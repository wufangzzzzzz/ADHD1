<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视觉预测训练</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .header p {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }

    .score-display {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #1e3a8a;
      margin-bottom: 15px;
    }

    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 15px 0;
    }

    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e0e0e0;
    }

    .progress-dot.active {
      background: #667eea;
    }

    .progress-dot.correct {
      background: #4caf50;
    }

    .progress-dot.wrong {
      background: #f44336;
    }

    .question-area {
      margin-bottom: 30px;
    }

    .question-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
    }

    .question-box {
      width: 120px;
      height: 120px;
      border: 3px solid #1e3a8a;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      background: white;
    }

    .question-box:last-child {
      background: #fff5f5;
      border-color: #ef4444;
    }

    .arrow-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
    }

    .arrow {
      font-size: 32px;
      color: #1e3a8a;
      font-weight: bold;
    }

    .options-area {
      margin-top: 30px;
    }

    .options-title {
      text-align: center;
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      gap: 15px;
      width: fit-content;
      margin: 0 auto;
    }

    .option-box {
      width: 160px;
      height: 160px;
      border: 3px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 70px;
      cursor: pointer;
      transition: all 0.2s;
      background: white;
    }

    .option-box:hover {
      border-color: #667eea;
      transform: scale(1.05);
    }

    .option-box.selected {
      border-color: #667eea;
      background: #f0f0ff;
    }

    .option-box.correct {
      border-color: #4caf50;
      background: #e8f5e9;
    }

    .option-box.wrong {
      border-color: #f44336;
      background: #ffebee;
    }

    .feedback {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
    }

    .feedback.correct {
      color: #4caf50;
    }

    .feedback.wrong {
      color: #f44336;
    }

    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    .mode-btn {
      padding: 8px 20px;
      font-size: 14px;
      background: #e0e0e0;
      color: #666;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #667eea;
      color: white;
    }

    .mode-btn:hover {
      transform: scale(1.05);
    }

    .btn {
      display: block;
      margin: 20px auto 0;
      padding: 12px 40px;
      font-size: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    
  
.back-btn{
  position:absolute;top:10px;left:10px;z-index:100;
  background:rgba(0,0,0,0.06);
  border:1px solid rgba(0,0,0,0.1);
  color:rgba(0,0,0,0.55);
  padding:6px 14px;border-radius:8px;
  font-size:13px;cursor:pointer;
  transition:all 0.2s;
  text-decoration:none;
}
.back-btn:hover{background:rgba(0,0,0,0.1);color:rgba(0,0,0,0.8);}
    /* 手机窄屏适配：选项区由 3×160px(约510px) 改为 2 列自适应，消除横向溢出 */
    @media (max-width: 560px) {
      .options-grid {
        grid-template-columns: repeat(2, 1fr);
        width: 100%;
        gap: 10px;
      }
      .option-box {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        font-size: clamp(30px, 12vw, 70px);
      }
      .question-box {
        width: 92px;
        height: 92px;
        font-size: 46px;
      }
      .container {
        padding: 20px 16px;
      }
    }

</style>
</head>
<body>
  <button class="back-btn" onclick="location.href='index.html'">← 返回大厅</button>
  <div class="container">
    <div class="header">
      <h1>接下来会发生什么</h1>
      <p>根据运动轨迹，从下方选项里圈出问号处的图案</p>
      <div class="mode-switch">
        <button class="mode-btn active" onclick="switchMode('image', event)">图像版</button>
        <button class="mode-btn" onclick="switchMode('number', event)">数字版</button>
        <button class="mode-btn" onclick="switchMode('letter', event)">字母版</button>
      </div>
      <div class="score-display">积分：<span id="score">0</span> 分</div>
    </div>
    <div class="divider"></div>

    <div class="progress-bar" id="progressBar"></div>

    <div class="question-area">
      <div class="question-row" id="questionRow"></div>
    </div>

    <div class="options-area">
      <p class="options-title">请选择正确答案</p>
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">下一题</button>
  </div>

  

  <script>
    // 当前模式
    let currentMode = 'image';

    // 图像模式：20个不同图案
    const imagePatterns = [
      '🎃', '🐱', '🐶', '🐰', '🐻', '🦊', '🦁', '🐼',
      '🍓', '🌙', '❤️', '🧡', '💛', '💚', '💙', '💜',
      '🍎', '🍊', '🍋', '🍇'
    ];

    // 数字模式：1-9
    const numberPatterns = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];

    // 字母模式：所有字母
    const letterPatterns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z'];

    // 当前使用的图案列表（用于一轮循环不重复）
    let currentPatterns = [];
    let currentPatternIndex = 0;
    let currentQuestion = 0;
    let correctAnswer = 0;
    let totalQuestions = 10;
    let answered = false;
    let score = 0;
    let currentPattern = '';

    // 切换模式
    function switchMode(mode, event) {
      currentMode = mode;
      // 更新按钮状态
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      // 重新初始化游戏
      init();
    }

    // 打乱图案顺序
    function shufflePatterns() {
      // 根据模式选择图案数组
      let sourcePatterns;
      if (currentMode === 'image') {
        sourcePatterns = [...imagePatterns];
      } else if (currentMode === 'number') {
        sourcePatterns = [...numberPatterns];
      } else {
        sourcePatterns = [...letterPatterns];
      }
      currentPatterns = sourcePatterns;
      for (let i = currentPatterns.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentPatterns[i], currentPatterns[j]] = [currentPatterns[j], currentPatterns[i]];
      }
      currentPatternIndex = 0;
    }

    // 获取当前图案
    function getCurrentPattern() {
      if (currentPatternIndex >= currentPatterns.length) {
        shufflePatterns();
      }
      return currentPatterns[currentPatternIndex++];
    }

    function init() {
      shufflePatterns();
      score = 0;
      currentQuestion = 0;
      document.getElementById('score').textContent = score;
      createProgressBar();
      loadQuestion();
    }

    function createProgressBar() {
      const progressBar = document.getElementById('progressBar');
      progressBar.innerHTML = '';
      for (let i = 0; i < totalQuestions; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < currentQuestion) {
          dot.classList.add('active');
        }
        progressBar.appendChild(dot);
      }
    }

    function loadQuestion() {
      answered = false;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').style.display = 'none';

      // 获取当前图案
      currentPattern = getCurrentPattern();

      // 随机选择起始角度（0, 90, 180, 270）
      const startAngle = Math.floor(Math.random() * 4) * 90;
      correctAnswer = (startAngle + 270) % 360; // 正确答案：顺时针旋转270度（即逆时针90度）

      // 生成题目：显示3个旋转后的图案 + 问号
      const questionRow = document.getElementById('questionRow');
      questionRow.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const currentAngle = (startAngle + i * 90) % 360;

        // 添加图案方框
        const box = document.createElement('div');
        box.className = 'question-box';
        box.innerHTML = getRotatedContent(currentPattern, currentAngle);
        questionRow.appendChild(box);

        // 添加箭头
        if (i < 2) {
          const arrowContainer = document.createElement('div');
          arrowContainer.className = 'arrow-container';
          arrowContainer.innerHTML = '<span class="arrow">→</span>';
          questionRow.appendChild(arrowContainer);
        }
      }

      // 添加等号
      const equalsContainer = document.createElement('div');
      equalsContainer.className = 'arrow-container';
      equalsContainer.innerHTML = '<span class="arrow">=</span>';
      questionRow.appendChild(equalsContainer);

      // 添加问号方框
      const questionBox = document.createElement('div');
      questionBox.className = 'question-box';
      questionBox.innerHTML = '?';
      questionBox.style.color = '#ef4444';
      questionBox.style.fontWeight = 'bold';
      questionRow.appendChild(questionBox);

      // 生成6个选项（包含正确答案和干扰项）
      generateOptions(startAngle);
    }

    function getRotatedContent(content, angle) {
      let style = `display: inline-block; transform-origin: 50% 50%; transform: rotate(${angle}deg);`;
      if (currentMode === 'number') {
        style += ' color: #e74c3c; font-weight: bold; font-size: 80px;';
      } else if (currentMode === 'letter') {
        style += ' color: #27ae60; font-weight: bold; font-size: 70px; line-height: 1;';
      }
      return `<span style="${style}">${content}</span>`;
    }

    function generateOptions(startAngle) {
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      // 使用8个角度（每45度一个）
      const allAngles = [0, 45, 90, 135, 180, 225, 270, 315];

      // 随机选择6个（包含正确答案）
      let options = [];
      options.push(correctAnswer);

      while (options.length < 6) {
        const angle = allAngles[Math.floor(Math.random() * allAngles.length)];
        if (!options.includes(angle)) {
          options.push(angle);
        }
      }

      // 打乱顺序
      options.sort(() => Math.random() - 0.5);

      options.forEach(angle => {
        const optionBox = document.createElement('div');
        optionBox.className = 'option-box';
        optionBox.innerHTML = getRotatedContent(currentPattern, angle);
        optionBox.dataset.angle = angle;
        optionBox.onclick = () => selectOption(optionBox, angle);
        optionsGrid.appendChild(optionBox);
      });
    }

    // 音效系统
    let audioContext = null;
    
    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    function playSound(type) {
      const ctx = getAudioContext();
      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);

      if (type === 'correct') {
        // 正确音效：上升音调
        oscillator.frequency.setValueAtTime(523, ctx.currentTime); // C5
        oscillator.frequency.setValueAtTime(659, ctx.currentTime + 0.1); // E5
        oscillator.frequency.setValueAtTime(784, ctx.currentTime + 0.2); // G5
        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.4);
      } else {
        // 错误音效：下降音调
        oscillator.frequency.setValueAtTime(400, ctx.currentTime);
        oscillator.frequency.setValueAtTime(300, ctx.currentTime + 0.15);
        oscillator.frequency.setValueAtTime(200, ctx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.5);
      }
    }

    function selectOption(element, angle) {
      const isCorrect = angle === correctAnswer;

      if (isCorrect) {
        element.classList.add('correct');
        document.getElementById('feedback').textContent = '回答正确！+10分';
        document.getElementById('feedback').className = 'feedback correct';
        score += 10;
        document.getElementById('score').textContent = score;
        playSound('correct');
        answered = true;
      } else {
        element.classList.add('wrong');
        // 短暂显示错误效果后移除，允许重新选择
        setTimeout(() => {
          element.classList.remove('wrong');
        }, 300);
        document.getElementById('feedback').textContent = '回答错误，请再试一次';
        document.getElementById('feedback').className = 'feedback wrong';
        playSound('wrong');
        return;
      }

      // 更新进度条
      const dots = document.querySelectorAll('.progress-dot');
      if (dots[currentQuestion]) {
        dots[currentQuestion].classList.add('correct');
      }

      // 检查是否完成一轮循环
      if (currentQuestion >= totalQuestions - 1) {
        document.getElementById('feedback').textContent = `恭喜通关！本轮获得 ${score} 分`;
        document.getElementById('feedback').className = 'feedback correct';
        document.getElementById('nextBtn').textContent = '重新开始';
        document.getElementById('nextBtn').onclick = init;
        document.getElementById('nextBtn').style.display = 'block';
      } else {
        // 选对了自动进入下一关
        setTimeout(() => {
          nextQuestion();
        }, 1000);
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= totalQuestions) {
        // 完成一轮，积分保留，重新开始新一轮
        currentQuestion = 0;
        shufflePatterns();
      }
      loadQuestion();
      createProgressBar();
    }

    window.onload = function() {
      init();
    };
    
    // 防下载
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) e.preventDefault();
    });
  </script>
</body>
</html>
