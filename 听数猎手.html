<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>听数猎手</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
  background:#f5f5f5; display:flex; flex-direction:column; align-items:center;
}
.toolbar {
  width:100%; max-width:620px; background:#fff; padding:8px 12px;
  display:flex; align-items:center; gap:6px; box-shadow:0 1px 4px rgba(0,0,0,0.08);
  z-index:10; flex-shrink:0; flex-wrap:wrap;
}
.tb-title { font-size:15px; font-weight:700; color:#333; margin-right:auto; white-space:nowrap; }
.tb-btn { padding:5px 12px; border:1px solid #ccc; background:#fff; border-radius:6px; font-size:12px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.tb-btn:hover { background:#f0f0f0; }
.tb-btn.go { border-color:#667eea; color:#667eea; }
.tb-btn.print { border-color:#999; color:#555; }
.tb-btn.home { color:#667eea; border-color:#667eea; text-decoration:none; display:inline-flex; align-items:center; }
.tb-score { font-size:13px; color:#764ba2; font-weight:700; }

.wrap { width:100%; max-width:620px; flex:1; padding:10px 12px; display:flex; flex-direction:column; gap:8px; overflow:hidden; min-height:0; }
.settings { background:#fff; border-radius:10px; padding:8px 12px; box-shadow:0 1px 4px rgba(0,0,0,0.06); display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
.set-label { font-size:11px; color:#888; white-space:nowrap; }
.set-row { display:flex; gap:3px; }
.set-btn { padding:3px 8px; border:1px solid #ddd; background:#fff; border-radius:4px; font-size:11px; cursor:pointer; }
.set-btn.on { background:#667eea; color:#fff; border-color:#667eea; }
.set-vol { width:60px; }

.game { flex:1; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:0; }
.prog { display:flex; gap:3px; flex-shrink:0; }
.prog span { width:24px; height:5px; background:#e0e0e0; border-radius:3px; }
.prog span.cur { background:#667eea; }
.prog span.ok { background:#4CAF50; }
.prog span.ng { background:#f44336; }
.status { text-align:center; flex-shrink:0; }
.status .big { font-size:18px; font-weight:700; color:#333; }
.status .sub { font-size:12px; color:#999; margin-top:4px; }

.listen-icon { display:flex; gap:3px; align-items:center; height:28px; }
.listen-icon i { width:4px; border-radius:2px; background:#667eea; animation:sw 1s ease-in-out infinite; }
.listen-icon i:nth-child(2){ animation-delay:0.15s; height:22px; }
.listen-icon i:nth-child(3){ animation-delay:0.3s; height:16px; }
.listen-icon i:nth-child(4){ animation-delay:0.45s; height:10px; }
@keyframes sw { 0%,100%{height:6px} 50%{height:24px} }

.answer-row { display:flex; gap:8px; align-items:center; flex-shrink:0; }
.answer-row input {
  width:140px; padding:10px 14px; border:2px solid #ddd; border-radius:10px;
  font-size:22px; font-weight:700; text-align:center; color:#333; outline:none;
}
.answer-row input:focus { border-color:#667eea; }
.answer-row input.ok { border-color:#4CAF50; color:#4CAF50; }
.answer-row input.ng { border-color:#f44336; color:#f44336; }
.btn-submit { padding:10px 20px; border:none; border-radius:10px; font-size:15px; font-weight:700; color:#fff; background:#667eea; cursor:pointer; }
.btn-submit:disabled { background:#ccc; cursor:not-allowed; }

.result { font-size:16px; font-weight:700; text-align:center; flex-shrink:0; }
.result .right { color:#4CAF50; }
.result .wrong { color:#f44336; }
.result .ans { font-size:26px; margin-top:4px; }

.finish { text-align:center; flex-shrink:0; }
.finish .score-big { font-size:36px; font-weight:700; color:#667eea; }

@media print {
  @page { margin:5mm; }
  html,body { background:#fff!important; overflow:visible!important; height:auto!important; }
  body { display:block!important; }
  .toolbar,.settings { display:none!important; }
  .wrap { max-width:none; height:auto; padding:0; }
  .game { box-shadow:none; border:1px solid #ddd; }
}
@media (max-width:420px) {
  .toolbar { padding:6px 8px; gap:4px; }
  .tb-title { font-size:13px; }
  .tb-btn { padding:3px 8px; font-size:10px; }
  .answer-row input { width:110px; font-size:18px; padding:8px 10px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="tb-title">听数猎手</span>
  <span class="tb-score" id="tbScore">0</span>
  <button class="tb-btn go" id="btnGo" onclick="startRound()">开始</button>
  <button class="tb-btn" onclick="replay()">重听</button>
  <button class="tb-btn print" onclick="window.print()">打印</button>
  <a href="index.html" class="tb-btn home">返回</a>
</div>

<div class="wrap">
  <div class="settings">
    <span class="set-label">难度</span>
    <div class="set-row" id="diffRow"></div>
    <span class="set-label">速度</span>
    <div class="set-row" id="spdRow"></div>
    <span class="set-label">音量</span>
    <input type="range" class="set-vol" id="vol" min="0" max="100" value="80" oninput="Game.volume=this.value/100; $('volVal').textContent=this.value">
    <span style="font-size:11px;color:#888;" id="volVal">80</span>
  </div>

  <div class="game">
    <div class="prog" id="prog"></div>
    <div class="status">
      <div class="big" id="stBig">点击"开始"听数字</div>
      <div class="sub" id="stSub">听完后填出最大的数</div>
    </div>
    <div class="listen-icon" id="listenIcon" style="display:none"><i></i><i></i><i></i><i></i></div>
    <div class="answer-row" id="answerRow" style="display:none">
      <input type="number" id="answerInput" placeholder="最大的数" onkeydown="if(event.key==='Enter')submitAnswer()">
      <button class="btn-submit" id="btnSubmit" onclick="submitAnswer()">提交</button>
    </div>
    <div class="result" id="resultArea" style="display:none"></div>
    <div class="finish" id="finishArea" style="display:none"></div>
  </div>
</div>

<script>
var Game = {
  difficulty: 1, speed: 1, volume: 0.8, score: 0, total: 0, correctCount: 0,
  round: 0, maxRounds: 10, numbers: [], correctAnswer: 0,
  playing: false, roundResults: [], _speechGen: 0, speechSupported: true,
  timers: [], audioCtx: null
};
function $(id){ return document.getElementById(id); }

var DIFFS = [
  { label:'简单', count:3, range:[1,20] },
  { label:'中等', count:4, range:[1,50] },
  { label:'困难', count:5, range:[1,100] },
  { label:'挑战', count:6, range:[1,200] }
];
var SPEEDS = [{ label:'慢', rate:0.7 }, { label:'中', rate:0.9 }, { label:'快', rate:1.1 }];

function init() {
  var dr = $('diffRow'), sr = $('spdRow');
  dr.innerHTML=''; sr.innerHTML='';
  DIFFS.forEach(function(d,i){ var b=document.createElement('span');b.className='set-btn'+(i===Game.difficulty?' on':'');b.textContent=d.label;b.onclick=function(){ setDiff(i); }; dr.appendChild(b); });
  SPEEDS.forEach(function(s,i){ var b=document.createElement('span');b.className='set-btn'+(i===Game.speed?' on':'');b.textContent=s.label;b.onclick=function(){ setSpeed(i); }; sr.appendChild(b); });
  renderProg(); updateScore();
}

function setDiff(i){ Game.difficulty=i; init(); }
function setSpeed(i){ Game.speed=i; init(); }

function renderProg(){
  var p=$('prog'); p.innerHTML='';
  for(var i=0;i<Game.maxRounds;i++){ var s=document.createElement('span'); if(i===Game.round)s.className='cur'; else if(Game.roundResults[i]===true)s.className='ok'; else if(Game.roundResults[i]===false)s.className='ng'; p.appendChild(s); }
}
function updateScore(){ $('tbScore').textContent='得分: '+Game.score; }

function startRound(){
  if(Game.playing) return;
  Game.playing = true;
  Game.round = 0; Game.score = 0; Game.correctCount = 0; Game.roundResults = new Array(Game.maxRounds).fill(null);
  $('btnGo').disabled = true;
  updateScore(); renderProg();
  $('finishArea').style.display='none';
  $('btnGo').textContent='进行中...';
  nextRound();
}

function nextRound(){
  if(Game.round >= Game.maxRounds){ finish(); return; }
  var cfg = DIFFS[Game.difficulty], spd = SPEEDS[Game.speed];
  Game.numbers = [];
  for(var i=0;i<cfg.count;i++){ Game.numbers.push(Math.floor(Math.random()*(cfg.range[1]-cfg.range[0]+1))+cfg.range[0]); }
  Game.correctAnswer = Math.max.apply(null, Game.numbers);
  $('stBig').textContent = '仔细听...';
  $('stSub').textContent = cfg.count+' 个数字，听完填出最大的';
  $('listenIcon').style.display = 'flex';
  $('answerRow').style.display = 'none';
  $('resultArea').style.display = 'none';
  $('answerInput').value = '';
  $('answerInput').className = '';
  $('btnSubmit').disabled = true;
  renderProg();
  speakSequence(Game.numbers, spd.rate, 0, function(){
    $('listenIcon').style.display = 'none';
    $('stBig').textContent = '你的答案';
    $('stSub').textContent = '填入你听到的最大数字';
    $('answerRow').style.display = 'flex';
    $('btnSubmit').disabled = false;
    setTimeout(function(){ try { $('answerInput').focus(); } catch(e){} }, 100);
  });
}

function speakSequence(nums, rate, idx, cb){
  if(idx >= nums.length){ if(cb) setTimeout(cb, 400); return; }
  var num = nums[idx];
  var chineseMap = {0:'零',1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九'};
  var text = String(num);
  speak(text, rate, function(){
    setTimeout(function(){ speakSequence(nums, rate, idx+1, cb); }, 350);
  });
}

function speak(text, rate, onEnd){
  if(!window.speechSynthesis){ if(onEnd) setTimeout(onEnd,600); return; }
  Game._speechGen++;
  var myGen = Game._speechGen;
  try { speechSynthesis.resume(); } catch(e){}
  setTimeout(function(){ try { speechSynthesis.cancel(); } catch(e){} }, 10);
  var u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=rate||1.0; u.volume=Game.volume; u.pitch=1.05;
  var voices = speechSynthesis.getVoices();
  var zh = voices.filter(function(v){ return v.lang.indexOf('zh')===0; });
  if(zh.length>0) u.voice = zh[0];
  var ended=false, ft=null;
  function done(){ if(ended)return; ended=true; if(ft)clearTimeout(ft); if(myGen===Game._speechGen&&onEnd) onEnd(); }
  u.onend=done; u.onerror=done;
  ft=setTimeout(done, text.length*300+3000);
  Game.timers.push(ft);
  speechSynthesis.speak(u);
}

function replay(){
  if(!Game.playing||Game.numbers.length===0) return;
  var spd = SPEEDS[Game.speed];
  $('listenIcon').style.display='flex';
  $('stBig').textContent='重听中...';
  $('answerRow').style.display='none';
  $('resultArea').style.display='none';
  $('answerInput').value=''; $('answerInput').className='';
  speakSequence(Game.numbers, spd.rate, 0, function(){
    $('listenIcon').style.display='none';
    $('stBig').textContent='你的答案';
    $('stSub').textContent='填入你听到的最大数字';
    $('answerRow').style.display='flex';
    $('btnSubmit').disabled=false;
    setTimeout(function(){ try { $('answerInput').focus(); } catch(e){} }, 100);
  });
}

function submitAnswer(){
  if(!Game.playing) return;
  var val = parseInt($('answerInput').value, 10);
  if(isNaN(val)){ $('stSub').textContent='请输入有效数字'; return; }
  $('btnSubmit').disabled = true;
  $('answerRow').style.display = 'none';
  var correct = (val === Game.correctAnswer);
  Game.roundResults[Game.round] = correct;
  if(correct){ Game.score += 10; Game.correctCount++; }
  $('resultArea').style.display = 'block';
  $('resultArea').innerHTML = correct
    ? '<span class="right">正确!</span><div class="ans">最大数: '+Game.correctAnswer+'</div>'
    : '<span class="wrong">错误</span><div class="ans">最大数: '+Game.correctAnswer+'</div>';
  updateScore(); renderProg();
  Game.round++;
  setTimeout(function(){ nextRound(); }, 1200);
}

function finish(){
  Game.playing = false;
  $('btnGo').disabled = false;
  $('btnGo').textContent = '开始';
  $('listenIcon').style.display = 'none';
  $('answerRow').style.display = 'none';
  $('resultArea').style.display = 'none';
  $('stBig').textContent = '训练完成!';
  $('stSub').textContent = Game.correctCount+'/'+Game.maxRounds+' 正确，得分: '+Game.score;
  $('finishArea').style.display = 'block';
  $('finishArea').innerHTML = '<div class="score-big">'+Game.score+'</div><div style="color:#888;font-size:13px;">总分 (最高'+(Game.maxRounds*10)+')</div>';
  renderProg();
}

init();
</script>
</body>
</html>
