<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔方投影 · 专注力视觉游戏</title>
<style>
*{box-sizing:border-box}
/* ★height:100dvh 必须有★：平板/手机浏览器的地址栏会吃掉一块可视高，
   只用 100vh 时底部（提示文案那行）会被裁掉 —— 先生 2026-10-08 报的"下面显示不全"。 */
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#0B111B;color:#EAF1FA;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit}
/* ★先生 2026-10-08：左侧魔方区放大、右侧游戏区缩小一点★
   原来左栏写死 320px：缩略图可用高约 700px 而可用宽只有 298px ⇒【宽度是瓶颈】，
   3D 只能画到 ~298px（fitCanvas 按 #cubeWrap 的 clientWidth/Height 定画布）。
   改成 clamp(340px,30vw,520px)：1440 宽的窗口左栏 432px（3D 298 → ~410，+38%），
   右栏 1075 → 963（−10%）。右栏变窄不亏：棋盘是正方形、本来就受高度约束。 */
#app{display:grid;grid-template-columns:clamp(340px,30vw,520px) minmax(0,1fr);gap:13px;padding:13px 16px;
  height:100vh;height:100dvh}   /* dvh：平板地址栏不再把底部吃掉（fallback 给老浏览器留 vh） */
.panel{background:linear-gradient(180deg,#141E2C,#101A27);border:1px solid #223449;
  border-radius:15px;position:relative;overflow:hidden;min-height:0}
#left{display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;gap:11px;padding:11px}
#cubeWrap{position:relative;min-height:140px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#16202E 0%,#0C131E 78%);
  border:1px solid #223449;cursor:grab;touch-action:none}
#cubeWrap:hover{border-color:#3A5677}
#cubeWrap.dragging{cursor:grabbing}
#cubeCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cubeTag{font-size:12px;color:#8FA3BC;text-align:center;line-height:1.55}
#cubeTag b{color:#FFC978;font-weight:700}
#leftTools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#leftTools button{padding:8px 4px;font-size:12.5px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #2B3E55;background:#16202E;
  color:#C9D6E6;padding:8px 10px;font-size:13px;font-weight:600;transition:.15s}
button:hover{background:#1D2A3C;border-color:#3B5372}
button.on{background:#3A2A12;border-color:#B8792A;color:#FFC978}
#right{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:11px;padding:11px}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#lvl button{padding:8px 0}
#stat{margin-left:auto;font-size:13px;color:#8FA3BC;white-space:nowrap}
#btnBack{padding:8px 11px;font-size:12.5px}
#stat b{color:#FFC978;font-size:15px}
/* ★右侧游戏区 = 棋盘 + 右边一列"辅助转动"箭头（先生 2026-10-08 第 3 条）★
   箭头列只占 56px + 9px 间隙；棋盘在右栏里本来就是【高度】约束，所以几乎不损失棋盘尺寸。 */
/* ★右侧游戏区 = 棋盘 + 紧贴它右边的一列"辅助转动"箭头★
   先生 2026-10-08 第 2 次澄清：「我说的是上下箭头靠近游戏一些 还是太远 尤其是电脑游览器模式下」
   —— 上一轮我把"边缘"当成了屏幕边缘、给右边加留白，方向反了。
   ★病根：棋盘是正方形、却在整列里居中 ⇒ 两侧各留 28.35px 空白（可见内容 696 宽 vs 容器 753），
     箭头又被推到列的最右边 ⇒ 箭头左缘离【看得见的圆线】足有 82.9px（1440 视口）。
   ★改法：把容器收缩成正方形（#boardWrap 的 aspect-ratio:1/1）+ boardRow 改 flex 居中，
     箭头就紧跟在棋盘容器右缘之后，只差一个 gap。gap=4px ⇒ 视觉距离 82.9 → 32.4px。 */
/* ★min-width:0 不能省★：#boardRow 是 #right 单列 grid 的 item，隐式列是 auto 轨道；
   不写它，行宽会按 max-content 撑到"棋盘边长 + 4 + 箭头宽"，超出面板 ⇒ 箭头被推到面板外、
   再被 .panel 的 overflow:hidden 裁掉（实测 1024x768 箭头顶到 1042 > 视口 1024；390x844 更甚）。 */
/* gap 4 → 14（先生 2026-10-08：「上下按键离着图形太近了」）——
   4px 在平板上（棋盘边上那圈空白按比例变小）几乎贴住圆线，14px 才看得出是一列独立的按键。 */
#boardRow{min-height:0;min-width:0;display:flex;align-items:stretch;justify-content:center;gap:14px}
/* aspect-ratio:1/1 是关键：容器高度=棋盘边长(受高度约束)，宽度跟着等于高度 ⇒ 容器正好包住棋盘。
   min-width:0 允许窄屏（棋盘的瓶颈换成宽度）时被 flex 收缩，此时 svg 的 meet 会自己缩，不会溢出。 */
#boardWrap{min-height:0;min-width:0;aspect-ratio:1/1;display:grid;place-items:center}
#board{width:100%;height:100%;display:block;touch-action:none}
#arrowCol{flex:0 0 auto;display:grid;grid-template-rows:auto auto;gap:9px;align-content:center;width:56px}
#arrowCol button{height:76px;padding:0;font-size:21px;line-height:1;display:grid;place-items:center}
/* 没选中层 / 正在转 ⇒ 置灰不可点（否则先生按了没反应会以为坏了） */
#arrowCol button:disabled,#arrowCol button:disabled:hover{background:#16202E;border-color:#2B3E55;
  color:#6B7C92;opacity:.7;cursor:not-allowed}
body.skin-light #arrowCol button:disabled,body.skin-light #arrowCol button:disabled:hover{
  background:#F1F4F9;border-color:#E4E9F1;color:#A9B5C4}
#tip{font-size:12.5px;color:#8FA3BC;text-align:center;line-height:1.6}
#tip b{color:#FFC978}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50}
#win.show{display:flex}
#winCard{background:linear-gradient(180deg,#16202E,#101A27);border:1px solid #2B3E55;border-radius:16px;
  padding:24px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#winCard h2{margin:0 0 6px;font-size:22px;font-weight:800;
  background:linear-gradient(92deg,#FFD08A,#FFB347 55%,#FF8E5E);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#winCard p{margin:0 0 16px;color:#8FA3BC;font-size:13.5px}
g.hit{cursor:pointer}
.line{fill:none;stroke:rgba(255,255,255,.34);stroke-width:1.4;transition:.12s}
.line.sel{stroke:#FFC978;stroke-width:3}
.line.hot{stroke:rgba(255,201,120,.70);stroke-width:2.2}
.ball{stroke:#0B111B;stroke-width:1.6}
#segSkin{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:104px}
#segSkin button{padding:8px 0}
/* ============================================================
   ★自定义每面颜色（先生 2026-10-07 第 3 条）★
   6 个色块按平面图上的【真实方位角】环摆 —— 方位角就是 geo 里各面心的 deg：
     AB-0 210 左上 / AB-1 30 右下 / BC-0 90 下 / BC-1 270 上 / AC-0 150 左下 / AC-1 330 右上
   屏幕位置 = (中心 + r*cos 角度, 中心 + r*sin 角度)，y 向下为正 —— 与 geo 同一口径，不另立一套。
   ============================================================ */
#facePop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(5,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60}
#facePop.show{display:flex}
#faceCard{background:linear-gradient(180deg,#16202E,#101A27);border:1px solid #2B3E55;border-radius:16px;
  padding:18px 20px 15px;box-shadow:0 24px 70px rgba(0,0,0,.6);width:326px}
#faceCard h3{margin:0 0 5px;font-size:15px;font-weight:800;color:#EAF1FA;text-align:center}
#faceCard p.fcSub{margin:0 0 10px;font-size:11.5px;color:#8FA3BC;line-height:1.45;text-align:center}
#faceRing{position:relative;width:270px;height:270px;margin:0 auto 6px}
#faceRing .fd{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:13px;
  border:2px solid #2B3E55;cursor:pointer;transition:.15s;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#0B111B;text-shadow:0 0 5px rgba(255,255,255,.72)}
#faceRing .fd:hover{border-color:#5B7CA6}
#faceRing .fd.on{border-color:#FFC978;box-shadow:0 0 0 3px rgba(255,201,120,.3)}
#faceSw{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:0 0 11px}
#faceSw i{width:100%;aspect-ratio:1/1;border-radius:7px;border:2px solid transparent;cursor:pointer}
#faceSw i.on{border-color:#FFC978;box-shadow:0 0 0 2px rgba(255,201,120,.25)}
#faceRow{display:flex;align-items:center;gap:8px}
#faceRow .fcLab{font-size:11.5px;color:#8FA3BC;white-space:nowrap}
#faceRow .gro{flex:1}
#faceColor{width:36px;height:30px;padding:0;border:1px solid #2B3E55;border-radius:8px;
  background:#16202E;cursor:pointer}
#faceRow button{padding:6px 10px;font-size:12px}


/* ============================================================
   白色底板皮肤（照抄本体 cube-projection.html 的 body.skin-light 口径）
   做法与本体一样：上面的规则一条不动，只在 body.skin-light 下整体覆盖；
   canvas 与 SVG 里"写死在 JS 里的颜色"由 skinPal() 按皮肤分支给。
   ============================================================ */
body.skin-light{background:#EEF2F8;color:#1D2733}
body.skin-light .panel{background:linear-gradient(180deg,#FFFFFF,#FAFCFE);border-color:#E1E7F0}
body.skin-light #cubeWrap{background:radial-gradient(120% 120% at 50% 0%,#FFFFFF 0%,#EDF1F7 78%);
  border-color:#E1E7F0}
body.skin-light #cubeWrap:hover{border-color:#A9B8CC}
body.skin-light #cubeTag{color:#7A8798}
body.skin-light #cubeTag b{color:#A8570C}
body.skin-light #stat{color:#5C6B7F}
body.skin-light #stat b{color:#A8570C}
body.skin-light #tip{color:#5C6B7F}
body.skin-light #tip b{color:#A8570C}
body.skin-light button{background:#F6F8FB;border-color:#DCE3EC;color:#33445C}
body.skin-light button:hover{background:#EDF3FA;border-color:#B9C6D6}
body.skin-light button.on{background:#FDF0DC;border-color:#D9A252;color:#8A5310;
  box-shadow:0 0 0 1px rgba(217,162,82,.22) inset}
body.skin-light .line{stroke:rgba(30,45,70,.42);stroke-width:1.6}
body.skin-light .line.sel{stroke:#C97A1A;stroke-width:3}
body.skin-light .ball{stroke:#FFFFFF;stroke-width:1.7}
body.skin-light #win{background:rgba(226,235,246,.74)}
body.skin-light #winCard{background:linear-gradient(180deg,#FFFFFF,#F5F9FD);border-color:#DCE3EC;
  box-shadow:0 28px 70px rgba(24,40,64,.26)}
body.skin-light #winCard h2{background:linear-gradient(92deg,#E0921C,#C97A1A 55%,#A8570C);
  -webkit-background-clip:text;background-clip:text;color:transparent}
body.skin-light #winCard p{color:#5C6B7F}
body.skin-light #facePop{background:rgba(226,235,246,.76)}
body.skin-light #faceCard{background:linear-gradient(180deg,#FFFFFF,#F5F9FD);border-color:#DCE3EC;
  box-shadow:0 28px 70px rgba(24,40,64,.26)}
body.skin-light #faceCard h3{color:#1D2733}
body.skin-light #faceCard p.fcSub{color:#5C6B7F}
body.skin-light #faceRing .fd{border-color:#DCE3EC}
body.skin-light #faceRing .fd.on{border-color:#D9A252;box-shadow:0 0 0 3px rgba(217,162,82,.25)}
body.skin-light #faceSw i.on{border-color:#D9A252;box-shadow:0 0 0 2px rgba(217,162,82,.22)}
body.skin-light #faceRow .fcLab{color:#5C6B7F}
body.skin-light #faceColor{background:#F6F8FB;border-color:#DCE3EC}

/* ★平板档（861~1120 宽）：把宽度让给棋盘★
   先生「游戏区的图案异常的小」——1024x768 这类平板横屏还是双列，左栏 30vw=307→clamp 到 340 太宽，
   右栏被压到 617 以下、棋盘只有 555（短边 72%）。这档把左栏收紧（随宽度 252~304），棋盘涨到 80%+。
   ★区间为什么只到 1120★（实测诊断）：再宽就是【高度】瓶颈了 ——
     1194x834 棋盘箱 687x687、1180x820 是 673x673 ⇒ 缩左栏对棋盘 0 收益，
     却把左侧 3D 从 236x270 压到 180x207（3D 尺寸 = min(cubeWrap宽,高)*0.44/HD，被左栏【宽度】卡住）。
   >1120 仍走默认 30vw：左栏保持大、3D 不缩（先生要的"左栏放大"）。 */
@media (min-width:861px) and (max-width:1120px){
  #app{grid-template-columns:clamp(252px,26vw,304px) minmax(0,1fr)}
}
/* ★矮屏档（平板横屏常见 600~780 高）★：hud / tip / 各处间距都收一点，把高度让给棋盘。
   放在 max-width:860 那档【之前】，窄屏小设备仍由后面那档说了算。 */
@media (max-height:780px){
  #app{padding:9px 12px}
  #right{padding:9px;gap:8px}
  #left{padding:9px;gap:8px}
  #hud{gap:8px}
  #hud button{padding:6px 9px;font-size:12px}
  #stat{font-size:12px}
  #tip{font-size:11.5px;line-height:1.45}
  #arrowCol button{height:64px}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:236px minmax(0,1fr);padding:10px}
  /* ★竖屏平板/手机：魔方在左、按钮在右★（实测 cubeWrap 790x140 ⇒ 3D 只有 100x113、右边全空白）
     两列后 cubeWrap 拿到整行高度 ≈214，3D 涨到 ~170；棋盘尺寸完全不受影响。
     行高用 auto + minmax(0,1fr)：第一行给难度、其余全给工具列，cubeWrap 跨两行吃满高度。 */
  #left{grid-template-columns:minmax(0,1fr) 160px;grid-template-rows:auto minmax(0,1fr);gap:8px}
  #cubeWrap{grid-column:1;grid-row:1/span 2}
  #lvl{grid-column:2;grid-row:1}
  #leftTools{grid-column:2;grid-row:2;grid-template-columns:minmax(0,1fr);align-content:start}
  #cubeTag{display:none}
  #faceCard{transform:scale(.92)}
  #arrowCol{width:46px}
  #arrowCol button{height:60px;font-size:18px}
}
</style></head><body>
<div id="app">
  <aside class="panel" id="left">
    <div id="cubeWrap" title="按住拖动可 360&deg; 旋转看各个面">
      <canvas id="cubeCv"></canvas>
    </div>
    <div id="lvl" title="阶数（2 / 3 / 4）">
      <button data-n="2">2 阶</button>
      <button data-n="3" class="on">3 阶</button>
      <button data-n="4">4 阶</button>
    </div>
    <div id="cubeTag">左侧 = <b>当前魔方</b>的立体图<br>按住拖动可转视角</div>
    <div id="leftTools">
      <button id="btnResetView">&#8634; 复位视角</button>
      <button id="btnUndo">&#8630; 撤销</button>
      <button id="btnFace" title="自定义每一面的颜色">&#127912; 配色</button>
    </div>
  </aside>
  <main class="panel" id="right">
    <div id="hud">
      <button id="btnBack" onclick="location.href='index.html'" title="返回游戏主页">&#8592; 返回</button>
      <div class="seg" id="segSkin" title="底板颜色">
        <button data-skin="light" class="on">白底</button>
        <button data-skin="dark">黑底</button>
      </div>
      <button id="btnNew">重新打乱</button>
      <button id="btnDemo" title="自动演示：回到本题打乱的样子，再一步步把它拼好">演示</button>
      <div id="stat">步数 <b>0</b></div>
    </div>
    <div id="boardRow">
      <div id="boardWrap"><svg id="board" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="arrowCol" title="先点一条圆线或一颗球选中它（线会变金），再按这里转那一层">
        <button id="btnUp" title="顺时针转这一层（等于在线上往上滑）" aria-label="顺时针转一层">&#9650;</button>
        <button id="btnDown" title="逆时针转这一层（等于在线上往下滑）" aria-label="逆时针转一层">&#9660;</button>
      </div>
    </div>
    <div id="tip"></div>
  </main>
</div>
<div id="facePop"><div id="faceCard">
  <h3>自定义每面颜色</h3>
  <p class="fcSub">6 个色块按平面图上的方位摆放 &middot; 先点一个面，再从下面挑颜色</p>
  <div id="faceRing"></div>
  <div id="faceSw"></div>
  <div id="faceRow">
    <span class="fcLab">自选</span>
    <input type="color" id="faceColor">
    <span class="gro"></span>
    <button id="faceReset">恢复默认</button>
    <button id="faceClose">关闭</button>
  </div>
</div></div>
<div id="win"><div id="winCard">
  <h2>&#127881; 复原完成</h2><p>每一面都同色了</p>
  <button id="winNext">再来一题</button>

  G.pcol=G.slots.map(function(s){return s.face;});

function isSolved(){

    var ss=G.faces[f].slots, c0=G.pcol[G.pid[ss[0]]];
    for(var j=1;j<ss.length;j++) if(G.pcol[G.pid[ss[j]]]!==c0) return false;
  }
  return true;
}
function turn(ci,d){
  if(G.busy) return;
  G.prevAt=G.at.slice(); G.prevPid=G.pid.slice();
  applyTurn(ci,d);
  G.hist.push([ci,d]); G.moves++; G.sel=ci; highlight();
  G.spin=spinOf(ci,d); G.busy=true; arrowState(); drawCube();
  animArc(ci,d,function(){ G.spin=null; G.busy=false; arrowState(); drawCube(); updateHUD(); });
}
function undo(){
  if(G.busy || !G.hist.length) return;
  var h=G.hist.pop();
  G.prevAt=G.at.slice(); G.prevPid=G.pid.slice();
  applyTurn(h[0],-h[1]); G.moves++; G.sel=h[0]; highlight();
  G.spin=spinOf(h[0],-h[1]); G.busy=true; arrowState(); drawCube();
  animArc(h[0],-h[1],function(){ G.spin=null; G.busy=false; arrowState(); drawCube(); updateHUD(); });
}

/* ================= ★演示：自动把这一题拼好（先生 2026-10-08）★ =================
   两步：
     ① 瞬时回到"刚打乱"的快照 —— 这样【不管玩家之前动过什么】都能演示（包括已经赢过一局）
     ② 按【打乱序列的逆序取反】一步步走动画 —— 走完必定已复原
   为什么不是"逆着玩家的走法退回去"（那样更省事，但错的）：
     若当前局面【已经复原】，再逆着 hist 走会把魔方【拧乱】——
     数学上 inverse(hist) 作用在 identity 上不等于 identity。快照法没有这个前提，恒成立。
   不计步数、不进撤销栈（演示不是玩家走的）；走完把本题收尾成"已复原"：
   hist 清空 + 步数归 0 ⇒ 既不会弹"🎉 已复原"过关卡，也不会留下一条会把人拧乱的撤销记录。
   ============================================================ */
var DEMO={on:false,q:[]};
/* 演示单步时长（ms）—— 想调速度只改这一个数。
   240 → 700（「动画速度太快了 减慢」）→ 1400（「再慢一倍」）。
   1400 = 手势 330ms 的 4.2 倍：3 阶打乱 9 步 ≈ 12.6s，4 阶 12 步 ≈ 16.8s。 */
var DEMO_STEP_MS=1400;
function demoStop(silent){
  DEMO.on=false; DEMO.q=[];
  if(!silent) demoBtnState();
}
function demoSteps(){
  var s=G.scramble||[], q=[], i;
  for(i=s.length-1;i>=0;i--) q.push([s[i][0],-s[i][1]]);   /* 逆序 + 取反 = 逆操作序列 */
  return q;
}
function demoRun(){
  if(DEMO.on){ demoStop(); return; }        /* 再点一次 = 停止 */
  if(G.busy) return;
  if(G.snap){                               /* ① 瞬时回到刚打乱的样子 */
    G.pid=G.snap.pid.slice(); G.at=G.snap.at.slice();
    G.prevPid=G.pid.slice(); G.prevAt=G.at.slice();
    G.sel=-1; G.spin=null; G.hist=[]; G.moves=0;
    paintBalls(); drawCube(); highlight(); updateHUD();
  }
  DEMO.q=demoSteps();
  if(!DEMO.q.length){ demoBtnState(); return; }
  DEMO.on=true; demoBtnState(); demoStep();
}
function demoStep(){
  if(!DEMO.on) return;
  if(!DEMO.q.length){                       /* ② 走完 ⇒ 收尾成"已复原" */
    DEMO.on=false; G.hist=[]; G.moves=0; G.sel=-1;
    highlight(); updateHUD(); demoBtnState();
    return;
  }
  var mv=DEMO.q.shift();
  G.prevAt=G.at.slice(); G.prevPid=G.pid.slice();
  applyTurn(mv[0],mv[1]);
  G.sel=mv[0]; highlight();
  G.spin=spinOf(mv[0],mv[1]); G.busy=true; arrowState(); drawCube();
  /* ★每步 DEMO_STEP_MS（先生：「动画速度太快了 减慢」→「再慢一倍」）★
     一步里要看清三件事：金色高亮选中哪条线 → 球沿弧滑到位 → 左边 3D 同步转完。
     240ms 根本来不及看；1400ms 属于「一步一步看着它走」的节奏。 */
  animArc(mv[0],mv[1],function(){
    G.spin=null; G.busy=false; drawCube(); updateHUD();
    demoBtnState();
    if(DEMO.on) demoStep();
  },DEMO_STEP_MS);
}
function demoBtnState(){
  var b=document.getElementById('btnDemo');
  if(!b) return;
  /* ★不要用 ▶/■ 这类异体符号★：#hud 里它们会回退到别的字体、行盒比汉字高 2px，
     ⇒ hud 35→37px ⇒ 右栏 1fr 行少 2px ⇒ 棋盘 753→751；而且两种字样高度不同
     ⇒ 演示途中棋盘会抖一下。用纯中文 + .on 金色底表示「进行中」就没这个问题。 */
  b.innerHTML=DEMO.on?'停止':'演示';
  if(DEMO.on) b.classList.add('on'); else b.classList.remove('on');
  b.disabled=(!DEMO.on && G.busy);          /* 正在转一层时不可点，免得"按了没反应以为坏了" */
}

/* ================= ★沿圆弧转圈★ ================= */
/* 拆成两半：arcPrepare = "这条环上哪些球粒要动、各自起点角、角差多少"
             arcSet     = "按缓动值 ez 把它们的屏幕坐标摆到弧上"
   animArc 用 rAF 跑这两半；验收脚本也能用同一对函数在任意 t 定格 ——
   定格出来的是【真正动画用的那套坐标】，不是另写一份近似。 */
function arcPrepare(ci,d){
  var c=G.circles[ci], o=pxp({x:c.cx,y:c.cy}), R=c.R*G.s, T=Math.PI*2;
  /* ★方向上不能再"看 d 的正负"★：环序下 d=+N 与 d=-N 谁是顺时针取决于该圆的 cw
     （实测每条圆 cw 都是 -1）。正解：dir = sign(d*cw)，cw=1 表示"d 为正 = 顺时针"。 */
  var dir=(d*(c.cw||1))>=0 ? 1 : -1, items=[], pid;
  for(pid=0; pid<G.at.length; pid++){
    var b=G.prevAt[pid], a=G.at[pid];
    if(b===a) continue;                       // 没动的球粒（不在环上）不参与
    var pb=pxp(G.slots[b]), pa=pxp(G.slots[a]);
    var a0=Math.atan2(pb.y-o.y, pb.x-o.x);
    var a1=Math.atan2(pa.y-o.y, pa.x-o.x);
    var da=((a1-a0)%T+T)%T;                   // 先取正向(顺时针)角差 ∈(0,T)
    if(dir<0) da-=T;                          // 逆时针 => 取负向
    items.push({el:G.elByPid[pid], a0:a0, da:da, pid:pid});
  }
  return {o:o, R:R, items:items, ci:ci, d:d, dir:dir};
}
function arcSet(ap, ez){
  for(var i=0;i<ap.items.length;i++){
    var it=ap.items[i], ang=it.a0+it.da*ez;
    it.el.style.transform='translate('+(ap.o.x+ap.R*Math.cos(ang))+'px,'+(ap.o.y+ap.R*Math.sin(ang))+'px)';
  }
}
function animArc(ci,d,done,dur){
  var ap=arcPrepare(ci,d), i;
  for(i=0;i<ap.items.length;i++) ap.items[i].el.style.transition='none';
  if(!ap.items.length){ paintBalls(); done&&done(); return; }
  var t0=performance.now(), DUR=dur||330;
  function step(now){
    var t=Math.min(1,(now-t0)/DUR);
    var ez=t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    arcSet(ap, ez);
    /* ★左边 3D 用同一个缓动值一起转★（同一时刻、同一进度、同时结束） */
    if(G.spin){ G.spin.ez=ez; drawCube(); }
    if(t<1) requestAnimationFrame(step);
    else { paintBalls(); done&&done(); }
  }
  requestAnimationFrame(step);
}

/* ================= 平面图渲染 ================= */
var gLine=el('g',{}), gHit=el('g',{}), gBall=el('g',{});
svg.appendChild(gLine); svg.appendChild(gHit); svg.appendChild(gBall);
var gEls=[], hitEls=[], lineEls=[];
function buildBoard(){
  svg.setAttribute('viewBox','0 0 '+VB+' '+VB);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  while(gLine.firstChild) gLine.removeChild(gLine.firstChild);
  while(gHit.firstChild)  gHit.removeChild(gHit.firstChild);
  while(gBall.firstChild) gBall.removeChild(gBall.firstChild);
  gEls=[]; hitEls=[]; lineEls=[];
  var i;
  for(i=0;i<G.circles.length;i++){
    var c=G.circles[i], o=pxp({x:c.cx,y:c.cy});
    var ln=el('circle',{cx:o.x,cy:o.y,r:c.R*G.s,class:'line'});
    gLine.appendChild(ln); lineEls.push(ln);
  }
  for(i=0;i<G.circles.length;i++){
    var c2=G.circles[i], o2=pxp({x:c2.cx,y:c2.cy});
    var ht=el('circle',{cx:o2.x,cy:o2.y,r:c2.R*G.s,fill:'none',stroke:'transparent',
      'stroke-width':24,'pointer-events':'stroke','class':'hit'});
    ht.dataset.ci=i; gHit.appendChild(ht); hitEls.push(ht);
  }
  /* 球元素按【球粒】建（pid 与初始 slot 一一对应） */
  for(i=0;i<G.at.length;i++){
    var s=G.slots[G.at[i]], p=pxp(s);
    var b=el('circle',{r:G.ballRArr[G.at[i]],cx:0,cy:0,class:'ball'});
    b.style.transform='translate('+p.x+'px,'+p.y+'px)';
    b.dataset.si=i;
    gBall.appendChild(b); gEls.push(b);
  }
  G.elByPid=gEls;
  applySkin();                 /* 元素是新建的 ⇒ 皮肤要重新刷到它们身上 */
}
function paintBalls(){
  for(var pid=0; pid<G.at.length; pid++){
    var at=G.at[pid], s=G.slots[at], p=pxp(s), b=gEls[pid];
    b.style.transition='none';
    b.style.transform='translate('+p.x+'px,'+p.y+'px)';
    b.setAttribute('r',G.ballRArr[at]);
    b.setAttribute('fill',G.fcol[G.pcol[pid]]);
  }
}
function highlight(){
  for(var i=0;i<lineEls.length;i++)
    lineEls[i].setAttribute('class','line'+(i===G.sel?' sel':''));
  arrowState();   /* 选中层变了 ⇒ 上/下箭头的可点状态跟着变 */
}
function updateHUD(){
  var solved=isSolved();
  document.getElementById('stat').innerHTML=
    (solved?'<b>🎉 已复原</b> · ':'')+'步数 <b>'+G.moves+'</b>';
  document.getElementById('win').classList.toggle('show',solved&&G.moves>0);
}

/* ================= 3D 魔方（照本体口径） ================= */
var A0={x:-0.70711,y:0.70711,z:0}, B0={x:-0.40825,y:-0.40825,z:0.81650};
var N0={x:0.57735,y:0.57735,z:0.57735}, ROTK=0.0082;
function dot3(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
function mm(A,B){var C=[],i,j,k,s;
  for(i=0;i<3;i++)for(j=0;j<3;j++){s=0;for(k=0;k<3;k++)s+=A[i*3+k]*B[k*3+j];C[i*3+j]=s;}return C;}
function rotAxis(ax,ay,az,th){
  var nx=Math.hypot(ax,ay,az); if(nx<1e-9) return [1,0,0,0,1,0,0,0,1];
  ax/=nx;ay/=nx;az/=nx;
  var c=Math.cos(th),s=Math.sin(th),t=1-c;
  return [t*ax*ax+c,t*ax*ay-s*az,t*ax*az+s*ay,
          t*ax*ay+s*az,t*ay*ay+c,t*ay*az-s*ax,
          t*ax*az-s*ay,t*ay*az+s*ax,t*az*az+c];
}
/* ★默认视角 = 单位阵（从 (0,0,0) 角看的标准等轴视角）★
   不用本体 rotAxis(N0,PI)：那会把画面绕视线转 180°，3D 里 w=0 面跑到"下"，
   而平面图里 w=0 面(BC-0)在"下" —— 左右方位会反。用单位阵后方位角逐一吻合(误差 0°)。 */
function defaultM(){return [1,0,0,0,1,0,0,0,1];}
var M=defaultM();
function cam(p){return {x:M[0]*p.u+M[1]*p.v+M[2]*p.w,
                        y:M[3]*p.u+M[4]*p.v+M[5]*p.w,
                        z:M[6]*p.u+M[7]*p.v+M[8]*p.w};}
function scr(u,v,w,cen){
  var q=cam({u:u-cen,v:v-cen,w:w-cen});
  return {x:dot3(q,A0), y:-dot3(q,B0), z:dot3(q,N0)};
}
var cv=document.getElementById('cubeCv'), ctx=cv.getContext('2d'), CW=0, CH=0, CDPR=0;
function fitCanvas(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth, h=cv.clientHeight;
  /* ★尺寸没变就别重设 width★ —— 赋值 canvas.width 会清空画布并重分配，
     跟着动画每秒调 60 次会白白闪烁+掉帧 */
  if(w===CW && h===CH && dpr===CDPR) return;
  CW=w; CH=h; CDPR=dpr;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
/* 绕【过立方体中心的某根轴】转 ph：与 geo 里 ring_ang 的测角方向一致（+ph = 绕轴角 +ph） */
function rotPtAbout(p, ax, ph, cen){
  var a0=p[0]-cen, a1=p[1]-cen, a2=p[2]-cen, C=Math.cos(ph), S=Math.sin(ph), o;
  /* ★四分之一/半圈要【精确】★：Math.cos(Math.PI/2)=6.1e-17 这个残差会让
     "转过来的坐标"与"静止摆放的坐标"差最后一位 ⇒ 屏幕上差 ~1e-14px ⇒ 抗锯齿边缘翻采样。
     把 |C|、|S∓1| 的浮点噪声按 1e-9 的门槛夹到 0/±1，整格旋转就变成【精确置换】。 */
  if(Math.abs(C)<1e-9) C=0; if(Math.abs(S)<1e-9) S=0;
  if(Math.abs(S-1)<1e-9) S=1; else if(Math.abs(S+1)<1e-9) S=-1;
  if(ax===0)      o=[a0, a1*C-a2*S, a1*S+a2*C];
  else if(ax===1) o=[a0*C+a2*S, a1, a2*C-a0*S];
  else            o=[a0*C-a1*S, a0*S+a1*C, a2];
  return [o[0]+cen, o[1]+cen, o[2]+cen];
}
function rotVecAbout(v, ax, ph){
  var o=rotPtAbout([v[0],v[1],v[2]], ax, ph, 0);
  return [o[0],o[1],o[2]];
}
/* ============================================================
   ★ 3D 魔方：转动时左边这一颗要【跟着转】★
   先生 2026-10-07：「动的时候左边的3D魔方要跟着转」
   G.spin = {axis, rot, ez, set} —— 该层绕自己的轴，按同一个缓动值转 rot*ez。
   为什么可以这么转（而且不是"看起来差不多"）：几何里已经验证过
     ⌈圆上走 N 格 ⟺ 该层绕轴严格 ±90°，且绕轴 ±90° 后每张贴纸 4 个角精确落到目标贴纸⌋，
   所以 ez=1 时 3D 的落点【就是】平面图那一手的结果，不会"转完再跳一下"。
   ============================================================ */
function drawCube(){
  if(!G.data) return;
  fitCanvas();
  ctx.clearRect(0,0,CW,CH);
  var N=G.n, cen=N/2, HD=N*Math.sqrt(3)/2;
  var sc=Math.min(CW,CH)*0.44/HD, ox=CW/2, oy=CH/2, i, k;
  /* ★不透明立方体只画【外法向朝观察者】的 3 个面★（等轴投影下 6 面互不重叠，全画会看穿） */
  var Lc=[-0.5,-0.3,-0.8], Ln=Math.hypot(Lc[0],Lc[1],Lc[2]);
  Lc=[Lc[0]/Ln,Lc[1]/Ln,Lc[2]/Ln];
  var pal=skinPal();
  function shadeHex(h,kk){
    if(!h) return '#888888';
    function cc(a,b){return Math.min(255,Math.round(parseInt(h.slice(a,b),16)*kk));}
    return 'rgb('+cc(1,3)+','+cc(3,5)+','+cc(5,7)+')';
  }
  for(i=0;i<G.faces.length;i++){
    var nf=G.faces[i].nrm, qn=cam({u:nf[0],v:nf[1],w:nf[2]});
    G.faces[i]._vis = dot3(qn,N0) < 0;
    G.faces[i]._k = pal.shadeBase + pal.shadeAmp*Math.max(0, dot3(qn,{x:Lc[0],y:Lc[1],z:Lc[2]}));
  }
  var sp = G.spin, ph = sp ? sp.rot*sp.ez : 0;
  var list=[];
  for(i=0;i<G.tiles.length;i++){
    var t=G.tiles[i], F=G.faces[t.face], pts=t.pts;
    var col=G.fcol[G.pcol[G.pid[t.slot]]], nr=F.nrm, kk=F._k;
    if(sp && sp.set[t.slot]){
      /* 这一层的贴纸：位置绕轴转，颜色用【转动前】的 —— 贴纸带着自己的颜色在走 */
      col = G.fcol[G.pcol[G.prevPid[t.slot]]];
      nr = rotVecAbout(F.nrm, sp.axis, ph);
      var np=[];
      for(k=0;k<4;k++) np.push(rotPtAbout(pts[k], sp.axis, ph, cen));
      pts = np;
      var qn2=cam({u:nr[0],v:nr[1],w:nr[2]});
      kk = pal.shadeBase + pal.shadeAmp*Math.max(0, dot3(qn2,{x:Lc[0],y:Lc[1],z:Lc[2]}));
    }
    var qv=cam({u:nr[0],v:nr[1],w:nr[2]});
    if(dot3(qv,N0) >= 0) continue;              /* 转动的贴纸法向也在转 ⇒ 逐张贴纸判可见 */
    var cx=0,cy=0,cs=[], wx=0,wy=0,wz=0;
    for(k=0;k<4;k++){
      var s=scr(pts[k][0],pts[k][1],pts[k][2],cen);
      cs.push(s); cx+=s.x; cy+=s.y;
      wx+=pts[k][0]; wy+=pts[k][1]; wz+=pts[k][2];
    }
    cx/=4; cy/=4; wx/=4; wy/=4; wz/=4;
    var q=[];
    for(k=0;k<4;k++) q.push({x:ox+(cx+(cs[k].x-cx)*0.86)*sc,
                             y:oy+(cy+(cs[k].y-cy)*0.86)*sc});
    /* ★把四边形的【起笔角 + 绕向】都规范化★
       同一个四边形，"转过来的顶点顺序"与"原位顶点顺序"可能从不同的角起笔、且绕向相反。
       形状一样，但光栅器在顶点上的边缘取样会差一点点 —— 实测两者逐像素差 33 个点、最大 17 级。
       先取 (y,x) 字典序最小的角当起笔，再让有向面积为正：这与"原来从哪个角、往哪绕"无关。 */
    var k0=0;
    for(k=1;k<4;k++) if(q[k].y<q[k0].y || (q[k].y===q[k0].y && q[k].x<q[k0].x)) k0=k;
    var qr=[];
    for(k=0;k<4;k++) qr.push(q[(k0+k)%4]);
    var area=0;
    for(k=0;k<4;k++){ var n2=qr[(k+1)%4]; area += qr[k].x*n2.y - n2.x*qr[k].y; }
    if(area<0) q=[qr[0], qr[3], qr[2], qr[1]]; else q=qr;
    /* ★排序键一律用【世界坐标】，不用屏幕浮点★
       贴纸中心的三个世界坐标都是半整数 ⇒ 量化后精确；且"转过来的位置"与
       "静止摆放的位置"在世界坐标里是同一个数 ⇒ 两条路径的绘制顺序【逐项相同】
       ⇒ 描边叠压顺序相同 ⇒ ez=1 与静止重绘逐像素一致。
       （此前用屏幕 z 排序：转动路径 cos90° 的 6e-17 残差会让 z 在末位翻序，
         等深贴纸的画序一变，共用边上的描边叠压就变，冒出 ~2.5 万像素的 1~42 级色差） */
    list.push({z:Math.round((wx+wy+wz)*1e3), wx:Math.round(wx*1e3), wy:Math.round(wy*1e3),
               q:q, col:shadeHex(col,kk)});
  }
  /* 深度大的先画（远的在下）；同深度按世界位置定序 ⇒ 与路径无关 */
  list.sort(function(a,b){return (b.z-a.z)||(a.wx-b.wx)||(a.wy-b.wy);});
  ctx.lineJoin='round';
  for(i=0;i<list.length;i++){
    var it=list[i];
    ctx.beginPath();
    ctx.moveTo(it.q[0].x,it.q[0].y);
    for(var k2=1;k2<4;k2++) ctx.lineTo(it.q[k2].x,it.q[k2].y);
    ctx.closePath();
    ctx.fillStyle=it.col; ctx.fill();
    ctx.strokeStyle=pal.cubeGap; ctx.lineWidth=1.4; ctx.stroke();
  }
  G.lastQuads=list;                 /* 供验收脚本比对（动画 ez=1 vs 静止重绘） */
}
/* 由"转多少格"算出 3D 这层要绕轴转多少弧度 */
function spinOf(ci,d){
  var c=G.circles[ci], n=G.n, q=d/n, rot;
  /* ★2026-10-08 演示轮：d 不一定是 N 的整数倍★
     打乱（以及演示的回放）走的是【±1 格】= 90/N 度的扭。原写法 Math.round(d/n) 会把
     ±1 格四舍五入成 0 ⇒ 2D 在滑、左边 3D 却【完全不动】（看着像卡住）。
     正解：整数倍沿用原来的规整（±3 格算成 ∓1 格，动画走近路），非整数倍按【格数比例】转。 */
  /* ★只有 90° 的整数倍才有「刚性」可言★：一条圆在 3D 里是跨四个侧面的
     12 格【方环】，只有 90° 的整数倍才把方环映射回立方体；非整数倍会把格子甩出去（炸开）。
     正常路径（打乱/手势/演示/撤销）d 恒为 N 的整数倍 ⇒ q 恒为整数，永远走不到四舍五入这一步；
     留着只是“万一”时的安全阀——宁可少转一格，也不把 3D 撕裂。 */
  var k=Math.round(q)%4;
  if(k===3) k=-1; else if(k===-2) k=2;
  rot=k*Math.PI/2;
  var set={}, mem=c.members, i;
  for(i=0;i<mem.length;i++) set[mem[i]]=1;
  return {axis:c.axis, rot:rot, ez:0, set:set, ci:ci, d:d};
}

/* ================= 交互：平面图 ================= */
/* ★★2026-10-08 修：si 是【球粒 id (pid)】，不是槽位 index★★
   证据链：buildBoard 里 `b.dataset.si=i`，这个 i 是 gEls / G.at 的下标 ⇒ 就是 pid；
   而球粒会到处跑（newPuzzle 一开始就用 steps=max(6,3n) 步随机转动打乱 G.at），
   所以必须先用 G.at[pid] 取它【当前所在的槽位】，再拿那个槽位去判属于哪条圆。

   ✗ 原写法 `var s=G.slots[si]`：把 pid 直接当槽位用。
     初始化/重开题那一瞬 pid==slot 才对，之后 at 一被打乱就查错位置
     ⇒ 点一颗球却转了另一条线，而且【从第一步起就错】。
     实测（_mirror_bug_repro.js 真鼠标手势）：全新题 36/54 颗球判错层；
     真手势点 pid=0（用户指向 ci=3）实际转动 ci=0。先生 2026-10-08 报的"严重 BUG"即此。

   判圆口径（未改）：球落在两条圆的交点上，取【切线最接近竖直】的那条
   —— 因为手势是上下滑，切线越竖直，球沿线滑动越自然。 */
function ballCircle(si){
  var s=G.slots[G.at[si]], best=-1, bs=-1;
  for(var i=0;i<s.circles.length;i++){
    var c=G.circles[s.circles[i]];
    var tx=-(s.y-c.cy), ty=(s.x-c.cx);
    var a=Math.abs(ty)/Math.hypot(tx,ty);
    if(a>bs){bs=a;best=s.circles[i];}
  }
  return best;
}
function target(ev){
  var t=ev.target;
  if(t.dataset.si!==undefined) return {si:+t.dataset.si, ci:null};
  if(t.dataset.ci!==undefined) return {si:null, ci:+t.dataset.ci};
  return null;
}
var sw=null;
svg.addEventListener('pointerdown',function(ev){
  if(G.busy) return;
  var tg=target(ev); if(!tg) return;
  sw={y:ev.clientY, tg:tg, cix:null};
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove',function(ev){
  if(!sw) return;
  var dy=ev.clientY-sw.y;
  if(Math.abs(dy)>8 && sw.cix===null){
    sw.cix = sw.tg.si!==null ? ballCircle(sw.tg.si) : sw.tg.ci;
    G.sel=sw.cix; highlight();
  }
});
svg.addEventListener('pointerup',function(ev){
  if(!sw) return;
  var dy=ev.clientY-sw.y, st=sw; sw=null;
  if(Math.abs(dy)<12){
    G.sel=(st.tg.si!==null? ballCircle(st.tg.si) : st.tg.ci);
    highlight(); return;
  }
  var ci = st.cix!==null ? st.cix : (st.tg.si!==null? ballCircle(st.tg.si) : st.tg.ci);
  /* ★一次滑动 = 该层转 90°（= 沿该圆走 N 格）★
     不是"走 1 格"：只有走 N 格才在 3D 里是【严格的绕轴 90° 刚体转动】
     （几何自检：绕轴 ±90° 后每张贴纸 4 个角精确落到目标贴纸，误差 0），
     所以左边那颗 3D 才能真的跟着转整层。c.cw 是该圆的顺时针符号。 */
  turn(ci, (dy<0?1:-1) * G.circles[ci].cw * G.n);
});
svg.addEventListener('pointercancel',function(){sw=null;});

/* ================= 交互：缩略图拖动转视角 ================= */
var cu=document.getElementById('cubeWrap');
cu.addEventListener('pointerdown',function(ev){
  cu.classList.add('dragging'); cu.setPointerCapture(ev.pointerId);
  cu._d={x:ev.clientX,y:ev.clientY};
});
cu.addEventListener('pointermove',function(ev){
  if(!cu._d) return;
  var dx=ev.clientX-cu._d.x, dy=ev.clientY-cu._d.y;
  cu._d={x:ev.clientX,y:ev.clientY};
  M=mm(mm(rotAxis(A0.x,A0.y,A0.z,dy*ROTK),rotAxis(-B0.x,-B0.y,-B0.z,dx*ROTK)),M);
  drawCube();
});
['pointerup','pointercancel'].forEach(function(t){
  cu.addEventListener(t,function(){cu.classList.remove('dragging');cu._d=null;});
});

/* =========================================================
   ★自定义每面颜色 —— 浮层（先生 2026-10-07 第 3 条）★
   ① 颜色存 G.fcol[6]（索引 = 面号）：球 fill 与 3D 贴纸色都读它；
      isSolved 判【球粒的面号】，与色值无关 ⇒ 换色不影响胜负、不重新出题。
   ② 6 个色块按平面图上的【真实方位角】环摆 —— 方位角就是 geo 里各面心的 deg
      (AB-0 210 左上 / AB-1 30 右下 / BC-0 90 下 / BC-1 270 上 / AC-0 150 左下 / AC-1 330 右上)。
      屏幕位置 = (中心 + r*cos 角度, 中心 + r*sin 角度)，y 向下为正，与 geo 同一口径。
   ③ 撞色 ⇒ 与持有该色的面【交换】，保证 6 面的色始终互不相同。
   ========================================================= */
var FRING=100, FRINGC=135;
var facePopEl=document.getElementById('facePop'), faceRingEl=document.getElementById('faceRing'),
    faceSwEl=document.getElementById('faceSw'), faceColorEl=document.getElementById('faceColor');
function renderFacePop(){
  var i, h='';
  for(i=0;i<6;i++){
    var f=G.faces[i], a=f.deg*Math.PI/180;
    var x=FRINGC+FRING*Math.cos(a), y=FRINGC+FRING*Math.sin(a);
    h+='<div class="fd'+(i===G.faceSel?' on':'')+'" data-f="'+i+'" title="'+f.az+'（'+f.name+'）"'
      +' style="left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px;background:'+G.fcol[i]+'">'+f.az+'</div>';
  }
  faceRingEl.innerHTML=h;
  h='';
  for(i=0;i<PAL10.length;i++)
    h+='<i data-c="'+PAL10[i]+'" class="'+(G.fcol[G.faceSel]===PAL10[i]?'on':'')
      +'" style="background:'+PAL10[i]+'"></i>';
  faceSwEl.innerHTML=h;
  if(faceColorEl) faceColorEl.value=String(G.fcol[G.faceSel]).toLowerCase();
}
function setFaceColor(c){
  c=String(c||'').toUpperCase();
  if(!/^#[0-9A-F]{6}$/.test(c)) return;
  var fi=G.faceSel, j=G.fcol.indexOf(c);
  if(j===fi) return;
  if(j>=0){ var oldc=G.fcol[fi]; G.fcol[fi]=c; G.fcol[j]=oldc; }   /* 撞色 ⇒ 交换 */
  else G.fcol[fi]=c;
  renderFacePop(); paintBalls(); drawCube();      /* ★只刷外观，绝不 newPuzzle★ */
}
function resetFaceColors(){ G.fcol=FCOL.slice(); renderFacePop(); paintBalls(); drawCube(); }
function openFacePop(v){ facePopEl.classList.toggle('show',!!v); if(v) renderFacePop(); }
faceRingEl.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('.fd'):null; if(!t) return;
  G.faceSel=+t.dataset.f; renderFacePop();
});
faceSwEl.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('i'):null; if(!t) return;
  setFaceColor(t.dataset.c);
});
if(faceColorEl) faceColorEl.addEventListener('input',function(){ setFaceColor(this.value); });
document.getElementById('faceReset').addEventListener('click',resetFaceColors);
document.getElementById('faceClose').addEventListener('click',function(){ openFacePop(false); });
facePopEl.addEventListener('click',function(ev){ if(ev.target===facePopEl) openFacePop(false); });

/* ================= 按钮 ================= */
document.querySelectorAll('#lvl button').forEach(function(b){
  b.addEventListener('click',function(){ if(G.busy) return; start(+b.dataset.n); });
});
document.getElementById('btnNew').addEventListener('click',function(){ if(G.busy) return; newPuzzle(); });
document.getElementById('btnDemo').addEventListener('click',demoRun);
document.getElementById('btnResetView').addEventListener('click',function(){ M=defaultM(); drawCube(); });
document.getElementById('btnUndo').addEventListener('click',undo);
document.getElementById('btnFace').addEventListener('click',function(){ if(G.busy) return; openFacePop(true); });
document.getElementById('win').addEventListener('click',function(){
  document.getElementById('win').classList.remove('show'); newPuzzle();
});
document.querySelectorAll('#segSkin button').forEach(function(b){
  b.addEventListener('click',function(){ setSkin(b.dataset.skin); });
});
window.addEventListener('resize',function(){ drawCube(); });

/* ================= 启动 ================= */
/* =========================================================
   ★上/下箭头：辅助转动（先生 2026-10-08 第 3 条）★
   与"在圆线上往上/往下滑"【完全等价】：都是转【当前选中的那一层】。
     上箭头 = 往上滑 = 顺时针 ； 下箭头 = 往下滑 = 逆时针
   口径照抄 pointerup 那一行：turn(ci,(dy<0?1:-1)*cw*n)，即上滑取 +1。
   选中方式：点一下某条圆线或某颗球（单击即选中、线变金）；
   两种转动方式可随时混用。
   ★必须放在 start(3) 之前★ —— start → newPuzzle → highlight → arrowState 会用到这两个元素。
   ========================================================= */
var btnUp=document.getElementById('btnUp'), btnDown=document.getElementById('btnDown');
function arrowState(){
  if(!btnUp || !btnDown) return;          /* 防御：任何早期调用都不炸 */
  var ok=(G.sel>=0 && !G.busy);
  btnUp.disabled=!ok; btnDown.disabled=!ok;
  /* ★放在这里最省事也最不易漏★：arrowState() 在每一次 busy 起落时都会被调用
     （turn/undo 的起手与回调、highlight、newPuzzle…），演示按钮的可用状态跟着一起变。 */
  demoBtnState();
}
function turnSel(sgn){
  if(G.busy || G.sel<0) return;
  turn(G.sel, sgn*G.circles[G.sel].cw*G.n);
}
btnUp.addEventListener('click',function(){ turnSel(1); });
btnDown.addEventListener('click',function(){ turnSel(-1); });
function start(n){ loadLevel(n); buildBoard(); newPuzzle(); }
start(3);
window.__MIRROR__={G:G, isSolved:isSolved, turn:turn, start:start, undo:undo,
  applyTurn:applyTurn, newPuzzle:newPuzzle, animArc:animArc,
  arcPrepare:arcPrepare, arcSet:arcSet, highlight:highlight, updateHUD:updateHUD,
  sc:function(){return G.s;}, ballCircle:ballCircle,
  setSkin:setSkin, skinPal:skinPal, spinOf:spinOf, rotPtAbout:rotPtAbout,
  turnSel:turnSel, arrowState:arrowState,
  isBusy:function(){return G.busy;}, paintBalls:paintBalls, drawCube:drawCube,
  setFaceColor:setFaceColor, resetFaceColors:resetFaceColors, renderFacePop:renderFacePop,
  openFacePop:openFacePop, PAL10:PAL10, DEFCOL:FCOL,
  demoRun:demoRun, demoStop:demoStop, demoBtnState:demoBtnState, demoSteps:demoSteps,
  isDemo:function(){return DEMO.on;}, demoLeft:function(){return DEMO.q.length;},
  demoStepMs:function(){return DEMO_STEP_MS;},
  scramble:function(){return (G.scramble||[]).slice();}, hasSnap:function(){return !!G.snap;}};
</script>
