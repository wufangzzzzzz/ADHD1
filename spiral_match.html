<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三角与方螺旋（与圆同尺寸）</title>
<style>
  body { background:#eef4fa; color:#1c2733; font-family:"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:24px; }
  h2 { text-align:center; font-size:18px; margin:0 0 6px; }
  p.note { text-align:center; color:#5b6b7b; font-size:13px; margin:0 0 22px; }
  .row { display:flex; gap:28px; justify-content:center; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid #d7dee8; border-radius:16px; padding:14px 16px; box-shadow:0 6px 18px rgba(28,39,51,.06); }
  .ttl { text-align:center; font-weight:700; font-size:15px; margin-bottom:10px; }
  .sub { text-align:center; font-size:12px; color:#7a8794; margin-top:8px; }
</style>
</head>
<body>
<h2>正三角形 与 正方形（螺旋尺寸与圆一致）</h2>
<p class="note">两个图形的最大外接边统一对齐为 520px。</p>
<div class="row">
    <div class="card">
      <div class="ttl">正三角形</div>
      <svg viewBox="-300 -300 600 600" width="320" height="320">
        <rect x="-300" y="-300" width="600" height="600" fill="#fbfcff"/>
        <path d="M -8.3 -45.4 L -61.0 -117.4 L 61.0 -127.0 L -8.3 12.1 L -110.7 -146.2 L 110.7 -155.7 L -8.3 69.6 L -160.5 -174.9 L 160.5 -184.5 L -8.3 127.0 L -210.2 -203.6 L 210.2 -213.2 L -8.3 184.5 L -260.0 -232.3 L 260.0 -241.9 L -8.3 241.9" fill="none" stroke="#0984e3" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="sub">外接框 520 × 484 px（与圆螺旋同尺寸）</div>
    </div>
    <div class="card">
      <div class="ttl">正方形</div>
      <svg viewBox="-300 -300 600 600" width="320" height="320">
        <rect x="-300" y="-300" width="600" height="600" fill="#fbfcff"/>
        <path d="M 22.1 27.9 L -56.9 39.5 L -68.5 -62.7 L 56.9 -74.3 L 68.5 74.3 L -103.3 85.9 L -114.9 -109.1 L 103.3 -120.7 L 114.9 120.7 L -149.7 132.3 L -161.3 -155.5 L 149.7 -167.1 L 161.3 167.1 L -196.2 178.8 L -207.8 -202.0 L 196.2 -213.6 L 207.8 213.6 L -242.6 225.2 L -254.2 -248.4 L 242.6 -260.0 L 254.2 260.0" fill="none" stroke="#e17055" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="sub">外接框 508 × 520 px（与圆螺旋同尺寸）</div>
    </div>
</div>
</body>
</html>
