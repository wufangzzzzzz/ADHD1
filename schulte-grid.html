      SchulteGridGame.prototype.formatTime = function(seconds) {
        var mins = Math.floor(seconds / 60);
        var secs = seconds % 60;
        return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
      };

      SchulteGridGame.prototype.closeResult = function() {
        document.getElementById('result-overlay').classList.remove('show');
      };

      SchulteGridGame.prototype.initAudio = function() {
        try {
          window.AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioContext = new AudioContext();
        } catch (e) {
          console.log('Web Audio API 不支持');
        }
      };

      SchulteGridGame.prototype.playSound = function(type) {
        if (!this.audioContext) {
          return;
        }

        try {
          var oscillator = this.audioContext.createOscillator();
          var gainNode = this.audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(this.audioContext.destination);

          if (type === 'start') {
            oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(659.25, this.audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.2);
          } else if (type === 'correct') {
            oscillator.frequency.setValueAtTime(440, this.audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.1);
          } else if (type === 'wrong') {
            oscillator.frequency.setValueAtTime(200, this.audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.15);
          } else if (type === 'complete') {
            oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(659.25, this.audioContext.currentTime + 0.15);
            oscillator.frequency.exponentialRampToValueAtTime(783.99, this.audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.5);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.5);
          }
        } catch (e) {
          console.log('播放音效失败', e);
        }
      };

      // ========== 圆形模式方法 ==========

      SchulteGridGame.prototype.getCircularRingConfig = function() {
        var size = this.gridSize;
        var configs = {
          3: { // 入门: 2层, 10格
            rings: [{ count: 4, fontSize: 34 }, { count: 6, fontSize: 34 }]
          },
          4: { // 初级: 2层, 20格
            rings: [{ count: 8, fontSize: 32 }, { count: 12, fontSize: 34 }]
          },
          5: { // 中级: 3层, 30格 (默认)
            rings: [{ count: 6, fontSize: 34 }, { count: 10, fontSize: 34 }, { count: 14, fontSize: 34 }]
          },
          6: { // 高级: 3层, 40格
            rings: [{ count: 6, fontSize: 30 }, { count: 12, fontSize: 30 }, { count: 22, fontSize: 30 }]
          },
          7: { // 专家: 4层, 60格
            rings: [{ count: 6, fontSize: 22 }, { count: 12, fontSize: 26 }, { count: 18, fontSize: 28 }, { count: 24, fontSize: 26 }]
          }
        };
        return configs[size] || configs[5];
      };

      SchulteGridGame.prototype.getTotalNumbers = function() {
        if (this.isCircularMode) {
          var config = this.getCircularRingConfig();
          var total = 0;
          for (var i = 0; i < config.rings.length; i++) {
            total += config.rings[i].count;
          }
          return total;
        }
        if (this.isBounceMode) return this._bounceGetTotal();
        if (this.isVariantMode) return this.variantNumbers.length;
        if (this.isPatternMode && this.patternSub === 7) {
          return (this._p7RealCount != null) ? this._p7RealCount : 0;
        }
        return this.gridSize * this.gridSize;
      };

      SchulteGridGame.prototype.getNumberStart = function() {
        return this.numberType === 'even' ? 2 : 1;
      };
      SchulteGridGame.prototype.getNumberStep = function() {
        return this.numberType === 'natural' ? 1 : 2;
      };
      SchulteGridGame.prototype.getNumberByIndex = function(i) {
        return this.getNumberStart() + i * this.getNumberStep();
      };
      SchulteGridGame.prototype.getMaxNumber = function() {
        var t = this.getTotalNumbers();
        return this.getNumberStart() + (t - 1) * this.getNumberStep();
      };
      SchulteGridGame.prototype.getFoundCount = function() {
        return Math.round((this.currentNumber - this.getNumberStart()) / this.getNumberStep());
      };
      SchulteGridGame.prototype.updateStartButtonText = function() {
        var btn = document.getElementById('start-btn');
        if (!btn) return;
        var ntLabel = this.numberType === 'odd' ? '奇数' : (this.numberType === 'even' ? '偶数' : '自然数');
        var startNum = this.getNumberStart();
        var maxNum = this.getMaxNumber();
        btn.textContent = ntLabel + ' 从' + startNum + '找到' + maxNum + ' 开始游戏';
      };

      SchulteGridGame.prototype.sectorPath = function(cx, cy, r1, r2, startDeg, endDeg) {
        var toRad = function(d) { return (d - 90) * Math.PI / 180; };
        var s = toRad(startDeg), e = toRad(endDeg);
        var large = (endDeg - startDeg) > 180 ? 1 : 0;
        var ox1 = cx + r2 * Math.cos(s), oy1 = cy + r2 * Math.sin(s);
        var ox2 = cx + r2 * Math.cos(e), oy2 = cy + r2 * Math.sin(e);
        if (r1 === 0) {
          return 'M ' + cx + ' ' + cy +
                 ' L ' + ox1.toFixed(2) + ' ' + oy1.toFixed(2) +
                 ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 1 ' + ox2.toFixed(2) + ' ' + oy2.toFixed(2) +
                 ' Z';
        }
        var ix1 = cx + r1 * Math.cos(s), iy1 = cy + r1 * Math.sin(s);
        var ix2 = cx + r1 * Math.cos(e), iy2 = cy + r1 * Math.sin(e);
        return 'M ' + ix1.toFixed(2) + ' ' + iy1.toFixed(2) +
               ' A ' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + ix2.toFixed(2) + ' ' + iy2.toFixed(2) +
               ' L ' + ox2.toFixed(2) + ' ' + oy2.toFixed(2) +
               ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 0 ' + ox1.toFixed(2) + ' ' + oy1.toFixed(2) +
               ' Z';
      };

      SchulteGridGame.prototype.renderCircularGrid = function() {
        var svg = document.getElementById('circular-svg');
        svg.innerHTML = '';

        // 添加文字阴影滤镜（模拟方形格子的 box-shadow）
        var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        var filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', 'text-shadow');
        filter.setAttribute('x', '-10%');
        filter.setAttribute('y', '-10%');
        filter.setAttribute('width', '120%');
        filter.setAttribute('height', '120%');
        var feDropShadow = document.createElementNS('http://www.w3.org/2000/svg', 'feDropShadow');
        feDropShadow.setAttribute('dx', '0');
        feDropShadow.setAttribute('dy', '1');
        feDropShadow.setAttribute('stdDeviation', '1');
        feDropShadow.setAttribute('flood-color', 'rgba(0,0,0,0.2)');
        filter.appendChild(feDropShadow);
        defs.appendChild(filter);
        svg.appendChild(defs);

        var cx = 250, cy = 250;

        // 添加白色背景圆盘
        var bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        bgCircle.setAttribute('cx', cx);
        bgCircle.setAttribute('cy', cy);
        bgCircle.setAttribute('r', 245);
        bgCircle.setAttribute('fill', '#FFFFFF');
        bgCircle.setAttribute('stroke', '#B0C4B8');
        bgCircle.setAttribute('stroke-width', '1');
        svg.appendChild(bgCircle);
        // 根据难度获取环形配置
        var config = this.getCircularRingConfig();
        var rings = config.rings;
        var numLayers = rings.length;
        var layerWidth = 245 / numLayers;

        // 计算格数总数
        var totalNumbers = 0;
        for (var ci = 0; ci < rings.length; ci++) {
          totalNumbers += rings[ci].count;
        }

        // 生成随机数字
        var numbers = [];
        for (var i = 0; i < totalNumbers; i++) numbers.push(this.getNumberByIndex(i));
        // 混乱模式下额外打乱一次（双层随机）
        if (this.circularChaos) {
          for (var i = numbers.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = numbers[i]; numbers[i] = numbers[j]; numbers[j] = temp;
          }
        }
        for (var i = numbers.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = numbers[i]; numbers[i] = numbers[j]; numbers[j] = temp;
        }

        var numIndex = 0;
        var self = this;

        // 方形格子的彩色色板：红、蓝、橙、紫
        var colorPalette = ['#f44336', '#2196F3', '#FF9800', '#9C27B0'];

        for (var layerIdx = 0; layerIdx < numLayers; layerIdx++) {
          var ring = rings[layerIdx];
          var r1 = layerIdx * layerWidth;
          var r2 = (layerIdx + 1) * layerWidth;
          var ringId = 'ring-' + layerIdx;
          var fontSize = ring.fontSize;
          var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('id', ringId);
          g.setAttribute('class', 'ring');

          var angleStep = 360 / ring.count;

          for (var si = 0; si < ring.count; si++) {
            var startAngle = si * angleStep;
            var endAngle = (si + 1) * angleStep;
            var number = numbers[numIndex++];

            var sectorGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            var isDestroy = self.circularDestroy;
            var isVoid = self.voidMode;
            var isDestroy2 = (isDestroy === 2);
            var destroyClass = isDestroy2 ? ' destroy-mode-2' : (isDestroy === 1 ? ' destroy-mode' : '');
            sectorGroup.setAttribute('class', 'sector-group' + (isVoid ? ' void-mode' : '') + destroyClass);
            sectorGroup.setAttribute('data-number', number);
            sectorGroup.setAttribute('data-layer', layerIdx);
            sectorGroup.setAttribute('data-sector', si);

            var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', self.sectorPath(cx, cy, r1, r2, startAngle, endAngle));
            path.setAttribute('class', 'sector' + (isVoid ? ' ring-cycle-' + (layerIdx + 1) : ''));
            // 毁灭模式2：JS RAF 驱动12色循环；毁灭模式1：棋盘格黑白交替；虚无/正常：白色扇形
            var isBlack = (si % 2 === 0);
            if (isDestroy2) {
              var destroy2StartColor = DESTROY2_COLORS[Math.floor(Math.random() * 12)];
              path.style.fill = destroy2StartColor;
              path.style.stroke = destroy2StartColor;
              path.style.transition = 'none';
            } else if (isDestroy === 1) {
              path.style.fill = isBlack ? '#000000' : '#f2f2f2';
              path.style.stroke = isBlack ? '#333333' : '#cccccc';
            } else {
              // 虚无/正常模式：白色扇形，用 setAttribute 让 CSS hover 生效
              path.setAttribute('fill', '#FFFFFF');
              path.setAttribute('stroke', '#B0C4B8');
            }
            path.setAttribute('stroke-width', '1');
            path.style.cursor = 'pointer';
            sectorGroup.appendChild(path);

            var midAngle = (startAngle + endAngle) / 2;
            var midR = (r1 + r2) / 2;
            var midRad = (midAngle - 90) * Math.PI / 180;
            var tx = cx + midR * Math.cos(midRad);
            var ty = cy + midR * Math.sin(midRad);

            var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', tx.toFixed(2));
            text.setAttribute('y', ty.toFixed(2));
            var textClass = 'sector-text' + (isVoid ? ' void-text' : '') + (isDestroy2 ? ' destroy-text-cycle' : '') + (isDestroy === 1 ? ' destroy-text' : '');
            text.setAttribute('class', textClass);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            text.setAttribute('font-size', fontSize);
            if (isDestroy2) {
              // 毁灭2：白色文字
              text.style.fill = '#ffffff';
              text.style.stroke = '#ffffff';
            } else if (isDestroy === 1) {
              // 毁灭1：数字颜色与底色相反
              text.style.fill = isBlack ? '#f2f2f2' : '#000000';
              text.style.stroke = isBlack ? '#f2f2f2' : '#000000';
            } else {
              // 虚无/正常模式：每个数字随机取彩色
              var textColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
              text.style.fill = textColor;
              text.style.stroke = textColor;
            }
            text.style.strokeWidth = '0.3';
            text.style.paintOrder = 'stroke';
            text.style.filter = 'url(#text-shadow)';
            text.setAttribute('font-weight', '600');
            // 文字反旋转以自身坐标为中心
            text.style.transformOrigin = tx.toFixed(2) + 'px ' + ty.toFixed(2) + 'px';
            text.setAttribute('pointer-events', 'none');
            text.textContent = number;
            sectorGroup.appendChild(text);

            // 点击事件 - 给 g 元素设置 pointer-events:all，虚无模式下透明 path 也能捕获点击
            sectorGroup.setAttribute('pointer-events', 'all');
            sectorGroup.onclick = (function(num, el) {
              return function() { self.handleClick(num, el); };
            })(number, sectorGroup);

            g.appendChild(sectorGroup);
          }

          svg.appendChild(g);
        }

        // 虚无模式下旋转状态由 toggleVoidMode 调用 startCircularRotation 恢复
        // 毁灭2：启动 JS RAF 颜色循环
        if (this.circularDestroy === 2) { this._startDestroy2Cycle(); }
      };

      // 毁灭2：CSS transition 驱动12色渐变循环（每680ms跳到下一个颜色，浏览器自动渐变过渡）
      SchulteGridGame.prototype._startDestroy2Cycle = function() {
        var self = this;
        // 保存已锁定的扇区（已正确点击变绿的），切换毁灭模式时不丢失
        var savedLocked = self.destroy2Locked || {};
        self._stopDestroy2Cycle();
        self.destroy2Locked = savedLocked;
        var sectors = document.querySelectorAll('#circular-svg .sector');
        if (!sectors.length) return;
        var nColors = DESTROY2_COLORS.length;
        // 每个扇形独立随机起始颜色索引（已锁定的扇区跳过，保留绿色）
        var colorIdx = [];
        for (var i = 0; i < sectors.length; i++) {
          colorIdx.push(Math.floor(Math.random() * nColors));
          sectors[i].style.transition = 'fill 0.68s ease, stroke 0.68s ease';
          if (!self.destroy2Locked[i]) {
            sectors[i].style.fill = DESTROY2_COLORS[colorIdx[i]];
            sectors[i].style.stroke = DESTROY2_COLORS[colorIdx[i]];
          }
          // 已锁定的扇区保持当前颜色（绿色），不覆盖
        }
        self.destroy2IntervalId = setInterval(function() {
          for (var i = 0; i < sectors.length; i++) {
            if (self.destroy2Locked[i]) continue; // 已正确点击的扇区跳过颜色循环
            colorIdx[i] = (colorIdx[i] + 1) % nColors;
            sectors[i].style.fill = DESTROY2_COLORS[colorIdx[i]];
            sectors[i].style.stroke = DESTROY2_COLORS[colorIdx[i]];
          }
        }, 680);
      };
      SchulteGridGame.prototype._stopDestroy2Cycle = function() {
        if (this.destroy2IntervalId) { clearInterval(this.destroy2IntervalId); this.destroy2IntervalId = null; }
        if (this.destroy2RafId) { cancelAnimationFrame(this.destroy2RafId); this.destroy2RafId = null; }
        // 不在此处清空 destroy2Locked——由 _startDestroy2Cycle 管理保存/恢复，
        // 确保在毁灭模式间切换（2→1→2）时不丢失已点击的绿色扇区
      };

      SchulteGridGame.prototype._updateCircularSectorStyles = function() {
        var sectors = document.querySelectorAll('#circular-svg .sector');
        var texts = document.querySelectorAll('#circular-svg .sector-text');
        var isVoid = this.voidMode;
        var isDestroy = this.circularDestroy;
        var isDestroy2 = (isDestroy === 2);

        // 更新扇形填充 + ring-cycle 类
        var ringCycleClasses = ['ring-cycle-1','ring-cycle-2','ring-cycle-3','ring-cycle-4','ring-cycle-5','ring-cycle-6','ring-cycle-7'];
        for (var i = 0; i < sectors.length; i++) {
          var sg = sectors[i].parentElement;
          var layerIdx = parseInt(sg.getAttribute('data-layer')) || 0;
          // 先清除所有 ring-cycle 类和 destroy-color-cycle
          for (var rc = 0; rc < ringCycleClasses.length; rc++) {
            sectors[i].classList.remove(ringCycleClasses[rc]);
          }
          sectors[i].classList.remove('destroy-color-cycle');
          if (isDestroy2) {
            // 不操作 fill/stroke，由 _startDestroy2Cycle 设置初始颜色
            sectors[i].style.removeProperty('animation-delay');
            sectors[i].style.transition = 'fill 0.8s ease, stroke 0.8s ease';
            sectors[i].classList.remove('destroy-color-cycle');
          } else if (isDestroy === 1) {
            var siFill = parseInt(sg.getAttribute('data-sector')) || 0;
            sectors[i].style.fill = (siFill % 2 === 0) ? '#000000' : '#f2f2f2';
            sectors[i].style.stroke = (siFill % 2 === 0) ? '#333333' : '#cccccc';
          } else if (isVoid) {
            sectors[i].style.fill = '';
            sectors[i].style.stroke = '';
            sectors[i].classList.add('ring-cycle-' + (layerIdx + 1));
          } else {
            sectors[i].style.fill = '#FFFFFF';
            sectors[i].style.stroke = '';
          }
        }

        // 更新文字颜色 + void-text/destroy-text/destroy-text-cycle 类
        for (var j = 0; j < texts.length; j++) {
          texts[j].classList.remove('void-text', 'destroy-text', 'destroy-text-cycle');
          if (isDestroy2) {
            texts[j].style.fill = '#ffffff';
            texts[j].style.stroke = '#ffffff';
            texts[j].classList.add('destroy-text-cycle');
          } else if (isDestroy === 1) {
            var siTxt = parseInt(texts[j].parentElement.getAttribute('data-sector')) || 0;
            texts[j].style.fill = (siTxt % 2 === 0) ? '#f2f2f2' : '#000000';
            texts[j].style.stroke = (siTxt % 2 === 0) ? '#f2f2f2' : '#000000';
            texts[j].classList.add('destroy-text');
          } else if (isVoid) {
            texts[j].style.fill = '';
            texts[j].style.stroke = '';
            texts[j].classList.add('void-text');
          } else {
            texts[j].style.fill = '';
            texts[j].style.stroke = '';
          }
        }

        // 更新 sector-group 类
        var groups = document.querySelectorAll('#circular-svg .sector-group');
        for (var k = 0; k < groups.length; k++) {
          groups[k].classList.remove('void-mode', 'destroy-mode', 'destroy-mode-2');
          if (isVoid) groups[k].classList.add('void-mode');
          if (isDestroy2) { groups[k].classList.add('destroy-mode-2'); groups[k].setAttribute('pointer-events', 'all'); }
          if (isDestroy === 1) groups[k].classList.add('destroy-mode');
        }

        // 启动/停止 RAF 颜色循环
        if (isDestroy2) {
          this._startDestroy2Cycle();
        } else {
          this._stopDestroy2Cycle();
        }
      };

      SchulteGridGame.prototype.toggleCircularRotation = function() {
        var svg = document.getElementById('circular-svg');
        var rings = svg.querySelectorAll('.ring');
        var btn = document.getElementById('circular-mode-btn');

        var prevState = this.circularRotating;
        // 三态切换: 0(静) → 1(动1:交替CW/CCW) → 2(动2:变速+30s翻转) → 0(静)
        this.circularRotating = (this.circularRotating + 1) % 3;

        // 先清除所有旋转类（含变速/虚无/方向类）
        var allRotateClasses = ['rotate-cw','rotate-ccw','ring-reverse','void-speed'];
        var allCounterClasses = ['counter-cw','counter-ccw','text-reverse'];
        for (var r = 0; r < 7; r++) {
          allRotateClasses.push('rotate-cw-r'+r, 'rotate-ccw-r'+r);
          allCounterClasses.push('counter-cw-r'+r, 'counter-ccw-r'+r);
        }
        rings.forEach(function(ring) {
          ring.classList.remove.apply(ring.classList, allRotateClasses);
          var texts = ring.querySelectorAll('.sector-text');
          for (var t = 0; t < texts.length; t++) {
            texts[t].classList.remove.apply(texts[t].classList, allCounterClasses);
          }
        });

        // 退出动2模式时停止RAF + 清除inline transform
        if (prevState === 2 && this.circularRotating !== 2) {
          this._stopSpeedRAF();
          this._speedFlipCW = true;
        }

        if (this.circularRotating === 1) {
          // 动1：交替CW/CCW（当前行为）
          rings.forEach(function(ring, idx) {
            ring.classList.add(idx % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
            var texts = ring.querySelectorAll('.sector-text');
            for (var t = 0; t < texts.length; t++) {
              texts[t].classList.add(idx % 2 === 0 ? 'counter-cw' : 'counter-ccw');
            }
          });
          btn.textContent = '圆形（动）';
        } else if (this.circularRotating === 2) {
          // 动2：JS RAF控制旋转，每30s翻转方向，角度连续无跳变
          if (prevState !== 2) {
            this._speedFlipCW = true;
          }
          this._startSpeedRAF();
          btn.textContent = '圆形（动·变速）';
        } else {
          btn.textContent = '圆形';
        }
      };

      // 动2模式：JS RAF 控制旋转，替代 CSS animation + animation-direction
      // 优势：翻转方向时角度连续无跳变（CSS animation-direction 变化会重置动画进度）
      // 30秒从 _speedRAFStart 起算，start() 时重置以确保从游戏开始计时
      // 累计角度法：每帧增量累加，翻转方向只改变增量符号，角度天然连续
      SchulteGridGame.prototype._startSpeedRAF = function() {
        var self = this;
        if (this._speedRAFId) cancelAnimationFrame(this._speedRAFId);
        this._speedRAFStart = performance.now();
        this._speedRAFLast = this._speedRAFStart;
        this._speedAngles = []; // 每个ring的累计角度

        function tick(now) {
          if (!self.isCircularMode || self.circularRotating !== 2) {
            self._speedRAFId = null;
            return;
          }
          var dt = (now - self._speedRAFLast) / 1000; // 秒
          self._speedRAFLast = now;
          var elapsed = (now - self._speedRAFStart) / 1000;

          // 每30秒翻转方向：0-30s → CW(1)，30-60s → CCW(-1)，60-90s → CW(1)...
          var direction = Math.floor(elapsed / 30) % 2 === 0 ? 1 : -1;
          self._speedFlipCW = direction === 1;

          var svg = document.getElementById('circular-svg');
          if (!svg) { self._speedRAFId = requestAnimationFrame(tick); return; }
          var rings = svg.querySelectorAll('.ring');

          // 每圈速度（秒/圈）：r0=20, r1=25, r2=30, r3=35, r4=40, r5=45, r6=50
          var durations = [20, 25, 30, 35, 40, 45, 50];
          // 虚无/毁灭模式转速+10%
          if (self.voidMode || self.circularDestroy > 0) {
            durations = [18, 22.5, 27, 31.5, 36, 40.5, 45];
          }

          for (var r = 0; r < rings.length; r++) {
            var dur = durations[r] || durations[durations.length - 1];
            // 累计角度：每帧增量 = direction * (360/dur) * dt
            if (self._speedAngles[r] === undefined) self._speedAngles[r] = 0;
            self._speedAngles[r] += direction * (360 / dur) * dt;
            var angle = self._speedAngles[r] % 360;
            if (angle < 0) angle += 360;
            rings[r].style.transform = 'rotate(' + angle + 'deg)';

            // text 反向旋转（保持数字朝上），transform-origin 已在 renderCircularGrid 中逐元素设置
            var texts = rings[r].querySelectorAll('.sector-text');
            for (var t = 0; t < texts.length; t++) {
              texts[t].style.transform = 'rotate(' + (-angle) + 'deg)';
            }
          }

          self._speedRAFId = requestAnimationFrame(tick);
        }
        self._speedRAFId = requestAnimationFrame(tick);
      };

      SchulteGridGame.prototype._stopSpeedRAF = function() {
        if (this._speedRAFId) {
          cancelAnimationFrame(this._speedRAFId);
          this._speedRAFId = null;
        }
        this._speedAngles = null; // 清除累计角度状态
        // 清除 inline transform（让 CSS 动画类或静态状态接管）
        var svg = document.getElementById('circular-svg');
        if (svg) {
          var rings = svg.querySelectorAll('.ring');
          for (var i = 0; i < rings.length; i++) {
            rings[i].style.transform = '';
            var texts = rings[i].querySelectorAll('.sector-text');
            for (var t = 0; t < texts.length; t++) {
              texts[t].style.transform = '';
            }
          }
        }
        // 清除翻转定时器（兼容旧代码）
        if (this._speedFlipTimer) {
          clearInterval(this._speedFlipTimer);
          this._speedFlipTimer = null;
        }
      };

      SchulteGridGame.prototype.enterCircularMode = function() {
        // 如果当前在马赛克模式，先退出
        if (this.isMosaicMode) {
          this.exitMosaicMode();
        }
        // 如果当前在方形（动）模式，先退出
        if (this.isSquareMoveMode) {
          this.exitSquareMoveMode();
        }
        // 如果当前在跳动模式，先退出
        if (this.isBounceMode) {
          this.exitBounceMode();
        }
        // 如果当前在旋转模式，先退出（修复 rotate→circular 时 bounce-canvas 残留）
        if (this.isRotateMode) {
          this.exitRotateMode();
        }
        // 如果当前在变体模式，先退出
        if (this.isVariantMode) {
          this.exitVariantMode();
        }
        // 如果当前在视觉差模式，先退出
        if (this.isVisualParallaxMode) {
          this.exitVisualParallaxMode();
        }
        // 如果当前在凹凸模式，先退出
        if (this.isBumpyMode) {
          this.exitBumpyMode();
        }
        if (this.isColorMode) this.exitColorMode();
        if (this.isPatternMode) this.isPatternMode = false;
        // 毁灭4模式切换到圆形时，重置毁灭状态，避免切回方形时DOM不匹配
        if (this.destroyMode > 0) {
          this.destroyMode = 0;
          var dbtn = document.querySelector('.destroy-toggle');
          if (dbtn) {
            dbtn.dataset.destroy = 'false';
            dbtn.classList.remove('active', 'state1', 'state2', 'state3', 'state4', 'state5');
            dbtn.textContent = '毁灭';
          }
        }
        this.isCircularMode = true;
        this.circularRotating = 0;
        this._speedFlipCW = true;
        this.circularChaos = false;
        // 保存进入前的方格模式
        this.previousMode = this.currentMode;
        this.currentMode = 'circular';

        // 隐藏方格容器，显示圆形容器
        document.getElementById('grid-container').style.display = 'none';
        document.getElementById('circular-container').style.display = 'flex';

        // 渲染圆形网格（静态，无旋转类）
        this.renderCircularGrid();

        document.getElementById('circular-mode-btn').textContent = '圆形';

        // 更新按钮状态
        var btns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.remove('active');
        }
        document.getElementById('circular-mode-btn').classList.add('active');

        // 重置状态
        this.currentNumber = this.getNumberStart();
        // 获取当前难度的总格数
        var config = this.getCircularRingConfig();
        var total = 0;
        for (var ci = 0; ci < config.rings.length; ci++) {
          total += config.rings[ci].count;
        }
        document.getElementById('progress').textContent = '0/' + total;
        document.getElementById('timer').textContent = '00:00';
        this.updateStartButtonText();
      };

      SchulteGridGame.prototype.exitCircularMode = function() {
        // 停止旋转 — 清除所有旋转类
        if (this.circularRotating > 0) {
          this.circularRotating = 0;
          // 停止动2 RAF + 清除 inline transform + 清除翻转定时器
          this._stopSpeedRAF();
          var rings = document.querySelectorAll('#circular-svg .ring');
          for (var ri = 0; ri < rings.length; ri++) {
            // 清除动1类
            rings[ri].classList.remove('rotate-cw', 'rotate-ccw');
            // 清除动2类 + 方向翻转类
            rings[ri].classList.remove('rotate-cw-r'+ri, 'rotate-ccw-r'+ri, 'ring-reverse', 'void-speed');
            var txts = rings[ri].querySelectorAll('.sector-text');
            for (var ti = 0; ti < txts.length; ti++) {
              txts[ti].classList.remove('counter-cw', 'counter-ccw');
              txts[ti].classList.remove('counter-cw-r'+ri, 'counter-ccw-r'+ri, 'text-reverse');
            }
          }
        }

        this.isCircularMode = false;
        this.circularDestroy = 0;
        this._stopDestroy2Cycle();

        // 显示方格容器，隐藏圆形容器
        document.getElementById('grid-container').style.display = '';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('variant-container').style.display = 'none';

        // 显示难度选择
        var diffGroup = document.querySelector('.difficulty-group');
        if (diffGroup) diffGroup.style.display = '';

        // 重置按钮文字
        document.getElementById('circular-mode-btn').textContent = '圆形';
      };

      // ========== 跳动模式 ==========
      SchulteGridGame.prototype.enterBounceMode = function(subMode) {
        this.bounceSubMode = (subMode === 3) ? 3 : (subMode === 4) ? 4 : 1;
        // 如果当前在马赛克模式，先退出
        if (this.isMosaicMode) {
          this.exitMosaicMode();
        }
        // 如果当前在方形（动）模式，先退出
        if (this.isSquareMoveMode) {
          this.exitSquareMoveMode();
        }
        // 毁灭4模式切换到混沌时，重置毁灭状态，避免切回方形时DOM不匹配
        if (this.destroyMode > 0) {
          this.destroyMode = 0;
          var dbtn = document.querySelector('.destroy-toggle');
          if (dbtn) {
            dbtn.dataset.destroy = 'false';
            dbtn.classList.remove('active', 'state1', 'state2', 'state3', 'state4', 'state5');
            dbtn.textContent = '毁灭';
          }
        }
        // 如果当前在变体模式，先退出
        if (this.isVariantMode) {
          this.exitVariantMode();
        }
        // 如果当前在视觉差模式，先退出
        if (this.isVisualParallaxMode) {
          this.exitVisualParallaxMode();
        }
        // 如果当前在凹凸模式，先退出
        if (this.isBumpyMode) {
          this.exitBumpyMode();
        }
        if (this.isColorMode) this.exitColorMode();
        if (this.isPatternMode) this.isPatternMode = false;
        if (this.isRotateMode) this.exitRotateMode();
        this.isBounceMode = true;
        this.isCircularMode = false;
        this.previousMode = this.currentMode;
        this.currentMode = 'bounce';

        var c = document.getElementById('bounce-canvas');
        c.style.background = '#FFFFFF';
        c.style.boxShadow = '0 4px 24px rgba(0,0,0,0.08)';

        document.getElementById('grid-container').style.display = 'none';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('bounce-canvas').style.display = 'block';

        var btns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.remove('active');
        }
        var cb = document.getElementById('chaos-btn');
        if (cb) {
          cb.classList.add('active');
          cb.textContent = (this.bounceSubMode === 3 ? '混沌3' : '混沌1');
        }

        this.currentNumber = this.getNumberStart();
        this.reset();
      };

      SchulteGridGame.prototype.exitRotateMode = function() {
        this.isRotateMode = false;
        if (this._rotateAnimId) { cancelAnimationFrame(this._rotateAnimId); this._rotateAnimId = null; }
        var c = document.getElementById('bounce-canvas');
        if (c) { c.style.display = 'none'; }
        var sb = document.getElementById('speed-toggle-btn');
        if (sb) sb.style.display = 'none';
        var cb = document.getElementById('chaos-btn');
        if (cb) cb.textContent = '混沌';
      };

      SchulteGridGame.prototype.exitBounceMode = function() {
        this.isBounceMode = false;
        if (this._bounceAnimId) { cancelAnimationFrame(this._bounceAnimId); this._bounceAnimId = null; }
        document.getElementById('bounce-canvas').style.display = 'none';
        document.getElementById('grid-container').style.display = '';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('variant-container').style.display = 'none';
        var cb = document.getElementById('chaos-btn');
        if (cb) cb.textContent = '混沌';
      };

      // ========== 变体模式（2D平面三叉星布局） ==========

      SchulteGridGame.prototype._variantShadeColor = function(hex, percent) {
        var rgb = this._hexToRgb(hex);
        var r, g, b;
        if (percent > 0) {
          r = Math.round(rgb.r + (255 - rgb.r) * percent);
          g = Math.round(rgb.g + (255 - rgb.g) * percent);
          b = Math.round(rgb.b + (255 - rgb.b) * percent);
        } else {
          r = Math.round(rgb.r * (1 + percent));
          g = Math.round(rgb.g * (1 + percent));
          b = Math.round(rgb.b * (1 + percent));
        }
        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));
        return _rgbToHex(r, g, b);
      };

      // 变体模式：9面三叉星平面布局
      // 每个面是3×3九宫格，在2D平面上按三叉星形状排列
      // A(中心/青) B(右/黄) C(左/粉) D(左上/绿) E(右上/紫)
      // F(B右上/蓝) G(B右下/橙) H(C左上/红) I(C左下/青绿)
      // 难度：入门/初级=3面×4=12, 中级=3面×9=27, 高级=5面×9=45, 专家=7面×9=63, 极限=9面×9=81
      SchulteGridGame.prototype._variantFaceColors = {
        A: '#00BCD4', B: '#FFC107', C: '#E91E63',
        D: '#76FF03', E: '#D500F9', F: '#1565C0',
        G: '#FF9800', H: '#F44336', I: '#009688'
      };

      // 每个面在2D网格中的原点坐标（左上角格子坐标）
      // T字形三叉星（魔方顶面+左右两面展开）：
      //   A 顶面在上，B 右面在下，C 左面在下，B 与 C 并排
      //   D 在 A 左侧，E 在 A 右侧（顶面向上翻开的两侧壁）
      //   F 在 B 右侧，G 在 B 下方（右臂延伸）
      //   H 在 C 左侧，I 在 C 下方（左臂延伸）
      // 难度：初级/入门=3面×4=12, 中级=3面×9=27, 高级=5面×9=45, 专家=7面×9=63, 极限=9面×9=81
      SchulteGridGame.prototype._variantFaceOrigin = {
        A: {x: 3, y: 0},     // 顶部中央（魔方顶面）
        B: {x: 3, y: 3},     // A 正下方（魔方右面）
        C: {x: 0, y: 3},     // B 左侧（魔方左面）
        D: {x: 0, y: 0},     // A 左侧（顶面左壁）
        E: {x: 6, y: 0},     // A 右侧（顶面右壁）
        F: {x: 6, y: 3},     // B 右侧（右臂侧壁）
        G: {x: 3, y: 6},     // B 下方（右臂下壁）
        H: {x: -3, y: 3},    // C 左侧（左臂侧壁）
        I: {x: 0, y: 6}      // C 下方（左臂下壁）
      };

      // 返回某面的9个格子（局部坐标 lx,ly 0~2）
      SchulteGridGame.prototype._getFaceBlocks = function(name) {
        var blocks = [], i, j;
        for (i = 0; i < 3; i++) {
          for (j = 0; j < 3; j++) {
            blocks.push({ lx: i, ly: j, face: name });
          }
        }
        return blocks;
      };

      // 初级模式每面保留的4个格子（局部坐标 lx,ly）
      // A: 5,7,8,9 → center + bottom row (靠近三面交汇处)
      // B: 11,12,14,15 → top-right 2×2 (靠近A面)
      // C: 20,21,23,24 → top-right 2×2 (靠近A面)
      SchulteGridGame.prototype._variantInnerCells = {
        A: [[1,1],[2,1],[1,2],[2,2]],
        B: [[1,0],[2,0],[1,1],[2,1]],
        C: [[1,0],[2,0],[1,1],[2,1]]
      };

      SchulteGridGame.prototype.getVariantBlocks = function() {
        var gs = this.gridSize;
        var faceNames, inner;
        if (gs <= 4) { faceNames = ['A','B','C']; inner = true; }
        else if (gs === 5) { faceNames = ['A','B','C']; inner = false; }
        else if (gs === 6) { faceNames = ['A','B','C','D','E']; inner = false; }
        else if (gs === 7) { faceNames = ['A','B','C','D','E','F','G']; inner = false; }
        else { faceNames = ['A','B','C','D','E','F','G','H','I']; inner = false; }

        var allBlocks = [];
        for (var fi = 0; fi < faceNames.length; fi++) {
          var name = faceNames[fi];
          var color = this._variantFaceColors[name];
          var origin = this._variantFaceOrigin[name];
          var blocks = this._getFaceBlocks(name);
          for (var bi = 0; bi < blocks.length; bi++) {
            var b = blocks[bi];
            if (inner) {
              // 初级模式：按用户指定的格子保留
              var keep = this._variantInnerCells[name];
              var found = false;
              for (var ki = 0; ki < keep.length; ki++) {
                if (keep[ki][0] === b.lx && keep[ki][1] === b.ly) { found = true; break; }
              }
              if (!found) continue;
            }
            allBlocks.push({
              lx: b.lx, ly: b.ly,
              gx: origin.x + b.lx, gy: origin.y + b.ly,
              face: name, color: color
            });
          }
        }
        return allBlocks;
      };

      SchulteGridGame.prototype.enterVariantMode = function() {
        // 如果当前在马赛克模式，先退出
        if (this.isMosaicMode) {
          this.exitMosaicMode();
        }
        // 如果当前在方形（动）模式，先退出
        if (this.isSquareMoveMode) {
          this.exitSquareMoveMode();
        }
        // 如果当前在视觉差模式，先退出
        if (this.isVisualParallaxMode) {
          this.exitVisualParallaxMode();
        }
        // 如果当前在凹凸模式，先退出
        if (this.isBumpyMode) {
          this.exitBumpyMode();
        }
        // 如果当前在跳动模式，先退出（停止 RAF + 清理 isBounceMode）
        if (this.isBounceMode) {
          this.exitBounceMode();
        }
        // 如果当前在旋转模式，先退出（清理 isRotateMode 标志 + 停止旋转 RAF）
        if (this.isRotateMode) {
          this.exitRotateMode();
        }
        if (this.isColorMode) this.exitColorMode();
        if (this.isPatternMode) this.isPatternMode = false;
        if (this.isCircularMode) this.exitCircularMode();
        // 毁灭模式重置
        if (this.destroyMode > 0) {
          this.destroyMode = 0;
          var dbtn = document.querySelector('.destroy-toggle');
          if (dbtn) {
            dbtn.dataset.destroy = 'false';
            dbtn.classList.remove('active', 'state1', 'state2', 'state3', 'state4', 'state5');
            dbtn.textContent = '毁灭';
          }
        }
        // 虚无模式重置（进入变体时清除，由用户在变体内手动开启）
        if (this.voidMode >= 1) {
          this.voidMode = 0;
          var vbtn = document.querySelector('.void-toggle');
          if (vbtn) vbtn.classList.remove('active');
        }
        this.isVariantMode = true;
        this.isCircularMode = false;
        this.isBounceMode = false;
        this.previousMode = this.currentMode;
        this.currentMode = 'variant';

        // 使用 variant SVG 容器（等距投影）
        document.getElementById('grid-container').style.display = 'none';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('bounce-canvas').style.display = 'none';
        var vc = document.getElementById('variant-container');
        vc.style.display = 'flex';
        vc.style.justifyContent = 'center';
        vc.style.alignItems = 'center';
        vc.style.width = 'min(92vw, 600px)';
        vc.style.height = 'min(72vh, 550px)';
        vc.style.overflow = 'hidden';
        vc.style.margin = '16px auto';
        vc.style.background = '#ffffff';
        vc.style.borderRadius = '12px';
        vc.style.border = '2px solid #e0e0e0';
        vc.style.boxShadow = '0 4px 20px rgba(0,0,0,0.06)';
        vc.style.padding = '12px';

        // 隐藏转速按钮
        var sb = document.getElementById('speed-toggle-btn');
        if (sb) sb.style.display = 'none';

        // 更新按钮状态
        var btns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.remove('active');
        }
        var vbtn = document.getElementById('variant-mode-btn');
        if (vbtn) vbtn.classList.add('active');

        // 重置游戏状态
        this.currentNumber = this.getNumberStart();
        this.isPlaying = false;
        this.stopTimer();

        // 渲染变体网格
        this.renderVariantGrid();

        // 更新UI
        var total = this.variantNumbers.length;
        document.getElementById('progress').textContent = '0/' + total;
        document.getElementById('timer').textContent = '00:00';
        this.updateStartButtonText();
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'none';
      };

      SchulteGridGame.prototype.exitVariantMode = function() {
        this.isVariantMode = false;
        var container = document.getElementById('grid-container');
        container.style.display = '';
        container.style.background = '';
        container.style.border = '';
        container.style.borderRadius = '';
        container.style.padding = '';
        container.style.width = '';
        container.innerHTML = '';
        document.getElementById('variant-container').style.display = 'none';
        // 退出变体模式时清除虚无状态和各格子渐变定时器
        if (this.voidMode >= 1) {
          this.voidMode = 0;
          var vbtn = document.querySelector('.void-toggle');
          if (vbtn) { vbtn.classList.remove('active'); vbtn.textContent = '虚无'; }
        }
        // 清除所有格子的虚无2定时器
        var allPolys = document.querySelectorAll('#variant-svg .variant-top');
        for (var ai = 0; ai < allPolys.length; ai++) {
          allPolys[ai]._voidActive = false;
          if (allPolys[ai]._voidTimer) {
            clearTimeout(allPolys[ai]._voidTimer);
            allPolys[ai]._voidTimer = null;
          }
        }
        // 不调用reset()，由调用方负责reset
      };

      SchulteGridGame.prototype.renderVariantGrid = function() {
        var self = this;

        // 清除残留的虚无2定时器（防止重置/切换时旧定时器继续触发）
        var oldPolys = document.querySelectorAll('#variant-svg .variant-top');
        for (var oi = 0; oi < oldPolys.length; oi++) {
          oldPolys[oi]._voidActive = false;
          if (oldPolys[oi]._voidTimer) {
            clearTimeout(oldPolys[oi]._voidTimer);
            oldPolys[oi]._voidTimer = null;
          }
        }

        // 等距投影参数
        var hw = 30, hh = 17, zh = 34;

        // 投影函数：3D角点 → 2D屏幕坐标
        function proj(x, y, z) {
          return [Math.round((x - y) * hw * 10) / 10, Math.round(((x + y) * hh - z * zh) * 10) / 10];
        }

        var gs = this.gridSize;
        var faceNames;
        var inner = false;
        if (gs <= 4) { faceNames = ['A','B','C']; inner = true; }
        else if (gs === 5) { faceNames = ['A','B','C']; inner = false; }
        else if (gs === 6) { faceNames = ['A','B','C','D','E']; inner = false; }
        else if (gs === 7) { faceNames = ['A','B','C','D','E','F','G']; inner = false; }
        else { faceNames = ['A','B','C','D','E','F','G','H','I']; inner = false; }

        var faceColors = { A:'#00BCD4', B:'#FFC107', C:'#E91E63', D:'#76FF03', E:'#D500F9', F:'#1565C0', G:'#FF9800', H:'#F44336', I:'#009688' };

        // 初级内层格子标记（lx,ly映射）
        var innerMask = {
          A: [[1,1],[2,1],[1,2],[2,2]],
          B: [[1,2],[2,2],[1,1],[2,1]],
          C: [[1,2],[2,2],[1,1],[2,1]]
        };

        // ====== 所有格子：用角点投影，确保共用边完全贴合 ======
        var blocks = [];

        // A面（顶面 z=3）：x=0..2, y=0..2, 每个格子的4角投影
        for (var ax = 0; ax < 3; ax++) {
          for (var ay = 0; ay < 3; ay++) {
            if (inner && !innerMatch('A', ax, ay)) continue;
            var c1 = proj(ax, ay, 3);
            var c2 = proj(ax+1, ay, 3);
            var c3 = proj(ax+1, ay+1, 3);
            var c4 = proj(ax, ay+1, 3);
            var ct = proj(ax+0.5, ay+0.5, 3);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'A', depth: ax+0.5+ay+0.5+3 });
          }
        }

        // B面（右面 x=3）：y=0..2, z=0..2
        for (var by = 0; by < 3; by++) {
          for (var bz = 0; bz < 3; bz++) {
            if (inner && !innerMatch('B', by, bz)) continue;
            var c1 = proj(3, by, bz);
            var c2 = proj(3, by+1, bz);
            var c3 = proj(3, by+1, bz+1);
            var c4 = proj(3, by, bz+1);
            var ct = proj(3, by+0.5, bz+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'B', depth: 3+by+0.5+bz+0.5 });
          }
        }

        // C面（左面 y=3）：x=0..2, z=0..2
        for (var cx = 0; cx < 3; cx++) {
          for (var cz = 0; cz < 3; cz++) {
            if (inner && !innerMatch('C', cx, cz)) continue;
            var c1 = proj(cx, 3, cz);
            var c2 = proj(cx+1, 3, cz);
            var c3 = proj(cx+1, 3, cz+1);
            var c4 = proj(cx, 3, cz+1);
            var ct = proj(cx+0.5, 3, cz+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'C', depth: cx+0.5+3+cz+0.5 });
          }
        }

        // D面（A左壁 x=0, y=0..2, z=3..5）
        for (var dy = 0; dy < 3; dy++) {
          for (var dz = 3; dz < 6; dz++) {
            var c1 = proj(0, dy, dz);
            var c2 = proj(0, dy+1, dz);
            var c3 = proj(0, dy+1, dz+1);
            var c4 = proj(0, dy, dz+1);
            var ct = proj(0, dy+0.5, dz+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'D', depth: 0+dy+0.5+dz+0.5 });
          }
        }

        // E面（A右壁 y=0, x=0..2, z=3..5）
        for (var ex = 0; ex < 3; ex++) {
          for (var ez = 3; ez < 6; ez++) {
            var c1 = proj(ex, 0, ez);
            var c2 = proj(ex+1, 0, ez);
            var c3 = proj(ex+1, 0, ez+1);
            var c4 = proj(ex, 0, ez+1);
            var ct = proj(ex+0.5, 0, ez+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'E', depth: ex+0.5+0+ez+0.5 });
          }
        }

        // F面（B前壁右延 y=0, x=3..5, z=0..2，与E同角度）
        for (var fx = 3; fx < 6; fx++) {
          for (var fz = 0; fz < 3; fz++) {
            var c1 = proj(fx, 0, fz);
            var c2 = proj(fx+1, 0, fz);
            var c3 = proj(fx+1, 0, fz+1);
            var c4 = proj(fx, 0, fz+1);
            var ct = proj(fx+0.5, 0, fz+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'F', depth: fx+0.5+0+fz+0.5 });
          }
        }

        // G面（B底面右延 z=0, x=3..5, y=0..2，与A同角度）
        for (var gx = 3; gx < 6; gx++) {
          for (var gy = 0; gy < 3; gy++) {
            var c1 = proj(gx, gy, 0);
            var c2 = proj(gx+1, gy, 0);
            var c3 = proj(gx+1, gy+1, 0);
            var c4 = proj(gx, gy+1, 0);
            var ct = proj(gx+0.5, gy+0.5, 0);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'G', depth: gx+0.5+gy+0.5+0 });
          }
        }

        // H面（C左壁前延 x=0, y=3..5, z=0..2，F的垂直镜像）
        for (var hy = 3; hy < 6; hy++) {
          for (var hz = 0; hz < 3; hz++) {
            var c1 = proj(0, hy, hz);
            var c2 = proj(0, hy+1, hz);
            var c3 = proj(0, hy+1, hz+1);
            var c4 = proj(0, hy, hz+1);
            var ct = proj(0, hy+0.5, hz+0.5);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'H', depth: 0+hy+0.5+hz+0.5 });
          }
        }

        // I面（C底面前延 z=0, y=3..5, x=0..2，G的垂直镜像）
        for (var iy = 3; iy < 6; iy++) {
          for (var ix = 0; ix < 3; ix++) {
            var c1 = proj(ix, iy, 0);
            var c2 = proj(ix+1, iy, 0);
            var c3 = proj(ix+1, iy+1, 0);
            var c4 = proj(ix, iy+1, 0);
            var ct = proj(ix+0.5, iy+0.5, 0);
            blocks.push({ pts:[c1,c2,c3,c4], cx:ct[0], cy:ct[1], face:'I', depth: ix+0.5+iy+0.5+0 });
          }
        }

        // 过滤面
        var faceSet = {};
        for (var fi = 0; fi < faceNames.length; fi++) faceSet[faceNames[fi]] = true;
        blocks = blocks.filter(function(b) { return faceSet[b.face]; });

        // 面之间不重叠（仅共享边），无需去重

        // 生成打乱数字
        var total = blocks.length;
        this.variantNumbers = [];
        for (var ni = 0; ni < total; ni++) this.variantNumbers.push(this.getNumberByIndex(ni));
        for (var ni2 = this.variantNumbers.length - 1; ni2 > 0; ni2--) {
          var nj = Math.floor(Math.random() * (ni2 + 1));
          var nt = this.variantNumbers[ni2];
          this.variantNumbers[ni2] = this.variantNumbers[nj];
          this.variantNumbers[nj] = nt;
        }
        for (var bi2 = 0; bi2 < blocks.length; bi2++) blocks[bi2].number = this.variantNumbers[bi2];

        // 排序：远→近（depth 越小越远，先画）
        blocks.sort(function(a, b) { return a.depth - b.depth; });

        // 计算 viewBox
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (var bi3 = 0; bi3 < blocks.length; bi3++) {
          var b3 = blocks[bi3];
          for (var pi = 0; pi < 4; pi++) {
            if (b3.pts[pi][0] < minX) minX = b3.pts[pi][0];
            if (b3.pts[pi][0] > maxX) maxX = b3.pts[pi][0];
            if (b3.pts[pi][1] < minY) minY = b3.pts[pi][1];
            if (b3.pts[pi][1] > maxY) maxY = b3.pts[pi][1];
          }
        }
        var pad = 10;
        var vbX = minX - pad, vbY = minY - pad;
        var vbW = maxX - minX + pad * 2, vbH = maxY - minY + pad * 2;

        // SVG渲染
        var svg = document.getElementById('variant-svg');
        svg.setAttribute('viewBox', vbX + ' ' + vbY + ' ' + vbW + ' ' + vbH);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.style.display = '';
        svg.innerHTML = '';

        for (var bi4 = 0; bi4 < blocks.length; bi4++) {
          var b4 = blocks[bi4];
          var ptsStr = b4.pts[0][0] + ',' + b4.pts[0][1] + ' ' +
                       b4.pts[1][0] + ',' + b4.pts[1][1] + ' ' +
                       b4.pts[2][0] + ',' + b4.pts[2][1] + ' ' +
                       b4.pts[3][0] + ',' + b4.pts[3][1];

          var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('class', 'variant-block');
          g.setAttribute('data-number', b4.number);
          g.style.cursor = 'pointer';

          var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', ptsStr);
          // 虚无模式：每个格子随机颜色；否则按面颜色
          if (self.voidMode >= 1 && (self.currentMode === 'variant' || self.currentMode === 'offset' || self.currentMode === 'chaos')) {
            var hue;
            do {
              hue = Math.floor(Math.random() * 360);
            } while (hue >= 100 && hue <= 145);
            var sat = 55 + Math.floor(Math.random() * 25);
            var lit = 45 + Math.floor(Math.random() * 15);
            poly.setAttribute('fill', 'hsl(' + hue + ',' + sat + '%,' + lit + '%)');
            // 虚无2模式：CSS transition 实现渐变动画
            if (self.voidMode === 2) {
              poly.style.transition = 'fill 2s ease';
            }
          } else {
            poly.setAttribute('fill', faceColors[b4.face]);
          }
          poly.setAttribute('stroke', '#1a1a2e');
          poly.setAttribute('stroke-width', '0.5');
          poly.setAttribute('class', 'variant-top');
          g.appendChild(poly);

          var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          txt.setAttribute('x', b4.cx);
          txt.setAttribute('y', b4.cy + 4);
          txt.setAttribute('text-anchor', 'middle');
          txt.setAttribute('fill', '#fff');
          txt.setAttribute('font-size', '14');
          txt.setAttribute('font-weight', 'bold');
          txt.setAttribute('font-family', '"Microsoft YaHei", sans-serif');
          txt.setAttribute('class', 'variant-text');
          txt.textContent = b4.number;

          // 偏移模式：静态旋转
          if (self.currentMode === 'offset') {
            var angles = [15, 30, 45, 60, 90, -15, -30, -45, -60, -90];
            var ang = angles[Math.floor(Math.random() * angles.length)];
            txt.setAttribute('transform', 'rotate(' + ang + ' ' + b4.cx + ' ' + b4.cy + ')');
          }
          // 混乱模式：动态摆动（标准对齐普通模式：角度池一致 + 各自绕自身中心旋转）
          else if (self.currentMode === 'chaos') {
            txt.classList.add('chaos-mode');
            // 角度幅度与普通模式一致（[25,30,45,75]×±1），不再用变体原本较小的 [15,30,45]
            var cAngles = [25, 30, 45, 75, -25, -30, -45, -75];
            var cAng = cAngles[Math.floor(Math.random() * cAngles.length)];
            txt.style.setProperty('--start-angle', cAng + 'deg');
            txt.style.setProperty('--end-angle', (-cAng) + 'deg');
            // 用 view-box 坐标系，把旋转原点显式设为该数字自身的中心（Safari 安全，同毁灭5/圆形做法）
            txt.style.transformOrigin = b4.cx + 'px ' + b4.cy + 'px';
          }

          // 换字模式：随机字体
          if (self.fontMode) {
            var vFont = self.fonts[Math.floor(Math.random() * self.fonts.length)];
            txt.setAttribute('font-family', vFont);
          }

          g.appendChild(txt);

          // 虚无2模式：每个格子记录初始色相，供渐变使用
          if (self.voidMode === 2 && (self.currentMode === 'variant' || self.currentMode === 'offset' || self.currentMode === 'chaos')) {
            var initHue = hue; // 当前已生成的 hue（已在上方跳过100~145）
            poly.setAttribute('data-hue', initHue);
            poly.style.transition = 'fill 1.5s ease';
            // 每个格子独立定时器，3~5s 随机错开
            (function(polyEl, svgEl) {
              function scheduleNext() {
                var delay = 3000 + Math.floor(Math.random() * 2000); // 3000~4999ms
                polyEl._voidTimer = setTimeout(function() {
                  if (!polyEl._voidActive) return;
                  // 向随机方向漂移 60~180°
                  var shift = 60 + Math.floor(Math.random() * 121);
                  if (Math.random() < 0.5) shift = -shift;
                  var newHue = parseInt(polyEl.getAttribute('data-hue')) + shift;
                  newHue = ((newHue % 360) + 360) % 360;
                  // 跳过 #4CAF50 附近 100~145
                  if (newHue >= 100 && newHue <= 145) {
                    newHue = newHue < 122 ? 95 : 150;
                  }
                  polyEl.setAttribute('data-hue', newHue);
                  var s = 55 + Math.floor(Math.random() * 25);
                  var l = 45 + Math.floor(Math.random() * 15);
                  polyEl.setAttribute('fill', 'hsl(' + newHue + ',' + s + '%,' + l + '%)');
                  scheduleNext(); // 递归调度
                }, delay);
              }
              polyEl._voidActive = true;
              scheduleNext();
            })(poly, svg);
          }

          (function(num, elem) {
            g.addEventListener('click', function() { self.handleClick(num, elem); });
          })(b4.number, g);

          svg.appendChild(g);
        }

        // helper: 检查是否在初级内层
        function innerMatch(face, lx, ly) {
          if (!inner) return true;
          var m = innerMask[face];
          if (!m) return true;
          for (var mi = 0; mi < m.length; mi++) {
            if (m[mi][0] === lx && m[mi][1] === ly) return true;
          }
          return false;
        }
      };

      SchulteGridGame.prototype._bounceGetTotal = function() {
        if (this.gridSize === 3) return 10;
        if (this.gridSize === 4) return 20;
        if (this.gridSize === 5) return 30;
        if (this.gridSize === 6) return 40;
        return 50;
      };

      SchulteGridGame.prototype._bounceGetBallRadius = function() {
        return 28;
      };

      SchulteGridGame.prototype._bounceGetColor = function(num, total) {
        var idx = (num - this.getNumberStart()) / this.getNumberStep();
        var ratio = idx / total;
	        var palettes = [
	          ['#C62828','#E53935','#EF5350','#FF5252','#FF7043','#FF8A80','#D32F2F','#B71C1C'],
	          ['#E65100','#F57C00','#FB8C00','#FF9800','#FFA726','#FFB74D','#EF6C00','#BF360C'],
	          ['#F9A825','#FDD835','#FFEE58','#FFEB3B','#FFF176','#FFCA28','#FFB300','#FF8F00'],
	          ['#4E342E','#5D4037','#6D4C41','#795548','#8D6E63','#A1887F','#3E2723','#BCAAA4'],
	          ['#00838F','#00ACC1','#00BCD4','#26C6DA','#4DD0E1','#0097A7','#006064','#00E5FF'],
	          ['#1565C0','#1E88E5','#2196F3','#42A5F5','#64B5F6','#1976D2','#0D47A1','#2979FF'],
	          ['#6A1B9A','#8E24AA','#9C27B0','#AB47BC','#CE93D8','#7B1FA2','#4A148C','#E040FB'],
	          ['#AD1457','#D81B60','#E91E63','#EC407A','#F06292','#C2185B','#880E4F','#FF4081']
	        ];
        var idx = Math.min(Math.floor(ratio * 8), 7);
        var palette = palettes[idx];
        return palette[Math.floor(Math.random() * palette.length)];
      };

      SchulteGridGame.prototype._hexToRgb = function(hex) {
        var h = hex.replace('#', '');
        return {
          r: parseInt(h.substring(0, 2), 16),
          g: parseInt(h.substring(2, 4), 16),
          b: parseInt(h.substring(4, 6), 16)
        };
      };

      SchulteGridGame.prototype._bounceInit = function() {
        var self = this;
        var total = this._bounceGetTotal();
        var midR = this._bounceGetBallRadius();                 // 混沌动基础半径（混沌3 的中间值）
        var rMin = midR * 0.65, rMax = midR * 1.35;            // 混沌3：以 midR=28 为中间值，范围 [18,38]
        this.bounceRMin = rMin; this.bounceRMax = rMax;
        var isC3 = (this.bounceSubMode === 3);
        var isC4 = (this.bounceSubMode === 4);
        var canvas = document.getElementById('bounce-canvas');
        var W = 600, H = 600;

        this._bounceBalls = [];
        for (var i = 1; i <= total; i++) {
          var br = (isC3 || isC4) ? (rMin + Math.random() * (rMax - rMin)) : midR;  // 混沌3/混沌4：开局尺寸均匀分布在 [rMin,rMax]
          var x, y, overlapping;
          var attempts = 0;
          do {
            overlapping = false;
            x = br + Math.random() * (W - 2 * br);
            y = br + Math.random() * (H - 2 * br);
            for (var j = 0; j < self._bounceBalls.length; j++) {
              var b = self._bounceBalls[j];
              var dx = x - b.x, dy = y - b.y;
              if (Math.sqrt(dx * dx + dy * dy) < br + b.r + 2) { overlapping = true; break; }
            }
            attempts++;
          } while (overlapping && attempts < 200);

          var ratio2 = (i - 1) / total;
          var pIdx = Math.min(Math.floor(ratio2 * 9), 8);
          var palettes = [
            ['#C62828','#E53935','#EF5350','#FF5252','#FF7043','#FF8A80','#D32F2F','#B71C1C'],
            ['#E65100','#F57C00','#FB8C00','#FF9800','#FFA726','#FFB74D','#EF6C00','#BF360C'],
            ['#F9A825','#FDD835','#FFEE58','#FFEB3B','#FFF176','#FFCA28','#FFB300','#FF8F00'],
            ['#4E342E','#5D4037','#6D4C41','#795548','#8D6E63','#A1887F','#3E2723','#BCAAA4'],
            ['#00838F','#00ACC1','#00BCD4','#26C6DA','#4DD0E1','#0097A7','#006064','#00E5FF'],
            ['#1565C0','#1E88E5','#2196F3','#42A5F5','#64B5F6','#1976D2','#0D47A1','#2979FF'],
            ['#6A1B9A','#8E24AA','#9C27B0','#AB47BC','#CE93D8','#7B1FA2','#4A148C','#E040FB'],
            ['#AD1457','#D81B60','#E91E63','#EC407A','#F06292','#C2185B','#880E4F','#FF4081'],
            ['#1B5E20','#2E7D32','#388E3C','#43A047','#66BB6A','#81C784','#2E7D32','#1B5E20']
          ];
          var palette = palettes[pIdx];
          var isC4b = (self.bounceSubMode === 4);
          this._bounceBalls.push({
            num: this.getNumberByIndex(i - 1),
            x: x, y: y,
            r: br,
            targetR: br,
            baseR: br,
            phase: Math.random() * Math.PI * 2,
            period: 4.5 + Math.random() * 3.0,
            vx: isC4b ? 0 : (Math.random() - 0.5) * 120,
            vy: isC4b ? 0 : (Math.random() - 0.5) * 120,
            color: palette[Math.floor(Math.random() * palette.length)],
            palette: palette,
            clicked: false
          });
        }
      };

      SchulteGridGame.prototype._bounceAnimate = function() {
        var self = this;
        if ((!this.isBounceMode && !this.isRotateMode) || !this.isPlaying) return;

        var canvas = document.getElementById('bounce-canvas');
        var ctx = canvas.getContext('2d');
        var W = 600, H = 600;
        var balls = this._bounceBalls;
        var dt = 1 / 60;

        // 物理更新
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.clicked) continue;
          if (self.bounceSubMode === 4) {
            // 混沌4：位置固定不动，只做原地呼吸缩放
            var tt = Date.now() * 0.001;
            b.r = b.baseR * (1 + 0.4 * Math.sin(2 * Math.PI * tt / b.period + b.phase));
            continue;
          }
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
          if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
          if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }
          if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); }
          if (self.bounceSubMode === 3 && b.targetR != null) {
            b.r += (b.targetR - b.r) * 0.08;   // 混沌3：半径缓动（0.2→0.08，适中速度）
          }
        }

        // 球间碰撞（混沌4 位置固定，跳过碰撞）
        if (self.bounceSubMode !== 4) {
        for (var i = 0; i < balls.length; i++) {
          for (var j = i + 1; j < balls.length; j++) {
            var a = balls[i], b2 = balls[j];
            if (a.clicked || b2.clicked) continue;
            var dx = b2.x - a.x, dy = b2.y - a.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var minDist = a.r + b2.r;
            if (dist < minDist && dist > 0.001) {
              var nx = dx / dist, ny = dy / dist;
              var overlap = minDist - dist;
              a.x -= nx * overlap / 2;
              a.y -= ny * overlap / 2;
              b2.x += nx * overlap / 2;
              b2.y += ny * overlap / 2;
              var dvx = a.vx - b2.vx, dvy = a.vy - b2.vy;
              var dvn = dvx * nx + dvy * ny;
              if (dvn > 0) {
                a.vx -= dvn * nx;
                a.vy -= dvn * ny;
                b2.vx += dvn * nx;
                b2.vy += dvn * ny;
                if (self.bounceSubMode === 3) {
                  // 混沌3：相撞时两球交换目标半径（大小互换），保持尺寸多样性，不会趋同
                  var tmpR = a.targetR;
                  a.targetR = b2.targetR;
                  b2.targetR = tmpR;
                }
              }
            }
          }
        }
        }

        // 渲染
        ctx.clearRect(0, 0, W, H);
        var destroyActive = self.destroyMode > 0;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          var drawColor;
          if (b.clicked) {
            drawColor = '#4CAF50';
          } else if (destroyActive && b.palette) {
            // 毁灭模式：颜色在调色板4色之间渐变循环
            var t = (Date.now() * 0.001 + b.num * 0.7) % b.palette.length;
            var idx = Math.floor(t);
            var frac = t - idx;
            var c1 = self._hexToRgb(b.palette[idx]);
            var c2 = self._hexToRgb(b.palette[(idx + 1) % b.palette.length]);
            var r = Math.round(c1.r + (c2.r - c1.r) * frac);
            var g = Math.round(c1.g + (c2.g - c1.g) * frac);
            var bl = Math.round(c1.b + (c2.b - c1.b) * frac);
            drawColor = 'rgb(' + r + ',' + g + ',' + bl + ')';
          } else {
            drawColor = b.color;
          }
          ctx.fillStyle = drawColor;
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold ' + Math.floor(b.r * 0.9) + 'px "JetBrains Mono", "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.num, b.x, b.y);
        }

        this._bounceAnimId = requestAnimationFrame(function() { self._bounceAnimate(); });
      };

      SchulteGridGame.prototype._bounceStart = function() {
        var c = document.getElementById('bounce-canvas');
        c.style.background = '#FFFFFF';
        c.style.boxShadow = '0 4px 24px rgba(0,0,0,0.08)';
        this._bounceInit();
        this._bounceAnimate();
      };

      
      SchulteGridGame.prototype._rotateInit = function() {
        var self = this;
        var total = this._bounceGetTotal();
        var ballR = this._bounceGetBallRadius();
        this._rotateAngle = 0;
        this._rotateDirection = 1;
        this._rotateTimer = 0;
        this._lastRotateTime = 0;
        if (this._rotateSpeed === undefined) this._rotateSpeed = 0.1;

        // 大圆参数
        var bigR = 280;
        var bigCx = 300, bigCy = 300;

        // 均匀分配数字到三个扇区
        var sectors = [[], [], []];
        var nums = [];
        for (var i = 0; i < total; i++) nums.push(this.getNumberByIndex(i));
        for (var i = nums.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = nums[i]; nums[i] = nums[j]; nums[j] = tmp;
        }
        for (var i = 0; i < nums.length; i++) {
          sectors[i % 3].push(nums[i]);
        }

        this._bounceBalls = [];
        for (var s = 0; s < 3; s++) {
          var sectorNums = sectors[s];
          for (var k = 0; k < sectorNums.length; k++) {
            var x, y, overlapping;
            var attempts = 0;
            do {
              overlapping = false;
              var angle = Math.random() * Math.PI * 2;
              var dist = ballR + Math.random() * (bigR - ballR * 2);
              x = bigCx + Math.cos(angle) * dist;
              y = bigCy + Math.sin(angle) * dist;
              for (var j = 0; j < self._bounceBalls.length; j++) {
                var b = self._bounceBalls[j];
                var dx = x - b.x, dy = y - b.y;
                if (Math.sqrt(dx * dx + dy * dy) < ballR + b.r + 2) { overlapping = true; break; }
              }
              attempts++;
            } while (overlapping && attempts < 200);

            this._bounceBalls.push({
              num: sectorNums[k],
              x: x, y: y,
              r: ballR,
              vx: (Math.random() - 0.5) * 120,
              vy: (Math.random() - 0.5) * 120,
              color: this._bounceGetColor(sectorNums[k], total),
              clicked: false,
              sector: s
            });
          }
        }
      };

      
      SchulteGridGame.prototype._rotateAnimate = function() {
        if (!this.isRotateMode) return;
        var self = this;
        var canvas = document.getElementById('bounce-canvas');
        var ctx = canvas.getContext('2d');
        var W = 600, H = 600;
        var now = performance.now() / 1000;
        if (!this._lastRotateTime) this._lastRotateTime = now;
        var dt = Math.min(now - this._lastRotateTime, 0.1);
        this._lastRotateTime = now;
        var balls = this._bounceBalls;

        // 物理更新（大圆边界约束）
        var bigR = 280, bigCx = 300, bigCy = 300;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.clicked) continue;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          // 重力
          b.vy += 80 * dt;
          // 大圆边界反弹
          var dx = b.x - bigCx, dy = b.y - bigCy;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist + b.r > bigR) {
            var nx = dx / dist, ny = dy / dist;
            b.x = bigCx + nx * (bigR - b.r);
            b.y = bigCy + ny * (bigR - b.r);
            var dvn = b.vx * nx + b.vy * ny;
            if (dvn > 0) {
              b.vx -= 2 * dvn * nx;
              b.vy -= 2 * dvn * ny;
            }
            b.vx *= 0.95;
            b.vy *= 0.95;
          }
        }

        // 球间碰撞
        for (var i = 0; i < balls.length; i++) {
          for (var j = i + 1; j < balls.length; j++) {
            var a = balls[i], b2 = balls[j];
            if (a.clicked || b2.clicked) continue;
            var dx = b2.x - a.x, dy = b2.y - a.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var minDist = a.r + b2.r;
            if (dist < minDist && dist > 0.001) {
              var nx = dx / dist, ny = dy / dist;
              var overlap = minDist - dist;
              a.x -= nx * overlap / 2;
              a.y -= ny * overlap / 2;
              b2.x += nx * overlap / 2;
              b2.y += ny * overlap / 2;
              var dvx = a.vx - b2.vx, dvy = a.vy - b2.vy;
              var dvn = dvx * nx + dvy * ny;
              if (dvn > 0) {
                a.vx -= dvn * nx;
                a.vy -= dvn * ny;
                b2.vx += dvn * nx;
                b2.vy += dvn * ny;
              }
            }
          }
        }

        // 旋转角度累加（必须在碰撞检测之前计算）
        // 每30秒反转方向
        this._rotateTimer += dt;
        if (this._rotateTimer >= 30) {
          this._rotateTimer = 0;
          this._rotateDirection *= -1;
        }
        this._rotateAngle += this._rotateSpeed * this._rotateDirection;
        if (this._rotateAngle >= 360) this._rotateAngle -= 360;
        if (this._rotateAngle < 0) this._rotateAngle += 360;
        var angleRad = this._rotateAngle * Math.PI / 180;

        // 球与旋转分割线碰撞
        var lineThick = 4;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.clicked) continue;
          for (var k = 0; k < 3; k++) {
            var lineAngle = angleRad + k * Math.PI * 2 / 3;
            var lx = Math.cos(lineAngle), ly = Math.sin(lineAngle);
            var rdx = b.x - bigCx, rdy = b.y - bigCy;
            var proj = rdx * lx + rdy * ly;
            if (proj < 0 || proj > bigR) continue;
            var perpDist = Math.abs(rdx * ly - rdy * lx);
            if (perpDist < b.r + lineThick) {
              var pushDir = (rdx * ly - rdy * lx) >= 0 ? 1 : -1;
              var overlap = b.r + lineThick - perpDist;
              b.x += pushDir * ly * overlap;
              b.y -= pushDir * lx * overlap;
              var vn = b.vx * ly - b.vy * lx;
              b.vx -= vn * ly;
              b.vy += vn * lx;
              b.vx *= 0.9;
              b.vy *= 0.9;
            }
          }
        }

        // 渲染
        ctx.clearRect(0, 0, W, H);

        // 1. 绘制白色大圆背景
        var bigR = 280;
        var bigCx = 300, bigCy = 300;
        ctx.beginPath();
        ctx.arc(bigCx, bigCy, bigR, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E0E0E0';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. 绘制旋转分割线（三条线从圆心直通边缘，无中心圆）
        ctx.save();
        ctx.translate(bigCx, bigCy);
        ctx.rotate(angleRad);

        for (var k = 0; k < 3; k++) {
          var lineAngle = k * Math.PI * 2 / 3;
          var x2 = Math.cos(lineAngle) * bigR;
          var y2 = Math.sin(lineAngle) * bigR;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#D0D0D0';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();

        // 3. 绘制彩色数字球（先画未点击的，再画已点击的绿色球在上层）
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.clicked) continue;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.1)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold ' + Math.floor(b.r * 0.7) + 'px "JetBrains Mono", "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.num, b.x, b.y);
        }
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (!b.clicked) continue;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = '#4CAF50';
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.1)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        this._rotateAnimId = requestAnimationFrame(function() { self._rotateAnimate(); });
      };

      SchulteGridGame.prototype._rotateStart = function() {
        var c = document.getElementById('bounce-canvas');
        c.style.background = 'transparent';
        c.style.boxShadow = 'none';
        var sb = document.getElementById('speed-toggle-btn');
        if (sb) sb.style.display = '';
        this._rotateInit();
        this._rotateAnimate();
      };

      SchulteGridGame.prototype._bounceHandleClick = function(ev) {
        if ((!this.isBounceMode && !this.isRotateMode) || !this.isPlaying) return;
        var canvas = document.getElementById('bounce-canvas');
        var rect = canvas.getBoundingClientRect();
        var scaleX = 600 / rect.width;
        var scaleY = 600 / rect.height;
        var mx = (ev.clientX - rect.left) * scaleX;
        var my = (ev.clientY - rect.top) * scaleY;

        var balls = this._bounceBalls;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          if (b.clicked) continue;
          var dx = mx - b.x, dy = my - b.y;
          if (Math.sqrt(dx * dx + dy * dy) <= b.r) {
            if (b.num === this.currentNumber) {
              b.clicked = true;
              this.currentNumber += this.getNumberStep();
              this.updateUI();
              this.playSound('correct');
              if (this.currentNumber > this.getMaxNumber()) {
                this.completeGame();
              }
            } else {
              this.playSound('wrong');
            }
            return;
          }
        }
      };

      SchulteGridGame.prototype._bounceRender = function() {
        var canvas = document.getElementById('bounce-canvas');
        var ctx = canvas.getContext('2d');
        var W = 600, H = 600;
        ctx.clearRect(0, 0, W, H);
        var balls = this._bounceBalls;
        for (var i = 0; i < balls.length; i++) {
          var b = balls[i];
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.clicked ? '#4CAF50' : b.color;
          ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold ' + Math.floor(b.r * 0.9) + 'px "JetBrains Mono", "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.num, b.x, b.y);
        }
      };

      var game = new SchulteGridGame();

      // 点击外部关闭下拉菜单
      document.addEventListener('click', function(ev) {
        var ntDropdown = document.getElementById('numtype-dropdown');
        var ntWrapper = ntDropdown ? ntDropdown.parentNode : null;
        if (ntDropdown && ntDropdown.classList.contains('show') && ntWrapper && !ntWrapper.contains(ev.target)) {
          ntDropdown.classList.remove('show');
        }
        var bgDropdown = document.getElementById('bgtype-dropdown');
        var bgWrapper = bgDropdown ? bgDropdown.parentNode : null;
        if (bgDropdown && bgDropdown.classList.contains('show') && bgWrapper && !bgWrapper.contains(ev.target)) {
          // 颜色选择后300ms内不关闭下拉菜单，避免原生颜色对话框关闭时的合成点击事件误关
          if (Date.now() - (game._bgColorSelectedAt || 0) > 300) {
            bgDropdown.classList.remove('show');
          }
        }
        // 模式下拉菜单：点击菜单外区域关闭
        var modeMenus = document.querySelectorAll('.mode-menu');
        for (var mi = 0; mi < modeMenus.length; mi++) {
          var mw = modeMenus[mi].parentNode;
          if (modeMenus[mi].classList.contains('show') && mw && !mw.contains(ev.target)) {
            modeMenus[mi].classList.remove('show');
          }
        }
      });

      document.getElementById('bounce-canvas').addEventListener('click', function(ev) {
        game._bounceHandleClick(ev);
      });
    </script>
    <!-- 液态玻璃(Liquid Glass)折射滤镜：feTurbulence 分形噪声 → 平滑 → 位移映射，用于 canvas 背景的液态扭曲 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <filter id="lg-dist" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.014" numOctaves="2" seed="11" result="n"/>
        <feGaussianBlur in="n" stdDeviation="1.1" result="ns"/>
        <feDisplacementMap in="SourceGraphic" in2="ns" scale="16" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
