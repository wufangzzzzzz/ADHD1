      // 横纵结合：步进式——奇数行右移→奇数列下移→偶数行右移→偶数列下移，循环
      SchulteGridGame.prototype._renderSquareMoveBoth = function() {
        var container = document.getElementById('square-move-container');
        container.innerHTML = '';
        container.style.display = 'block';
        container.style.flexDirection = '';
        container.style.gap = '';
        container.style.position = 'relative';

        var size = this.gridSize;
        var cellSize = this.calculateCellSize();
        var padding = 4;
        var gap = 3;
        var stepUnit = cellSize + gap;
        var totalSize = size * cellSize + (size - 1) * gap;

        container.style.width = (totalSize + padding * 2) + 'px';
        container.style.height = (totalSize + padding * 2) + 'px';

        var colorPalette = ['#E53935', '#FF5722', '#FF9800', '#FFC107', '#FFEB3B', '#CDDC39', '#4CAF50', '#009688', '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'];
        var angles = [25, 30, 45, 75];
        var fontSize = Math.floor(cellSize * 0.55);
        var numbers = this.numbers.slice();

        var numColors = {};
        for (var i = 0; i < numbers.length; i++) {
          numColors[numbers[i]] = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        }

        // 创建格子（absolute 定位）+ 视觉位置网格
        var grid = []; // grid[visualRow][visualCol] = cell 元素
        for (var row = 0; row < size; row++) {
          grid[row] = [];
          for (var col = 0; col < size; col++) {
            var idx = row * size + col;
            var num = numbers[idx];

            var cell = document.createElement('div');
            cell.className = 'square-move-cell';
            cell.dataset.number = num;
            cell.style.position = 'absolute';
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            cell.style.fontSize = fontSize + 'px';
            cell.style.lineHeight = cellSize + 'px';
            cell.style.textAlign = 'center';
            cell.style.left = (col * stepUnit + padding) + 'px';
            cell.style.top = (row * stepUnit + padding) + 'px';

            var numberSpan = document.createElement('span');
            numberSpan.className = 'number-text';
            numberSpan.textContent = num;
            numberSpan.style.color = numColors[num];

            if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
              var ang = angles[Math.floor(Math.random() * angles.length)];
              var dir = Math.random() > 0.5 ? 1 : -1;
              var finalAng = ang * dir;
              if (this.currentMode === 'offset') {
                numberSpan.style.transform = 'rotate(' + finalAng + 'deg)';
                numberSpan.style.display = 'inline-block';
              } else {
                numberSpan.classList.add('chaos-mode');
                numberSpan.style.display = 'inline-block';
                numberSpan.style.setProperty('--start-angle', finalAng + 'deg');
                numberSpan.style.setProperty('--end-angle', (-finalAng) + 'deg');
              }
            }

            if (this.fontMode) {
              numberSpan.style.fontFamily = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            }

            cell.appendChild(numberSpan);
            cell.onclick = (function(n, el) {
              return function() { game.handleClick(n, el); };
            })(num, cell);

            container.appendChild(cell);
            grid[row][col] = cell;
          }
        }

        // 步进参数：使用与横向/纵向模式相同的速度（pixelSpeed=15 px/s）
        var pixelSpeed = 15;
        var stepDuration = Math.round(stepUnit / pixelSpeed * 1000); // 移动一格所需时间（ms）
        var pauseDuration = 0; // 无停顿，连续流动
        var stepPhase = 0; // 0=奇数行右移, 1=奇数列下移, 2=偶数行右移, 3=偶数列下移
        var self = this;

        function doStep() {
          var clones = []; // {element, originalCell, targetLeft, targetTop}
          var transitionStr = 'left ' + stepDuration + 'ms linear, top ' + stepDuration + 'ms linear';

          if (stepPhase === 0 || stepPhase === 2) {
            // 水平：右移1格
            var startRow = (stepPhase === 0) ? 0 : 1;
            for (var row = startRow; row < size; row += 2) {
              var oldCells = [];
              for (var c = 0; c < size; c++) oldCells[c] = grid[row][c];

              var wrapCell = oldCells[size - 1];
              for (var c = size - 1; c > 0; c--) {
                grid[row][c] = oldCells[c - 1];
              }
              grid[row][0] = wrapCell;

              // 原格子平滑滑出右边缘（不消失）
              wrapCell.style.transition = transitionStr;
              wrapCell.style.left = (size * stepUnit + padding) + 'px';

              // 克隆从左侧滑入，形成无缝循环
              var clone = wrapCell.cloneNode(true);
              clone.style.transition = 'none';
              clone.style.left = (-stepUnit + padding) + 'px';
              clone.style.top = (row * stepUnit + padding) + 'px';
              (function(num, cl) {
                clone.onclick = function() { game.handleClick(num, cl); };
              })(parseInt(wrapCell.dataset.number), clone);
              container.appendChild(clone);
              clones.push({
                element: clone,
                originalCell: wrapCell,
                targetLeft: padding,
                targetTop: row * stepUnit + padding
              });

              // 其他格子右移1格
              for (var c = 0; c < size - 1; c++) {
                oldCells[c].style.transition = transitionStr;
                oldCells[c].style.left = ((c + 1) * stepUnit + padding) + 'px';
              }
            }
            container.offsetHeight;
            for (var i = 0; i < clones.length; i++) {
              clones[i].element.style.transition = transitionStr;
              clones[i].element.style.left = clones[i].targetLeft + 'px';
            }
          } else {
            // 垂直：下移1格
            var startCol = (stepPhase === 1) ? 0 : 1;
            for (var col = startCol; col < size; col += 2) {
              var oldCells = [];
              for (var r = 0; r < size; r++) oldCells[r] = grid[r][col];

              var wrapCell = oldCells[size - 1];
              for (var r = size - 1; r > 0; r--) {
                grid[r][col] = oldCells[r - 1];
              }
              grid[0][col] = wrapCell;

              // 原格子平滑滑出下边缘
              wrapCell.style.transition = transitionStr;
              wrapCell.style.top = (size * stepUnit + padding) + 'px';

              // 克隆从上方滑入
              var clone = wrapCell.cloneNode(true);
              clone.style.transition = 'none';
              clone.style.left = (col * stepUnit + padding) + 'px';
              clone.style.top = (-stepUnit + padding) + 'px';
              (function(num, cl) {
                clone.onclick = function() { game.handleClick(num, cl); };
              })(parseInt(wrapCell.dataset.number), clone);
              container.appendChild(clone);
              clones.push({
                element: clone,
                originalCell: wrapCell,
                targetLeft: col * stepUnit + padding,
                targetTop: padding
              });

              // 其他格子下移1格
              for (var r = 0; r < size - 1; r++) {
                oldCells[r].style.transition = transitionStr;
                oldCells[r].style.top = ((r + 1) * stepUnit + padding) + 'px';
              }
            }
            container.offsetHeight;
            for (var i = 0; i < clones.length; i++) {
              clones[i].element.style.transition = transitionStr;
              clones[i].element.style.top = clones[i].targetTop + 'px';
            }
          }

          stepPhase = (stepPhase + 1) % 4;

          // 动画结束后：移除克隆，重置原格子到新位置（无transition）
          self._squareMoveBothTimer = setTimeout(function() {
            for (var i = 0; i < clones.length; i++) {
              var orig = clones[i].originalCell;
              orig.style.transition = 'none';
              orig.style.left = clones[i].targetLeft + 'px';
              orig.style.top = clones[i].targetTop + 'px';
              clones[i].element.remove();
            }
            if (clones.length > 0) container.offsetHeight;
            doStep();
          }, stepDuration + pauseDuration);
        }

        self._squareMoveBothTimer = setTimeout(doStep, 500);
      };

      SchulteGridGame.prototype.renderMosaicGrid = function() {
        var size = this.gridSize;
        var container = document.getElementById('mosaic-container');
        container.innerHTML = '';

        // 基于窗口计算游戏区域尺寸，取正方形
        var maxW = Math.min(window.innerWidth - 16, 560);
        var maxH = Math.min(window.innerHeight * 0.75, 560);
        var cw = Math.min(maxW, maxH);
        var ch = cw;
        if (cw < 200) { cw = 400; ch = 400; }
        this._mosaicCW = cw;
        this._mosaicCH = ch;

        // 创建SVG
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', cw);
        svg.setAttribute('height', ch);
        svg.setAttribute('viewBox', '0 0 ' + cw + ' ' + ch);
        svg.style.maxWidth = '100%';
        svg.id = 'mosaic-svg';
        container.appendChild(svg);

        this.generateNumbers();
        var numbers = this.numbers;
        var cellColors = this.generateCellColors(size, size);
        var pts = this._mosaicPoints; // [rows+1][cols+1]
        var idx = 0;
        var isOffset = this.currentMode === 'offset';
        var isChaos = this.currentMode === 'chaos';

        this._mosaicCells = []; // 存储每个格子的多边形和文字，用于点击判定

        for (var r = 0; r < size; r++) {
          for (var c = 0; c < size; c++) {
            // 4个角点：左上、右上、右下、左下
            var p1 = pts[r][c], p2 = pts[r][c+1], p3 = pts[r+1][c+1], p4 = pts[r+1][c];
            var pointsStr = p1.x.toFixed(1)+','+p1.y.toFixed(1)+' '+
                           p2.x.toFixed(1)+','+p2.y.toFixed(1)+' '+
                           p3.x.toFixed(1)+','+p3.y.toFixed(1)+' '+
                           p4.x.toFixed(1)+','+p4.y.toFixed(1);

            var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            poly.setAttribute('points', pointsStr);
            var fillColor = cellColors[idx];
            poly.setAttribute('fill', fillColor);
            poly.setAttribute('opacity', '1');
            poly.originalFill = fillColor;
            poly.setAttribute('stroke', 'rgba(0,0,0,0.15)');
            poly.setAttribute('stroke-width', '1');
            poly.dataset.number = numbers[idx];
            poly.classList.add('mosaic-cell');
            svg.appendChild(poly);

            // 文字（白色）
            var cx = (p1.x + p2.x + p3.x + p4.x) / 4;
            var cy = (p1.y + p2.y + p3.y + p4.y) / 4;
            var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            txt.setAttribute('x', cx);
            txt.setAttribute('y', cy + 4);
            txt.setAttribute('text-anchor', 'middle');
            txt.setAttribute('fill', '#ffffff');
            txt.setAttribute('stroke', 'none');
            txt.setAttribute('font-size', Math.round(cw / size * 0.4));
            txt.setAttribute('font-weight', 'bold');
            if (this.fontMode) {
              txt.setAttribute('font-family', this.getRandomFont());
            } else {
              txt.setAttribute('font-family', '"Microsoft YaHei", sans-serif');
            }
            txt.textContent = numbers[idx];
            txt.classList.add('mosaic-text');

            // offset模式：随机旋转
            if (isOffset) {
              var angle = Math.floor(Math.random() * 6) * 15; // 0,15,30,45,60,75
              txt.setAttribute('transform', 'rotate(' + angle + ' ' + cx + ' ' + cy + ')');
            }
            // chaos模式：摆动动画
            if (isChaos) {
              txt.classList.add('chaos-mode');
              txt.style.animation = 'swing 2s ease-in-out infinite';
              txt.style.animationDelay = (Math.random() * 2) + 's';
            }

            svg.appendChild(txt);

            this._mosaicCells.push({
              poly: poly, txt: txt,
              pts: [p1, p2, p3, p4],
              number: numbers[idx],
              cx: cx, cy: cy,
              txtColor: cellColors[idx]
            });

            idx++;
          }
        }

        // 点击SVG委托
        var self = this;
        svg.onclick = function(e) {
          var pt = svg.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          var svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
          self._mosaicHandleClick(svgPt.x, svgPt.y);
        };

        this.currentNumber = this.getNumberStart();
        this.updateUI();
        this.updateStartButtonText();
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'none';
      };

      // ===== 马赛克动画 =====
      // 计算四边形面积（鞋带公式）
      SchulteGridGame.prototype._mosaicCellArea = function(p1, p2, p3, p4) {
        // p1~p4 按顺时针或逆时针顺序
        return Math.abs(
          (p1.x * p2.y + p2.x * p3.y + p3.x * p4.y + p4.x * p1.y) -
          (p2.x * p1.y + p3.x * p2.y + p4.x * p3.y + p1.x * p4.y)
        ) / 2;
      };

      SchulteGridGame.prototype._mosaicAnimateStart = function() {
        var self = this;
        var size = this.gridSize;
        var cols = size, rows = size;
        var cw = this._mosaicCW || 400;
        var ch = this._mosaicCH || 400;
        var cellW = cw / cols, cellH = ch / rows;
        var pts = this._mosaicPoints;
        var frameCount = 0;

        var maxDist = Math.min(cellW, cellH) * 0.5; // 外层半径：半个格子宽
        var minDist = maxDist * 0.25; // 内层半径：防止格子缩太小
        var maxSpeed = 0.2; // 速度上限，降低至流畅可见

        function animate() {
          frameCount++;
          // 更新每个内部点的位置（双层圆形约束）
          for (var r = 1; r < rows; r++) {
            for (var c = 1; c < cols; c++) {
              var p = pts[r][c];

              // 更新位置
              p.x += p.vx;
              p.y += p.vy;

              // 双层圆形约束：点在 [minDist, maxDist] 环内
              var dx = p.x - p.ox;
              var dy = p.y - p.oy;
              var dist = Math.sqrt(dx * dx + dy * dy);

              if (dist > maxDist) {
                // 超外层：拉回边界，速度方向指向原点
                p.x = p.ox + (dx / dist) * maxDist;
                p.y = p.oy + (dy / dist) * maxDist;
                var nx = -dx / (dist || 1);
                var ny = -dy / (dist || 1);
                var spd = 0.08 + Math.random() * 0.08;
                p.vx = nx * spd + (Math.random() - 0.5) * 0.05;
                p.vy = ny * spd + (Math.random() - 0.5) * 0.05;
              } else if (dist < minDist) {
                // 超内层：拉回内边界，速度方向远离原点
                p.x = p.ox + (dx / dist) * (minDist + 1);
                p.y = p.oy + (dy / dist) * (minDist + 1);
                var nx2 = dx / (dist || 1);
                var ny2 = dy / (dist || 1);
                var spd2 = 0.08 + Math.random() * 0.08;
                p.vx = nx2 * spd2 + (Math.random() - 0.5) * 0.05;
                p.vy = ny2 * spd2 + (Math.random() - 0.5) * 0.05;
              }

              // 速度上限
              var spd3 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
              if (spd3 > maxSpeed) {
                p.vx = (p.vx / spd3) * maxSpeed;
                p.vy = (p.vy / spd3) * maxSpeed;
              }
            }
          }

          // 每帧微小扰动，保持活跃
          for (var r2 = 1; r2 < rows; r2++) {
            for (var c2 = 1; c2 < cols; c2++) {
              var p2 = pts[r2][c2];
              p2.vx += (Math.random() - 0.5) * 0.02;
              p2.vy += (Math.random() - 0.5) * 0.02;
            }
          }

          // 更新SVG格子形状 + 数字跟随中心点
          var cells = self._mosaicCells;
          for (var i = 0; i < cells.length; i++) {
            var cell = cells[i];
            var r0 = Math.floor(i / cols), c0 = i % cols;
            var p1=pts[r0][c0], p2=pts[r0][c0+1], p3=pts[r0+1][c0+1], p4=pts[r0+1][c0];
            var ps = p1.x.toFixed(1)+','+p1.y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+' '+p3.x.toFixed(1)+','+p3.y.toFixed(1)+' '+p4.x.toFixed(1)+','+p4.y.toFixed(1);
            cell.poly.setAttribute('points', ps);
            // 数字跟随格子中心点
            var cx = (p1.x+p2.x+p3.x+p4.x)/4, cy = (p1.y+p2.y+p3.y+p4.y)/4;
            cell.txt.setAttribute('x', cx);
            cell.txt.setAttribute('y', cy+4);
            // 虚空模式：每隔60帧随机换文字颜色
            if (self.voidMode && frameCount % 60 === 0) {
              cell.txt.setAttribute('fill', self._randomColor());
            }
          }

          self._mosaicAnimId = requestAnimationFrame(animate);
        }

        self._mosaicAnimId = requestAnimationFrame(animate);
      };

      // 射线法：判断点(x,y)是否在多边形pts内
      SchulteGridGame.prototype._mosaicPointInPoly = function(x, y, polyPts) {
        var inside = false;
        for (var i = 0, j = polyPts.length-1; i < polyPts.length; j = i++) {
          var xi = polyPts[i].x, yi = polyPts[i].y;
          var xj = polyPts[j].x, yj = polyPts[j].y;
          if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) {
            inside = !inside;
          }
        }
        return inside;
      };

      SchulteGridGame.prototype._mosaicHandleClick = function(mx, my) {
        if (!this.isPlaying) return;
        for (var i = 0; i < this._mosaicCells.length; i++) {
          var cell = this._mosaicCells[i];
          if (this._mosaicPointInPoly(mx, my, cell.pts)) {
            if (cell.number === this.currentNumber) {
              // 正确 - 绿色 + 数字变50%灰
              cell.poly.setAttribute('fill', '#4CAF50');
              cell.txt.setAttribute('fill', '#808080');
              this.currentNumber += this.getNumberStep();
              this.playSound('correct');
              this.updateUI();
              if (this.currentNumber > this.getMaxNumber()) {
                this.completeGame();
              }
            } else {
              // 错误 - 红色 + 抖动动画
              cell.poly.setAttribute('fill', '#FF6B6B');
              cell.poly.style.animation = 'mosaicShake 0.3s ease';
              this.playSound('wrong');
              (function(poly, orig1, origStroke1) {
                setTimeout(function() {
                  poly.setAttribute('fill', orig1 || '#555');
                  poly.style.animation = '';
                }, 350);
              })(cell.poly, cell.poly.originalFill);
            }
            break;
          }
        }
      };

      SchulteGridGame.prototype.toggleVoidMode = function() {
        // 圆形模式允许游戏中切换虚无
        if (!this.isCircularMode && !this.isVariantMode && this.isPlaying) {
          return;
        }
        // 变体模式：仅在普通变体（currentMode==='variant'）下生效
        if (this.isVariantMode && this.currentMode !== 'variant') {
          return;
        }

        // 三态循环：0(关)→1(虚无)→2(虚无2)→0(关)
        // 变体虚无2=渐变色，普通虚无2=数字随机散布
        // 圆形模式保持二态：0(关)↔1(虚无)
        var oldVoidMode = this.voidMode;
        if (this.isVariantMode) {
          this.voidMode = (this.voidMode + 1) % 3;
        } else if (this.isCircularMode) {
          this.voidMode = this.voidMode >= 1 ? 0 : 1;
        } else {
          this.voidMode = (this.voidMode + 1) % 3;
        }

        // 从虚无2切走时，清除所有格子定时器
        if (oldVoidMode === 2 && this.voidMode !== 2) {
          var allPolys2 = document.querySelectorAll('#variant-svg .variant-top');
          for (var pi2 = 0; pi2 < allPolys2.length; pi2++) {
            allPolys2[pi2]._voidActive = false;
            if (allPolys2[pi2]._voidTimer) {
              clearTimeout(allPolys2[pi2]._voidTimer);
              allPolys2[pi2]._voidTimer = null;
            }
          }
        }

        // 虚无与毁灭互斥：开启虚无时关闭毁灭
        if (this.voidMode >= 1 && this.circularDestroy > 0) {
          this.circularDestroy = 0;
          var dbtn = document.querySelector('.destroy-toggle');
          if (dbtn) {
            dbtn.classList.remove('active', 'state1', 'state2', 'state3');
            dbtn.textContent = '毁灭';
          }
        }

        var btn = document.querySelector('.void-toggle');
        if (btn) {
          btn.classList.remove('active');
          if (this.voidMode === 1) {
            btn.classList.add('active');
            btn.textContent = '虚无';
          } else if (this.voidMode === 2) {
            btn.classList.add('active');
            btn.textContent = '虚无2';
          } else {
            btn.textContent = '虚无';
          }
        }

        // 圆形模式
        if (this.isCircularMode) {
          if (this.isPlaying) {
            // 游戏中：原地更新样式，不重建 DOM（避免动画重置）
            this._updateCircularSectorStyles();
            // 动2模式 RAF 循环每帧自动检查 voidMode/destroy 速度，无需额外调用
            // 重启计时器，直接开始新一局
            this.stopTimer();
            this.startTime = Date.now();
            this.startTimer();
          } else {
            this.renderCircularGrid();
            // 恢复旋转状态
            if (this.circularRotating === 1) {
              var svg = document.getElementById('circular-svg');
              var rings = svg.querySelectorAll('.ring');
              for (var ri = 0; ri < rings.length; ri++) {
                rings[ri].classList.add(ri % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
                var texts = rings[ri].querySelectorAll('.sector-text');
                for (var t = 0; t < texts.length; t++) {
                  texts[t].classList.add(ri % 2 === 0 ? 'counter-cw' : 'counter-ccw');
                }
              }
            } else if (this.circularRotating === 2) {
              this._startSpeedRAF();
            }
          }
        } else if (this.isVariantMode) {
          // 变体模式：重新渲染（应用随机颜色）
          this.renderVariantGrid();
        } else {
          this.reset();
        }
      };

      SchulteGridGame.prototype.toggleDestroyMode = function() {
        // 变体模式不支持毁灭效果
        if (this.isVariantMode) {
          return;
        }
        // 圆形模式：三态切换 0(关) → 1(黑白) → 2(12色循环) → 0(关)
        if (this.isCircularMode) {
          this.circularDestroy = (this.circularDestroy + 1) % 3;

          // 毁灭与虚无互斥：开启毁灭时关闭虚无
          if (this.circularDestroy > 0 && this.voidMode >= 1) {
            this.voidMode = 0;

              btn.classList.add('active', 'state2');

            } else {
              btn.textContent = '毁灭';
            }
          }
          // 圆形模式：游戏中原地更新样式，否则重建 DOM
          if (this.isPlaying) {
            this._updateCircularSectorStyles();
            // 动2模式 RAF 循环每帧自动检查 voidMode/destroy 速度，无需额外调用
            if (this.circularRotating === 2) {
              // RAF 自动适应
            }
          } else {
            this.renderCircularGrid();
            // 恢复旋转状态
            if (this.circularRotating === 1) {
              var svg2 = document.getElementById('circular-svg');
              var rings2 = svg2.querySelectorAll('.ring');
              for (var ri2 = 0; ri2 < rings2.length; ri2++) {
                rings2[ri2].classList.add(ri2 % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
                var texts2 = rings2[ri2].querySelectorAll('.sector-text');
                for (var t2 = 0; t2 < texts2.length; t2++) {
                  texts2[t2].classList.add(ri2 % 2 === 0 ? 'counter-cw' : 'counter-ccw');
                }
              }
            } else if (this.circularRotating === 2) {
              this._startSpeedRAF();
            }
          }
          return;
        }

        // 方形模式：六态切换：0(关闭) -> 1(背景变换) -> 2(炫光效果) -> 3(错觉背景) -> 4(交错棋盘) -> 5(曲面棋盘) -> 0(关闭)
        this.destroyMode = (this.destroyMode + 1) % 6;

        var btn = document.querySelector('.destroy-toggle');
        if (btn) {
          btn.dataset.destroy = this.destroyMode.toString();
          btn.classList.remove('active', 'state1', 'state2', 'state3', 'state4', 'state5');
          
          if (this.destroyMode === 0) {
            btn.textContent = '毁灭';
          } else if (this.destroyMode === 1) {
            btn.classList.add('active', 'state1');
            btn.textContent = '毁灭1';
          } else if (this.destroyMode === 2) {
            btn.classList.add('active', 'state2');
            btn.textContent = '毁灭2';
          } else if (this.destroyMode === 3) {
            btn.classList.add('active', 'state3');
            btn.textContent = '毁灭3';
          } else if (this.destroyMode === 4) {
            btn.classList.add('active', 'state4');
            btn.textContent = '毁灭4';
            // 进入毁灭4：默认10×10
            this.gridSize = 10;
            var diffBtns = document.querySelectorAll('.difficulty-btn');
            for (var d = 0; d < diffBtns.length; d++) {
              diffBtns[d].classList.remove('active');
              if (parseInt(diffBtns[d].dataset.size) === 10) {
                diffBtns[d].classList.add('active');

      // ========== 背景选择 ==========
      SchulteGridGame.prototype._darkenHex = function(hex, amount) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.round(r * (1 - amount)));
        g = Math.max(0, Math.round(g * (1 - amount)));
        b = Math.max(0, Math.round(b * (1 - amount)));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      };

      SchulteGridGame.prototype.reset = function() {
        this.currentNumber = this.getNumberStart();
        this.isPlaying = false;
        this.stopTimer();
        this._stopP3();   // 任何重开先停掉蒲公英动画，避免残留 rAF

        // 先隐藏所有容器
        document.getElementById('grid-container').style.display = 'none';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('bounce-canvas').style.display = 'none';
        document.getElementById('variant-container').style.display = 'none';
        document.getElementById('mosaic-container').style.display = 'none';
        document.getElementById('square-move-container').style.display = 'none';
        document.getElementById('vp-container').style.display = 'none';
        if (document.getElementById('bumpy-container')) document.getElementById('bumpy-container').style.display = 'none';

        if (this.isCircularMode) {
          document.getElementById('circular-container').style.display = 'flex';
          this.renderCircularGrid();
          if (this.circularRotating === 1) {
            var svg2 = document.getElementById('circular-svg');
            var rings2 = svg2.querySelectorAll('.ring');
            for (var ri2 = 0; ri2 < rings2.length; ri2++) {
              rings2[ri2].classList.add(ri2 % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
              var ts2 = rings2[ri2].querySelectorAll('.sector-text');
              for (var ti2 = 0; ti2 < ts2.length; ti2++) {
                ts2[ti2].classList.add(ri2 % 2 === 0 ? 'counter-cw' : 'counter-ccw');
              }
            }
          } else if (this.circularRotating === 2) {
            this._startSpeedRAF();
          }
        } else if (this.isBounceMode) {
          document.getElementById('bounce-canvas').style.display = 'block';
          if (this._bounceAnimId) { cancelAnimationFrame(this._bounceAnimId); this._bounceAnimId = null; }
          this._bounceInit();
          this._bounceRender();
        } else if (this.isRotateMode) {
          document.getElementById('bounce-canvas').style.display = 'block';
          if (this._rotateAnimId) { cancelAnimationFrame(this._rotateAnimId); this._rotateAnimId = null; }
          // 旋转模式：直接启动旋转动画（init + rAF），每帧绘制白色大圆 + 三条旋转分割线 + 彩色数字球
          this._rotateStart();
        } else if (this.isVariantMode) {
          document.getElementById('variant-container').style.display = 'flex';
          this.renderVariantGrid();
        } else if (this.isMosaicMode) {
          document.getElementById('mosaic-container').style.display = 'flex';
          var self = this;
          requestAnimationFrame(function() {
            self._mosaicInit();
            self.renderMosaicGrid();
            if (self.mosaicDynamic) {
              self._mosaicAnimateStart();
            }
          });
          this.updateUI();
          this.updateStartButtonText();
          document.getElementById('start-btn').style.display = 'block';
          document.getElementById('restart-btn').style.display = 'none';
          return;
        } else if (this.isSquareMoveMode) {
          document.getElementById('square-move-container').style.display = 'block';
          this.generateNumbers();
          if (this.squareMoveDirection === 4) {
            this._smTransformBg = this._nextSquareTransformBg();
            document.getElementById('square-move-container').style.backgroundColor = this._smTransformBg;
          }
          this.renderSquareMoveGrid();
        } else if (this.isBumpyMode) {
          document.getElementById('bumpy-container').style.display = 'block';
          // 开新一局：重新生成配色 + 四种效果循环前进一格（0→1→2→3→0）
          this.bumpyPalette = this._generateBumpyPalette();
          this.bumpyIdx = ((this.bumpyIdx == null ? -1 : this.bumpyIdx) + 1) % 4;
          this.generateNumbers();
          this.renderBumpyGrid();
        } else if (this.isVisualParallaxMode) {
          document.getElementById('vp-container').style.display = 'block';
          this.generateNumbers();
          this.renderVisualParallaxGrid();
        } else if (this.isPatternMode) {
          document.getElementById('grid-container').style.display = 'grid';
          // 新一局：仅图案1需随机半边方向 + A锚点色相；图案2 为白底白格，无需色相
          if (this.patternSub === 1) {
            this.patternSide = Math.random() < 0.5 ? 'left' : 'right';
            this.patternHue = Math.random() * 360;
          }
          // 重置图案2：先停掉持续旋转动画，再把每格角度恢复为静态基准角（不转）
          if (this.patternSub === 2) {
            if (this._p2SpinId) { cancelAnimationFrame(this._p2SpinId); this._p2SpinId = null; }
            var p2spans = document.querySelectorAll('.pattern2-num');
            for (var p2i = 0; p2i < p2spans.length; p2i++) {
              var ba = (this._p2Base && this._p2Base[p2i]) || 0;
              p2spans[p2i].style.transform = 'rotate(' + ba + 'deg)';
            }
          }
          this.generateNumbers();
          this.renderGrid();
        } else if (this.isColorMode) {
          document.getElementById('grid-container').style.display = 'grid';
          this.generateNumbers();
          this.renderGrid();
        } else {
          document.getElementById('grid-container').style.display = 'grid';
          this.generateNumbers();
          this.renderGrid();
        }
        this.updateUI();
        this.updateStartButtonText();

        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'none';
      };

      SchulteGridGame.prototype.start = function() {
        this.stopTimer();
        this.isPlaying = true;
        this.currentNumber = this.getNumberStart();
        this.startTime = Date.now();
        this.startTimer();

        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('restart-btn').style.display = 'block';

        if (this.isBounceMode) {
          this._bounceStart();
        } else if (this.isRotateMode) {
          this._rotateStart();
        }

        // 圆形动2模式：重置 RAF 计时起点，确保30秒从游戏开始时起算
        if (this.isCircularMode && this.circularRotating === 2) {
          this._startSpeedRAF();
        }

        // 图案2：点击开始游戏后，所有数字在各自基准角度基础上缓慢持续顺时针旋转
        if (this.isPatternMode && this.patternSub === 2) {
          this._p2Spin();
        }

        // 图案6-3 随机模式：每局开局重掷形状(圆/六边形)与配色(10套随机一套)，并重渲染
        if (this.isPatternMode && this.patternSub === 6 && this.patternColor === 3) {
          this._p6ShapeRand = (Math.random() < 0.5 ? 'circle' : 'hex');
          this._p6PaletteIdx = Math.floor(Math.random() * this._P6_PALETTES.length);
          var gc6 = document.getElementById('grid-container');
          this._stopP6();
          this._renderPatternGrid6(gc6);
        }

        this.initAudio();
        this.playSound('start');
        this.updateUI();
      };

      SchulteGridGame.prototype.restart = function() {
        this.closeResult();
        this.reset();
      };

      // 图案2 持续缓慢顺时针旋转（基于每格静态基准角 + 全局累加，统一平滑）
      SchulteGridGame.prototype._p2Spin = function() {
        var self = this;
        if (this._p2SpinId) { cancelAnimationFrame(this._p2SpinId); this._p2SpinId = null; }
        var spans = document.querySelectorAll('.pattern2-num');
        if (!spans.length) return;
        var SPEED = 12;               // 度/秒（缓慢，约 30 秒转一整圈）
        var last = null;
        var accum = 0;                // 全局累加角度
        function animate(t) {
          if (self._p2SpinId === null) return;   // 已停止
          if (last === null) last = t;
          var dt = (t - last) / 1000;
          last = t;
          accum += SPEED * dt;
          for (var i = 0; i < spans.length; i++) {
            var ba = (self._p2Base && self._p2Base[i]) || 0;
            spans[i].style.transform = 'rotate(' + (ba + accum) + 'deg)';
          }
          self._p2SpinId = requestAnimationFrame(animate);
        }
        this._p2SpinId = requestAnimationFrame(animate);
      };

      SchulteGridGame.prototype._stopP2Spin = function() {
        if (this._p2SpinId) { cancelAnimationFrame(this._p2SpinId); this._p2SpinId = null; }
      };

      SchulteGridGame.prototype.MOSAIC_COLORS = [
        '#E53935', '#FF5722', '#FF9800', '#FFC107',
        '#FFEB3B', '#CDDC39', '#C3D825', '#009688',
        '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'
      ];

      // 生成行列颜色矩阵，保证相邻格（上下/左右）颜色不同，且颜色分布均匀
      SchulteGridGame.prototype.generateCellColors = function(rows, cols) {
        var palette = this.MOSAIC_COLORS;
        var total = rows * cols;

        // 第1步：构建均匀颜色池（每种颜色出现次数 = floor(total/12) 或 ceil）
        var counts = {};
        for (var i = 0; i < palette.length; i++) counts[palette[i]] = 0;
        var base = Math.floor(total / palette.length);
        var extra = total % palette.length;
        // 颜色池：每种颜色出现 base 或 base+1 次
        var colorPool = [];
        for (var i = 0; i < palette.length; i++) {
          var cnt = base + (i < extra ? 1 : 0);
          for (var k = 0; k < cnt; k++) colorPool.push(palette[i]);
        }

        // 第2步：Fisher-Yates 打乱
        for (var i = colorPool.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = colorPool[i]; colorPool[i] = colorPool[j]; colorPool[j] = t;
        }

        // 第3步：贪心填入网格，优先用颜色池中前面的颜色，跳过与左/上同色的
        var grid = [];
        var unused = colorPool.slice(); // 未使用的颜色列表（动态调整）
        for (var r = 0; r < rows; r++) {
          grid[r] = [];
          for (var c = 0; c < cols; c++) {
            var forbidden = {};
            if (c > 0) forbidden[grid[r][c-1]] = true;
            if (r > 0) forbidden[grid[r-1][c]] = true;

            // 从 unused 中找第一个不在 forbidden 中的颜色
            var found = -1;
            for (var k = 0; k < unused.length; k++) {
              if (!forbidden[unused[k]]) { found = k; break; }
            }
            if (found === -1) {
              // 不应发生（12种颜色，最多禁止2种），兜底：随机选 palette 中的非禁止色
              var fb = palette[Math.floor(Math.random() * palette.length)];
              var attempts = 0;
              while (forbidden[fb] && attempts < palette.length) {
                fb = palette[Math.floor(Math.random() * palette.length)];
                attempts++;
              }
              grid[r][c] = fb;
            } else {
              grid[r][c] = unused[found];
              unused.splice(found, 1); // 从 unused 中移除已用颜色
            }
          }
        }

        // 第4步：验证相邻同色，若有则与后面不同色的格子交换修复
        var maxFix = 100;
        for (var iter = 0; iter < maxFix; iter++) {
          var hasBad = false;
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var bad = false;
              if (c > 0 && grid[r][c] === grid[r][c-1]) bad = true;
              if (r > 0 && grid[r][c] === grid[r-1][c]) bad = true;
              if (!bad) continue;
              hasBad = true;
              // 找任意一个与当前格子颜色不同的格子交换
              for (var r2 = 0; r2 < rows; r2++) {
                for (var c2 = 0; c2 < cols; c2++) {
                  if (r2 === r && c2 === c) continue;
                  if (grid[r2][c2] === grid[r][c]) continue;
                  // 尝试交换
                  var tmp = grid[r][c];
                  grid[r][c] = grid[r2][c2];
                  grid[r2][c2] = tmp;
                  // 检查交换后当前位置是否还相邻同色
                  var stillBad = false;
                  if (c > 0 && grid[r][c] === grid[r][c-1]) stillBad = true;
                  if (r > 0 && grid[r][c] === grid[r-1][c]) stillBad = true;
                  if (c < cols-1 && grid[r][c] === grid[r][c+1]) stillBad = true;
                  if (r < rows-1 && grid[r][c] === grid[r+1][c]) stillBad = true;
                  if (stillBad) {
                    // 交换不好，换回来
                    tmp = grid[r][c];
                    grid[r][c] = grid[r2][c2];
                    grid[r2][c2] = tmp;
                  } else {
                    // 交换成功，跳出搜索
                    r2 = rows; c2 = cols; // 跳出双层循环
                  }
                }
              }
            }
          }
          if (!hasBad) break;
        }

        // 展平为一维数组
        var flat = [];
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            flat.push(grid[r][c]);
          }
        }
        return flat;
      };

      SchulteGridGame.prototype.getRandomFont = function() {
        return this.fonts[Math.floor(Math.random() * this.fonts.length)];
      };

      SchulteGridGame.prototype.generateNumbers = function() {
        var total = this.gridSize * this.gridSize;
        this.numbers = [];

        for (var i = 1; i <= total; i++) {
          if (this.numberType === 'odd') {
            this.numbers.push(2 * i - 1);
          } else if (this.numberType === 'even') {
            this.numbers.push(2 * i);
          } else {
            this.numbers.push(i);
          }
        }

        this.shuffleNumbers();
      };

      SchulteGridGame.prototype.shuffleNumbers = function() {
        for (var i = this.numbers.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = this.numbers[i];
          this.numbers[i] = this.numbers[j];
          this.numbers[j] = temp;
        }
      };

      SchulteGridGame.prototype.renderGrid = function() {
        var container = document.getElementById('grid-container');
        // 离开图案3（含切到普通/彩格/毁灭等任何非图案3模式）时，务必停掉蒲公英动画与后台 rAF，避免隐藏卡顿
        if (!this.isPatternMode || (this.patternSub !== 3 && this.patternSub !== 4)) { this._stopP3(); this._stopP4(); }
        // 先清理可能残留的特殊模式 class，避免影响显示
        container.classList.remove('destroy-mode-4', 'destroy-mode-5');
        // 恢复 game-container 默认宽度（毁灭5会放大）。必须在 calculateCellSize 之前执行，
        // 否则重开时容器仍带着上次毁灭5撑大的 maxWidth，calculateCellSize 读到的 clientWidth 越来越大，形成滚雪球放大
        var gcRestore = document.querySelector('.game-container');
        if (gcRestore) gcRestore.style.maxWidth = '';

        var cellSize = this.calculateCellSize();

        // 毁灭4模式：特殊渲染路径
        if (this.destroyMode === 4) {
          this._renderDestroy4Grid(container, cellSize);
          return;
        }

        // 毁灭5模式：曲面棋盘格
        if (this.destroyMode === 5) {
          this._renderDestroy5Grid(container, cellSize);
          return;
        }

        // 虚无2模式：数字随机散布
        if (this.voidMode === 2) {
          this._renderScatterGrid(container, cellSize);
          return;
        }

        // 彩格模式：独立渲染路径
        if (this.isColorMode) {
          this._renderColorGrid();
          return;
        }

        // 图案模式：独立渲染路径（按子模式分流）
        if (this.isPatternMode) {
          if (this.patternSub !== 3) this._stopP3();   // 离开图案3 时停掉蒲公英动画并复原容器
          if (this.patternSub !== 4) this._stopP4();   // 离开图案4 时停掉切片并复原容器
          if (this.patternSub !== 5) this._stopP5();   // 离开图案5 时停掉星璇动画并复原容器
          if (this.patternSub !== 6) this._stopP6();   // 离开图案6 时停掉嵌套旋转动画并复原容器
          if (this.patternSub === 7) { this._renderPatternGrid7(container); return; }
          if (this.patternSub === 6) { this._renderPatternGrid6(container); return; }
          if (this.patternSub === 5) { this._renderPatternGrid5(container); return; }
          if (this.patternSub === 4) { this._renderPatternGrid4(container); return; }
          if (this.patternSub === 3) { this._renderPatternGrid3(container); return; }
          if (this.patternSub === 2) this._renderPatternGrid2(container, cellSize);
          else this._renderPatternGrid(container, cellSize);
          return;
        }

        // 普通模式：清理散布/毁灭4模式留下的样式
        container.style.display = '';
        container.style.position = '';
        container.style.overflow = '';
        container.style.background = '';
        container.style.width = '';
        container.style.height = '';
        container.style.padding = '';
        container.style.boxSizing = '';
        container.style.borderRadius = '';
        container.style.gap = '';

        container.style.gridTemplateColumns = 'repeat(' + this.gridSize + ', ' + cellSize + 'px)';
        container.innerHTML = '';

        var colorPalette = ['#E53935', '#FF5722', '#FF9800', '#FFC107', '#FFEB3B', '#CDDC39', '#4CAF50', '#009688', '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'];
        var angles = [25, 30, 45, 75];
        
        for (var i = 0; i < this.numbers.length; i++) {
          var cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.number = this.numbers[i];
          cell.style.width = cellSize + 'px';
          cell.style.height = cellSize + 'px';
          cell.style.fontSize = Math.floor(cellSize * 0.55) + 'px';
          cell.style.lineHeight = cellSize + 'px';
          
          // 创建数字文字元素
          var numberSpan = document.createElement('span');
          numberSpan.className = 'number-text';
          numberSpan.textContent = this.numbers[i];
          // 随机颜色
          numberSpan.style.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];

          // 根据模式应用旋转
          if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
            var angle = angles[Math.floor(Math.random() * angles.length)];
            var direction = Math.random() > 0.5 ? 1 : -1;
            var finalAngle = angle * direction;
            
            if (this.currentMode === 'offset') {
              // 偏移模式：静态旋转
              numberSpan.style.transform = 'rotate(' + finalAngle + 'deg)';
            } else {
              // 混乱模式：动态摆动
              numberSpan.classList.add('chaos-mode');
              var oppositeAngle = -finalAngle;
              numberSpan.style.setProperty('--start-angle', finalAngle + 'deg');
              numberSpan.style.setProperty('--end-angle', oppositeAngle + 'deg');
            }
          }
          
          // 毁灭3模式：默认细字体（换字模式可覆盖）
          if (this.destroyMode === 3) {
            numberSpan.style.fontFamily = "'Segoe UI Light', 'Helvetica Neue Light', 'PingFang SC Light', sans-serif";
          }
          // 换字模式：随机字体（可与其他模式组合）
          if (this.fontMode) {
            var randomFont = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            numberSpan.style.fontFamily = randomFont;
          }
          
          cell.appendChild(numberSpan);
          
          // 虚无模式：边框放射动画（可与其他模式组合）
          if (this.voidMode) {
            cell.classList.add('void-mode');
          }

          // 毁灭模式：根据状态应用不同的效果
          if (this.destroyMode === 1) {
            // 模式1：色相平滑旋转，每格随机时长 + 随机相位，避免列同步
            cell.classList.add('destroy-mode-1');
            numberSpan.style.color = '#ffffff';
            // 随机动画时长 6~12s，随机负延迟打散相位
            cell.style.animationDuration = (6 + Math.random() * 6).toFixed(1) + 's';
            cell.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
          } else if (this.destroyMode === 2) {
            // 模式2：中心爆发式炫光效果
            cell.classList.add('destroy-mode-2');
            numberSpan.style.color = '#000000';
            numberSpan.style.textShadow = '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff';
          } else if (this.destroyMode === 3) {
            // 模式3：浮雕错觉背景方格
            cell.classList.add('destroy-mode-3');
            // 棋盘格凸起/凹陷
            var row = Math.floor(i / this.gridSize);
            var col = i % this.gridSize;
            cell.classList.add((row % 2 === col % 2) ? 'raised' : 'recessed');
          }

          cell.onclick = (function(number) {
            return function() {
              game.handleClick(number, this);
            };
          })(this.numbers[i]);

          container.appendChild(cell);
        }

        // 毁灭3模式：创建菱形交点 overlay
        if (this.destroyMode === 3) {
          container.classList.add('destroy-mode-3');
          this._createDestroyOverlay(container, cellSize);
        } else {
          container.classList.remove('destroy-mode-3');
          this._removeDestroyOverlay(container);
        }
      };

      // 图案模式渲染：每格 = 容积A色背景 + 半圆B色 + 两位数字（压半圆那位=A、另一位=B）
      // 数字格式化为两位（01, 02, ...）；A=暗+高饱和、B=亮+柔和，色相差129°，每局随机A锚点
      SchulteGridGame.prototype._renderPatternGrid = function(container, cellSize) {
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(' + this.gridSize + ', ' + cellSize + 'px)';
        container.style.gap = '';
        container.innerHTML = '';

        // 两种色：A=暗+高饱和、B=亮+柔和，色相差129°（近三角、冷暖同区），每局以随机A色相为锚点
        var hue = (this.patternHue != null) ? this.patternHue : 158;  // 默认取样例深绿 158°
        var A = 'hsl(' + hue + ',75%,21%)';                  // 容积底色（暗、饱和）
        var B = 'hsl(' + ((hue + 129) % 360) + ',30%,74%)';  // 半圆（亮、柔和，与A相差129°）

        var side = this.patternSide || 'left'; // 本局统一半边方向
        var r = 46, cx = 50, cy = 50;
        // 半圆 path：sweep-flag 0 = 左半圆，1 = 右半圆
        var halfPath = (side === 'left')
          ? ('M ' + cx + ' ' + (cy - r) + ' A ' + r + ' ' + r + ' 0 0 0 ' + cx + ' ' + (cy + r) + ' Z')
          : ('M ' + cx + ' ' + (cy - r) + ' A ' + r + ' ' + r + ' 0 0 1 ' + cx + ' ' + (cy + r) + ' Z');

        var SVGNS = 'http://www.w3.org/2000/svg';
        for (var i = 0; i < this.numbers.length; i++) {
          var num = this.numbers[i];

          var cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.style.width = cellSize + 'px';
          cell.style.height = cellSize + 'px';
          cell.style.background = A;          // 容积底色 = A（避免透出页面底色）
          cell.style.border = 'none';
          cell.style.padding = '0';
          cell.style.display = 'flex';
          cell.style.alignItems = 'center';
          cell.style.justifyContent = 'center';

          var svg = document.createElementNS(SVGNS, 'svg');
          svg.setAttribute('viewBox', '0 0 100 100');
          svg.setAttribute('width', '100%');
          svg.setAttribute('height', '100%');
          svg.style.display = 'block';

          // 容积：整格 A 色（铺满、圆角）
          var rect = document.createElementNS(SVGNS, 'rect');
          rect.setAttribute('x', '0'); rect.setAttribute('y', '0');
          rect.setAttribute('width', '100'); rect.setAttribute('height', '100');
          rect.setAttribute('rx', '12');
          rect.setAttribute('fill', A);
          svg.appendChild(rect);

          // 半圆：B 色
          var half = document.createElementNS(SVGNS, 'path');
          half.setAttribute('d', halfPath);
          half.setAttribute('fill', B);
          svg.appendChild(half);

          // 两位数字（补零），按半圆方向决定哪位数字落在 B 半圆（用 A 色填充）
          var str = ('' + num);
          if (num < 10) str = '0' + str;        // 01..09
          // 防御：>=100 保持原样（图案模式限制 ≤81，一般不会触发）
          var tens = str.charAt(0), ones = str.charAt(1);
          // 压在半圆(B)上的数字用A；压在另一半(A底色)上的数字用B —— 两位数都形成对比、都清晰
          var tensFill, onesFill;
          if (side === 'left') { tensFill = A; onesFill = B; }
          else { tensFill = B; onesFill = A; }

          var t1 = document.createElementNS(SVGNS, 'text');
          t1.setAttribute('x', '36'); t1.setAttribute('y', '64');
          t1.setAttribute('font-size', '40'); t1.setAttribute('font-weight', '700');
          t1.setAttribute('text-anchor', 'middle');
          t1.setAttribute('font-family', 'Arial, "PingFang SC", "Microsoft YaHei", sans-serif');
          t1.setAttribute('fill', tensFill);
          t1.textContent = tens;
          svg.appendChild(t1);

          var t2 = document.createElementNS(SVGNS, 'text');
          t2.setAttribute('x', '64'); t2.setAttribute('y', '64');
          t2.setAttribute('font-size', '40'); t2.setAttribute('font-weight', '700');
          t2.setAttribute('text-anchor', 'middle');
          t2.setAttribute('font-family', 'Arial, "PingFang SC", "Microsoft YaHei", sans-serif');
          t2.setAttribute('fill', onesFill);
          t2.textContent = ones;
          svg.appendChild(t2);

          cell.appendChild(svg);

          cell.onclick = (function(number) {
            return function() { game.handleClick(number, this); };
          })(num);

          container.appendChild(cell);
        }
      };

      // 图案2：白底 + 透明格子 + 思源黑体细体数字，每个数字按自身中心旋转
      //   角度规则：数字 1 = 0°（正常）；数字 2 起起步 10°，之后每个 +20°（2→10°,3→30°,4→50°…）
      //   方向：逆时针（视觉上向左下倾），对应「左边和下面倾斜」
      SchulteGridGame.prototype._renderPatternGrid2 = function(container, cellSize) {
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(' + this.gridSize + ', ' + cellSize + 'px)';
        container.style.gap = '';
        container.style.background = '#ffffff';   // 白底（容积白色，与白格融为一体）
        container.innerHTML = '';
        this._p2Base = [];   // 每格静态基准角度（按行列位置）
        var idx = 0;
        for (var r = 0; r < this.gridSize; r++) {
          for (var c = 0; c < this.gridSize; c++) {
            var num = this.numbers[idx];
            var angle = (r + c) * 5;   // 第1行第1格=0°；向右每格+5°、向下每格+5°
            this._p2Base[idx] = angle;
            var cell = document.createElement('div');
            cell.className = 'grid-cell pattern2-cell';
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            cell.style.display = 'flex';
            cell.style.alignItems = 'center';
            cell.style.justifyContent = 'center';
            var span = document.createElement('div');
            span.className = 'pattern2-num';
            span.textContent = '' + num;
            span.style.fontSize = Math.floor(cellSize * 0.46) + 'px';
            span.style.transform = 'rotate(' + angle + 'deg)';
            span.style.transformOrigin = '50% 50%';
            cell.appendChild(span);
            cell.onclick = (function(number) {
              return function() { game.handleClick(number, this); };
            })(num);
            container.appendChild(cell);
            idx++;
          }
        }
      };

      // 图案3：3D 蒲公英（canvas 实时绘制）
      //   天空蓝渐变背景（上深→下浅）；容积底部中心 A → 画面中心 B 纤细白线；
      //   B 散出更细白线连到每个数字；整团绕竖直轴缓慢旋转（从后往前）；
      //   点中当前数字 → 该数字与连线向上飘到顶边淡出消失。
      SchulteGridGame.prototype._renderPatternGrid3 = function(container) {
        this._stopP3();
        // 蓝色渐变「容积」区域：居中、限高，上下留白，避免顶到顶部时间显示与底部开始按钮
        container.style.position = 'absolute';
        container.style.left = '50%'; container.style.top = '50%';
        container.style.right = 'auto'; container.style.bottom = 'auto';
        container.style.width = '100%'; container.style.maxWidth = '500px';
        container.style.height = '62%'; container.style.maxHeight = '480px';
        container.style.transform = 'translate(-50%, -50%)';
        container.style.display = 'block';
        container.style.gridTemplateColumns = '';
        container.style.gap = '';
        container.style.padding = '0';
        container.style.marginTop = '0';
        container.style.borderRadius = '0';
        container.style.boxShadow = 'none';
        container.style.background = 'linear-gradient(to bottom, #0748a6 0%, #7bcdfd 100%)';
        container.innerHTML = '';

        var canvas = document.createElement('canvas');
        canvas.className = 'pattern3-canvas';
        canvas.style.display = 'block';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        container.appendChild(canvas);
        this._p3Canvas = canvas;

        var N = this.numbers.length;
        var seeds = [];
        var golden = Math.PI * (3 - Math.sqrt(5));   // 黄金角，球面均匀分布
        for (var i = 0; i < N; i++) {
          var y = 1 - (i + 0.5) / N * 2;             // 1 → -1
          var radius = Math.sqrt(Math.max(0, 1 - y * y));
          var theta = golden * i;
          seeds.push({
            num: this.numbers[i],
            ux: Math.cos(theta) * radius,
            uy: y,
            uz: Math.sin(theta) * radius,
            gone: false, floating: false, floatT: 0, alpha: 1, wrongT: 0,
            sx: 0, sy: 0, size: 14, phase: Math.random() * Math.PI * 2
          });
        }
        this._p3 = { seeds: seeds, rot: 0, raf: null, last: null,
                     W: 0, H: 0, dpr: 1, B: { x: 0, y: 0 }, A: { x: 0, y: 0 }, R: 0, finishing: false,
                     t: 0, gust: 0, gustTarget: 0, gustHold: 0, gustTimer: 2.5 };
        this._p3Finishing = false;

        var self = this;
        canvas.addEventListener('click', function(e) {
          if (!self.isPlaying) return;
          var rect = canvas.getBoundingClientRect();
          self._p3Click(e.clientX - rect.left, e.clientY - rect.top);
        });
        // 尺寸只在初始化与窗口变化时测量一次；绘制循环内不再每帧读布局（防卡顿）
        this._p3Measure();
        this._p3ResizeHandler = function() { if (self._p3) self._p3Measure(); };
        window.addEventListener('resize', this._p3ResizeHandler);
        this._p3Frame();
      };

      SchulteGridGame.prototype._p3Frame = function() {
        var self = this;
        var p3 = this._p3;
        if (!p3) return;
        function frame(ts) {
          if (!self._p3 || self._p3.raf == null) return;
          if (p3.last == null) p3.last = ts;
          var dt = (ts - p3.last) / 1000; p3.last = ts;
          if (dt > 0.1) dt = 0.1;
          p3.rot += dt * 0.12;           // 更慢约 52 秒/圈
          self._p3Draw(dt);
          p3.raf = requestAnimationFrame(frame);
        }
        p3.raf = requestAnimationFrame(frame);
      };

      SchulteGridGame.prototype._p3Measure = function() {
        var p3 = this._p3; if (!p3 || !this._p3Canvas) return;
        var canvas = this._p3Canvas;
        var dpr = window.devicePixelRatio || 1;
        var w = Math.max(1, canvas.clientWidth);
        var h = Math.max(1, canvas.clientHeight);
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        }
        p3.W = w; p3.H = h; p3.dpr = dpr;
      };

      SchulteGridGame.prototype._p3Draw = function(dt) {
        var p3 = this._p3;
        var canvas = this._p3Canvas;
        if (!p3 || !canvas) return;
        p3.t += dt;
        // 几何尺寸已缓存（在 _p3Measure 中按容器尺寸计算，避免每帧读布局造成卡顿）
        var w = p3.W, h = p3.H, dpr = p3.dpr;
        if (!w || !h) return;
        var ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        var R = Math.min(w, h) * 0.22;            // 蒲公英半径

        // ★ 阵风（风=偶尔轻轻吹偏一下，不是循环摆动）：
        //   隔一段随机时间，B 点（连同整团蒲公英：绒丝+数字）缓慢向随机一侧偏移一点，
        //   维持一小段时间后慢慢回正，再隔随机时间出现下一次。A 点固定不动。
        p3.gustTimer -= dt;
        if (p3.gustTimer <= 0) {
          p3.gustTarget = (Math.random() < 0.5 ? -1 : 1) * R * (0.12 + Math.random() * 0.10); // 随机方向、随机幅度（轻微）
          p3.gustHold = 1.2 + Math.random() * 1.0;   // 本次偏移维持约 1.2~2.2s
          p3.gustTimer = 3.5 + Math.random() * 4;    // 下次出现的随机间隔 3.5~7.5s
        }
        p3.gustHold -= dt;
        if (p3.gustHold <= 0) p3.gustTarget = 0;     // 维持时间到，开始回正
        p3.gust += (p3.gustTarget - p3.gust) * Math.min(1, dt * 1.2);  // 缓慢趋近 / 回正（慢慢）

        var B = { x: w / 2 + p3.gust, y: h * 0.55 }; // 蒲公英头：随阵风缓慢偏移，整团（绒丝+数字）一起跟着偏
        var A = { x: w / 2, y: h - 2 };               // 茎底支点 A 固定不动
        p3.B = B; p3.A = A; p3.R = R;

        // A → B 纤细白线：A 固定、B 偏移，茎随之斜向一侧（像被风吹偏）；A 点不画白点
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
        // B 点白圆保留（蒲公英中心）；A 点不要白点，只留一根线
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(B.x, B.y, 3, 0, Math.PI * 2); ctx.fill();

        var cosr = Math.cos(p3.rot), sinr = Math.sin(p3.rot);
        var focal = R * 3.2;
        var baseSize = Math.min(w, h) * 0.05;

        for (var i = 0; i < p3.seeds.length; i++) {
          var s = p3.seeds[i];
          if (s.gone) continue;
          var x0 = s.ux * R, y0 = s.uy * R, z0 = s.uz * R;
          var xr = x0 * cosr - z0 * sinr;          // 绕竖直轴(Y)旋转
          var zr = x0 * sinr + z0 * cosr;
          var yr = y0;
          var persp = focal / (focal - zr);
          var sx = B.x + xr * persp;
          var sy = B.y + yr * persp;
          var depth = (zr + R) / (2 * R);          // 0(后)→1(前)
          var size = baseSize * (0.5 + 0.5 * depth);
          var alpha = (0.4 + 0.6 * depth) * s.alpha;
          // 整团左右摆动已由 B.x（含 sway）统一带动，这里只需记录屏幕坐标即可
          s.sx = sx; s.sy = sy; s.size = size;

          if (s.floating) {
            s.floatT += dt;
            var ft = s.floatT / 0.85;
            if (ft >= 1) { s.gone = true; continue; }
            sy -= ft * h * 0.5;                     // 向上飘向顶边
            alpha *= (1 - ft);
          }
          var drawColor = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
          if (s.wrongT > 0) {
            s.wrongT -= dt; if (s.wrongT < 0) s.wrongT = 0;
            drawColor = 'rgba(255,90,90,' + alpha.toFixed(3) + ')';
          }

          // B → 种子 更细白线（绒丝），轻轻向下弯曲一点
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * alpha).toFixed(3) + ')';
          ctx.lineWidth = 1;
          var mx = (B.x + sx) / 2;
          var my = (B.y + sy) / 2 + Math.abs(sx - B.x) * 0.15 + 5;  // 控制点下移 → 绒丝向下轻垂
          ctx.beginPath(); ctx.moveTo(B.x, B.y); ctx.quadraticCurveTo(mx, my, sx, sy); ctx.stroke();

          // 数字（白色，无描边）
          ctx.font = '700 ' + size.toFixed(1) + 'px "Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = drawColor;
          ctx.fillText(s.num, sx, sy);
        }
      };

      SchulteGridGame.prototype._p3Click = function(x, y) {
        if (!this.isPlaying || !this._p3) return;
        var best = null, bestD = 1e9;
        for (var i = 0; i < this._p3.seeds.length; i++) {
          var s = this._p3.seeds[i];
          if (s.gone) continue;
          var dx = x - s.sx, dy = y - s.sy;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestD) { bestD = d; best = s; }
        }
        if (!best) return;
        var hitR = Math.max(18, best.size * 0.75);
        if (bestD > hitR) return;
        if (best.num === this.currentNumber) {
          best.floating = true; best.floatT = 0;
          this.playSound('correct');
          if (this.currentNumber === this.getMaxNumber()) {
            var self = this;
            this._p3Finishing = true;
            setTimeout(function() { self.completeGame(); }, 850);
          } else {
            this.currentNumber += this.getNumberStep();
            this.updateUI();
          }
        } else {
          best.wrongT = 0.5;
          this.playSound('wrong');
        }
      };

      SchulteGridGame.prototype._stopP3 = function() {
        if (this._p3ResizeHandler) { window.removeEventListener('resize', this._p3ResizeHandler); this._p3ResizeHandler = null; }
        if (this._p3 && this._p3.raf != null) { cancelAnimationFrame(this._p3.raf); }
        this._p3 = null;
        this._p3Canvas = null;
        this._p3Finishing = false;
        var c = document.getElementById('grid-container');
        if (c) {
          c.style.position = ''; c.style.left = ''; c.style.top = '';
          c.style.right = ''; c.style.bottom = '';
          c.style.width = ''; c.style.height = '';
          c.style.display = ''; c.style.background = '';
          c.style.padding = ''; c.style.marginTop = '';
          c.style.borderRadius = ''; c.style.boxShadow = '';
          c.style.transform = ''; c.style.maxWidth = ''; c.style.maxHeight = '';
        }
      };

      // 图案4：圆形内 Voronoi（泰森多边形）不规则切片，每片面积近似相等；
      //   数字 1..N 随机散布在各切片中，按从小到大顺序点击（与图案1/2/3 一致）。
      SchulteGridGame.prototype._p4GenSeeds = function(N) {
        var seeds = [];
        var minD = 0.95 * Math.sqrt(Math.PI / N);
        var guard = 0;
        while (seeds.length < N && guard < 80) {
          guard++;
          var cur = minD, tries = 0;
          while (seeds.length < N && tries < 3000 * N) {
            tries++;
            var r = 0.88 * Math.sqrt(Math.random()), a = Math.random() * 2 * Math.PI;  // 初始均匀盘分布；配合后续 Lloyd 松弛使面积均匀
            var x = r * Math.cos(a), y = r * Math.sin(a);
            var ok = true;
            for (var i = 0; i < seeds.length; i++) {
              var dx = x - seeds[i].x, dy = y - seeds[i].y;
              if (dx * dx + dy * dy < cur * cur) { ok = false; break; }
            }
            if (ok) seeds.push({ x: x, y: y });
          }
          if (seeds.length < N) minD *= 0.85;     // 不够则放宽最小间距再补
        }
        return seeds;
      };

      SchulteGridGame.prototype._p4Clip = function(poly, a, b, c) {
        var out = [], n = poly.length;
        for (var k = 0; k < n; k++) {
          var cur = poly[k], prev = poly[(k + n - 1) % n];
          var dc = a * cur.x + b * cur.y + c, dp = a * prev.x + b * prev.y + c;
          var curIn = dc <= 0, prevIn = dp <= 0;
          if (curIn) {
            if (!prevIn) out.push(this._p4Intersect(prev, cur, a, b, c));
            out.push(cur);
          } else if (prevIn) {
            out.push(this._p4Intersect(prev, cur, a, b, c));
          }
        }
        return out;
      };

      SchulteGridGame.prototype._p4Intersect = function(p1, p2, a, b, c) {
        var d1 = a * p1.x + b * p1.y + c, d2 = a * p2.x + b * p2.y + c;
        var t = d1 / (d1 - d2);
        return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
      };

      SchulteGridGame.prototype._p4Voronoi = function(seeds, clipR) {
        clipR = clipR || 1;
        var circle = [];
        for (var k = 0; k < 72; k++) {
          var ang = k / 72 * 2 * Math.PI;
          circle.push({ x: Math.cos(ang) * clipR, y: Math.sin(ang) * clipR });
        }
        var cells = [];
        for (var i = 0; i < seeds.length; i++) {
          var poly = circle.map(function(p) { return { x: p.x, y: p.y }; });
          for (var j = 0; j < seeds.length; j++) {
            if (j === i) continue;
            var a = seeds[j].x - seeds[i].x, b = seeds[j].y - seeds[i].y;
            var mx = (seeds[i].x + seeds[j].x) / 2, my = (seeds[i].y + seeds[j].y) / 2;
            var c = -(a * mx + b * my);
            poly = this._p4Clip(poly, a, b, c);
            if (poly.length < 3) break;
          }
          cells.push({ poly: poly, num: 0, done: false, wrong: false });
        }
        return cells;
      };

      // 多边形面积质心（Lloyd 松弛用）：标准质心，比顶点平均更接近单元真正中心
      SchulteGridGame.prototype._p4Centroid = function(poly) {
        var A = 0, cx = 0, cy = 0, n = poly.length;
        for (var k = 0; k < n; k++) {
          var p = poly[k], q = poly[(k + 1) % n];
          var cr = p.x * q.y - q.x * p.y;
          A += cr; cx += (p.x + q.x) * cr; cy += (p.y + q.y) * cr;
        }
        A *= 0.5;
        if (Math.abs(A) < 1e-9) return { x: 0, y: 0 };
        return { x: cx / (6 * A), y: cy / (6 * A) };
      };

      // Lloyd 松弛：把每个种子移到它所在单元的面积质心，反复迭代。
      //   收敛后所有碎片面积趋近相等、间距均匀 —— 直接解决"外圈碎片明显大于内部"的不均匀问题，
      //   同时最小碎片的内切半径显著变大，是"数字能放大且不压线"的前提。
      SchulteGridGame.prototype._p4Lloyd = function(seeds, clipR, iters) {
        clipR = clipR || 1; iters = iters || 10;
        var maxR = clipR - 0.015;                 // 种子钳制在裁切圆内，防止越过裁切边导致单元被切薄
        for (var it = 0; it < iters; it++) {
          var cells = this._p4Voronoi(seeds, clipR);
          for (var i = 0; i < seeds.length; i++) {
            if (cells[i].poly.length < 3) continue;
            var cen = this._p4Centroid(cells[i].poly);
            var rr = Math.sqrt(cen.x * cen.x + cen.y * cen.y);
            if (rr > maxR) { var s = maxR / rr; cen.x *= s; cen.y *= s; }
            seeds[i].x = cen.x; seeds[i].y = cen.y;
          }
        }
        return seeds;
      };

      SchulteGridGame.prototype._p4PointInPoly = function(px, py, poly) {
        var inside = false, n = poly.length;
        for (var i = 0, j = n - 1; i < n; j = i++) {
          var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
          var hit = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
          if (hit) inside = !inside;
        }
        return inside;
      };

      SchulteGridGame.prototype._p4PointSegDist = function(px, py, ax, ay, bx, by) {
        var dx = bx - ax, dy = by - ay;
        var l2 = dx * dx + dy * dy;
        var t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        var qx = ax + t * dx, qy = ay + t * dy;
        return Math.sqrt((px - qx) * (px - qx) + (py - qy) * (py - qy));
      };

      // 种子点到其单元边界的最近距离(归一半径单位)：即该碎片能容纳的最大内切圆半径
      SchulteGridGame.prototype._p4Inradius = function(sx, sy, poly) {
        var minD = Infinity;
        for (var k = 0; k < poly.length; k++) {
          var a = poly[k], b = poly[(k + 1) % poly.length];
          var d = this._p4PointSegDist(sx, sy, a.x, a.y, b.x, b.y);
          if (d < minD) minD = d;
        }
        return minD;
      };

      SchulteGridGame.prototype._renderPatternGrid4 = function(container) {
        this._stopP4();
        container.style.position = 'absolute';
        container.style.left = '50%'; container.style.top = '50%';
        container.style.right = 'auto'; container.style.bottom = 'auto';
        container.style.transform = 'translate(-50%, -54%)';  // 整体上移，避开底部开始按钮
        container.style.width = '90%'; container.style.height = '90%';
        container.style.maxWidth = ''; container.style.maxHeight = '';
        container.style.display = 'block';
        container.style.gridTemplateColumns = ''; container.style.gap = '';
        container.style.padding = '0'; container.style.marginTop = '0';
        container.style.borderRadius = '0'; container.style.boxShadow = 'none';
        container.style.background = 'transparent';
        container.innerHTML = '';
        var canvas = document.createElement('canvas');
        canvas.style.display = 'block';
        canvas.style.width = '100%'; canvas.style.height = '100%';
        container.appendChild(canvas);
        this._p4Container = container;
        var Nraw = (this.numbers && this.numbers.length) ? this.numbers.length : (this.gridSize * this.gridSize);
        var CLIP = 0.94;                              // 碎片裁切半径(单位半径)：几乎贴到可见圆边(0.97)，消除"圆与容器之间的大空隙"
        var READ_MIN = 18;                            // 人眼可读最小字号(px)：任何难度数字都不得小于它 —— 阅读优先于格数
        var FS_CAP = 0.30, FS_K = 1.15;               // 字号上限(相对半径)与"内切半径→字号"系数：够大够读、不过分夸张
        var palette = ['#E53935', '#FF5722', '#FF9800', '#FBC02D', '#43A047', '#00897B', '#1E88E5', '#3949AB', '#8E24AA', '#D81B60', '#00838F', '#6D4C41'];
        // 软上限 49 格；字号按"最小碎片内切半径"取整局统一值，若低于可读下限则自动降格数
        var N = Math.min(Nraw, 49);
        var seeds = null, cells = null, minIn = 0;
        while (true) {
          seeds = this._p4GenSeeds(N);
          for (var si = 0; si < seeds.length; si++) { seeds[si]._ph = Math.random() * Math.PI * 2; seeds[si]._ph2 = Math.random() * Math.PI * 2; }
          seeds = this._p4Lloyd(seeds, CLIP, 10);      // Lloyd 松弛：碎片面积均匀，外圈不再明显大于内部
          cells = this._p4Voronoi(seeds, CLIP);
          minIn = Infinity;
          for (var ci = 0; ci < cells.length; ci++) {
            var inr = this._p4Inradius(seeds[ci].x, seeds[ci].y, cells[ci].poly);
            if (inr < minIn) minIn = inr;
          }
          // 最坏 R≈225px 时的字号：min(上限, 内切半径×系数)，达到可读下限即保留该格数
          if (N <= 9 || Math.min(225 * FS_CAP, minIn * 225 * FS_K) >= READ_MIN) break;
          N--;
        }
        for (var ci2 = 0; ci2 < cells.length; ci2++) {
          cells[ci2].num = this.getNumberStart() + ci2 * this.getNumberStep();  // 图案4 用连续 1..N 数字(位置由 Voronoi 天然随机)；不能用 numbers[ci2] 否则降格后会缺号卡死
          cells[ci2]._cx = seeds[ci2].x; cells[ci2]._cy = seeds[ci2].y;  // 数字放在种子点：Voronoi单元围绕种子生成，才是板块真正的视觉中心
          cells[ci2].color = palette[Math.floor(Math.random() * palette.length)];  // 随机彩色，与其它模式一致(不自动高亮下一个)
        }
        this._p4 = { canvas: canvas, cells: cells, baseCells: cells, baseSeeds: seeds, CLIP: CLIP, minInr: minIn, READ_MIN: READ_MIN, FS_CAP: FS_CAP, FS_K: FS_K, W: 0, H: 0, dpr: 1, cx: 0, cy: 0, R: 0 };
        var self = this;
        canvas.addEventListener('click', function(e) {
          if (!self.isPlaying) return;
          var rect = canvas.getBoundingClientRect();
          self._p4Click(e.clientX - rect.left, e.clientY - rect.top);
        });
        this._p4Measure();
        this._p4ResizeHandler = function() { if (self._p4) self._p4Measure(); };
        window.addEventListener('resize', this._p4ResizeHandler);
        var self2 = this;
        var p4frame = function () {
          if (!self2._p4) return;
          var t = performance.now() / 1000;
          var amp = 0, spd = 0.4;                  // 完全不呼吸，方格和数字都不动，纯静态画面
          var base = self2._p4.baseSeeds, old = self2._p4.cells;
          var maxR = self2._p4.CLIP - 0.08;           // 漂移后种子仍远小于裁切边，避免单元突跳/卡顿
          var ds = [];
          for (var bi = 0; bi < base.length; bi++) {
            var b = base[bi];
            var dx = b.x + amp * Math.sin(t * spd + b._ph);
            var dy = b.y + amp * Math.cos(t * spd * 0.8 + b._ph2);
            var rr = Math.sqrt(dx * dx + dy * dy);
            if (rr > maxR) { var s = maxR / rr; dx *= s; dy *= s; }
            ds.push({ x: dx, y: dy });
          }
          var newCells = self2._p4Voronoi(ds, self2._p4.CLIP);  // 重算 Voronoi：相邻单元天然共用边，飘动时无缝隙
          for (var ni = 0; ni < newCells.length; ni++) {
            newCells[ni].num = self2.getNumberStart() + ni * self2.getNumberStep();  // 连续数字
            if (old && old[ni]) { newCells[ni].done = old[ni].done; newCells[ni].wrong = old[ni].wrong; }
            newCells[ni]._cx = self2._p4.baseCells[ni]._cx;  // 数字锚点=初始种子(固定不动)→绝对丝滑不卡，碎片边界只轻呼吸
            newCells[ni]._cy = ds[ni].y;
            newCells[ni].color = self2._p4.baseCells[ni].color;
          }
          self2._p4.cells = newCells;
          self2._p4DrawStatic();
          self2._p4.raf = requestAnimationFrame(p4frame);
        };
        this._p4.raf = requestAnimationFrame(p4frame);
      };

      SchulteGridGame.prototype._p4Measure = function() {
        var p4 = this._p4; if (!p4) return;
        var cont = this._p4Container;
        // 容器尺寸保持安全值(限高 480px，不越过顶部时间栏/底部开始按钮)；
        // "圆撑满容器"由 R=S/2*0.97 负责，不必把容器本身放大到 68% 高
        var S = Math.floor(Math.min(window.innerWidth * 0.92, window.innerHeight * 0.62));
        if (S > 480) S = 480;
        if (S < 200) S = 200;
        cont.style.width = S + 'px'; cont.style.height = S + 'px';
        var dpr = window.devicePixelRatio || 1;
        var c = p4.canvas;
        c.width = Math.round(S * dpr); c.height = Math.round(S * dpr);
        var ctx = c.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        p4.W = S; p4.H = S; p4.dpr = dpr;
        // 磨砂玻璃背景(模糊光斑)尺寸变化后失效，绘制时按需重建
        p4.bgCanvas = null;
        this._p4DrawStatic();
      };

      SchulteGridGame.prototype._p4DrawStatic = function() {
        var p4 = this._p4; if (!p4) return;
        var c = p4.canvas, ctx = c.getContext('2d');
        var S = p4.W;
        ctx.clearRect(0, 0, S, S);
        var cx = S / 2, cy = S / 2, R = S / 2 * 0.97;   // 圆撑满容器，几乎不剩空隙
        p4.cx = cx; p4.cy = cy; p4.R = R;
        // ---- 第0层：护眼浅色渐变背景(圆外也显示) ----
        var bgG = ctx.createLinearGradient(0, 0, S, S);
        bgG.addColorStop(0, '#e9f1eb'); bgG.addColorStop(0.5, '#f5f8f4'); bgG.addColorStop(1, '#dfeae2');
        ctx.fillStyle = bgG; ctx.fillRect(0, 0, S, S);
        // ---- 第1层：圆内模糊+提饱和的"风景"(玻璃后的世界)，离屏预渲染一次 ----
        if (!p4.bgCanvas || p4.bgCanvas._S !== S) {
          var bc = document.createElement('canvas');
          bc.width = c.width; bc.height = c.height;
          var bctx = bc.getContext('2d');
          bctx.setTransform(p4.dpr, 0, 0, p4.dpr, 0, 0);
          bctx.fillStyle = bgG; bctx.fillRect(0, 0, S, S);
          // 静态苹果抽象色彩背景：大块弥散柔光，雾感蓝绿粉橙紫
          var blobs = [
            ['#bcd8e8', 0.58, S * 0.12, S * 0.18, S * 0.42],
            ['#c8e4c4', 0.52, S * 0.82, S * 0.72, S * 0.38],
            ['#f2d4da', 0.55, S * 0.72, S * 0.16, S * 0.35],
            ['#f0dcc0', 0.45, S * 0.18, S * 0.78, S * 0.36],
            ['#d8d6e8', 0.40, S * 0.44, S * 0.52, S * 0.45]
          ];
          for (var bi = 0; bi < blobs.length; bi++) {
            var b = blobs[bi];
            bctx.globalAlpha = b[1];
            bctx.fillStyle = b[0];
            bctx.beginPath(); bctx.arc(b[2], b[3], b[4], 0, Math.PI * 2); bctx.fill();
          }
          bctx.globalAlpha = 1;
          if ('filter' in bctx) {
            bctx.filter = 'blur(8px) saturate(170%)';   // 液态玻璃=弱模糊+提饱和(不是磨砂的重模糊)
            bctx.drawImage(bc, 0, 0, S, S);
            bctx.filter = 'none';
            try {
              bctx.filter = 'url(#lg-dist)';             // 液态折射扭曲：feTurbulence 噪声位移映射
              bctx.drawImage(bc, 0, 0, S, S);
            } catch (e) { /* 不支持 url() 滤镜则保持模糊背景 */ }
            bctx.filter = 'none';
          }
          bc._S = S;
          p4.bgCanvas = bc;
        }
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(p4.bgCanvas, 0, 0, S, S);
        // ---- 第2层：碎片玻璃面(菲涅尔曲面渐变) + 光晕 + 细白主线 ----
        var fs = Math.min(R * p4.FS_CAP, (p4.minInr || 0.18) * R * p4.FS_K);  // 统一字号
        if (fs < p4.READ_MIN) fs = p4.READ_MIN;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + fs + 'px "Microsoft YaHei", sans-serif';
        for (var i = 0; i < p4.cells.length; i++) {
          var cell = p4.cells[i], poly = cell.poly;
          if (poly.length < 3) continue;
          ctx.beginPath();
          var topY = Infinity, botY = -Infinity;
          for (var k = 0; k < poly.length; k++) {
            var px = cx + poly[k].x * R, py = cy + poly[k].y * R;
            if (py < topY) topY = py;
            if (py > botY) botY = py;
            if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          if (cell.done) {
            var dg = ctx.createLinearGradient(0, topY, 0, botY);
            dg.addColorStop(0, 'rgba(43,168,158,0.52)'); dg.addColorStop(1, 'rgba(43,168,158,0.32)');
            ctx.fillStyle = dg;
          } else {
            var gg = ctx.createLinearGradient(0, topY, 0, botY);
            gg.addColorStop(0, 'rgba(255,255,255,0.35)');
            gg.addColorStop(0.15, 'rgba(255,255,255,0.08)');
            gg.addColorStop(0.70, 'rgba(255,255,255,0.06)');
            gg.addColorStop(1, 'rgba(255,255,255,0.18)');
            ctx.fillStyle = gg;
          }
          ctx.fill();
          // 光晕 + 细白主线
          ctx.lineWidth = 4;
          ctx.strokeStyle = cell.wrong ? 'rgba(232,83,63,0.25)' : 'rgba(255,255,255,0.16)';
          ctx.stroke();
          ctx.lineWidth = 1;
          ctx.strokeStyle = cell.wrong ? 'rgba(232,83,63,0.95)' : 'rgba(255,255,255,0.65)';
          ctx.stroke();
        }
        // ---- 第3层：数字(固定锚点=绝对丝滑，单色清晰不脏) ----
        for (var i2 = 0; i2 < p4.cells.length; i2++) {
          var cell2 = p4.cells[i2];
          if (cell2.poly.length < 3) continue;
          var dx = cx + (cell2._cx || 0) * R, dy = cy + (cell2._cy || 0) * R;
          if (cell2.done) {
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
          } else if (cell2.wrong) {
            ctx.fillStyle = '#e8533f';
          } else {
            ctx.fillStyle = cell2.color || '#2c3e50';
          }
          ctx.fillText('' + cell2.num, dx, dy);
        }
        ctx.restore();
        // ---- 圆边：简洁白描边 ----
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.stroke();
      };

      SchulteGridGame.prototype._p4Click = function(x, y) {
        if (!this.isPlaying || !this._p4) return;
        var p4 = this._p4;
        var ux = (x - p4.cx) / p4.R, uy = (y - p4.cy) / p4.R;
        if (ux * ux + uy * uy > 1.02) return;     // 圆外忽略
        var hit = null;
        for (var i = 0; i < p4.cells.length; i++) {
          var cell = p4.cells[i];
          if (cell.done) continue;
          if (this._p4PointInPoly(ux, uy, cell.poly)) { hit = cell; break; }
        }
        if (!hit) return;
        if (hit.num === this.currentNumber) {
          hit.done = true;
          this.playSound('correct');
          // 通关判定以碎片数 N 为准(而非 gridSize²)：图案4 可能因可读字号而自动降格数，避免点完碎片后卡死
          var maxN = this.getNumberStart() + (p4.cells.length - 1) * this.getNumberStep();
          if (this.currentNumber === maxN) {
            var self = this;
            setTimeout(function() { self.completeGame(); }, 500);
          } else {
            this.currentNumber += this.getNumberStep();
            this.updateUI();
          }
          this._p4DrawStatic();
        } else {
          var self2 = this;
          hit.wrong = true;
          this.playSound('wrong');
          this._p4DrawStatic();
          setTimeout(function() { hit.wrong = false; if (self2._p4) self2._p4DrawStatic(); }, 400);
        }
      };

      SchulteGridGame.prototype._stopP4 = function() {
        if (this._p4ResizeHandler) { window.removeEventListener('resize', this._p4ResizeHandler); this._p4ResizeHandler = null; }
        if (this._p4 && this._p4.raf) { cancelAnimationFrame(this._p4.raf); }
        this._p4 = null;
        var c = document.getElementById('grid-container');
        if (c) {

          c.style.right = ''; c.style.bottom = '';
          c.style.width = ''; c.style.height = '';
          c.style.display = ''; c.style.background = '';
          c.style.padding = ''; c.style.marginTop = '';
          c.style.borderRadius = ''; c.style.boxShadow = '';
          c.style.transform = ''; c.style.maxWidth = ''; c.style.maxHeight = '';
          c.style.gridTemplateColumns = ''; c.style.gap = '';
        }
      };

      SchulteGridGame.prototype._stopP5 = function() {

        this._p5 = null;

          c.style.transform = ''; c.style.maxWidth = ''; c.style.maxHeight = '';
