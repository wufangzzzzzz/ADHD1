              // 使用按编号预分配的颜色，两份复制一致
              numberSpan.style.color = numColors[num];

              // 偏移/混乱模式
              if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
                var ang = angles[Math.floor(Math.random() * angles.length)];
                var dir = Math.random() > 0.5 ? 1 : -1;
                var finalAng = ang * dir;
                if (this.currentMode === 'offset') {
                  numberSpan.style.transform = 'rotate(' + finalAng + 'deg)';
                  numberSpan.style.display = 'inline-block';
                } else {
                  numberSpan.classList.add('chaos-mode');
                  numberSpan.style.display = 'inline-block';
                  numberSpan.style.setProperty('--start-angle', finalAng + 'deg');
                  numberSpan.style.setProperty('--end-angle', (-finalAng) + 'deg');
                }
              }

              // 换字模式
              if (this.fontMode) {
                numberSpan.style.fontFamily = this.fonts[Math.floor(Math.random() * this.fonts.length)];
              }

              cell.appendChild(numberSpan);

              cell.onclick = (function(n, el) {
                return function() { game.handleClick(n, el); };
              })(num, cell);

              track.appendChild(cell);
            }
          }

          // 方向：奇数行(0-indexed偶数)右移，偶数行(0-indexed奇数)左移
          var isRightMove = (row % 2 === 0);
          // 速度：按行宽计算基础时长，保证不同难度视觉速度一致
          var pixelSpeed = 15; // px/秒
          var baseDuration = rowWidth / pixelSpeed;
          var duration = baseDuration * (1 - row * 0.04);
          if (duration < baseDuration * 0.6) duration = baseDuration * 0.6;

          if (isRightMove) {
            track.style.animation = 'sm-scroll-right ' + duration.toFixed(1) + 's linear infinite';
          } else {
            track.style.animation = 'sm-scroll-left ' + duration.toFixed(1) + 's linear infinite';
          }

          rowDiv.appendChild(track);
          container.appendChild(rowDiv);
        }
      };

      // 纵向移动：每列垂直循环，奇偶列方向交替

      // 横纵结合：步进式——奇数行右移→奇数列下移→偶数行右移→偶数列下移，循环
      SchulteGridGame.prototype._renderSquareMoveBoth = function() {
        var container = document.getElementById('square-move-container');
        container.innerHTML = '';
        container.style.display = 'block';
        container.style.flexDirection = '';
        container.style.gap = '';
        container.style.position = 'relative';

        var size = this.gridSize;
        var cellSize = this.calculateCellSize();
        var padding = 4;
        var gap = 3;
        var stepUnit = cellSize + gap;
        var totalSize = size * cellSize + (size - 1) * gap;

        container.style.width = (totalSize + padding * 2) + 'px';
        container.style.height = (totalSize + padding * 2) + 'px';

        var colorPalette = ['#E53935', '#FF5722', '#FF9800', '#FFC107', '#FFEB3B', '#CDDC39', '#4CAF50', '#009688', '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'];
        var angles = [25, 30, 45, 75];
        var fontSize = Math.floor(cellSize * 0.55);
        var numbers = this.numbers.slice();

        var numColors = {};
        for (var i = 0; i < numbers.length; i++) {
          numColors[numbers[i]] = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        }

        // 创建格子（absolute 定位）+ 视觉位置网格
        var grid = []; // grid[visualRow][visualCol] = cell 元素
        for (var row = 0; row < size; row++) {
          grid[row] = [];
          for (var col = 0; col < size; col++) {
            var idx = row * size + col;
            var num = numbers[idx];

            var cell = document.createElement('div');
            cell.className = 'square-move-cell';
            cell.dataset.number = num;
            cell.style.position = 'absolute';
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            cell.style.fontSize = fontSize + 'px';
            cell.style.lineHeight = cellSize + 'px';
            cell.style.textAlign = 'center';
            cell.style.left = (col * stepUnit + padding) + 'px';
            cell.style.top = (row * stepUnit + padding) + 'px';

            var numberSpan = document.createElement('span');
            numberSpan.className = 'number-text';
            numberSpan.textContent = num;
            numberSpan.style.color = numColors[num];

            if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
              var ang = angles[Math.floor(Math.random() * angles.length)];
              var dir = Math.random() > 0.5 ? 1 : -1;
              var finalAng = ang * dir;
              if (this.currentMode === 'offset') {
                numberSpan.style.transform = 'rotate(' + finalAng + 'deg)';
                numberSpan.style.display = 'inline-block';
              } else {
                numberSpan.classList.add('chaos-mode');
                numberSpan.style.display = 'inline-block';
                numberSpan.style.setProperty('--start-angle', finalAng + 'deg');
                numberSpan.style.setProperty('--end-angle', (-finalAng) + 'deg');
              }
            }

            if (this.fontMode) {
              numberSpan.style.fontFamily = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            }

            cell.appendChild(numberSpan);
            cell.onclick = (function(n, el) {
              return function() { game.handleClick(n, el); };
            })(num, cell);

            container.appendChild(cell);
            grid[row][col] = cell;
          }
        }

        // 步进参数：使用与横向/纵向模式相同的速度（pixelSpeed=15 px/s）
        var pixelSpeed = 15;
        var stepDuration = Math.round(stepUnit / pixelSpeed * 1000); // 移动一格所需时间（ms）
        var pauseDuration = 0; // 无停顿，连续流动
        var stepPhase = 0; // 0=奇数行右移, 1=奇数列下移, 2=偶数行右移, 3=偶数列下移
        var self = this;

        function doStep() {
          var clones = []; // {element, originalCell, targetLeft, targetTop}
          var transitionStr = 'left ' + stepDuration + 'ms linear, top ' + stepDuration + 'ms linear';

          if (stepPhase === 0 || stepPhase === 2) {
            // 水平：右移1格
            var startRow = (stepPhase === 0) ? 0 : 1;
            for (var row = startRow; row < size; row += 2) {
              var oldCells = [];
              for (var c = 0; c < size; c++) oldCells[c] = grid[row][c];

              var wrapCell = oldCells[size - 1];
              for (var c = size - 1; c > 0; c--) {
                grid[row][c] = oldCells[c - 1];
              }
              grid[row][0] = wrapCell;

              // 原格子平滑滑出右边缘（不消失）
              wrapCell.style.transition = transitionStr;
              wrapCell.style.left = (size * stepUnit + padding) + 'px';

              // 克隆从左侧滑入，形成无缝循环
              var clone = wrapCell.cloneNode(true);
              clone.style.transition = 'none';
              clone.style.left = (-stepUnit + padding) + 'px';
              clone.style.top = (row * stepUnit + padding) + 'px';
              (function(num, cl) {
                clone.onclick = function() { game.handleClick(num, cl); };
              })(parseInt(wrapCell.dataset.number), clone);
              container.appendChild(clone);
              clones.push({
                element: clone,
                originalCell: wrapCell,
                targetLeft: padding,
                targetTop: row * stepUnit + padding
              });

              // 其他格子右移1格
              for (var c = 0; c < size - 1; c++) {
                oldCells[c].style.transition = transitionStr;
                oldCells[c].style.left = ((c + 1) * stepUnit + padding) + 'px';
              }
            }
            container.offsetHeight;
            for (var i = 0; i < clones.length; i++) {
              clones[i].element.style.transition = transitionStr;
              clones[i].element.style.left = clones[i].targetLeft + 'px';
            }
          } else {
            // 垂直：下移1格
            var startCol = (stepPhase === 1) ? 0 : 1;
            for (var col = startCol; col < size; col += 2) {
              var oldCells = [];
              for (var r = 0; r < size; r++) oldCells[r] = grid[r][col];

              var wrapCell = oldCells[size - 1];
              for (var r = size - 1; r > 0; r--) {
                grid[r][col] = oldCells[r - 1];
              }
              grid[0][col] = wrapCell;

              // 原格子平滑滑出下边缘
              wrapCell.style.transition = transitionStr;
              wrapCell.style.top = (size * stepUnit + padding) + 'px';

              // 克隆从上方滑入
              var clone = wrapCell.cloneNode(true);
              clone.style.transition = 'none';
              clone.style.left = (col * stepUnit + padding) + 'px';
              clone.style.top = (-stepUnit + padding) + 'px';
              (function(num, cl) {
                clone.onclick = function() { game.handleClick(num, cl); };
              })(parseInt(wrapCell.dataset.number), clone);
              container.appendChild(clone);
              clones.push({
                element: clone,
                originalCell: wrapCell,
                targetLeft: col * stepUnit + padding,
                targetTop: padding
              });

              // 其他格子下移1格
              for (var r = 0; r < size - 1; r++) {
                oldCells[r].style.transition = transitionStr;
                oldCells[r].style.top = ((r + 1) * stepUnit + padding) + 'px';
              }
            }
            container.offsetHeight;
            for (var i = 0; i < clones.length; i++) {
              clones[i].element.style.transition = transitionStr;
              clones[i].element.style.top = clones[i].targetTop + 'px';
            }
          }

          stepPhase = (stepPhase + 1) % 4;

          // 动画结束后：移除克隆，重置原格子到新位置（无transition）
          self._squareMoveBothTimer = setTimeout(function() {
            for (var i = 0; i < clones.length; i++) {
              var orig = clones[i].originalCell;
              orig.style.transition = 'none';
              orig.style.left = clones[i].targetLeft + 'px';
              orig.style.top = clones[i].targetTop + 'px';
              clones[i].element.remove();
            }
            if (clones.length > 0) container.offsetHeight;
            doStep();
          }, stepDuration + pauseDuration);
        }

        self._squareMoveBothTimer = setTimeout(doStep, 500);
      };

      SchulteGridGame.prototype.renderMosaicGrid = function() {
        var size = this.gridSize;

        // 点击SVG委托

      // ===== 马赛克动画 =====
      // 计算四边形面积（鞋带公式）
      SchulteGridGame.prototype._mosaicCellArea = function(p1, p2, p3, p4) {
        // p1~p4 按顺时针或逆时针顺序
        return Math.abs(
          (p1.x * p2.y + p2.x * p3.y + p3.x * p4.y + p4.x * p1.y) -
          (p2.x * p1.y + p3.x * p2.y + p4.x * p3.y + p1.x * p4.y)
        ) / 2;
      };

      SchulteGridGame.prototype._mosaicAnimateStart = function() {
        var self = this;
        var size = this.gridSize;
        var cols = size, rows = size;
        var cw = this._mosaicCW || 400;
        var ch = this._mosaicCH || 400;
        var cellW = cw / cols, cellH = ch / rows;
        var pts = this._mosaicPoints;
        var frameCount = 0;

        var maxDist = Math.min(cellW, cellH) * 0.5; // 外层半径：半个格子宽
        var minDist = maxDist * 0.25; // 内层半径：防止格子缩太小
        var maxSpeed = 0.2; // 速度上限，降低至流畅可见

        function animate() {
          frameCount++;
          // 更新每个内部点的位置（双层圆形约束）
          for (var r = 1; r < rows; r++) {
            for (var c = 1; c < cols; c++) {
              var p = pts[r][c];

              // 更新位置
              p.x += p.vx;
              p.y += p.vy;

              // 双层圆形约束：点在 [minDist, maxDist] 环内
              var dx = p.x - p.ox;
              var dy = p.y - p.oy;
              var dist = Math.sqrt(dx * dx + dy * dy);

              if (dist > maxDist) {
                // 超外层：拉回边界，速度方向指向原点
                p.x = p.ox + (dx / dist) * maxDist;
                p.y = p.oy + (dy / dist) * maxDist;
                var nx = -dx / (dist || 1);
                var ny = -dy / (dist || 1);
                var spd = 0.08 + Math.random() * 0.08;
                p.vx = nx * spd + (Math.random() - 0.5) * 0.05;
                p.vy = ny * spd + (Math.random() - 0.5) * 0.05;
              } else if (dist < minDist) {
                // 超内层：拉回内边界，速度方向远离原点
                p.x = p.ox + (dx / dist) * (minDist + 1);
                p.y = p.oy + (dy / dist) * (minDist + 1);
                var nx2 = dx / (dist || 1);
                var ny2 = dy / (dist || 1);
                var spd2 = 0.08 + Math.random() * 0.08;
                p.vx = nx2 * spd2 + (Math.random() - 0.5) * 0.05;
                p.vy = ny2 * spd2 + (Math.random() - 0.5) * 0.05;
              }

              // 速度上限
              var spd3 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
              if (spd3 > maxSpeed) {
                p.vx = (p.vx / spd3) * maxSpeed;
                p.vy = (p.vy / spd3) * maxSpeed;
              }
            }
          }

          // 每帧微小扰动，保持活跃
          for (var r2 = 1; r2 < rows; r2++) {
            for (var c2 = 1; c2 < cols; c2++) {
              var p2 = pts[r2][c2];
              p2.vx += (Math.random() - 0.5) * 0.02;
              p2.vy += (Math.random() - 0.5) * 0.02;
            }
          }

          // 更新SVG格子形状 + 数字跟随中心点
          var cells = self._mosaicCells;
          for (var i = 0; i < cells.length; i++) {
            var cell = cells[i];
            var r0 = Math.floor(i / cols), c0 = i % cols;
            var p1=pts[r0][c0], p2=pts[r0][c0+1], p3=pts[r0+1][c0+1], p4=pts[r0+1][c0];
            var ps = p1.x.toFixed(1)+','+p1.y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1)+' '+p3.x.toFixed(1)+','+p3.y.toFixed(1)+' '+p4.x.toFixed(1)+','+p4.y.toFixed(1);
            cell.poly.setAttribute('points', ps);
            // 数字跟随格子中心点
            var cx = (p1.x+p2.x+p3.x+p4.x)/4, cy = (p1.y+p2.y+p3.y+p4.y)/4;
            cell.txt.setAttribute('x', cx);
            cell.txt.setAttribute('y', cy+4);
            // 虚空模式：每隔60帧随机换文字颜色
            if (self.voidMode && frameCount % 60 === 0) {
              cell.txt.setAttribute('fill', self._randomColor());
            }
          }

          self._mosaicAnimId = requestAnimationFrame(animate);
        }

        self._mosaicAnimId = requestAnimationFrame(animate);
      };

      // 射线法：判断点(x,y)是否在多边形pts内
      SchulteGridGame.prototype._mosaicPointInPoly = function(x, y, polyPts) {
        var inside = false;
        for (var i = 0, j = polyPts.length-1; i < polyPts.length; j = i++) {
          var xi = polyPts[i].x, yi = polyPts[i].y;
          var xj = polyPts[j].x, yj = polyPts[j].y;
          if (((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) {
            inside = !inside;
          }
        }
        return inside;
      };

      SchulteGridGame.prototype._mosaicHandleClick = function(mx, my) {
        if (!this.isPlaying) return;
        for (var i = 0; i < this._mosaicCells.length; i++) {
          var cell = this._mosaicCells[i];
          if (this._mosaicPointInPoly(mx, my, cell.pts)) {
            if (cell.number === this.currentNumber) {
              // 正确 - 绿色 + 数字变50%灰
              cell.poly.setAttribute('fill', '#4CAF50');
              cell.txt.setAttribute('fill', '#808080');
              this.currentNumber += this.getNumberStep();
              this.playSound('correct');
              this.updateUI();
              if (this.currentNumber > this.getMaxNumber()) {
                this.completeGame();
              }
            } else {
              // 错误 - 红色 + 抖动动画
              cell.poly.setAttribute('fill', '#FF6B6B');
              cell.poly.style.animation = 'mosaicShake 0.3s ease';
              this.playSound('wrong');
              (function(poly, orig1, origStroke1) {
                setTimeout(function() {
                  poly.setAttribute('fill', orig1 || '#555');
                  poly.style.animation = '';
                }, 350);
              })(cell.poly, cell.poly.originalFill);
            }
            break;
          }
        }
      };

      SchulteGridGame.prototype.toggleVoidMode = function() {
        // 圆形模式允许游戏中切换虚无
        if (!this.isCircularMode && !this.isVariantMode && this.isPlaying) {
          return;
        }
        // 变体模式：仅在普通变体（currentMode==='variant'）下生效
        if (this.isVariantMode && this.currentMode !== 'variant') {
          return;
        }

        // 三态循环：0(关)→1(虚无)→2(虚无2)→0(关)
        // 变体虚无2=渐变色，普通虚无2=数字随机散布
        // 圆形模式保持二态：0(关)↔1(虚无)
        var oldVoidMode = this.voidMode;
        if (this.isVariantMode) {
          this.voidMode = (this.voidMode + 1) % 3;
        } else if (this.isCircularMode) {
          this.voidMode = this.voidMode >= 1 ? 0 : 1;
        } else {
          this.voidMode = (this.voidMode + 1) % 3;
        }

        // 从虚无2切走时，清除所有格子定时器
        if (oldVoidMode === 2 && this.voidMode !== 2) {
          var allPolys2 = document.querySelectorAll('#variant-svg .variant-top');
          for (var pi2 = 0; pi2 < allPolys2.length; pi2++) {
            allPolys2[pi2]._voidActive = false;
            if (allPolys2[pi2]._voidTimer) {
              clearTimeout(allPolys2[pi2]._voidTimer);
              allPolys2[pi2]._voidTimer = null;
            }
          }
        }

        // 虚无与毁灭互斥：开启虚无时关闭毁灭
        if (this.voidMode >= 1 && this.circularDestroy > 0) {
          this.circularDestroy = 0;
          var dbtn = document.querySelector('.destroy-toggle');
          if (dbtn) {
            dbtn.classList.remove('active', 'state1', 'state2', 'state3');
            dbtn.textContent = '毁灭';
          }
        }

        var btn = document.querySelector('.void-toggle');
        if (btn) {
          btn.classList.remove('active');
          if (this.voidMode === 1) {
            btn.classList.add('active');
            btn.textContent = '虚无';
          } else if (this.voidMode === 2) {
            btn.classList.add('active');
            btn.textContent = '虚无2';
          } else {
            btn.textContent = '虚无';
          }
        }

        // 圆形模式
        if (this.isCircularMode) {
          if (this.isPlaying) {
            // 游戏中：原地更新样式，不重建 DOM（避免动画重置）
            this._updateCircularSectorStyles();
            // 动2模式 RAF 循环每帧自动检查 voidMode/destroy 速度，无需额外调用
            // 重启计时器，直接开始新一局
            this.stopTimer();
            this.startTime = Date.now();
            this.startTimer();
          } else {
            this.renderCircularGrid();
            // 恢复旋转状态
            if (this.circularRotating === 1) {
              var svg = document.getElementById('circular-svg');
              var rings = svg.querySelectorAll('.ring');
              for (var ri = 0; ri < rings.length; ri++) {
                rings[ri].classList.add(ri % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
                var texts = rings[ri].querySelectorAll('.sector-text');
                for (var t = 0; t < texts.length; t++) {
                  texts[t].classList.add(ri % 2 === 0 ? 'counter-cw' : 'counter-ccw');
                }
              }
            } else if (this.circularRotating === 2) {
              this._startSpeedRAF();
            }
          }
        } else if (this.isVariantMode) {
          // 变体模式：重新渲染（应用随机颜色）
          this.renderVariantGrid();
        } else {
          this.reset();
        }
      };

      SchulteGridGame.prototype.toggleDestroyMode = function() {

        // 方形模式：六态切换：0(关闭) -> 1(背景变换) -> 2(炫光效果) -> 3(错觉背景) -> 4(交错棋盘) -> 5(曲面棋盘) -> 0(关闭)
        this.destroyMode = (this.destroyMode + 1) % 6;

        var btn = document.querySelector('.destroy-toggle');
        if (btn) {

            for (var d = 0; d < diffBtns.length; d++) {

              if (parseInt(diffBtns[d].dataset.size) === 10) {
                diffBtns[d].classList.add('active');
              }
            }
          } else if (this.destroyMode === 5) {
            btn.classList.add('active', 'state5');
            btn.textContent = '毁灭5';
          }
        }

        this.reset();
      };

        this.reset();

      // ========== 背景选择 ==========
      SchulteGridGame.prototype._darkenHex = function(hex, amount) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.round(r * (1 - amount)));
        g = Math.max(0, Math.round(g * (1 - amount)));
        b = Math.max(0, Math.round(b * (1 - amount)));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      };

      SchulteGridGame.prototype.toggleBgTypeDropdown = function() {
        var dropdown = document.getElementById('bgtype-dropdown');
        if (dropdown) {
          dropdown.classList.toggle('show');
        }
      };

      SchulteGridGame.prototype.selectBgType = function(type) {

        } else if (type === 'stripe-horizontal') {
          body.style.background = 'repeating-linear-gradient(0deg, ' + c1 + ' 0 20px, ' + c2 + ' 20px 40px)';
        } else if (type === 'stripe-vertical') {
          body.style.background = 'repeating-linear-gradient(90deg, ' + c1 + ' 0 20px, ' + c2 + ' 20px 40px)';
        } else if (type === 'grid-pattern') {

      SchulteGridGame.prototype.reset = function() {
        this.currentNumber = this.getNumberStart();
        this.isPlaying = false;
        this.stopTimer();

        // 先隐藏所有容器
        document.getElementById('grid-container').style.display = 'none';
        document.getElementById('circular-container').style.display = 'none';
        document.getElementById('bounce-canvas').style.display = 'none';
        document.getElementById('variant-container').style.display = 'none';
        document.getElementById('mosaic-container').style.display = 'none';
        document.getElementById('square-move-container').style.display = 'none';
        document.getElementById('vp-container').style.display = 'none';
        if (document.getElementById('bumpy-container')) document.getElementById('bumpy-container').style.display = 'none';

        if (this.isCircularMode) {
          document.getElementById('circular-container').style.display = 'flex';
          this.renderCircularGrid();
          if (this.circularRotating === 1) {
            var svg2 = document.getElementById('circular-svg');
            var rings2 = svg2.querySelectorAll('.ring');
            for (var ri2 = 0; ri2 < rings2.length; ri2++) {
              rings2[ri2].classList.add(ri2 % 2 === 0 ? 'rotate-cw' : 'rotate-ccw');
              var ts2 = rings2[ri2].querySelectorAll('.sector-text');
              for (var ti2 = 0; ti2 < ts2.length; ti2++) {
                ts2[ti2].classList.add(ri2 % 2 === 0 ? 'counter-cw' : 'counter-ccw');
              }
            }
          } else if (this.circularRotating === 2) {
            this._startSpeedRAF();
          }
        } else if (this.isBounceMode) {
          document.getElementById('bounce-canvas').style.display = 'block';
          if (this._bounceAnimId) { cancelAnimationFrame(this._bounceAnimId); this._bounceAnimId = null; }
          this._bounceInit();
          this._bounceRender();
        } else if (this.isVariantMode) {
          document.getElementById('variant-container').style.display = 'flex';
          this.renderVariantGrid();
        } else if (this.isMosaicMode) {
          document.getElementById('mosaic-container').style.display = 'flex';
          var self = this;
          requestAnimationFrame(function() {
            self._mosaicInit();
            self.renderMosaicGrid();
            if (self.mosaicDynamic) {
              self._mosaicAnimateStart();
            }
          });
          this.updateUI();
          this.updateStartButtonText();
          document.getElementById('start-btn').style.display = 'block';
          document.getElementById('restart-btn').style.display = 'none';
          return;
        } else if (this.isSquareMoveMode) {
          document.getElementById('square-move-container').style.display = 'block';
          this.generateNumbers();
          this.renderSquareMoveGrid();
        } else if (this.isBumpyMode) {
          document.getElementById('bumpy-container').style.display = 'block';
          // 开新一局：重新生成配色 + 四种效果循环前进一格（0→1→2→3→0）
          this.bumpyPalette = this._generateBumpyPalette();
          this.bumpyIdx = ((this.bumpyIdx == null ? -1 : this.bumpyIdx) + 1) % 4;
          this.generateNumbers();
          this.renderBumpyGrid();
        } else if (this.isVisualParallaxMode) {
          document.getElementById('vp-container').style.display = 'block';
          this.generateNumbers();
          this.renderVisualParallaxGrid();
        } else {
          document.getElementById('grid-container').style.display = 'grid';
          this.generateNumbers();
          this.renderGrid();
        }
        this.updateUI();
        this.updateStartButtonText();

        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'none';
      };

      SchulteGridGame.prototype.start = function() {
        this.stopTimer();
        this.isPlaying = true;
        this.currentNumber = this.getNumberStart();
        this.startTime = Date.now();
        this.startTimer();

        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('restart-btn').style.display = 'block';

        if (this.isBounceMode) {
          this._bounceStart();
        } else if (this.isRotateMode) {
          this._rotateStart();
        }

        // 圆形动2模式：重置 RAF 计时起点，确保30秒从游戏开始时起算
        if (this.isCircularMode && this.circularRotating === 2) {
          this._startSpeedRAF();
        }

        this.initAudio();
        this.playSound('start');
        this.updateUI();
      };

      SchulteGridGame.prototype.restart = function() {

      SchulteGridGame.prototype.MOSAIC_COLORS = [
        '#E53935', '#FF5722', '#FF9800', '#FFC107',
        '#FFEB3B', '#CDDC39', '#C3D825', '#009688',
        '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'
      ];

      // 生成行列颜色矩阵，保证相邻格（上下/左右）颜色不同，且颜色分布均匀
      SchulteGridGame.prototype.generateCellColors = function(rows, cols) {
        var palette = this.MOSAIC_COLORS;
        var total = rows * cols;

        // 第1步：构建均匀颜色池（每种颜色出现次数 = floor(total/12) 或 ceil）
        var counts = {};
        for (var i = 0; i < palette.length; i++) counts[palette[i]] = 0;
        var base = Math.floor(total / palette.length);
        var extra = total % palette.length;
        // 颜色池：每种颜色出现 base 或 base+1 次
        var colorPool = [];
        for (var i = 0; i < palette.length; i++) {
          var cnt = base + (i < extra ? 1 : 0);
          for (var k = 0; k < cnt; k++) colorPool.push(palette[i]);
        }

        // 第2步：Fisher-Yates 打乱
        for (var i = colorPool.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = colorPool[i]; colorPool[i] = colorPool[j]; colorPool[j] = t;
        }

        // 第3步：贪心填入网格，优先用颜色池中前面的颜色，跳过与左/上同色的
        var grid = [];
        var unused = colorPool.slice(); // 未使用的颜色列表（动态调整）
        for (var r = 0; r < rows; r++) {
          grid[r] = [];
          for (var c = 0; c < cols; c++) {
            var forbidden = {};
            if (c > 0) forbidden[grid[r][c-1]] = true;
            if (r > 0) forbidden[grid[r-1][c]] = true;

            // 从 unused 中找第一个不在 forbidden 中的颜色
            var found = -1;
            for (var k = 0; k < unused.length; k++) {
              if (!forbidden[unused[k]]) { found = k; break; }
            }
            if (found === -1) {
              // 不应发生（12种颜色，最多禁止2种），兜底：随机选 palette 中的非禁止色
              var fb = palette[Math.floor(Math.random() * palette.length)];
              var attempts = 0;
              while (forbidden[fb] && attempts < palette.length) {
                fb = palette[Math.floor(Math.random() * palette.length)];
                attempts++;
              }
              grid[r][c] = fb;
            } else {
              grid[r][c] = unused[found];
              unused.splice(found, 1); // 从 unused 中移除已用颜色
            }
          }
        }

        // 第4步：验证相邻同色，若有则与后面不同色的格子交换修复
        var maxFix = 100;
        for (var iter = 0; iter < maxFix; iter++) {
          var hasBad = false;
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var bad = false;
              if (c > 0 && grid[r][c] === grid[r][c-1]) bad = true;
              if (r > 0 && grid[r][c] === grid[r-1][c]) bad = true;
              if (!bad) continue;
              hasBad = true;
              // 找任意一个与当前格子颜色不同的格子交换
              for (var r2 = 0; r2 < rows; r2++) {
                for (var c2 = 0; c2 < cols; c2++) {
                  if (r2 === r && c2 === c) continue;
                  if (grid[r2][c2] === grid[r][c]) continue;
                  // 尝试交换
                  var tmp = grid[r][c];
                  grid[r][c] = grid[r2][c2];
                  grid[r2][c2] = tmp;
                  // 检查交换后当前位置是否还相邻同色
                  var stillBad = false;
                  if (c > 0 && grid[r][c] === grid[r][c-1]) stillBad = true;
                  if (r > 0 && grid[r][c] === grid[r-1][c]) stillBad = true;
                  if (c < cols-1 && grid[r][c] === grid[r][c+1]) stillBad = true;
                  if (r < rows-1 && grid[r][c] === grid[r+1][c]) stillBad = true;
                  if (stillBad) {
                    // 交换不好，换回来
                    tmp = grid[r][c];
                    grid[r][c] = grid[r2][c2];
                    grid[r2][c2] = tmp;
                  } else {
                    // 交换成功，跳出搜索
                    r2 = rows; c2 = cols; // 跳出双层循环
                  }
                }
              }
            }
          }
          if (!hasBad) break;
        }

        // 展平为一维数组
        var flat = [];
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            flat.push(grid[r][c]);
          }
        }
        return flat;
      };

      SchulteGridGame.prototype.getRandomFont = function() {
        return this.fonts[Math.floor(Math.random() * this.fonts.length)];
      };

      SchulteGridGame.prototype.generateNumbers = function() {
        var total = this.gridSize * this.gridSize;
        this.numbers = [];

        for (var i = 1; i <= total; i++) {
          if (this.numberType === 'odd') {
            this.numbers.push(2 * i - 1);
          } else if (this.numberType === 'even') {
            this.numbers.push(2 * i);
          } else {
            this.numbers.push(i);
          }
        }

        this.shuffleNumbers();
      };

      SchulteGridGame.prototype.shuffleNumbers = function() {
        for (var i = this.numbers.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = this.numbers[i];
          this.numbers[i] = this.numbers[j];
          this.numbers[j] = temp;
        }
      };

      SchulteGridGame.prototype.renderGrid = function() {
        var container = document.getElementById('grid-container');
        // 先清理可能残留的特殊模式 class，避免影响显示
        container.classList.remove('destroy-mode-4', 'destroy-mode-5');
        // 恢复 game-container 默认宽度（毁灭5会放大）。必须在 calculateCellSize 之前执行，
        // 否则重开时容器仍带着上次毁灭5撑大的 maxWidth，calculateCellSize 读到的 clientWidth 越来越大，形成滚雪球放大
        var gcRestore = document.querySelector('.game-container');
        if (gcRestore) gcRestore.style.maxWidth = '';

        var cellSize = this.calculateCellSize();

        // 毁灭4模式：特殊渲染路径
        if (this.destroyMode === 4) {
          this._renderDestroy4Grid(container, cellSize);
          return;
        }

        // 毁灭5模式：曲面棋盘格
        if (this.destroyMode === 5) {
          this._renderDestroy5Grid(container, cellSize);
          return;
        }

        // 虚无2模式：数字随机散布
        if (this.voidMode === 2) {
          this._renderScatterGrid(container, cellSize);
          return;
        }

        // 普通模式：清理散布/毁灭4模式留下的样式
        container.style.display = '';
        container.style.position = '';
        container.style.overflow = '';
        container.style.background = '';
        container.style.width = '';
        container.style.height = '';
        container.style.padding = '';
        container.style.boxSizing = '';
        container.style.borderRadius = '';
        container.style.gap = '';

        container.style.gridTemplateColumns = 'repeat(' + this.gridSize + ', ' + cellSize + 'px)';
        container.innerHTML = '';

        var colorPalette = ['#E53935', '#FF5722', '#FF9800', '#FFC107', '#FFEB3B', '#CDDC39', '#4CAF50', '#009688', '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'];
        var angles = [25, 30, 45, 75];
        
        for (var i = 0; i < this.numbers.length; i++) {
          var cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.number = this.numbers[i];
          cell.style.width = cellSize + 'px';
          cell.style.height = cellSize + 'px';
          cell.style.fontSize = Math.floor(cellSize * 0.55) + 'px';
          cell.style.lineHeight = cellSize + 'px';
          
          // 创建数字文字元素
          var numberSpan = document.createElement('span');
          numberSpan.className = 'number-text';
          numberSpan.textContent = this.numbers[i];
          // 随机颜色
          numberSpan.style.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];

          // 根据模式应用旋转
          if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
            var angle = angles[Math.floor(Math.random() * angles.length)];
            var direction = Math.random() > 0.5 ? 1 : -1;
            var finalAngle = angle * direction;
            
            if (this.currentMode === 'offset') {
              // 偏移模式：静态旋转
              numberSpan.style.transform = 'rotate(' + finalAngle + 'deg)';
            } else {
              // 混乱模式：动态摆动
              numberSpan.classList.add('chaos-mode');
              var oppositeAngle = -finalAngle;
              numberSpan.style.setProperty('--start-angle', finalAngle + 'deg');
              numberSpan.style.setProperty('--end-angle', oppositeAngle + 'deg');
            }
          }
          
          // 毁灭3模式：默认细字体（换字模式可覆盖）
          if (this.destroyMode === 3) {
            numberSpan.style.fontFamily = "'Segoe UI Light', 'Helvetica Neue Light', 'PingFang SC Light', sans-serif";
          }
          // 换字模式：随机字体（可与其他模式组合）
          if (this.fontMode) {
            var randomFont = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            numberSpan.style.fontFamily = randomFont;
          }
          
          cell.appendChild(numberSpan);
          
          // 虚无模式：边框放射动画（可与其他模式组合）
          if (this.voidMode) {
            cell.classList.add('void-mode');
          }

          // 毁灭模式：根据状态应用不同的效果
          if (this.destroyMode === 1) {
            // 模式1：色相平滑旋转，每格随机时长 + 随机相位，避免列同步
            cell.classList.add('destroy-mode-1');
            numberSpan.style.color = '#ffffff';
            // 随机动画时长 6~12s，随机负延迟打散相位
            cell.style.animationDuration = (6 + Math.random() * 6).toFixed(1) + 's';
            cell.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
          } else if (this.destroyMode === 2) {
            // 模式2：中心爆发式炫光效果
            cell.classList.add('destroy-mode-2');
            numberSpan.style.color = '#000000';
            numberSpan.style.textShadow = '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff';
          } else if (this.destroyMode === 3) {
            // 模式3：浮雕错觉背景方格
            cell.classList.add('destroy-mode-3');
            // 棋盘格凸起/凹陷
            var row = Math.floor(i / this.gridSize);
            var col = i % this.gridSize;
            cell.classList.add((row % 2 === col % 2) ? 'raised' : 'recessed');
          }

          cell.onclick = (function(number) {
            return function() {
              game.handleClick(number, this);
            };
          })(this.numbers[i]);

          container.appendChild(cell);
        }

        // 毁灭3模式：创建菱形交点 overlay
        if (this.destroyMode === 3) {
          container.classList.add('destroy-mode-3');
          this._createDestroyOverlay(container, cellSize);
        } else {
          container.classList.remove('destroy-mode-3');
          this._removeDestroyOverlay(container);
        }
      };

      // Bridson 泊松盘采样算法：自然随机、均匀覆盖、无重叠
      function _poissonDiskSample(width, height, minDist, maxPoints) {
        var cellSize = minDist / Math.sqrt(2);
        var cols = Math.ceil(width / cellSize);
        var rows = Math.ceil(height / cellSize);
        var grid = new Array(cols * rows);
        for (var i = 0; i < grid.length; i++) grid[i] = -1;
        var points = [];
        var active = [];

        // 初始点随机
        var p0 = { x: Math.random() * width, y: Math.random() * height };
        points.push(p0);
        active.push(0);
        var ci0 = Math.floor(p0.x / cellSize);
        var ri0 = Math.floor(p0.y / cellSize);
        grid[ri0 * cols + ci0] = 0;

        while (active.length > 0 && points.length < maxPoints) {
          var ai = Math.floor(Math.random() * active.length);
          var p = points[active[ai]];
          var found = false;

          for (var k = 0; k < 30; k++) {
            var angle = Math.random() * 2 * Math.PI;
            var r = minDist + Math.random() * minDist;
            var nx = p.x + Math.cos(angle) * r;
            var ny = p.y + Math.sin(angle) * r;

            if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;

            var nc = Math.floor(nx / cellSize);
            var nr = Math.floor(ny / cellSize);
            var valid = true;

            for (var dc = -2; dc <= 2 && valid; dc++) {
              for (var dr = -2; dr <= 2 && valid; dr++) {
                var gc = nc + dc, gr = nr + dr;
                if (gc < 0 || gc >= cols || gr < 0 || gr >= rows) continue;
                var gi = grid[gr * cols + gc];
                if (gi !== -1) {
                  var q = points[gi];
                  var dx = nx - q.x, dy = ny - q.y;
                  if (dx * dx + dy * dy < minDist * minDist) valid = false;
                }
              }
            }

            if (valid) {
              points.push({ x: nx, y: ny });
              active.push(points.length - 1);
              grid[nr * cols + nc] = points.length - 1;
              found = true;
              break;
            }
          }

          if (!found) {
            active.splice(ai, 1);
          }
        }

        return points;
      }

      // 虚无2模式：数字随机散布，无方格背景
      SchulteGridGame.prototype._renderScatterGrid = function(container, cellSize) {
        // ⚠️ 关键：必须在函数最开头设置 display，确保即使后续代码出错容器也可见
        container.innerHTML = '';
        container.style.display = 'block';
        container.style.visibility = 'visible';
        container.style.position = 'relative';
        container.style.overflow = 'hidden';
        container.style.background = '#ffffff';      // 白色不透明容器
        container.style.gridTemplateColumns = '';
        container.style.borderRadius = '8px';
        container.style.padding = '0';
        container.style.boxSizing = 'content-box';

        var total = this.numbers.length;
        if (total === 0) return;  // 无数字则跳过

        var gap = 3;
        var margin = 4;
        var totalW = this.gridSize * cellSize + (this.gridSize - 1) * gap + margin * 2;

        // 关键：game-container 有 max-width:500px，必须按父容器真实宽度限制容器
        var parentEl = container.parentElement;
        var parentW = parentEl ? parentEl.clientWidth : totalW;
        if (parentW > 0 && totalW > parentW) {
          totalW = parentW;
        }
        var totalH = totalW;
        container.style.width = totalW + 'px';
        container.style.height = totalH + 'px';

        var padW = totalW - margin * 2;
        var padH = totalH - margin * 2;

        // elemSize 自适应
        var optimalSpacing = Math.sqrt(padW * padH / total);
        var elemSize = Math.min(cellSize, Math.floor(optimalSpacing * 0.75));
        if (elemSize < 14) elemSize = 14;
        var fontSize = Math.max(10, Math.floor(elemSize * 0.65));

        // === Poisson Disk Sampling（Bridson算法） ===
        // 理想最小间距：保证不重叠、不过分聚集、随机均匀
        var minDist = Math.floor(optimalSpacing * 0.9);
        if (minDist < 14) minDist = 14;

        function poissonSample(w, h, dist, maxN) {
          if (w <= 0 || h <= 0 || dist <= 0) return [];
          var cellSz = dist / Math.sqrt(2);
          var cols = Math.ceil(w / cellSz);
          var rows = Math.ceil(h / cellSz);
          var grid = new Array(cols * rows);
          var pts = [];
          var active = [];

          // 初始点
          var p0 = { x: Math.random() * w, y: Math.random() * h };
          pts.push(p0);
          active.push(0);
          grid[Math.floor(p0.y / cellSz) * cols + Math.floor(p0.x / cellSz)] = 0;

          while (active.length > 0 && pts.length < maxN) {
            var ai = Math.floor(Math.random() * active.length);
            var p = pts[active[ai]];
            var found = false;

            for (var k = 0; k < 30; k++) {
              var angle = Math.random() * 2 * Math.PI;
              var r = dist + Math.random() * dist;
              var nx = p.x + Math.cos(angle) * r;
              var ny = p.y + Math.sin(angle) * r;

              if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;

              var nc = Math.floor(nx / cellSz);
              var nr = Math.floor(ny / cellSz);
              var valid = true;

              for (var dc = -2; dc <= 2 && valid; dc++) {
                for (var dr = -2; dr <= 2 && valid; dr++) {
                  var gc = nc + dc, gr = nr + dr;
                  if (gc < 0 || gc >= cols || gr < 0 || gr >= rows) continue;
                  var gi = grid[gr * cols + gc];
                  if (gi !== undefined) {
                    var q = pts[gi];
                    var dx = nx - q.x, dy = ny - q.y;
                    if (dx * dx + dy * dy < dist * dist) valid = false;
                  }
                }
              }

              if (valid) {
                pts.push({ x: nx, y: ny });
                active.push(pts.length - 1);
                grid[nr * cols + nc] = pts.length - 1;
                found = true;
                break;
              }
            }

            if (!found) { active.splice(ai, 1); }
          }

          return pts;
        }

        var sampleW = padW - elemSize;  // 采样范围与渲染边界精确对齐，避免钳位聚集
        var sampleH = padH - elemSize;
        if (sampleW < 30) sampleW = 30;
        if (sampleH < 30) sampleH = 30;

        var points = poissonSample(sampleW, sampleH, minDist, total);

        // 逐步缩小间距重试
        for (var retry = 0; retry < 6 && points.length < total; retry++) {
          minDist = Math.max(8, Math.floor(minDist * 0.82));
          points = poissonSample(sampleW, sampleH, minDist, total);
        }

        // 兜底：随机填充
        while (points.length < total) {
          points.push({ x: Math.random() * sampleW, y: Math.random() * sampleH });
        }

        // 打乱数字顺序
        var numOrder = [];
        for (var i = 0; i < total; i++) numOrder.push(i);
        for (var i = total - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = numOrder[i]; numOrder[i] = numOrder[j]; numOrder[j] = t;
        }

        var colorPalette = ['#D32F2F', '#E65100', '#F57C00', '#FF8F00', '#F9A825', '#E64A19', '#5D4037', '#455A64', '#1565C0', '#283593', '#6A1B9A', '#AD1457'];

        for (var n = 0; n < total; n++) {
          var idx = numOrder[n];
          var pt = points[n];

          var x = margin + pt.x;
          var y = margin + pt.y;
          x = Math.max(margin, Math.min(x, totalW - margin - elemSize));
          y = Math.max(margin, Math.min(y, totalH - margin - elemSize));
          var angle = (Math.random() - 0.5) * 180;

          var elem = document.createElement('div');
          elem.className = 'scatter-cell';
          elem.dataset.number = this.numbers[idx];
          elem.textContent = this.numbers[idx];
          elem.style.position = 'absolute';
          elem.style.left = x + 'px';
          elem.style.top = y + 'px';
          elem.style.width = elemSize + 'px';
          elem.style.height = elemSize + 'px';
          elem.style.lineHeight = elemSize + 'px';
          elem.style.textAlign = 'center';
          elem.style.fontSize = fontSize + 'px';
          elem.style.fontWeight = 'bold';
          elem.style.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
          elem.style.cursor = 'pointer';
          elem.style.userSelect = 'none';
          elem.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
          elem.style.transition = 'all 0.15s ease';

          if (this.currentMode === 'chaos') {
            elem.classList.add('chaos-mode');
            var cAngles = [15, 30, 45, -15, -30, -45];
            var cAng = cAngles[Math.floor(Math.random() * cAngles.length)];
            // 以当前元素自身旋转角度为基准摆动
            elem.style.setProperty('--start-angle', (angle + cAng).toFixed(1) + 'deg');
            elem.style.setProperty('--end-angle', (angle - cAng).toFixed(1) + 'deg');
            elem.style.animation = 'swing 2s ease-in-out infinite';
          }

          if (this.fontMode) {
            var randomFont = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            elem.style.fontFamily = randomFont;
          }

          elem.onclick = (function(num, el) {
            return function() {
              game.handleClick(num, el);
            };
          })(this.numbers[idx], elem);

          container.appendChild(elem);
        }
      };

      // 毁灭4模式：交错棋盘格渲染
      SchulteGridGame.prototype._renderDestroy4Grid = function(container, cellSize) {
        container.innerHTML = '';
        container.className = 'grid-container destroy-mode-4';
        container.style.gridTemplateColumns = '';

        var gap = Math.max(1, Math.floor(cellSize / 10));
        var halfCell = Math.floor(cellSize * (this.gridSize >= 9 ? 0.35 : 0.5));
        var totalWidth = this.gridSize * cellSize + this.gridSize * gap + halfCell;
        // box-sizing: border-box + padding: 4px → 实际内容区 = width - 8px，需补上
        container.style.width = (totalWidth + 8) + 'px';
        container.style.gap = gap + 'px';
        var angles = [25, 30, 45, 75];
        var colorPalette = ['#E53935', '#FF5722', '#FF9800', '#FFC107', '#FFEB3B', '#CDDC39', '#4CAF50', '#009688', '#2196F3', '#3F51B5', '#9C27B0', '#E91E63'];

        // 装饰半格：纯展示，不参与交互
        function createHalfDecor(rowIdx, isEvenRow) {
          var d = document.createElement('div');
          d.className = 'grid-cell destroy-mode-4 destroy4-decor';
          d.style.width = halfCell + 'px';
          d.style.height = cellSize + 'px';
          d.style.pointerEvents = 'none';
          // 装饰格颜色：与相邻完整格相反，延续棋盘格
          var decColor = isEvenRow ? (rowIdx + 1) % 2 : (rowIdx + 10) % 2;
          d.classList.add(decColor === 0 ? 'checker-white' : 'checker-black');
          return d;
        }

        for (var r = 0; r < this.gridSize; r++) {
          var row = document.createElement('div');
          row.className = 'destroy4-row';
          row.style.gap = gap + 'px';

          var isEven = r % 2 === 0;

          // 偶数行：左侧补装饰半格
          if (isEven) {
            row.appendChild(createHalfDecor(r, true));
          }

          for (var c = 0; c < this.gridSize; c++) {
            var idx = r * this.gridSize + c;
            var cell = document.createElement('div');
            cell.className = 'grid-cell destroy-mode-4';
            cell.dataset.number = this.numbers[idx];
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            cell.style.fontSize = Math.floor(cellSize * 0.55) + 'px';
            cell.style.lineHeight = cellSize + 'px';

            // 棋盘格配色：(r+c)%2===0 → 白底黑字，否则黑底白字
            var isWhite = (r + c) % 2 === 0;
            cell.classList.add(isWhite ? 'checker-white' : 'checker-black');

            // 创建数字 span
            var numberSpan = document.createElement('span');
            numberSpan.className = 'number-text';
            numberSpan.textContent = this.numbers[idx];

            // 偏移/混乱效果叠加
            if (this.currentMode === 'offset' || this.currentMode === 'chaos') {
              var angle = angles[Math.floor(Math.random() * angles.length)];
              var direction = Math.random() > 0.5 ? 1 : -1;
              var finalAngle = angle * direction;
              if (this.currentMode === 'offset') {
                numberSpan.style.transform = 'rotate(' + finalAngle + 'deg)';
              } else {
                numberSpan.classList.add('chaos-mode');
                numberSpan.style.setProperty('--start-angle', finalAngle + 'deg');
                numberSpan.style.setProperty('--end-angle', (-finalAngle) + 'deg');
              }
            }

            // 换字效果叠加
            if (this.fontMode) {
              numberSpan.style.fontFamily = this.fonts[Math.floor(Math.random() * this.fonts.length)];
            }

            // 虚无效果叠加
            if (this.voidMode) {
              cell.classList.add('void-mode');
            }

            cell.appendChild(numberSpan);

            cell.onclick = (function(number) {
              return function() {
                game.handleClick(number, this);
              };
            })(this.numbers[idx]);

            row.appendChild(cell);
          }

          // 奇数行：右侧补装饰半格
          if (!isEven) {
            row.appendChild(createHalfDecor(r, false));
          }

          container.appendChild(row);
        }
      };

      // ========== 毁灭5：曲面棋盘格 ==========
      // 黑白交替棋盘；黑格左右各2条6%宽色块（1:#f1d213 2:#e92239 黑 3:#031cc7 4:#1896e7）
      // 所有方格竖边弯成>150°圆弧，奇数行(0-indexed偶)向右弯，偶数行(0-indexed奇)向左弯
      SchulteGridGame.prototype._renderDestroy5Grid = function(container, cellSize) {
        container.innerHTML = '';
        container.className = 'grid-container destroy-mode-5';
        container.style.gridTemplateColumns = '';
        container.style.display = 'block';
        // 毁灭5容器宽度：根据cs反推总宽度（含色块+弧形+偏移），不超屏幕
        var N5 = this.gridSize;
        var needW5 = cellSize * (1.2 * N5 + 0.70) + 8;
        var gc5 = document.querySelector('.game-container');
        if (gc5) gc5.style.maxWidth = Math.min(window.innerWidth - 20, needW5) + 'px';
        // 清理毁灭4/散布等模式残留的内联样式
        container.style.width = '100%';
        container.style.height = '';
        container.style.gap = '';
        container.style.position = '';
        container.style.overflow = '';
        container.style.background = '';
        container.style.padding = '';
        container.style.boxSizing = '';
        container.style.borderRadius = '';

        var SVGNS = 'http://www.w3.org/2000/svg';
        var N = this.gridSize;
        var cs = cellSize;
        var r = Math.floor(cs * 0.9); // 圆弧半径，弧角≈67°，外凸≈15%cs
        var bulge = r - Math.sqrt(r * r - (cs / 2) * (cs / 2)); // sagitta ≈ 0.15*cs

        // 色块宽度比例（每条 10% cs）
        var stripW = 0.10;
        var stripPx = stripW * cs;           // 每条色块像素宽度
        var groupW = 2 * stripPx;            // 每组色块宽度（2条）

        // 总内容宽度 = N个格子 + (N+1)组色块
        var contentW = N * cs + (N + 1) * groupW;
        var maxOffset = stripPx;                 // 行整体平移最大偏移（3号色块宽度）
        var svgW = contentW + 2 * bulge + 2 * maxOffset;
        var svgH = N * cs;

        var svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('viewBox', (-(bulge + maxOffset)) + ' 0 ' + svgW + ' ' + svgH);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        svg.style.width = '100%';
        svg.style.height = 'auto';
        svg.style.display = 'block';

        var angles = [25, 30, 45, 75];

        // 色块颜色（装饰色块，不算黑白面积）
        var stripColors12 = ['#f1d213', '#e92239']; // 色块1, 2
        var stripColors34 = ['#1525f0', '#1896e7']; // 色块3(改色), 4

        for (var row = 0; row < N; row++) {
          var curveRight = (row % 2 === 0); // 第1行(row=0)向右，第2行(row=1)向左，交替
          var leftSweep = curveRight ? 1 : 0;
          var rightSweep = curveRight ? 0 : 1;
          var y0 = row * cs;
          var xCur = 0; // 从0开始，SVG viewBox偏移处理bulge

          // 整行平移：奇数行(第1,3,5行)右移1个色块宽度，偶数行(第2,4,6行)左移1个色块宽度
          var rowOffsetX = (row % 2 === 0) ? stripPx : -stripPx;
          var rowG = document.createElementNS(SVGNS, 'g');
          rowG.setAttribute('transform', 'translate(' + rowOffsetX + ', 0)');

          // 遍历：色块组0 → 格子0 → 色块组1 → 格子1 → ... → 色块组N
          for (var col = 0; col <= N; col++) {
            // 渲染色块组（装饰，不可点击）
            // 奇数行(第1,3,5行)：1,2,3,4,1,2,3,4...（偶数位=12，奇数位=34）
            // 偶数行(第2,4,6行)：4,3,2,1,4,3,2,1...（偶数位=43反转，奇数位=21反转）
            var groupIsEven = (col % 2 === 0);
            var rowIsOdd = (row % 2 === 0); // row=0是第1行=奇数行
            var sColors;
            if (rowIsOdd) {
              sColors = groupIsEven ? stripColors12 : stripColors34;
            } else {
              sColors = groupIsEven
                ? [stripColors34[1], stripColors34[0]]  // [4, 3]
                : [stripColors12[1], stripColors12[0]]; // [2, 1]
            }

            for (var s = 0; s < 2; s++) {
              var sPath = document.createElementNS(SVGNS, 'path');
              sPath.setAttribute('fill', sColors[s]);
              sPath.setAttribute('d',
                'M ' + xCur + ',' + y0 +
                ' A ' + r + ',' + r + ' 0 0 ' + leftSweep + ' ' + xCur + ',' + (y0 + cs) +
                ' L ' + (xCur + stripPx) + ',' + (y0 + cs) +
                ' A ' + r + ',' + r + ' 0 0 ' + rightSweep + ' ' + (xCur + stripPx) + ',' + y0 +
                ' Z'
              );
              rowG.appendChild(sPath);
              xCur += stripPx;
            }

            // 渲染格子主体（最后一组色块后无格子）
            if (col < N) {
              var idx = row * N + col;
              var isWhite = (row + col) % 2 === 0;
              var cellColor = isWhite ? '#FFFFFF' : '#000000';

              var g = document.createElementNS(SVGNS, 'g');
              g.setAttribute('class', 'cell-group');

              var cellPath = document.createElementNS(SVGNS, 'path');
              cellPath.setAttribute('class', 'cell-bg');
              cellPath.setAttribute('fill', cellColor);
              cellPath.setAttribute('d',
                'M ' + xCur + ',' + y0 +
                ' A ' + r + ',' + r + ' 0 0 ' + leftSweep + ' ' + xCur + ',' + (y0 + cs) +
                ' L ' + (xCur + cs) + ',' + (y0 + cs) +
                ' A ' + r + ',' + r + ' 0 0 ' + rightSweep + ' ' + (xCur + cs) + ',' + y0 +
                ' Z'
              );
              g.appendChild(cellPath);

              // 数字位置：居中 + 奇数行(第1,3,5行)右偏，偶数行(第2,4,6行)左偏
              var textCX = xCur + cs / 2 + (row % 2 === 0 ? cs * 0.05 : -cs * 0.05);
              var textCY = y0 + cs / 2;

              var txt = document.createElementNS(SVGNS, 'text');
              txt.setAttribute('x', textCX);
              txt.setAttribute('y', textCY);
              txt.setAttribute('text-anchor', 'middle');
              txt.setAttribute('dominant-baseline', 'central');
              txt.setAttribute('fill', isWhite ? '#000000' : '#FFFFFF');
              txt.setAttribute('font-size', Math.floor(cs * 0.5));
              txt.textContent = this.numbers[idx];
              g.appendChild(txt);

              // 偏移模式：数字随机旋转（静态）
              if (this.currentMode === 'offset') {
                var offAngle = angles[Math.floor(Math.random() * angles.length)];
                var offDir = Math.random() > 0.5 ? 1 : -1;
                txt.setAttribute('transform', 'rotate(' + (offAngle * offDir) + ' ' + textCX + ' ' + textCY + ')');
              }

              // 混乱模式：数字随机摆动（CSS动画）
              if (this.currentMode === 'chaos') {
                var chAngle = angles[Math.floor(Math.random() * angles.length)];
                var chDir = Math.random() > 0.5 ? 1 : -1;
                var startAngle = chAngle * chDir;
                var endAngle = -startAngle;
                txt.classList.add('chaos-mode');
                txt.style.setProperty('--start-angle', startAngle + 'deg');
                txt.style.setProperty('--end-angle', endAngle + 'deg');
              }

              // 换字模式：随机字体（用内联样式，优先级高于 CSS 的 font-family 规则；
              // 用 setAttribute 会成为表现属性被 CSS 覆盖，字体换不掉）
              if (this.fontMode) {
                var randomFont = this.fonts[Math.floor(Math.random() * this.fonts.length)];
                txt.style.fontFamily = randomFont;
              }

              // 点击事件
              g.onclick = (function(number, group) {
                return function() {
                  game.handleClick(number, group);
                };
              })(this.numbers[idx], g);

              rowG.appendChild(g);

              xCur += cs;
            }
          }
          svg.appendChild(rowG);
        }

        container.appendChild(svg);
      };

      SchulteGridGame.prototype._createDestroyOverlay = function(container, cellSize) {
        this._removeDestroyOverlay(container);
        var overlay = document.createElement('div');
        overlay.className = 'destroy-diamond-overlay';
        overlay.id = 'destroy-diamond-overlay';
        var gs = this.gridSize;
        for (var r = 0; r <= gs; r++) {
          for (var c = 0; c <= gs; c++) {
            var cluster = document.createElement('div');
            cluster.className = 'destroy-diamond-cluster';
            cluster.style.left = (c * cellSize) + 'px';
            cluster.style.top = (r * cellSize) + 'px';
            // 4种模式随机：2黑2白相邻不交叉
            var patterns = [
              ['black','black','white','white'],
              ['white','black','black','white'],
              ['white','white','black','black'],
              ['black','white','white','black']
            ];
            var colors = patterns[Math.floor(Math.random() * 4)];
            var positions = ['top','right','bottom','left'];
            for (var i = 0; i < 4; i++) {
              var d = document.createElement('div');
              d.className = 'destroy-diamond ' + colors[i] + ' ' + positions[i];
              cluster.appendChild(d);
            }
            overlay.appendChild(cluster);
          }
        }
        container.appendChild(overlay);
      };

      SchulteGridGame.prototype._removeDestroyOverlay = function(container) {
        var existing = container.querySelector('#destroy-diamond-overlay');
        if (existing) existing.remove();
      };

      SchulteGridGame.prototype.calculateCellSize = function() {
        var gameContainer = document.querySelector('.game-container');
        var containerWidth;
        if (gameContainer && gameContainer.clientWidth > 0) {
          containerWidth = gameContainer.clientWidth;
        } else {
          containerWidth = Math.min(window.innerWidth - 20, 500);
        }
        var maxGridSize = 10;
        var padding = 4;
        var gap = 3;
        
        // 毁灭4模式：列间距为cellSize/10，多出半个格装饰用
        if (this.destroyMode === 4) {
          var availW = containerWidth - padding * 2;
          var halfRatio = this.gridSize >= 9 ? 0.35 : 0.5;
          // total = halfCell + gridSize*cellSize + gridSize*(cellSize/10)
          // total = cellSize * (halfRatio + gridSize * 1.1)
          var cs = Math.floor(availW / (halfRatio + this.gridSize * 1.1));
          return Math.min(cs, 120);
        }
        
        var availableWidth = containerWidth - padding * 2 - (this.gridSize - 1) * gap;
        var cellSize = Math.floor(availableWidth / this.gridSize);
        
        return Math.min(cellSize, 120);
      };

      SchulteGridGame.prototype.handleClick = function(number, element) {
        if (!this.isPlaying) {
          return;
        }

        if (number === this.currentNumber) {
          this.handleCorrectClick(element);
        } else {
          this.handleWrongClick(element);
        }
      };

      SchulteGridGame.prototype.handleCorrectClick = function(element) {
        // 变体模式：菱形变绿，数字变50%灰，并停止该格子的虚无2渐变
        if (this.isVariantMode) {
          var vTop = element.querySelector('.variant-top');
          if (vTop) {
            vTop.setAttribute('fill', '#4CAF50');
            vTop._voidActive = false;
            if (vTop._voidTimer) { clearTimeout(vTop._voidTimer); vTop._voidTimer = null; }
          }
          var vTxt = element.querySelector('text');
          if (vTxt) vTxt.setAttribute('fill', '#808080');
        } else if ((this.voidMode || this.circularDestroy > 0) && this.isCircularMode) {
          var vp = element.querySelector('.sector');
          var vt = element.querySelector('.sector-text');
          if (vp) {
            vp.style.animation = 'none';
            vp.style.fill = '#4CAF50';
          }
          if (vt) {
            vt.style.fill = '#ffffff';
            vt.style.stroke = '#ffffff';
            vt.style.fontWeight = '800';
          }
          // 毁灭2模式：锁定该扇区，颜色循环不再覆盖
          if (this.circularDestroy === 2) {
            var allGroups = document.querySelectorAll('#circular-svg .sector-group');
            for (var gi = 0; gi < allGroups.length; gi++) {
              if (allGroups[gi] === element) { this.destroy2Locked[gi] = true; break; }
            }
          }
        } else if (this.voidMode === 2 && !this.isVariantMode && !this.isCircularMode) {
          // 虚无2散布模式：数字文字变绿
          element.style.color = '#4CAF50';
        } else if (this.isSquareMoveMode) {
          // 方形（动）模式：标记所有同编号格子为正确
          var smNum = element.dataset.number;
          var smCells = document.querySelectorAll('.square-move-cell[data-number="' + smNum + '"]');
          for (var sci = 0; sci < smCells.length; sci++) {
            smCells[sci].classList.add('correct');
            // 停止混乱动画
            var smSpan = smCells[sci].querySelector('.number-text');
            if (smSpan && this.currentMode === 'chaos') {
              smSpan.style.animation = 'none';
              smSpan.classList.remove('chaos-mode');
            }
          }
        } else if (this.isVisualParallaxMode) {
          // 视觉差模式：上圆变绿
          element.classList.add('correct');
        } else if (this.isBumpyMode) {
          // 凹凸模式：选中后 A1(B1+B2 两三角) 与 C 全部变绿；并停掉动模式下的 fill 渐变动画
          var bsvg = element.querySelector('svg');
          if (bsvg) {
            var bpolys = bsvg.querySelectorAll('polygon');
            for (var bpi = 0; bpi < bpolys.length; bpi++) {
              var ban = bpolys[bpi].querySelector('animate');
              if (ban) bpolys[bpi].removeChild(ban);
              bpolys[bpi].setAttribute('fill', '#4CAF50');
            }
          }
        } else {
          element.classList.add('correct');
        }
        
        // 混乱模式下，停止已选中数字的动画
        var numberSpan = element.querySelector('.number-text');
        if (numberSpan && this.currentMode === 'chaos') {
          numberSpan.style.animation = 'none';
          numberSpan.classList.remove('chaos-mode');
        }
        // 散布模式混乱：停止 scatter-cell 的摆动动画
        if (this.voidMode === 2 && this.currentMode === 'chaos' && element.classList.contains('scatter-cell')) {
          element.style.animation = 'none';
          element.classList.remove('chaos-mode');
        }
        // 变体模式混乱：停止SVG文字摆动
        if (this.isVariantMode && this.currentMode === 'chaos') {
          var vTxt = element.querySelector('.variant-text');
          if (vTxt) {
            vTxt.style.animation = 'none';
            vTxt.classList.remove('chaos-mode');
          }
        }
        // 毁灭5模式混乱：停止SVG文字摆动
        if (this.destroyMode === 5 && this.currentMode === 'chaos') {
          var d5Txt = element.querySelector('text');
          if (d5Txt) {
            d5Txt.style.animation = 'none';
            d5Txt.classList.remove('chaos-mode');
          }
        }

        this.playSound('correct');

        var total = this.getTotalNumbers();

        if (this.currentNumber === this.getMaxNumber()) {
          this.completeGame();
        } else {
          this.currentNumber += this.getNumberStep();
          this.updateUI();
        }
      };

      SchulteGridGame.prototype.handleWrongClick = function(element) {
        // 变体模式：菱形闪红 + 抖动动画
        if (this.isVariantMode) {
          var vTopW = element.querySelector('.variant-top');
          var origFill = vTopW ? vTopW.getAttribute('fill') : '';
          if (vTopW) vTopW.setAttribute('fill', '#FF6B6B');
          element.style.animation = 'mosaicShake 0.3s ease';
          this.playSound('wrong');
          var selfElW = element;
          var topElW = vTopW;
          setTimeout(function() {
            if (topElW) topElW.setAttribute('fill', origFill);
            if (selfElW) selfElW.style.animation = '';
          }, 400);
        } else if ((this.voidMode || this.circularDestroy > 0) && this.isCircularMode) {
          var vp = element.querySelector('.sector');
          var vt = element.querySelector('.sector-text');
          // ★ 先保存原始内联样式，再设置红色（否则保存的就是红色）
          var origFill = vp ? vp.style.fill : '';
          var origStroke = vp ? vp.style.stroke : '';
          var origTextFill = vt ? vt.style.fill : '';
          var origTextStroke = vt ? vt.style.stroke : '';
          var origTextWeight = vt ? vt.style.fontWeight : '';
          if (vp) {
            vp.style.animation = 'none';
            vp.style.fill = '#FF5252';
          }
          if (vt) {
            vt.style.fill = '#ffffff';
            vt.style.stroke = '#ffffff';
            vt.style.fontWeight = '800';
          }
          var self = this;
          var wasVoid = this.voidMode;
          this.playSound('wrong');
          setTimeout(function() {
            if (vp) {
              vp.style.animation = '';
              vp.style.fill = origFill;
              vp.style.stroke = origStroke;
              if (wasVoid) {
                var layerIdx = parseInt(element.getAttribute('data-layer') || '0');
                vp.setAttribute('class', 'sector ring-cycle-' + (layerIdx + 1));
              }
            }
            if (vt) {
              vt.style.fill = origTextFill;
              vt.style.stroke = origTextStroke;
              vt.style.fontWeight = origTextWeight;
            }
          }, 400);
        } else if (this.voidMode === 2 && !this.isVariantMode && !this.isCircularMode) {
          // 虚无2散布模式：闪红+抖动后恢复
          var origBg2 = element.style.background;
          var origColor2 = element.style.color;
          element.style.background = '#FF6B6B';
          element.style.color = '#ffffff';
          element.style.animation = 'shake 0.4s ease';
          this.playSound('wrong');
          var elW2 = element;
          setTimeout(function() {
            elW2.style.background = origBg2;
            elW2.style.color = origColor2;
            elW2.style.animation = '';
          }, 400);
        } else if (this.isSquareMoveMode) {
          // 方形（动）模式：闪红+抖动后恢复（只影响点击的那个格子）
          var smOrigBg = element.style.background;
          var smOrigBorder = element.style.borderColor;
          element.style.background = '#FF5252';
          element.style.borderColor = '#FF5252';
          element.style.animation = 'shake 0.4s ease';
          this.playSound('wrong');
          var smEl = element;
          setTimeout(function() {
            smEl.style.background = smOrigBg;
            smEl.style.borderColor = smOrigBorder;
            smEl.style.animation = '';
          }, 400);
        } else if (this.isVisualParallaxMode) {
          // 视觉差模式：闪红+抖动后恢复
          element.classList.add('wrong');
          element.style.animation = 'shake 0.4s ease';
          this.playSound('wrong');
          var vpEl = element;
          setTimeout(function() {
            vpEl.classList.remove('wrong');
            vpEl.style.animation = '';
          }, 400);
        } else {
          element.classList.add('wrong');
          setTimeout(function() {
            element.classList.remove('wrong');
          }, 400);
        }
      };

      SchulteGridGame.prototype.completeGame = function() {
        this.isPlaying = false;
        this.stopTimer();
        if (this._squareMoveBothTimer) {
          clearTimeout(this._squareMoveBothTimer);
          this._squareMoveBothTimer = null;
        }
        this.playSound('complete');

        var elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
        var timeStr = this.formatTime(elapsedTime);

        document.getElementById('result-time').textContent = timeStr;

        var total = this.getTotalNumbers();
        var avgTime = (elapsedTime / total).toFixed(2);
        var evaluation = this.evaluatePerformance(elapsedTime, total);

        var difficultyStr;
        var ntLabel = this.numberType === 'odd' ? '奇数' : (this.numberType === 'even' ? '偶数' : '自然数');
        if (this.isCircularMode) {
          difficultyStr = '圆形模式 (' + total + '个' + ntLabel + ')';
        } else if (this.isVariantMode) {
          difficultyStr = '变体模式 (' + total + '个' + ntLabel + ')';
        } else if (this.isSquareMoveMode) {
          difficultyStr = (this.squareMoveDirection === 3 ? '方形（横纵）' : (this.squareMoveDirection === 2 ? '方形（纵）' : '方形（横）')) + '(' + total + '个' + ntLabel + ')';
        } else if (this.isVisualParallaxMode) {
          difficultyStr = '视差' + (this.vpSubMode === 2 ? '（动）' : '（静）') + ' (' + total + '个' + ntLabel + ')';
        } else if (this.isBumpyMode) {
          difficultyStr = '凹凸' + (this.bumpySubMode === 2 ? '（动）' : '（静）') + ' (' + total + '个' + ntLabel + ')';
        } else {
          difficultyStr = '难度: ' + this.gridSize + '×' + this.gridSize + ' (' + total + '个' + ntLabel + ')';
        }

        document.getElementById('result-info').innerHTML =
          difficultyStr + '<br>' +
          '平均每个数字: ' + avgTime + '秒<br>' +
          '评价: ' + evaluation;

        document.getElementById('result-overlay').classList.add('show');
      };

      SchulteGridGame.prototype.evaluatePerformance = function(totalTime, totalNumbers) {
        var avgTime = totalTime / totalNumbers;
        var evaluation = '';

        if (this.gridSize === 3) {
          if (avgTime < 0.5) evaluation = '🌟 非常优秀!';
          else if (avgTime < 0.8) evaluation = '👍 优秀!';
          else if (avgTime < 1.2) evaluation = '😊 良好';
          else if (avgTime < 1.8) evaluation = '💪 继续加油';
          else evaluation = '🔄 多加练习';
        } else if (this.gridSize === 4) {
          if (avgTime < 0.6) evaluation = '🌟 非常优秀!';
          else if (avgTime < 0.9) evaluation = '👍 优秀!';
          else if (avgTime < 1.4) evaluation = '😊 良好';
          else if (avgTime < 2.0) evaluation = '💪 继续加油';
          else evaluation = '🔄 多加练习';
        } else if (this.gridSize === 5) {
          if (avgTime < 0.7) evaluation = '🌟 非常优秀!';
          else if (avgTime < 1.1) evaluation = '👍 优秀!';
          else if (avgTime < 1.6) evaluation = '😊 良好';
          else if (avgTime < 2.3) evaluation = '💪 继续加油';
          else evaluation = '🔄 多加练习';
        } else if (this.gridSize === 6) {
          if (avgTime < 0.8) evaluation = '🌟 非常优秀!';
          else if (avgTime < 1.3) evaluation = '👍 优秀!';
          else if (avgTime < 1.9) evaluation = '😊 良好';
          else if (avgTime < 2.6) evaluation = '💪 继续加油';
          else evaluation = '🔄 多加练习';
        } else {
          if (avgTime < 0.9) evaluation = '🌟 非常优秀!';
          else if (avgTime < 1.5) evaluation = '👍 优秀!';
          else if (avgTime < 2.1) evaluation = '😊 良好';
          else if (avgTime < 2.9) evaluation = '💪 继续加油';
          else evaluation = '🔄 多加练习';
        }

        return evaluation;
      };

      SchulteGridGame.prototype.updateUI = function() {
        var total = this.getTotalNumbers();
        document.getElementById('progress').textContent = this.getFoundCount() + '/' + total;
      };

      SchulteGridGame.prototype.startTimer = function() {
        var self = this;
        this.timerInterval = setInterval(function() {
          var elapsed = Math.floor((Date.now() - self.startTime) / 1000);
          document.getElementById('timer').textContent = self.formatTime(elapsed);
        }, 100);
      };

      SchulteGridGame.prototype.stopTimer = function() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
      };

      SchulteGridGame.prototype.formatTime = function(seconds) {
        var mins = Math.floor(seconds / 60);
        var secs = seconds % 60;
        return (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
      };

      SchulteGridGame.prototype.closeResult = function() {
        document.getElementById('result-overlay').classList.remove('show');
      };

      SchulteGridGame.prototype.initAudio = function() {
        try {
          window.AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioContext = new AudioContext();
        } catch (e) {
          console.log('Web Audio API 不支持');
        }
      };

      SchulteGridGame.prototype.playSound = function(type) {
        if (!this.audioContext) {
          return;
        }

        try {
          var oscillator = this.audioContext.createOscillator();
          var gainNode = this.audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(this.audioContext.destination);

          if (type === 'start') {
            oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(659.25, this.audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.2);
          } else if (type === 'correct') {
            oscillator.frequency.setValueAtTime(440, this.audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.1);
          } else if (type === 'wrong') {
            oscillator.frequency.setValueAtTime(200, this.audioContext.currentTime);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.15);
          } else if (type === 'complete') {
            oscillator.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(659.25, this.audioContext.currentTime + 0.15);
            oscillator.frequency.exponentialRampToValueAtTime(783.99, this.audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.5);
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.5);
          }
        } catch (e) {
          console.log('播放音效失败', e);
        }
      };

      // ========== 圆形模式方法 ==========

      SchulteGridGame.prototype.getCircularRingConfig = function() {
        var size = this.gridSize;
        var configs = {
          3: { // 入门: 2层, 10格
            rings: [{ count: 4, fontSize: 34 }, { count: 6, fontSize: 34 }]
          },
          4: { // 初级: 2层, 20格
            rings: [{ count: 8, fontSize: 32 }, { count: 12, fontSize: 34 }]
          },
          5: { // 中级: 3层, 30格 (默认)
            rings: [{ count: 6, fontSize: 34 }, { count: 10, fontSize: 34 }, { count: 14, fontSize: 34 }]
          },
          6: { // 高级: 3层, 40格
            rings: [{ count: 6, fontSize: 30 }, { count: 12, fontSize: 30 }, { count: 22, fontSize: 30 }]
          },
          7: { // 专家: 4层, 60格
            rings: [{ count: 6, fontSize: 22 }, { count: 12, fontSize: 26 }, { count: 18, fontSize: 28 }, { count: 24, fontSize: 26 }]
          }
        };
        return configs[size] || configs[5];
      };

      SchulteGridGame.prototype.getTotalNumbers = function() {
        if (this.isCircularMode) {
          var config = this.getCircularRingConfig();
          var total = 0;
          for (var i = 0; i < config.rings.length; i++) {
            total += config.rings[i].count;
          }
          return total;
        }
        if (this.isBounceMode) return this._bounceGetTotal();
        if (this.isVariantMode) return this.variantNumbers.length;
        return this.gridSize * this.gridSize;
      };

      SchulteGridGame.prototype.getNumberStart = function() {
        return this.numberType === 'even' ? 2 : 1;
      };
      SchulteGridGame.prototype.getNumberStep = function() {
        return this.numberType === 'natural' ? 1 : 2;
      };
      SchulteGridGame.prototype.getNumberByIndex = function(i) {
        return this.getNumberStart() + i * this.getNumberStep();
      };
      SchulteGridGame.prototype.getMaxNumber = function() {
        var t = this.getTotalNumbers();
        return this.getNumberStart() + (t - 1) * this.getNumberStep();
      };
      SchulteGridGame.prototype.getFoundCount = function() {
        return Math.round((this.currentNumber - this.getNumberStart()) / this.getNumberStep());
      };
      SchulteGridGame.prototype.updateStartButtonText = function() {
        var btn = document.getElementById('start-btn');
        if (!btn) return;
        var ntLabel = this.numberType === 'odd' ? '奇数' : (this.numberType === 'even' ? '偶数' : '自然数');
        var startNum = this.getNumberStart();
        var maxNum = this.getMaxNumber();
        btn.textContent = ntLabel + ' 从' + startNum + '找到' + maxNum + ' 开始游戏';
      };

      SchulteGridGame.prototype.sectorPath = function(cx, cy, r1, r2, startDeg, endDeg) {
        var toRad = function(d) { return (d - 90) * Math.PI / 180; };
        var s = toRad(startDeg), e = toRad(endDeg);
        var large = (endDeg - startDeg) > 180 ? 1 : 0;
        var ox1 = cx + r2 * Math.cos(s), oy1 = cy + r2 * Math.sin(s);
        var ox2 = cx + r2 * Math.cos(e), oy2 = cy + r2 * Math.sin(e);
        if (r1 === 0) {
          return 'M ' + cx + ' ' + cy +
                 ' L ' + ox1.toFixed(2) + ' ' + oy1.toFixed(2) +
                 ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 1 ' + ox2.toFixed(2) + ' ' + oy2.toFixed(2) +
                 ' Z';
        }
        var ix1 = cx + r1 * Math.cos(s), iy1 = cy + r1 * Math.sin(s);
        var ix2 = cx + r1 * Math.cos(e), iy2 = cy + r1 * Math.sin(e);
        return 'M ' + ix1.toFixed(2) + ' ' + iy1.toFixed(2) +
               ' A ' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + ix2.toFixed(2) + ' ' + iy2.toFixed(2) +
               ' L ' + ox2.toFixed(2) + ' ' + oy2.toFixed(2) +
               ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 0 ' + ox1.toFixed(2) + ' ' + oy1.toFixed(2) +
               ' Z';
      };

      SchulteGridGame.prototype.renderCircularGrid = function() {
        var svg = document.getElementById('circular-svg');
        svg.innerHTML = '';

        // 添加文字阴影滤镜（模拟方形格子的 box-shadow）
        var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
