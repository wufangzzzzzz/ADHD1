<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>经典迷宫</title>
<style>
:root{
  --bg:#ffffff; --panel:#f5f6fa; --text:#1a1a2e; --muted:#5a6072;
  --wall:#2b2b2b; --path:#f4f4f8; --visited:#cfe3fb; --cur:#1565c0;
  --start:#2e7d32; --end:#f9a825; --accent:#1565c0; --border:#d8dce6;
  --danger:#e53935; --line:#1565c0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;
}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:10px 14px;gap:8px;}
.topbar{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.back-btn{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
.title{flex:1;font-size:18px;font-weight:600;text-align:center;}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;justify-content:center;}
.diff-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.diff-btn{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;}
.diff-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.print-btn{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;}
.stop-btn{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;}
.stop-btn:disabled{opacity:.5;cursor:not-allowed;}
.stop-btn.running{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.stats{display:flex;gap:14px;justify-content:center;flex-shrink:0;font-size:14px;color:var(--muted);flex-wrap:wrap;}
.stats b{color:var(--text);font-size:16px;}
.hint{flex-shrink:0;text-align:center;font-size:13px;color:var(--muted);min-height:18px;}
.maze-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
canvas{touch-action:none;background:var(--bg);border-radius:10px;border:1px solid var(--border);cursor:crosshair;max-width:100%;max-height:100%;}
.result-card{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
.result-card.show{display:flex;}
.result-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;width:min(92vw,420px);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.2);}
.result-box h2{margin:0 0 14px;font-size:20px;text-align:center;}
.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px;}
.result-row span:last-child{font-weight:600;}
.result-text{margin:14px 0;font-size:14px;line-height:1.6;color:var(--muted);}
.result-actions{display:flex;gap:10px;margin-top:8px;}
.result-actions .btn{flex:1;text-align:center;}
.result-actions .stop-btn{flex:1;text-align:center;}

/* ===== 嵌入模式 ===== */
html.embed-mode,body.embed-mode{height:100%;overflow:hidden;}
body.embed-mode{padding:0;background:#0f1226;}
.embed-mode .app{padding:0;gap:0;height:100vh;}
.embed-mode .topbar,.embed-mode .controls,.embed-mode .result-card{display:none!important;}
.embed-mode .stats{
  flex:0 0 auto;height:32px;display:flex;align-items:center;gap:16px;
  justify-content:center;background:linear-gradient(135deg,#1b1f3b,#2a2f5a);
  color:rgba(255,255,255,.8);font-size:13px;padding:0 8px;
}
.embed-mode .stats b{color:#FFD700;font-size:14px;}
.embed-mode .hint{
  flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:center;
  background:#1b1f3b;color:rgba(255,255,255,.5);font-size:11px;padding:0;
}
.embed-mode .maze-wrap{
  flex:1 1 auto;min-height:0;padding:8px;
}
.embed-mode canvas{
  background:#fff;border:1px solid rgba(255,255,255,.1);
  border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.3);
}
@media (max-width:480px){
  .title{font-size:15px;}
  .app{padding:8px 10px;gap:6px;}
  .stats{font-size:12px;gap:10px;}
  .diff-btn{padding:6px 9px;font-size:12px;}
}
@media print{
  .no-print{display:none!important;}
  .topbar,.controls,.stats,.hint{display:none!important;}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;margin:0!important;}
  .app{height:100vh!important;min-height:100vh!important;overflow:visible!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;padding:16px!important;gap:0!important;}
  .maze-wrap{flex:0 0 auto!important;width:100%!important;height:auto!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:visible!important;}
  canvas{background:#fff!important;width:100%!important;height:auto!important;max-width:100%!important;max-height:none!important;border:1px solid #999!important;border-radius:0!important;}
  .result-card{display:none!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back-btn no-print" onclick="location.href='index.html'">返回</button>
    <div class="title">经典迷宫</div>
  </div>
  <div class="controls no-print">
    <div class="diff-group" id="diffGroup">
      <button class="diff-btn" data-size="8">简单 8×8</button>
      <button class="diff-btn active" data-size="12">中等 12×12</button>
      <button class="diff-btn" data-size="16">困难 16×16</button>
      <button class="diff-btn" data-size="20">专家 20×20</button>
      <button class="diff-btn" data-size="80">极限 80×80</button>
    </div>
    <button class="btn" id="newBtn" onclick="newGame()">新迷宫</button>
    <button class="print-btn" onclick="window.print()">打印</button>
    <button class="stop-btn" id="stopBtn" onclick="stopGame()" disabled>停止训练</button>
  </div>
  <div class="stats">
    <div>用时 <b id="timeVal">0.0</b>s</div>
    <div>步数 <b id="stepVal">0</b></div>
    <div>最优 <b id="bestVal">–</b></div>
  </div>
  <div class="hint" id="hint">点「新迷宫」开始，从绿色起点按住拖到金色终点</div>
  <div class="maze-wrap" id="mazeWrap">
    <canvas id="maze"></canvas>
  </div>
</div>
<div class="result-card no-print" id="resultCard">
  <div class="result-box">
    <h2>🎉 走出迷宫！</h2>
    <div class="result-row"><span>用时</span><span id="rTime">–</span></div>
    <div class="result-row"><span>你的步数</span><span id="rStep">–</span></div>
    <div class="result-row"><span>最优步数</span><span id="rBest">–</span></div>
    <div class="result-row"><span>路线效率</span><span id="rEff">–</span></div>
    <div class="result-text" id="rText"></div>
    <div class="result-actions">
      <button class="btn" onclick="newGame()">再来一局</button>
      <button class="stop-btn" onclick="closeResult()">关闭</button>
    </div>
  </div>
</div>
<script>
const canvas=document.getElementById('maze');
const ctx=canvas.getContext('2d');
const mazeWrap=document.getElementById('mazeWrap');
let N=12;
let grid=[];
let trail=[{r:0,c:0}];
let start={r:0,c:0};
let end={r:0,c:0};
let steps=0, best=0;
let running=false, finished=false;
let startTime=0, timerId=null;
let timerStarted=false;
let cs=20;
let audioCtx=null;
let isDrawing=false;

/* ===== 嵌入模式 ===== */
var isEmbed=false,embedSide='L',embedGrid=null,embedN=12;
(function setupEmbed(){
  var params=new URLSearchParams(location.search);
  if(!params.has('embed'))return;
  isEmbed=true;
  embedSide=params.get('side')||'L';
  document.body.classList.add('embed-mode');

  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.cmd==='config'){
      embedGrid=d.grid||null;
      embedN=d.size||12;
      N=embedN;
      loadEmbedMaze();
      resize();
      document.getElementById('timeVal').textContent='0.0';
      document.getElementById('stepVal').textContent='0';
      document.getElementById('bestVal').textContent=best;
      document.getElementById('hint').textContent='等待开始…';
      running=false;finished=false;
    }else if(d.cmd==='start'){
      initAudio();
      running=true;finished=false;
      trail=[{r:0,c:0}];
      steps=0;
      timerStarted=false;
      stopTimer();
      document.getElementById('stepVal').textContent='0';
      document.getElementById('timeVal').textContent='0.0';
      document.getElementById('hint').textContent='从绿色起点拖到金色终点';
      resize();
    }else if(d.cmd==='reset'){
      running=false;finished=false;
      stopTimer();
      document.getElementById('timeVal').textContent='0.0';
      document.getElementById('stepVal').textContent='0';
      document.getElementById('hint').textContent='等待开始…';
      if(embedGrid){loadEmbedMaze();resize();}
    }
  });
  window.addEventListener('resize',function(){if(grid.length)resize();});
  try{window.parent.postMessage({cmd:'ready',side:embedSide},'*');}catch(e){}
})();

function loadEmbedMaze(){
  if(!embedGrid)return;
  N=embedN;
  grid=[];
  for(var r=0;r<N;r++){
    var row=[];
    for(var c=0;c<N;c++){
      var cell=embedGrid[r][c];
      row.push({N:cell.N,S:cell.S,E:cell.E,W:cell.W,visited:false});
    }
    grid.push(row);
  }
  start={r:0,c:0};
  end={r:N-1,c:N-1};
  best=bfsShortest(N);
  trail=[{r:0,c:0}];
}

function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function beep(freq,dur,type){
  if(!audioCtx)return;
  var o=audioCtx.createOscillator();
  var g=audioCtx.createGain();
  o.type=type||'sine';
  o.frequency.value=freq;
  o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.2,audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur);
}

function colors(){
  return{bg:'#ffffff',wall:'#2b2b2b',path:'#f4f4f8',visited:'#cfe3fb',cur:'#1565c0',start:'#2e7d32',end:'#f9a825',line:'#1565c0'};
}

function generateMaze(n){
  grid=[];
  for(var r=0;r<n;r++){
    var row=[];
    for(var c=0;c<n;c++)row.push({N:true,S:true,E:true,W:true,visited:false});
    grid.push(row);
  }
  var stack=[{r:0,c:0}];
  grid[0][0].visited=true;
  var dirs=[
    {dr:-1,dc:0,k:'N',opp:'S'},
    {dr:1,dc:0,k:'S',opp:'N'},
    {dr:0,dc:1,k:'E',opp:'W'},
    {dr:0,dc:-1,k:'W',opp:'E'}
  ];
  while(stack.length){
    var curCell=stack[stack.length-1];
    var nb=[];
    for(var i=0;i<dirs.length;i++){
      var d=dirs[i];
      var nr=curCell.r+d.dr,nc=curCell.c+d.dc;
      if(nr>=0&&nr<n&&nc>=0&&nc<n&&!grid[nr][nc].visited)nb.push({nr:nr,nc:nc,d:d});
    }
    if(nb.length===0){stack.pop();continue;}
    var pick=nb[Math.floor(Math.random()*nb.length)];
    grid[curCell.r][curCell.c][pick.d.k]=false;
    grid[pick.nr][pick.nc][pick.d.opp]=false;
    grid[pick.nr][pick.nc].visited=true;
    stack.push({r:pick.nr,c:pick.nc});
  }
  start={r:0,c:0};
  end={r:n-1,c:n-1};
  best=bfsShortest(n);
}

function bfsShortest(n){
  var dist=[];
  for(var i=0;i<n;i++)dist.push(new Array(n).fill(-1));
  var q=[[0,0]];
  dist[0][0]=0;
  while(q.length){
    var pt=q.shift();
    var r=pt[0],c=pt[1];
    if(r===n-1&&c===n-1)return dist[r][c];
    var dirs=[{dr:-1,dc:0,k:'N'},{dr:1,dc:0,k:'S'},{dr:0,dc:1,k:'E'},{dr:0,dc:-1,k:'W'}];
    for(var i=0;i<dirs.length;i++){
      var d=dirs[i];
      if(!grid[r][c][d.k]){
        var nr=r+d.dr,nc=c+d.dc;
        if(nr>=0&&nr<n&&nc>=0&&nc<n&&dist[nr][nc]===-1){
          dist[nr][nc]=dist[r][c]+1;
          q.push([nr,nc]);
        }
      }
    }
  }
  return n*n;
}

function resize(){
  var availW=mazeWrap.clientWidth-4;
  var availH=mazeWrap.clientHeight-4;
  var avail=Math.max(40,Math.min(availW,availH));
  cs=Math.floor(avail/(N+0.4));
  if(cs<5)cs=5;
  canvas.width=cs*N;
  canvas.height=cs*N;
  draw();
}

function draw(){
  if(!grid.length)return;
  var col=colors();
  ctx.fillStyle=col.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  var head=trail[trail.length-1];
  var tset={};
  trail.forEach(function(p){tset[p.r*N+p.c]=true;});
  for(var r=0;r<N;r++){
    for(var c=0;c<N;c++){
      var x=c*cs,y=r*cs;
      var fill=col.path;
      if(r===head.r&&c===head.c)fill=col.cur;
      else if(tset[r*N+c])fill=col.visited;
      ctx.fillStyle=fill;
      ctx.fillRect(x,y,cs,cs);
    }
  }
  ctx.strokeStyle=col.wall;
  ctx.lineWidth=Math.max(2,cs*0.12);
  ctx.lineCap='round';
  for(var r=0;r<N;r++){
    for(var c=0;c<N;c++){
      var x=c*cs,y=r*cs;
      if(grid[r][c].N){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+cs,y);ctx.stroke();}
      if(grid[r][c].W){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+cs);ctx.stroke();}
      if(r===N-1&&grid[r][c].S){ctx.beginPath();ctx.moveTo(x,y+cs);ctx.lineTo(x+cs,y+cs);ctx.stroke();}
      if(c===N-1&&grid[r][c].E){ctx.beginPath();ctx.moveTo(x+cs,y);ctx.lineTo(x+cs,y+cs);ctx.stroke();}
    }
  }
  if(trail.length>1){
    ctx.strokeStyle=col.line;
    ctx.lineWidth=Math.max(2,cs*0.18);
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();
    trail.forEach(function(p,i){
      var x=p.c*cs+cs/2,y=p.r*cs+cs/2;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  ctx.fillStyle=col.start;
  var sx=start.c*cs,sy=start.r*cs;
  ctx.beginPath();ctx.arc(sx+cs/2,sy+cs/2,cs*0.28,0,7);ctx.fill();
  ctx.fillStyle=col.end;
  var ex=end.c*cs,ey=end.r*cs;
  ctx.beginPath();ctx.arc(ex+cs/2,ey+cs/2,cs*0.28,0,7);ctx.fill();
}

function headPos(){return trail[trail.length-1];}
function canPass(a,b){
  var dr=b.r-a.r,dc=b.c-a.c;
  if(dr===-1&&dc===0)return!grid[a.r][a.c].N;
  if(dr===1&&dc===0)return!grid[a.r][a.c].S;
  if(dr===0&&dc===1)return!grid[a.r][a.c].E;
  if(dr===0&&dc===-1)return!grid[a.r][a.c].W;
  return false;
}
function stepForward(nr,nc){
  if(!running||finished)return;
  ensureTimer();
  var h=headPos();
  if(nr<0||nr>=N||nc<0||nc>=N)return;
  if(Math.abs(nr-h.r)+Math.abs(nc-h.c)!==1)return;
  if(!canPass(h,{r:nr,c:nc}))return;
  trail.push({r:nr,c:nc});
  steps++;
  document.getElementById('stepVal').textContent=steps;
  beep(520,0.05);
  if(nr===end.r&&nc===end.c){draw();finish();return;}
  draw();
}
function stepBack(){
  if(!running||finished)return;
  if(trail.length<=1)return;
  trail.pop();
  steps=Math.max(0,steps-1);
  document.getElementById('stepVal').textContent=steps;
  beep(300,0.04);
  draw();
}

function finish(){
  finished=true;
  running=false;
  isDrawing=false;
  stopTimer();
  if(!isEmbed){
    var sb=document.getElementById('stopBtn');
    sb.classList.remove('running');
    sb.disabled=true;
  }
  beep(784,0.18,'triangle');
  setTimeout(function(){beep(1046,0.2,'triangle');},120);
  var t=(performance.now()-startTime)/1000;
  if(isEmbed){
    try{window.parent.postMessage({cmd:'done',side:embedSide,time:t,steps:steps},'*');}catch(e){}
    document.getElementById('hint').textContent='到达终点！用时 '+t.toFixed(1)+'s · '+steps+'步';
  }else{
    var eff=steps>0?(best/steps*100):0;
    document.getElementById('rTime').textContent=t.toFixed(1)+'s';
    document.getElementById('rStep').textContent=steps;
    document.getElementById('rBest').textContent=best;
    document.getElementById('rEff').textContent=eff.toFixed(0)+'%';
    document.getElementById('rText').textContent=buildInterpret(t,steps,best,eff);
    document.getElementById('resultCard').classList.add('show');
  }
  draw();
}

function buildInterpret(t,steps,best,eff){
  var s='';
  if(steps===best)s='完美路线！一步不绕，空间规划能力极佳。';
  else if(steps<=best*1.2)s='高效通关，仅有极少量绕路，规划不错。';
  else if(steps<=best*1.6)s='中等效率，绕路偏多，可先观察整体结构再走。';
  else s='绕路明显，说明边走边试。建议先看清主通道再出发。';
  if(t<best*0.8)s+='  速度也很快。';
  else if(t>best*2)s+=' 用时偏长，熟练度可继续提升。';
  return s;
}

function startTimer(){
  startTime=performance.now();
  timerId=setInterval(function(){
    var t=(performance.now()-startTime)/1000;
    document.getElementById('timeVal').textContent=t.toFixed(1);
  },100);
}
function ensureTimer(){
  if(timerStarted)return;
  timerStarted=true;
  startTimer();
}
function stopTimer(){
  if(timerId){clearInterval(timerId);timerId=null;}
}

function newGame(){
  initAudio();
  var act=document.querySelector('.diff-btn.active');
  N=parseInt(act.dataset.size);
  generateMaze(N);
  trail=[{r:0,c:0}];
  steps=0;
  finished=false;
  running=true;
  isDrawing=false;
  document.getElementById('stepVal').textContent='0';
  document.getElementById('bestVal').textContent=best;
  document.getElementById('timeVal').textContent='0.0';
  document.getElementById('hint').textContent='从绿色起点按住拖到金色终点（也可点相邻格或方向键）';
  var sb=document.getElementById('stopBtn');
  sb.disabled=false;
  sb.classList.add('running');
  document.getElementById('resultCard').classList.remove('show');
  stopTimer();
  timerStarted=false;
  resize();
}

function stopGame(){
  if(!running)return;
  running=false;
  finished=true;
  isDrawing=false;
  stopTimer();
  var sb=document.getElementById('stopBtn');
  sb.classList.remove('running');
  sb.disabled=true;
  document.getElementById('hint').textContent='已停止。点「新迷宫」重新开始。';
}

function closeResult(){
  document.getElementById('resultCard').classList.remove('show');
}

function cellFromEvent(e){
  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX-rect.left)*(canvas.width/rect.width);
  var y=(e.clientY-rect.top)*(canvas.height/rect.height);
  var c=Math.floor(x/cs),r=Math.floor(y/cs);
  if(r<0||r>=N||c<0||c>=N)return null;
  return{r:r,c:c};
}
function pointerDown(e){
  initAudio();
  if(!running||finished)return;
  var cell=cellFromEvent(e);if(!cell)return;
  var h=headPos();
  if(cell.r===h.r&&cell.c===h.c){isDrawing=true;return;}
  if(Math.abs(cell.r-h.r)+Math.abs(cell.c-h.c)===1&&canPass(h,cell)){
    isDrawing=true;stepForward(cell.r,cell.c);return;
  }
}
function pointerMove(e){
  if(!isDrawing||!running||finished)return;
  var cell=cellFromEvent(e);if(!cell)return;
  var h=headPos();
  if(cell.r===h.r&&cell.c===h.c)return;
  if(trail.length>=2){
    var prev=trail[trail.length-2];
    if(cell.r===prev.r&&cell.c===prev.c){stepBack();return;}
  }
  if(Math.abs(cell.r-h.r)+Math.abs(cell.c-h.c)===1&&canPass(h,cell)){
    stepForward(cell.r,cell.c);
  }
}
function pointerUp(){isDrawing=false;}

canvas.addEventListener('pointerdown',pointerDown);
canvas.addEventListener('pointermove',pointerMove);
window.addEventListener('pointerup',pointerUp);
canvas.addEventListener('pointercancel',pointerUp);

window.addEventListener('keydown',function(e){
  if(!running)return;
  var h=headPos();
  if(e.key==='ArrowUp')stepForward(h.r-1,h.c);
  else if(e.key==='ArrowDown')stepForward(h.r+1,h.c);
  else if(e.key==='ArrowLeft')stepForward(h.r,h.c-1);
  else if(e.key==='ArrowRight')stepForward(h.r,h.c+1);
});

if(!isEmbed){
  document.getElementById('diffGroup').addEventListener('click',function(e){
    var b=e.target.closest('.diff-btn');
    if(!b)return;
    document.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    if(running||finished)newGame();
  });
  window.addEventListener('resize',function(){if(grid.length)resize();});
  newGame();
}
</script>
</body>
</html>
