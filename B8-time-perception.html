<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>时间感知训练 - 比长短</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  background:#0A1622;
  color:#EDE7F6;
  display:flex;align-items:center;justify-content:center;
  height:100dvh;
  user-select:none;-webkit-user-select:none;
}
.container{display:flex;gap:16px;width:min(98vw,1100px);height:min(96vh,680px);padding:12px;}
/* ===== 左面板 ===== */
.left-panel{
  width:270px;min-width:270px;
  background:rgba(179,136,255,0.04);
  border-radius:16px;padding:14px 12px;
  display:flex;flex-direction:column;gap:8px;
  border:1px solid rgba(179,136,255,0.1);
  overflow-y:auto;
}
.panel-title{color:#B388FF;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.diff-group{margin-bottom:2px;}
.diff-label{color:rgba(237,231,246,0.45);font-size:11px;margin-bottom:3px;}
.diff-btns{display:flex;gap:5px;}
.diff-btn{
  flex:1;padding:6px 0;border-radius:8px;
  border:1px solid rgba(237,231,246,0.1);
  background:rgba(237,231,246,0.03);
  color:rgba(237,231,246,0.55);
  font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center;
}
.diff-btn:hover{background:rgba(179,136,255,0.08);}
.diff-btn.active{background:linear-gradient(135deg,#B388FF,#7C4DFF);border-color:transparent;color:#1a0b2e;font-weight:800;}
.age-switch{display:flex;gap:6px;}
.age-btn{
  flex:1;padding:7px 0;border-radius:8px;
  border:1px solid rgba(237,231,246,0.1);
  background:rgba(237,231,246,0.03);
  color:rgba(237,231,246,0.55);
  font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center;
}
.age-btn.active{background:rgba(179,136,255,0.15);border-color:#B388FF;color:#B388FF;}
.diff-btn:disabled,.age-btn:disabled{opacity:0.35;cursor:not-allowed;pointer-events:none;}
.params-row{display:flex;gap:6px;flex-wrap:wrap;}
.param-tag{background:rgba(237,231,246,0.04);padding:3px 8px;border-radius:6px;color:rgba(237,231,246,0.45);font-size:10px;font-family:'JetBrains Mono',monospace;}
.guide-card{background:rgba(179,136,255,0.04);border-radius:10px;padding:10px;border:1px solid rgba(179,136,255,0.1);}
.guide-title{color:#B388FF;font-size:11px;font-weight:700;margin-bottom:4px;}
.guide-text{color:rgba(237,231,246,0.5);font-size:10px;line-height:1.6;}
.guide-text b{color:rgba(237,231,246,0.85);}
.stat-box{background:rgba(237,231,246,0.03);border-radius:8px;padding:8px 10px;}
.stat-row{display:flex;justify-content:space-between;padding:2px 0;font-size:11px;}
.stat-row .sl{color:rgba(237,231,246,0.45);}
.stat-row .sv{color:#B388FF;font-family:'JetBrains Mono',monospace;font-weight:700;}
/* ===== 右面板 ===== */
.right-panel{
  flex:1;background:rgba(179,136,255,0.03);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;border:1px solid rgba(179,136,255,0.08);min-width:0;overflow:hidden;
}
.game-header{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
.game-title{color:#EDE7F6;font-size:18px;font-weight:800;}
.back-btn{background:rgba(237,231,246,0.06);border:none;color:rgba(237,231,246,0.5);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:all 0.2s;}
.back-btn:hover{background:rgba(237,231,246,0.12);}
.game-area{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}
/* 舞台：阶段文字 + 方块垂直堆叠，避免文字压入方块 */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
/* 阶段文字：位于方块上方，不压入方块内部 */
.phase-label{font-size:15px;font-weight:700;color:rgba(237,231,246,0.7);letter-spacing:0.05em;text-align:center;}
/* 时长方块 */
.time-block{
  position:relative;
  width:clamp(130px,32vmin,210px);height:clamp(130px,32vmin,210px);
  border-radius:26px;background:rgba(179,136,255,0.06);
  border:2px solid rgba(179,136,255,0.18);
  display:flex;align-items:center;justify-content:center;
  transition:background 0.04s, box-shadow 0.04s, border-color 0.04s;
}
/* 第一段 / 第二段用不同颜色（CSS 变量由 JS 注入到 .stage） */
.time-block.seg1{background:linear-gradient(135deg,var(--c1a),var(--c1b));box-shadow:0 0 50px var(--c1g);border-color:transparent;}
.time-block.seg2{background:linear-gradient(135deg,var(--c2a),var(--c2b));box-shadow:0 0 50px var(--c2g);border-color:transparent;}
.phase-dots{display:flex;gap:10px;margin-top:4px;}
.phase-dot{width:10px;height:10px;border-radius:50%;background:rgba(237,231,246,0.15);transition:all 0.2s;}
.phase-dot.on{background:var(--c1a,#B388FF);box-shadow:0 0 12px var(--c1g,rgba(179,136,255,0.7));transform:scale(1.2);}
/* 答案按钮 */
.answer-btns{display:flex;gap:14px;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.answer-btns.show{opacity:1;pointer-events:auto;}
.ans-btn{
  padding:14px 22px;border-radius:14px;border:1px solid rgba(179,136,255,0.3);
  background:rgba(179,136,255,0.08);color:#EDE7F6;
  font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;min-width:140px;
}
.ans-btn:hover{background:rgba(179,136,255,0.18);transform:translateY(-1px);}
.ans-btn:active{transform:scale(0.96);}
.hint-bar{color:rgba(237,231,246,0.4);font-size:13px;text-align:center;transition:opacity 0.3s;min-height:18px;}
/* 闪烁环 */
.flash-ring{position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;}
.flash-ring.correct{opacity:1;box-shadow:inset 0 0 0 4px #4CAF50;animation:flashFade 0.35s ease-out;}
.flash-ring.wrong{opacity:1;box-shadow:inset 0 0 0 4px #F44336;animation:flashFade 0.35s ease-out;}
@keyframes flashFade{0%{opacity:1;}100%{opacity:0;}}
/* 底部 */
.game-footer{position:absolute;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:5;}
.progress-bar{width:100%;height:6px;background:rgba(237,231,246,0.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#B388FF,#7C4DFF);border-radius:3px;transition:width 0.3s;}
.footer-row{display:flex;justify-content:space-between;align-items:center;}
.score-display{color:#EDE7F6;font-size:14px;font-weight:700;}
.trial-info{color:rgba(237,231,246,0.4);font-size:12px;font-family:'JetBrains Mono',monospace;}
.start-btn{padding:9px 26px;border-radius:12px;border:none;background:linear-gradient(135deg,#B388FF,#7C4DFF);color:#1a0b2e;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(179,136,255,0.25);}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(179,136,255,0.35);}
.start-btn:active{transform:scale(0.96);}
.start-btn.stop-mode{background:linear-gradient(135deg,#e53935,#ef5350);color:#fff;box-shadow:0 4px 16px rgba(229,57,53,0.3);}
.start-btn.stop-mode:hover{box-shadow:0 6px 20px rgba(229,57,53,0.4);}
/* 倒计时 */
.countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;font-weight:800;color:#EDE7F6;animation:cdPop 0.5s ease-out;z-index:6;}
@keyframes cdPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
/* 单题倒计时进度条 */
.trial-timer-bar{position:absolute;top:0;left:0;right:0;height:4px;width:0%;background:linear-gradient(90deg,#FFB74D,#FF7043);opacity:0;z-index:3;pointer-events:none;border-radius:0 0 2px 2px;}
/* 结果卡片 */
.result-card{position:absolute;inset:0;background:rgba(10,22,34,0.96);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:20px 16px;z-index:10;overflow-y:auto;}
.result-title{color:#B388FF;font-size:22px;font-weight:800;margin-top:6px;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:86%;max-width:420px;}
.result-item{background:rgba(237,231,246,0.05);border-radius:10px;padding:10px;text-align:center;}
.result-item .val{color:#B388FF;font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.result-item .lbl{color:rgba(237,231,246,0.5);font-size:11px;margin-top:3px;}
.result-section{width:86%;max-width:420px;background:rgba(237,231,246,0.03);border-radius:10px;padding:12px 14px;}
.section-title{color:#B388FF;font-size:13px;font-weight:700;margin-bottom:8px;}
.cond-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(237,231,246,0.04);}
.cond-row:last-child{border-bottom:none;}
.cond-row .cl{color:rgba(237,231,246,0.55);}
.cond-row .cv{color:#EDE7F6;font-family:'JetBrains Mono',monospace;font-weight:700;}
.effect-val{font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.effect-good{color:#4CAF50;}
.effect-mild{color:#FF9800;}
.effect-poor{color:#F44336;}
.result-grade{color:#4CAF50;font-size:16px;font-weight:700;}
.result-eval{width:86%;max-width:420px;background:rgba(237,231,246,0.04);border-radius:10px;padding:10px 14px;font-size:12px;color:rgba(237,231,246,0.7);line-height:1.8;text-align:left;}
.result-eval .eval-line{margin-bottom:3px;}
.result-eval .eval-line:last-child{margin-bottom:0;}
.result-btns{display:flex;gap:10px;margin-top:4px;margin-bottom:10px;}
.result-btns button{padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-retry{background:linear-gradient(135deg,#B388FF,#7C4DFF);color:#1a0b2e;}
.btn-home{background:rgba(237,231,246,0.1);color:#EDE7F6;}
.btn-retry:hover{transform:translateY(-1px);}
.btn-home:hover{background:rgba(237,231,246,0.16);}
/* 响应式 */
@media(max-width:680px){
  .container{flex-direction:column;height:auto;min-height:96vh;gap:10px;padding:10px;}
  .left-panel{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;gap:8px;overflow-x:auto;}
  .panel-title{width:100%;}
  .age-switch{flex:1;min-width:120px;}
  .diff-group{flex:1;min-width:90px;}
  .guide-card,.stat-box{flex:1;min-width:140px;}
  .params-row{width:100%;}
  .right-panel{height:60vh;min-height:420px;}
  .ans-btn{min-width:120px;padding:12px 16px;}
}
</style>
</head>
<body>
<div class="container">
  <!-- 左面板 -->
  <div class="left-panel">
    <div class="panel-title">时间感知训练</div>
    <div class="age-switch">
      <button class="age-btn active" data-mode="child" onclick="setMode('child')">儿童</button>
      <button class="age-btn" data-mode="adult" onclick="setMode('adult')">成人</button>
    </div>
    <div class="panel-title" style="margin-top:2px;">难度选择</div>
    <div class="diff-group">
      <div class="diff-label">初级</div>
      <div class="diff-btns" id="diff-easy"></div>
    </div>
    <div class="diff-group">
      <div class="diff-label">中级</div>
      <div class="diff-btns" id="diff-medium"></div>
    </div>
    <div class="diff-group">
      <div class="diff-label">高级</div>
      <div class="diff-btns" id="diff-hard"></div>
    </div>
    <div class="diff-group">
      <div class="diff-label">两段配色</div>
      <div class="diff-btns" id="color-schemes"></div>
    </div>
    <div class="params-row" id="params-row"></div>
    <div class="guide-card">
      <div class="guide-title">玩法说明</div>
      <div class="guide-text">
        屏幕中央方块会<b>亮两次</b>：先亮<b>第一段</b>，灭一下，再亮<b>第二段</b>。<br>
        • 比较两段亮起的<b>时长</b>，哪段更久就点对应按钮。<br>
        • 两次亮起<b>颜色不同</b>：第一段用【色一】、第二段用【色二】（左侧可换配色），靠颜色也能区分先后。<br>
        • 差异很小时靠"内部时钟"感觉，别猜。<br>
        • 亮起时有轻微提示音，可辅助时间感知。<br>
        <span style="color:#FFB74D;font-weight:700;">提示：</span>注意力越集中，对短时的辨别越准。
      </div>
    </div>
    <div class="stat-box">
      <div class="stat-row"><span class="sl">准确率</span><span class="sv" id="stat-acc">—</span></div>
      <div class="stat-row"><span class="sl">连对</span><span class="sv" id="stat-streak">0</span></div>
    </div>
  </div>
  <!-- 右面板 -->
  <div class="right-panel">
    <div class="game-header">
      <div class="game-title">时间感知 · 比长短</div>
      <button class="back-btn" onclick="location.href='index.html'">返回</button>
    </div>
    <div class="game-area" id="game-area">
      <div class="trial-timer-bar" id="trial-timer"></div>
      <div class="stage" id="stage">
        <div class="phase-label" id="phase-label" style="opacity:0;">准备</div>
        <div class="time-block" id="time-block">
          <div class="flash-ring" id="flash-ring"></div>
        </div>
      </div>
      <div class="phase-dots">
        <div class="phase-dot" id="dot1"></div>
        <div class="phase-dot" id="dot2"></div>
      </div>
      <div class="hint-bar" id="hint-bar">点击「开始训练」后，比较两次亮起的时长</div>
      <div class="answer-btns" id="answer-btns">
        <button class="ans-btn" id="ans-first" onclick="handleAnswer('first')">① 第一段更长</button>
        <button class="ans-btn" id="ans-second" onclick="handleAnswer('second')">② 第二段更长</button>
      </div>
    </div>
    <div class="game-footer">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="footer-row">
        <span class="score-display">正确：<span id="score">0</span></span>
        <span class="trial-info" id="trial-info">0 / 0</span>
        <button class="start-btn" id="start-btn" onclick="startOrStop()">开始训练</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 难度配置 =====
// base: 第一段基准时长(ms); delta: 相对时长差(±); trials: 总题数; isi: 两段间隔(ms); answerTimeout: 判断限时(ms)
const DIFF_CONFIG = {
  child: {
    easy:   { label:'入门', base:900, delta:0.45, trials:16, isi:600, answerTimeout:4000 },
    medium: { label:'进阶', base:900, delta:0.30, trials:20, isi:550, answerTimeout:3500 },
    hard:   { label:'挑战', base:900, delta:0.18, trials:24, isi:500, answerTimeout:3000 },
  },
  adult: {
    easy:   { label:'入门', base:700, delta:0.30, trials:20, isi:550, answerTimeout:3500 },
    medium: { label:'进阶', base:700, delta:0.18, trials:24, isi:500, answerTimeout:3000 },
    hard:   { label:'挑战', base:700, delta:0.10, trials:30, isi:450, answerTimeout:2500 },
  }
};

// ===== 两段配色方案 =====
// 每段亮起用不同颜色，变量注入 .stage；c1=第一段，c2=第二段
const COLOR_SCHEMES = {
  purple_orange: { name:'紫 / 橙', c1:['#B388FF','#7C4DFF','rgba(179,136,255,0.55)'], c2:['#FFB74D','#FF7043','rgba(255,183,77,0.55)'] },
  cyan_pink:     { name:'青 / 粉', c1:['#4DD0E1','#00BCD4','rgba(77,208,225,0.55)'],  c2:['#F06292','#E91E63','rgba(240,98,146,0.55)'] },
  blue_yellow:   { name:'蓝 / 黄', c1:['#64B5F6','#1E88E5','rgba(100,181,246,0.55)'], c2:['#FFD54F','#FFB300','rgba(255,213,79,0.55)'] },
  green_red:     { name:'绿 / 红', c1:['#81C784','#43A047','rgba(129,199,132,0.55)'], c2:['#E57373','#E53935','rgba(229,115,115,0.55)'] },
};

// ===== 状态 =====
let state = {
  mode:'child',
  level:'easy',
  colorScheme:'purple_orange',
  running:false,
  total:0,
  currentTrial:0,
  currentTrialData:null,
  score:0,
  trialStartTime:0,
  responded:false,
  streakRight:0,
  trialTimer:null,
  presentTimer:null,
  countdownTimer:null,
  timers:[],
  results:[],
};

// ===== 音频 =====
let audioCtx = null;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function playBeep(freq,dur,vol=0.12){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}

// ===== DOM =====
const $ = id=>document.getElementById(id);

// ===== 两段配色按钮 =====
function buildColorSchemes(){
  const container=$('color-schemes');
  container.innerHTML='';
  Object.keys(COLOR_SCHEMES).forEach(key=>{
    const sc=COLOR_SCHEMES[key];
    const btn=document.createElement('button');
    btn.className='diff-btn'+(state.colorScheme===key?' active':'');
    // 用两段色块直观展示配色
    btn.innerHTML=`<div style="display:flex;gap:4px;justify-content:center;margin-bottom:3px;">`+
                  `<span style="width:11px;height:11px;border-radius:3px;background:${sc.c1[0]};"></span>`+
                  `<span style="width:11px;height:11px;border-radius:3px;background:${sc.c2[0]};"></span>`+
                  `</div><span>${sc.name}</span>`;
    btn.onclick=()=>{
      state.colorScheme=key;
      document.querySelectorAll('#color-schemes .diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      applyColorScheme();
    };
    container.appendChild(btn);
  });
}
function applyColorScheme(){
  const sc=COLOR_SCHEMES[state.colorScheme];
  const stage=$('stage');
  stage.style.setProperty('--c1a',sc.c1[0]);
  stage.style.setProperty('--c1b',sc.c1[1]);
  stage.style.setProperty('--c1g',sc.c1[2]);
  stage.style.setProperty('--c2a',sc.c2[0]);
  stage.style.setProperty('--c2b',sc.c2[1]);
  stage.style.setProperty('--c2g',sc.c2[2]);
}

// ===== 难度按钮 =====
function buildDiffBtns(){
  ['easy','medium','hard'].forEach(lvl=>{
    const container=$('diff-'+lvl);
    container.innerHTML='';
    ['easy','medium','hard'].forEach(sub=>{
      const cfg=DIFF_CONFIG[state.mode][sub];
      const btn=document.createElement('button');
      btn.className='diff-btn'+(state.level===sub?' active':'');
      btn.textContent=cfg.label;
      btn.onclick=()=>{state.level=sub;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');updateParams();};
      container.appendChild(btn);
    });
  });
  updateParams();
}
function setMode(mode){
  state.mode=mode;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  // 重置难度按钮高亮
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  state.level='easy';
  buildDiffBtns();
}
function updateParams(){
  const cfg=DIFF_CONFIG[state.mode][state.level];
  const pct=Math.round(cfg.delta*100);
  $('params-row').innerHTML=
    `<span class="param-tag">基准 ${cfg.base}ms</span>`+
    `<span class="param-tag">时长差 ±${pct}%</span>`+
    `<span class="param-tag">${cfg.trials}题</span>`;
}

// ===== 开始 / 停止 =====
function startOrStop(){
  if(state.running) stopGame();
  else startGame();
}
function startGame(){
  initAudio();
  const cfg=DIFF_CONFIG[state.mode][state.level];
  state.running=true;
  state.total=cfg.trials;
  state.currentTrial=0;
  state.score=0;
  state.streakRight=0;
  state.results=[];
  $('start-btn').textContent='停止训练';
  $('start-btn').classList.add('stop-mode');
  $('score').textContent='0';
  $('trial-info').textContent='0 / '+state.total;
  $('stat-acc').textContent='—';
  $('stat-streak').textContent='0';
  $('progress-fill').style.width='0%';
  $('answer-btns').classList.remove('show');
  hideResult();
  runCountdown(()=>nextTrial());
}
function stopGame(){
  state.running=false;
  clearAllTimers();
  resetBlock();
  $('start-btn').textContent='开始训练';
  $('start-btn').classList.remove('stop-mode');
  $('answer-btns').classList.remove('show');
  $('hint-bar').style.opacity='1';
  $('hint-bar').textContent='已停止。点击「开始训练」可重新挑战';
  $('phase-label').style.opacity='0';
  // 若已有部分结果，给出阶段性评估
  if(state.results.length>0) showResult(true);
}

// ===== 倒计时 =====
function runCountdown(cb){
  let n=3;
  const cd=document.createElement('div');
  cd.className='countdown';
  cd.textContent=n;
  $('time-block').appendChild(cd);
  const tick=()=>{
    n--;
    if(n>0){cd.textContent=n;cd.style.animation='none';void cd.offsetWidth;cd.style.animation='cdPop 0.5s ease-out';}
    else{cd.remove();clearInterval(state.countdownTimer);state.countdownTimer=null;cb();}
  };
  state.countdownTimer=setInterval(tick,700);
}

// ===== 试次流程 =====
function nextTrial(){
  if(!state.running) return;
  if(state.currentTrial>=state.total){ finishGame(); return; }
  $('progress-fill').style.width=(state.currentTrial/state.total*100)+'%';
  $('trial-info').textContent=state.currentTrial+' / '+state.total;
  presentTrial();
}
function presentTrial(){
  const cfg=DIFF_CONFIG[state.mode][state.level];
  state.responded=false;
  // 生成本题：t2Longer = 第二段是否更长
  const t2Longer = Math.random()<0.5;
  const t1 = cfg.base;
  const t2 = t2Longer ? Math.round(cfg.base*(1+cfg.delta)) : Math.round(cfg.base*(1-cfg.delta));
  state.currentTrialData={t1,t2,t2Longer,delta:cfg.delta};
  // 关键修复：先真正清除上一轮残留的定时器，否则历史 trial 的 setTimeout 会泄漏叠加
  // （旧题的"亮方块/显示答案"回调反复触发 → 方块乱闪、答案按钮被反复刷新 → 没时间点击）
  if(state.timers && state.timers.length){ state.timers.forEach(id=>clearTimeout(id)); }
  if(state.trialTimer){ clearTimeout(state.trialTimer); state.trialTimer=null; }
  state.timers=[];
  $('answer-btns').classList.remove('show');
  $('hint-bar').style.opacity='0.5';
  $('hint-bar').textContent='';
  $('dot1').classList.remove('on');$('dot2').classList.remove('on');
  $('phase-label').style.opacity='1';
  $('phase-label').textContent='准备…';

  // 统一调度：所有定时器入数组，停止时可完全清除，避免状态错乱
  const at=(delay,fn)=>{
    const id=setTimeout(()=>{ if(!state.running) return; fn(); },delay);
    state.timers.push(id);
  };
  // 第一段亮起（持续 t1）
  at(300,()=>{
    $('phase-label').textContent='① 第一段';
    $('dot1').classList.add('on');
    activateBlock(true,1);
    playBeep(440,Math.min(t1/1000,0.5));
  });
  // 第一段熄灭 → 间隔
  at(300+t1,()=>{
    activateBlock(false);
    $('dot1').classList.remove('on');
    $('phase-label').textContent='间隔…';
  });
  // 第二段亮起（持续 t2）
  at(300+t1+cfg.isi,()=>{
    $('phase-label').textContent='② 第二段';
    $('dot2').classList.add('on');
    activateBlock(true,2);
    playBeep(660,Math.min(t2/1000,0.5));
  });
  // 第二段熄灭 → 显示答案 + 判断限时
  at(300+t1+cfg.isi+t2,()=>{
    activateBlock(false);
    $('dot2').classList.remove('on');
    $('phase-label').style.opacity='0';
    $('hint-bar').style.opacity='1';
    $('hint-bar').textContent='哪一段更长？';
    $('answer-btns').classList.add('show');
    state.trialStartTime=performance.now();
    startTrialTimer(cfg.answerTimeout);
  });
}
function activateBlock(on, seg){
  const b=$('time-block');
  b.classList.remove('seg1','seg2');
  if(on){
    if(seg===1) b.classList.add('seg1');
    else if(seg===2) b.classList.add('seg2');
  }
}
function resetBlock(){ activateBlock(false); }

function startTrialTimer(ms){
  $('trial-timer').style.opacity='1';
  $('trial-timer').style.transition='none';
  $('trial-timer').style.width='100%';
  void $('trial-timer').offsetWidth;
  $('trial-timer').style.transition='width '+ms+'ms linear';
  $('trial-timer').style.width='0%';
  state.trialTimer=setTimeout(()=>{
    if(state.responded||!state.running) return;
    // 超时未答
    handleAnswer(null);
  },ms);
}
function clearTrialTimer(){
  if(state.trialTimer){clearTimeout(state.trialTimer);state.trialTimer=null;}
  $('trial-timer').style.opacity='0';
}

// ===== 作答 =====
function handleAnswer(choice){
  if(state.responded||!state.running) return;
  state.responded=true;
  clearTrialTimer();
  $('answer-btns').classList.remove('show');
  const d=state.currentTrialData;
  const rt=Math.round(performance.now()-state.trialStartTime);
  let correct=null;
  if(choice===null){ correct=false; }
  else if(choice==='first'){ correct = !d.t2Longer; }
  else if(choice==='second'){ correct = d.t2Longer; }
  state.results.push({t2Longer:d.t2Longer, answer:choice, correct, rt, delta:d.delta});
  if(correct){
    state.score++;
    state.streakRight++;
    showFlash('correct');
    playBeep(880,0.12);
  }else{
    state.streakRight=0;
    showFlash(choice===null?'miss':'wrong');
    playBeep(220,0.18,0.1);
  }
  // 更新统计
  const acc=Math.round(state.score/state.results.length*100);
  $('stat-acc').textContent=acc+'%';
  $('stat-streak').textContent=state.streakRight;
  $('score').textContent=state.score;
  // 进入下一题
  state.currentTrial++;
  const nextId=setTimeout(()=>{
    if(state.running) nextTrial();
  },choice===null?500:350);
  state.timers.push(nextId);
}

function showFlash(type){
  const r=$('flash-ring');
  r.className='flash-ring '+type;
  void r.offsetWidth;
  setTimeout(()=>{r.className='flash-ring';},350);
}

// ===== 结束 / 评估 =====
function finishGame(){
  state.running=false;
  clearAllTimers();
  resetBlock();
  $('start-btn').textContent='开始训练';
  $('start-btn').classList.remove('stop-mode');
  $('progress-fill').style.width='100%';
  $('trial-info').textContent=state.total+' / '+state.total;
  showResult(false);
}
function clearAllTimers(){
  if(state.timers){ state.timers.forEach(id=>clearTimeout(id)); state.timers=[]; }
  if(state.trialTimer){clearTimeout(state.trialTimer);state.trialTimer=null;}
  if(state.countdownTimer){clearInterval(state.countdownTimer);state.countdownTimer=null;}
  $('trial-timer').style.opacity='0';
}

function showResult(partial){
  buildResultCard(partial);
  $('result-card').style.display='flex';
}
function hideResult(){
  const rc=$('result-card');
  if(rc) rc.style.display='none';
}

function buildResultCard(partial){
  const res=state.results;
  const total=res.length;
  const correct=res.filter(r=>r.correct).length;
  const acc=total?Math.round(correct/total*100):0;
  const avgRt=total?Math.round(res.reduce((s,r)=>s+(r.rt||0),0)/total):0;
  // 分条件
  const firstLonger=res.filter(r=>!r.t2Longer);
  const secondLonger=res.filter(r=>r.t2Longer);
  const flAcc=firstLonger.length?Math.round(firstLonger.filter(r=>r.correct).length/firstLonger.length*100):'—';
  const slAcc=secondLonger.length?Math.round(secondLonger.filter(r=>r.correct).length/secondLonger.length*100):'—';
  // 难度档
  const cfg=DIFF_CONFIG[state.mode][state.level];
  const deltaPct=Math.round(cfg.delta*100);
  // 等级
  let grade,gradeCls;
  if(acc>=85){grade='优秀 · 时间辨别敏锐';gradeCls='effect-good';}
  else if(acc>=70){grade='良好 · 基本稳定';gradeCls='effect-mild';}
  else{grade='需加强 · 时长差异感知弱';gradeCls='effect-poor';}

  // 文字解读
  const lines=[];
  lines.push(`本次 ${partial?'（已停止·阶段性）':'完整'} ${total} 题，难度档时长差 ±${deltaPct}%（韦伯比例），准确率 <b>${acc}%</b>。`);
  if(total>=6){
    if(Math.abs((typeof flAcc==='number'?flAcc:0)-(typeof slAcc==='number'?slAcc:0))>=15){
      const worse= (typeof flAcc==='number'&&typeof slAcc==='number')?(flAcc<slAcc?'第一段更长题':'第二段更长题'):'';
      lines.push(`你在对「${worse}」的辨别上明显偏弱，可能存在方向性偏差——大脑对"先入"或"后入"的时长记忆不对称。`);
    }else{
      lines.push(`两段方向的辨别较均衡，方向性偏差小。`);
    }
  }
  if(acc>=85){
    lines.push(`当前难度对你已偏易。建议升到「${cfg.delta<=0.18?'挑战':'进阶'}」档，或成人模式进一步压缩时长差，逼近个人时间辨别阈限。`);
  }else if(acc<70){
    lines.push(`当前时长差对你偏难。可先降一档（如 ±45% 入门）建立"时长感"后再逐步收紧，避免靠猜。`);
  }else{
    lines.push(`处于有效训练区。保持当前难度多练几轮，准确率稳定后可升档。`);
  }
  lines.push(`训练价值：时间感知依赖"内部时钟"脉冲累加，集中注意力能提升脉冲可靠性，是持续注意与冲动抑制的基础能力。`);

  const evalHtml=lines.map(l=>`<div class="eval-line">• ${l}</div>`).join('');

  const card=document.createElement('div');
  card.className='result-card';
  card.id='result-card';
  card.innerHTML=`
    <div class="result-title">${partial?'训练中断':'训练完成'}</div>
    <div class="result-grade ${gradeCls}">${grade}</div>
    <div class="result-grid">
      <div class="result-item"><div class="val">${acc}%</div><div class="lbl">准确率</div></div>
      <div class="result-item"><div class="val">${correct}/${total}</div><div class="lbl">答对题数</div></div>
      <div class="result-item"><div class="val">±${deltaPct}%</div><div class="lbl">时长差(韦伯)</div></div>
      <div class="result-item"><div class="val">${avgRt}ms</div><div class="lbl">平均反应时</div></div>
    </div>
    <div class="result-section">
      <div class="section-title">分方向辨别</div>
      <div class="cond-row"><span class="cl">第一段更长题</span><span class="cv">${flAcc}${typeof flAcc==='number'?'%':''}</span></div>
      <div class="cond-row"><span class="cl">第二段更长题</span><span class="cv">${slAcc}${typeof slAcc==='number'?'%':''}</span></div>
    </div>
    <div class="result-eval">${evalHtml}</div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startGame()">再来一次</button>
      <button class="btn-home" onclick="location.href='index.html'">返回大厅</button>
    </div>
  `;
  // 移除旧卡片
  const old=$('result-card'); if(old) old.remove();
  $('game-area').appendChild(card);
}

// ===== 初始化 =====
buildDiffBtns();
buildColorSchemes();
applyColorScheme();
</script>
