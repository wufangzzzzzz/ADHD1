<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记忆翻牌 - 视知觉训练</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    html, body { touch-action: manipulation; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 15px;
      color: white;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    
    .back-btn {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #E91E63 50%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      color: #E91E63;
      font-size: 12px;
      padding: 6px 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      display: inline-block;
    }
    
    .info-bar {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
    }
    
    .info-item {
      text-align: center;
    }
    
    .info-label {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 3px;
    }
    
    .info-value {
      font-size: 20px;
      font-weight: bold;
      color: #FFD700;
    }
    
    .level-select {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .level-btn {
      padding: 8px 20px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.8);
      transition: all 0.3s;
    }
    
    .level-btn.active {
      border-color: #E91E63;
      background: rgba(233,30,99,0.3);
      color: white;
    }
    
    .game-area {
      background: white;
      border-radius: 20px;
      padding: 20px;
      max-width: 720px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .cards-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      width: fit-content;
    }
    
    .card {
      width: 80px;
      height: 100px;
      perspective: 1000px;
      cursor: pointer;
      flex-shrink: 0;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    
    .card-front {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 32px;
    }
    
    .card-back {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      transform: rotateY(180deg);
    }
    
    .card.matched {
      opacity: 0.5;
      pointer-events: none;
    }
    
    .card.matched .card-back {
      background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
    }
    
    .btn-row {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    .mode-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .mode-btn {
      padding: 8px 20px;
      border: 2px solid #E91E63;
      background: white;
      color: #E91E63;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mode-btn.active {
      background: linear-gradient(135deg, #E91E63, #F48FB1);
      color: white;
    }
    
    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-start {
      background: linear-gradient(135deg, #E91E63, #F48FB1);
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .hint-text {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
      min-height: 20px;
    }
    
    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    
    .result-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    .result-content {
      background: white;
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      color: #333;
    }
    
    .result-emoji {
      font-size: 80px;
      margin-bottom: 15px;
    }
    
    .result-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .result-stats {
      font-size: 16px;
      color: #666;
      margin-bottom: 25px;
    }
    
    
    @media (max-width: 400px) {
      .card {
        width: 65px;
        height: 85px;
      }
      
      .card-front, .card-back {
        font-size: 28px;
      }
    }
    
    .number-display {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      text-align: center;
      line-height: 1;
    }
    
    .icon-display {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn">← 返回主页</a>
      <h1>记忆翻牌</h1>
      <p class="subtitle">视觉记忆 · 序列记忆</p>
    </div>
    
    <div class="info-bar">
      <div class="info-item">
        <div class="info-label">关卡</div>
        <div class="info-value" id="level">1</div>
      </div>
      <div class="info-item">
        <div class="info-label">配对</div>
        <div class="info-value" id="pairs">0/0</div>
      </div>
      <div class="info-item">
        <div class="info-label">用时</div>
        <div class="info-value" id="timer">0s</div>
      </div>
    </div>
    
    <div class="level-select">
      <button class="level-btn active" onclick="setLevel(1)">简单 4对</button>
      <button class="level-btn" onclick="setLevel(2)">中等 6对</button>
      <button class="level-btn" onclick="setLevel(3)">困难 8对</button>
    </div>
    
    <div class="mode-select" id="modeSelect">
      <button class="mode-btn active" onclick="setMode('icon')">图形模式</button>
      <button class="mode-btn" onclick="setMode('number')">数字模式</button>
    </div>
    
    <div class="game-area">
      <div class="cards-grid" id="cardsGrid"></div>
      
      <div class="hint-text" id="hintText">点击开始游戏，翻转卡片找到所有配对</div>
      
      <div class="btn-row">
        <button class="btn btn-start" id="startBtn" onclick="startGame()">开始游戏</button>
      </div>
    </div>
  </div>
  
  <div class="result-overlay" id="resultOverlay">
    <div class="result-content">
      <div class="result-emoji">🎉</div>
      <div class="result-title" id="resultTitle">太棒了！</div>
      <div class="result-stats" id="resultStats">完成配对！</div>
      <button class="btn btn-start" onclick="continueGame()">继续挑战</button>
    </div>
  </div>
  
  
  
  <script>
    // 防下载
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    
    // 关卡配置
    var LEVEL_CONFIG = {
      1: { pairs: 4, cols: 4 },
      2: { pairs: 6, cols: 4 },
      3: { pairs: 8, cols: 4 }
    };
    
    // 图标集
    var ICONS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑', '🌟', '⭐', '🌙', '☀️', 
                 '🐱', '🐶', '🐼', '🦊', '🦁', '🐯', '🌸', '🌺', '🌻', '🌷', '🏀', '⚽'];
    
    // 数字集（相似易混淆数字）
    var NUMBERS = [1, 2, 3, 5, 6, 7, 8, 9];
    
    // 游戏状态
    var currentLevel = 1;
    var currentMode = 'icon';
    var cards = [];
    var flippedCards = [];
    var matchedPairs = 0;
    var gameStarted = false;
    var canFlip = true;
    var startTime = 0;
    var timerInterval = null;
    var totalPairs = 0;
    var audioCtx = null;
    
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    function playSound(type) {
      try {
        initAudio();
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        
        if (type === 'flip') {
          o.frequency.value = 600;
          o.type = 'sine';
          g.gain.setValueAtTime(0.2, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          o.start();
          o.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'match') {
          o.frequency.value = 880;
          o.type = 'sine';
          g.gain.setValueAtTime(0.3, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          o.start();
          o.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'win') {
          [523, 659, 784, 1047].forEach((freq, i) => {
            setTimeout(() => {
              var o2 = audioCtx.createOscillator();
              var g2 = audioCtx.createGain();
              o2.connect(g2);
              g2.connect(audioCtx.destination);
              o2.frequency.value = freq;
              o2.type = 'sine';
              g2.gain.setValueAtTime(0.3, audioCtx.currentTime);
              g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
              o2.start();
              o2.stop(audioCtx.currentTime + 0.3);
            }, i * 150);
          });
        }
      } catch(e) {}
    }
    
    function setLevel(level) {
      currentLevel = level;
      document.getElementById('level').textContent = level;
      document.querySelectorAll('.level-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === level);
      });
      resetGame();
    }
    
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && mode === 'icon') || (i === 1 && mode === 'number'));
      });
      resetGame();
    }
    
    function shuffleArray(array) {
      var arr = [...array];
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    
    function createCards() {
      var config = LEVEL_CONFIG[currentLevel];
      var sourceArray = currentMode === 'icon' ? ICONS : NUMBERS;
      var selectedItems = shuffleArray(sourceArray).slice(0, config.pairs);
      var cardPairs = [...selectedItems, ...selectedItems];
      cards = shuffleArray(cardPairs);
      totalPairs = config.pairs;
    }
    
    function renderCards() {
      var config = LEVEL_CONFIG[currentLevel];
      var grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = 'repeat(' + config.cols + ', 80px)';
      
      cards.forEach((item, index) => {
        var card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.icon = item;
        var displayContent = currentMode === 'number' ? '<span class="number-display">' + item + '</span>' : '<span class="icon-display">' + item + '</span>';
        card.innerHTML = '<div class="card-inner"><div class="card-front">?</div><div class="card-back">' + displayContent + '</div></div>';
        card.onclick = function() { flipCard(this); };
        grid.appendChild(card);
      });
    }
    
    function flipCard(card) {
      if (!gameStarted || !canFlip) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      
      card.classList.add('flipped');
      flippedCards.push(card);
      playSound('flip');
      
      if (flippedCards.length === 2) {
        canFlip = false;
        checkMatch();
      }
    }
    
    function checkMatch() {
      var card1 = flippedCards[0];
      var card2 = flippedCards[1];
      
      if (card1.dataset.icon === card2.dataset.icon) {
        // 匹配成功
        setTimeout(() => {
          card1.classList.add('matched');
          card2.classList.add('matched');
          playSound('match');
          
          matchedPairs++;
          document.getElementById('pairs').textContent = matchedPairs + '/' + totalPairs;
          
          flippedCards = [];
          canFlip = true;
          
          if (matchedPairs === totalPairs) {
            gameWin();
          }
        }, 300);
      } else {
        // 不匹配，翻回
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          canFlip = true;
        }, 800);
      }
    }
    
    function startGame() {
      gameStarted = true;
      matchedPairs = 0;
      flippedCards = [];
      canFlip = true;
      startTime = Date.now();
      
      createCards();
      renderCards();
      
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('hintText').textContent = '翻开卡片，找到所有配对';
      document.getElementById('pairs').textContent = '0/' + totalPairs;
      
      timerInterval = setInterval(() => {
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = elapsed + 's';
      }, 1000);
    }
    
    function gameWin() {
      gameStarted = false;
      clearInterval(timerInterval);
      playSound('win');
      
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('resultOverlay').classList.add('show');
      document.getElementById('resultStats').textContent = '用时 ' + elapsed + ' 秒';
      
      if (elapsed < 20) {
        document.getElementById('resultTitle').textContent = '记忆力惊人！';
        document.querySelector('.result-emoji').textContent = '🧠';
      } else if (elapsed < 40) {
        document.getElementById('resultTitle').textContent = '太棒了！';
        document.querySelector('.result-emoji').textContent = '🎉';
      } else {
        document.getElementById('resultTitle').textContent = '完成的不错！';
        document.querySelector('.result-emoji').textContent = '👍';
      }
    }
    
    function continueGame() {
      document.getElementById('resultOverlay').classList.remove('show');
      
      // 升级关卡
      if (currentLevel < 3) {
        currentLevel++;
        document.querySelectorAll('.level-btn').forEach((btn, i) => {
          btn.classList.toggle('active', i + 1 === currentLevel);
        });
      }
      
      document.getElementById('level').textContent = currentLevel;
      resetGame();
      document.getElementById('startBtn').style.display = 'block';
    }
    
    function resetGame() {
      gameStarted = false;
      clearInterval(timerInterval);
      matchedPairs = 0;
      flippedCards = [];
      canFlip = true;
      
      createCards();
      renderCards();
      
      document.getElementById('timer').textContent = '0s';
      document.getElementById('pairs').textContent = '0/' + totalPairs;
      document.getElementById('hintText').textContent = '点击开始游戏，翻转卡片找到所有配对';
      document.getElementById('startBtn').style.display = 'block';
    }
    
    window.addEventListener('load', function() {
      resetGame();
    });
  </script>
</body>
</html>
