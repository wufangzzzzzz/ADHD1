<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>空间记忆矩阵 - Corsi 视觉空间工作记忆训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  background:#FFFBFA;
  height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
.container{
  width:min(98vw,1100px);
  height:min(98vh,760px);
  display:flex;
  gap:16px;
  padding:12px;
}

/* 左面板 */
.left-panel{
  width:300px;min-width:300px;
  background:#FFFFFF;
  border-radius:16px;
  padding:12px;
  display:flex;flex-direction:column;
  gap:10px;
  box-shadow:0 2px 16px rgba(45,43,85,0.06);
  overflow:hidden;
}
.panel-title{
  color:#2D2B55;
  font-size:14px;font-weight:800;
  text-align:center;
  padding-bottom:8px;
  border-bottom:1px solid rgba(45,43,85,0.08);
}
.diff-label{
  color:rgba(45,43,85,0.5);
  font-size:12px;font-weight:600;
  margin-bottom:4px;
}
.diff-btns{display:flex;gap:6px;}
.diff-btn{
  flex:1;
  padding:8px 4px;
  border-radius:12px;
  border:2px solid rgba(45,43,85,0.1);
  background:#FFFFFF;
  color:rgba(45,43,85,0.6);
  font-size:12px;font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  text-align:center;
}
.diff-btn.active{border-color:#FF5E0E;color:#FF5E0E;background:rgba(255,94,14,0.06);}
.diff-btn:hover{background:rgba(45,43,85,0.04);}
.diff-btn:active{transform:scale(0.95);}

/* 配置说明 */
.config-desc{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
}
.config-desc .row{
  display:flex;justify-content:space-between;
  color:rgba(45,43,85,0.5);
  font-size:11px;
  padding:3px 0;
}
.config-desc .row span:last-child{
  color:#2D2B55;
  font-weight:700;
}

/* 玩法说明 */
.rules-box{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
  flex:1;
  overflow-y:auto;
}
.rules-box .rules-title{
  color:#2D2B55;
  font-size:12px;font-weight:700;
  margin-bottom:6px;
}
.rules-box p{
  color:rgba(45,43,85,0.55);
  font-size:11px;line-height:1.6;
  margin-bottom:5px;
}
.rules-box b{color:#2D2B55;}

/* 开始按钮 */
.start-btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#FF5E0E,#FF9800);
  color:#fff;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:transform 0.1s ease;
  box-shadow:0 3px 12px rgba(255,94,14,0.25);
}
.start-btn:active{transform:scale(0.95);}
.start-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* 右面板 */
.right-panel{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:8px 0;
  overflow:hidden;
}
.game-title{
  font-size:22px;font-weight:800;
  background:linear-gradient(135deg,#FF5E0E,#FF69B4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-align:center;
}
.info-bar{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.info-item{
  background:#FFFFFF;
  border-radius:10px;
  padding:10px 18px;
  font-size:15px;
  font-weight:700;
  color:#2D2B55;
  box-shadow:0 1px 8px rgba(45,43,85,0.06);
}
.info-item .val{
  font-family:'JetBrains Mono','Courier New',monospace;
  color:#FF5E0E;
}

/* 进度条 */
.progress-wrap{
  width:460px;
  display:flex;align-items:center;gap:8px;
}
.progress-label{
  font-size:12px;font-weight:700;
  color:rgba(45,43,85,0.5);
  white-space:nowrap;
}
.progress-bar{
  flex:1;height:6px;
  background:rgba(45,43,85,0.08);
  border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#FF5E0E,#FF9800);
  border-radius:3px;
  transition:width 0.3s ease;
  width:0%;
}

/* 3×3 方块网格 */
.game-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  width:460px;
  height:460px;
}
.block{
  background:rgba(45,43,85,0.06);
  border-radius:16px;
  border:3px solid transparent;
  cursor:pointer;
  transition:transform 0.1s ease;
  aspect-ratio:1;
}
.block:active{transform:scale(0.95);}


/* 正确点击 */
.block.clicked{
  background:#32CD32;
  border-color:#32CD32;
  box-shadow:0 0 24px rgba(50,205,50,0.5);
}

/* 错误点击 */
.block.wrong{
  background:#FF073A;
  border-color:#FF073A;
  box-shadow:0 0 24px rgba(255,7,58,0.5);
}

.hint-text{
  font-size:16px;
  font-weight:700;
  color:rgba(45,43,85,0.6);
  text-align:center;
  min-height:24px;
}

.result-card{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
  display:none;
  flex-direction:column;
  gap:6px;
}
.result-card.show{display:flex;}
.result-row{
  display:flex;justify-content:space-between;
  font-size:12px;
  color:rgba(45,43,85,0.5);
  padding:3px 0;
  border-bottom:1px solid rgba(45,43,85,0.06);
}
.result-row .rv{font-weight:700;color:#FF5E0E;}

/* ===== CSS 动画效果 ===== */
@media (prefers-reduced-motion: no-preference) {
  /* 方块依次弹入 */
  @keyframes staggerBounce {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  .block.stagger-in {
    opacity: 0;
    animation: staggerBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  /* 点亮脉冲 */

  /* 正确闪烁 */
  @keyframes correctFlash {
    0% { box-shadow: 0 0 0 rgba(50,205,50,0); }
    50% { box-shadow: 0 0 36px rgba(50,205,50,0.7); }
    100% { box-shadow: 0 0 0 rgba(50,205,50,0); }
  }
  .block.clicked {
    animation: correctFlash 0.5s ease-out;
  }

  /* 错误抖动 */
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .block.wrong {
    animation: wrongShake 0.4s ease-out;
  }

  /* 序列完成脉冲 */
  @keyframes sequenceDone {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .block.sequence-done {
    animation: sequenceDone 0.3s ease-out;
  }

  /* 计数跳动 */
  @keyframes countPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .count-pop {
    animation: countPop 0.3s ease-out;
  }
}

@media (prefers-reduced-motion: reduce) {
  .block.stagger-in { opacity: 1; animation: none; }
  .block.clicked, .block.wrong, .block.sequence-done { animation: none; }
  .count-pop { animation: none; }
  .btn:active,.diff-btn:active,.start-btn:active{transform:none;}
}

.back-btn{
  position:absolute;top:10px;left:10px;z-index:100;
  background:rgba(0,0,0,0.06);
  border:1px solid rgba(0,0,0,0.1);
  color:rgba(0,0,0,0.55);
  padding:6px 14px;border-radius:8px;
  font-size:13px;cursor:pointer;
  transition:all 0.2s;
  text-decoration:none;
}
.back-btn:hover{background:rgba(0,0,0,0.1);color:rgba(0,0,0,0.8);}
</style>
</head>
<body>
  <button class="back-btn" onclick="location.href='index.html'">← 返回大厅</button>

<div class="container">
  <!-- 左面板 -->
  <div class="left-panel">
    <div class="panel-title">空间记忆矩阵</div>

    <div class="diff-label">难度选择</div>
    <div class="diff-btns" id="diffPanel">
      <button class="diff-btn active" data-level="easy">初级</button>
      <button class="diff-btn" data-level="medium">中级</button>
      <button class="diff-btn" data-level="hard">高级</button>
    </div>

    <div class="config-desc" id="configDesc">
      <div class="row"><span>起始序列</span><span id="cfgStart">2</span></div>
      <div class="row"><span>最大序列</span><span id="cfgMax">6</span></div>
      <div class="row"><span>点亮间隔</span><span id="cfgInterval">1000ms</span></div>
      <div class="row"><span>点亮时长</span><span id="cfgLit">800ms</span></div>
    </div>

    <div class="rules-box">
      <div class="rules-title">玩法说明</div>
      <p><b>训练目标：</b>视觉空间工作记忆。观察3×3网格中方块依次点亮，按相同顺序点击复现。</p>
      <p><b>操作方式：</b>方块依次点亮后，按记忆的顺序点击方块。每个长度有2次尝试机会。</p>
      <p><b>计分规则：</b>记忆跨度（最长成功亮起格数）为核心指标。综合得分 = 记忆跨度 × 总正确序列数。</p>
      <p><b>难度差异：</b></p>
      <p>初级：起始2个，间隔1000ms<br>中级：起始3个，间隔800ms<br>高级：起始3个，间隔600ms</p>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-row"><span>记忆跨度</span><span class="rv" id="rSpan">-</span></div>
      <div class="result-row"><span>总正确序列</span><span class="rv" id="rCorrect">-</span></div>
      <div class="result-row"><span>综合得分</span><span class="rv" id="rScore">-</span></div>
      <button class="start-btn" id="restartBtn" onclick="restartGame()" style="margin-top:4px;">再玩一次</button>
    </div>

    <button class="start-btn" id="startBtn" onclick="startGame()">开始训练</button>
  </div>

  <!-- 右面板 -->
  <div class="right-panel">
    <div class="game-title">空间记忆矩阵</div>

    <div class="info-bar">
      <div class="info-item">亮起格数 <span class="val" id="seqLen">2</span></div>
      <div class="info-item">正确 <span class="val" id="correctCount">0</span></div>
      <div class="info-item">尝试 <span class="val" id="attemptCount">1/2</span></div>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <span class="progress-label">进度</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressText">0/2</span>
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <div class="hint-text" id="hintText">点击左侧「开始训练」</div>
  </div>
</div>

<script>
const DIFFICULTY = {
  easy:{startLen:2,maxLen:6,interval:1000,litDuration:800},
  medium:{startLen:3,maxLen:7,interval:800,litDuration:600},
  hard:{startLen:3,maxLen:9,interval:600,litDuration:400}
};

let state = {
  level:'easy',
  seqLen:2,
  sequence:[],
  playerSeq:[],
  correctTotal:0,
  attemptNum:1,
  phase:'idle', // idle|showing|input|result
  gameOver:false,
  gameStarted:false
};

const gameGrid = document.getElementById('gameGrid');
const hintText = document.getElementById('hintText');
const resultCard = document.getElementById('resultCard');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

// ===== 音效系统 =====
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration, type='sine', vol=0.15){
  try{
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}

function playLitSound(){
  playTone(880, 0.12, 'sine', 0.12);
}

function playClickSound(){
  playTone(660, 0.08, 'sine', 0.1);
}

function playCorrectSound(){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [523,659,784].forEach((f,i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + i*0.1);
    gain.gain.setValueAtTime(0.12, now + i*0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + i*0.1);
    osc.stop(now + i*0.1 + 0.2);
  });
}

function playWrongSound(){
  playTone(200, 0.3, 'square', 0.1);
}

function playGameOverSound(){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + i*0.12);
    gain.gain.setValueAtTime(0.1, now + i*0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.12 + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + i*0.12);
    osc.stop(now + i*0.12 + 0.25);
  });
}

function updateConfigDesc(){
  const cfg = DIFFICULTY[state.level];
  document.getElementById('cfgStart').textContent = cfg.startLen;
  document.getElementById('cfgMax').textContent = cfg.maxLen;
  document.getElementById('cfgInterval').textContent = cfg.interval + 'ms';
  document.getElementById('cfgLit').textContent = cfg.litDuration + 'ms';
}

function createBlocks(){
  gameGrid.innerHTML = '';
  for(let i = 0; i < 9; i++){
    const b = document.createElement('div');
    b.className = 'block stagger-in';
    b.dataset.idx = i;
    b.style.setProperty('--i', i);
    b.style.animationDelay = (i * 60) + 'ms';
    b.addEventListener('click',()=>onBlockClick(i,b));
    gameGrid.appendChild(b);
  }
}

function generateSequence(){
  state.sequence = [];
  const used = new Set();
  while(state.sequence.length < state.seqLen){
    const r = Math.floor(Math.random() * 9);
    if(!used.has(r) || state.seqLen > 9){
      state.sequence.push(r);
      used.add(r);
    }
  }
  state.playerSeq = [];
}

function updateProgress(current, total){
  if(total === 0){
    progressFill.style.width = '0%';
    progressText.textContent = '0/0';
    return;
  }
  const pct = Math.round((current / total) * 100);
  progressFill.style.width = pct + '%';
  progressText.textContent = current + '/' + total;
}

async function showSequence(){
  state.phase = 'showing';
  hintText.textContent = '观察方块点亮顺序...';
  progressWrap.style.display = 'flex';
  updateProgress(0, state.sequence.length);
  const cfg = DIFFICULTY[state.level];
  const blocks = gameGrid.querySelectorAll('.block');
  setBlocksEnabled(false);

  for(let i = 0; i < state.sequence.length; i++){
    await sleep(300);
    const idx = state.sequence[i];
    blocks[idx].style.cssText = 'background:#FFDA00 !important; border-color:#FFDA00 !important; box-shadow:0 0 36px rgba(255,218,0,0.7) !important; transform:scale(1.06) !important;';
    playLitSound();
    updateProgress(i + 1, state.sequence.length);
    await sleep(cfg.litDuration);
    blocks[idx].style.cssText = '';
  }
  await sleep(400);
  state.phase = 'input';
  hintText.textContent = '请按顺序点击方块！';
  updateProgress(0, state.sequence.length);
  setBlocksEnabled(true);
}

function onBlockClick(idx, el){
  if(state.phase !== 'input' || state.gameOver) return;
  state.playerSeq.push(idx);

  playClickSound();

  el.style.cssText = 'background:#32CD32 !important; border-color:#32CD32 !important; box-shadow:0 0 24px rgba(50,205,50,0.5) !important;';

  updateProgress(state.playerSeq.length, state.sequence.length);

  const pos = state.playerSeq.length - 1;
  if(state.playerSeq[pos] !== state.sequence[pos]){
    setTimeout(()=>{
      el.style.cssText = 'background:#FF073A !important; border-color:#FF073A !important; box-shadow:0 0 24px rgba(255,7,58,0.5) !important;';
      playWrongSound();
    },100);
    setTimeout(()=>handleWrong(),500);
    return;
  }

  if(state.playerSeq.length === state.sequence.length){
    handleCorrect();
  }
}

function handleCorrect(){
  state.correctTotal++;
  state.attemptNum = 1;
  state.seqLen++;
  const cfg = DIFFICULTY[state.level];
  if(state.seqLen > cfg.maxLen){
    endGame();
    return;
  }

  playCorrectSound();

  // 序列完成脉冲
  gameGrid.querySelectorAll('.block').forEach(b=>{
    b.classList.add('sequence-done');
    setTimeout(()=>b.classList.remove('sequence-done'),300);
  });

  // 计数跳动
  const el = document.getElementById('correctCount');
  el.classList.remove('count-pop');
  void el.offsetWidth;
  el.classList.add('count-pop');

  hintText.textContent = '正确！亮起格数 +1';
  updateUI();
  setBlocksEnabled(false);
  clearBlockStates();
  generateSequence();
  setTimeout(()=>showSequence(),1000);
}

function handleWrong(){
  state.attemptNum++;
  if(state.attemptNum > 2){
    endGame();
    return;
  }
  hintText.textContent = '顺序不对，再试一次！';
  updateUI();
  setBlocksEnabled(false);
  state.playerSeq = [];
  updateProgress(0, state.sequence.length);
  setTimeout(()=>{
    clearBlockStates();
    state.phase = 'input';
    hintText.textContent = '请按顺序点击方块！';
    setBlocksEnabled(true);
  },800);
}

function endGame(){
  state.gameOver = true;
  state.gameStarted = false;
  state.phase = 'idle';
  hintText.textContent = '';
  progressWrap.style.display = 'none';
  setBlocksEnabled(false);
  startBtn.disabled = false;
  startBtn.textContent = '开始训练';
  startBtn.style.display = 'none';
  resultCard.classList.add('show');
  const span = state.seqLen - 1;
  const score = span * state.correctTotal;
  document.getElementById('rSpan').textContent = span;
  document.getElementById('rCorrect').textContent = state.correctTotal;
  document.getElementById('rScore').textContent = score;
  saveResult(span, score);
  playGameOverSound();
}

function saveResult(span, score){
  const data = JSON.parse(localStorage.getItem('corsi_matrix')||'[]');
  data.push({span,correct:state.correctTotal,score,level:state.level,time:Date.now()});
  if(data.length > 20) data.shift();
  localStorage.setItem('corsi_matrix',JSON.stringify(data));
}

function startGame(){
  if(state.phase === 'showing' || state.phase === 'input') return;
  const cfg = DIFFICULTY[state.level];
  state.seqLen = cfg.startLen;
  state.correctTotal = 0;
  state.attemptNum = 1;
  state.gameOver = false;
  state.gameStarted = true;
  state.phase = 'idle';
  resultCard.classList.remove('show');
  startBtn.style.display = 'block';
  startBtn.disabled = true;
  startBtn.textContent = '训练中...';
  updateUI();
  createBlocks();
  generateSequence();
  setTimeout(()=>showSequence(),800);
}

function resetToIdle(){
  state.gameStarted = false;
  state.gameOver = true;
  state.phase = 'idle';
  gameGrid.querySelectorAll('.block').forEach(b=>{
    b.classList.remove('lit','correct','wrong');
    b.style.pointerEvents = 'auto';
  });
  document.querySelectorAll('.diff-btn').forEach(b=>b.disabled=false);
  resultCard.classList.remove('show');
  hintText.textContent = '点击开始训练';
  document.getElementById('rSpan').textContent = '-';
  document.getElementById('rCorrect').textContent = '-';
  document.getElementById('rScore').textContent = '-';
}

function restartGame(){
  resetToIdle();
}

function setBlocksEnabled(enabled){
  gameGrid.querySelectorAll('.block').forEach(b=>{
    b.style.pointerEvents = enabled ? 'auto' : 'none';
  });
}

function clearBlockStates(){
  gameGrid.querySelectorAll('.block').forEach(b=>{
    b.style.cssText = '';
  });
}

function updateUI(){
  document.getElementById('seqLen').textContent = state.seqLen;
  document.getElementById('correctCount').textContent = state.correctTotal;
  document.getElementById('attemptCount').textContent = state.attemptNum + '/2';
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// 难度切换
document.getElementById('diffPanel').addEventListener('click',e=>{
  if(!e.target.classList.contains('diff-btn')) return;
  document.querySelectorAll('#diffPanel .diff-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  state.level = e.target.dataset.level;
  state.phase = 'idle';
  state.gameOver = false;
  state.gameStarted = false;
  state.correctTotal = 0;
  state.attemptNum = 1;
  resultCard.classList.remove('show');
  progressWrap.style.display = 'none';
  startBtn.style.display = 'block';
  startBtn.disabled = false;
  startBtn.textContent = '开始训练';
  hintText.textContent = '点击左侧「开始训练」';
  updateConfigDesc();
  updateUI();
  createBlocks();
});

// 初始化
createBlocks();
updateConfigDesc();
updateUI();
progressWrap.style.display = 'none';
</script>
</body>
</html>
