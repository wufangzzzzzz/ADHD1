<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>螺旋曲线预览 · 5圈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(76,110,245,.20) 0%, rgba(76,110,245,0) 60%),
    linear-gradient(168deg, #17233f 0%, #1d1538 55%, #251237 100%);
  display:flex; flex-direction:column; color:#f2f7f5;
}
.topbar { flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:12px 14px 8px; }
.logo { font-size:19px; font-weight:800; letter-spacing:3px; color:#f2f7f5; text-shadow:0 1px 8px rgba(255,255,255,.15); }
.stage { flex:1; min-height:0; position:relative; margin:0 10px 10px; border-radius:20px; overflow:hidden;
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
.badge {
  position:absolute; left:14px; top:14px; z-index:10;
  background:rgba(255,255,255,.10); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18); border-radius:12px;
  padding:6px 14px; font-size:13px; color:#f2f7f5;
}
</style>
</head>
<body>
<div class="topbar"><div class="logo">螺旋曲线预览 · 5 圈</div></div>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="badge">5 圈螺旋曲线（单线）</div>
</div>
<script>
(function(){
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var TURNS = 5;
  var geom = { cx:0, cy:0, maxR:0, r0:14, k:0 };

  function initGeom(){
    var w = cv.clientWidth || 800, h = cv.clientHeight || 600;
    geom.cx = w/2; geom.cy = h/2;
    geom.maxR = Math.min(w,h)/2 - 26;
    geom.k = (geom.maxR - geom.r0) / (TURNS * 2 * Math.PI);
  }
  function bandRadius(theta){ return geom.r0 + geom.k * theta; }
  function BAND_W(){ return Math.max(16, geom.k * Math.PI * 2 * 0.52); }

  function fit(){
    initGeom();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 250); });

  function draw(){
    var w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0,0,w,h);
    // 一条螺旋曲线（单线）
    ctx.beginPath();
    for (var th = 0; th <= TURNS*2*Math.PI + 0.2; th += 0.05) {
      var r = bandRadius(th);
      var x = geom.cx + r*Math.cos(th), y = geom.cy + r*Math.sin(th);
      if (th===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    // 中心点
    ctx.beginPath();
    ctx.arc(geom.cx, geom.cy, 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fill();
  }

  fit();
})();
</script>
</body>
</html>
