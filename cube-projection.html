<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立体投影涂色 · 三面方格</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0B111B;color:#EAF1FA;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    /* 平板（iPad / Android）兼容：manipulation = 允许滑动与双指缩放，但【禁掉双击缩放】。
       好处是去掉 iOS/Android 双击缩放带来的约 300ms 点击延迟，也不会出现"点格子变成放大页面"。
       弹窗 canvas 要单独设成 none（见 #mcv），否则拖拽旋转会被浏览器当成滚动手势中断。 */
    touch-action:manipulation;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%}
  button{font-family:inherit}

  /* ---------- 页头 ---------- */
  #hd{position:fixed;left:0;right:0;top:0;height:54px;z-index:20;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(180deg,#16202E,#0F1826);border-bottom:1px solid #1E2C3E}
  #hd h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap;
    background:linear-gradient(92deg,#FFD08A,#FFB347 55%,#FF8E5E);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #hd .rule{font-size:12.5px;color:#8FA3BC;line-height:1.5;
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow:hidden}
  #hd .rule b{color:#FFC978;font-weight:700}
  #hd .sp{flex:1 1 auto}
  #hd .stat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8FA3BC;white-space:nowrap}
  #hd .stat i{font-style:normal;color:#EAF1FA;font-weight:700;font-size:14px}

  /* ---------- 主体：横版两列 ---------- */
  #wrap{position:fixed;left:0;right:0;top:54px;bottom:0;z-index:10;
    display:grid;grid-template-columns:340px minmax(0,1fr);gap:13px;padding:13px 16px}
  #left{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:11px;min-height:0}
  #right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:11px;min-height:0}

  .panel{background:linear-gradient(180deg,#141E2C,#101A27);border:1px solid #223449;
    border-radius:15px;position:relative;overflow:hidden}

  /* ---------- 缩略图 ---------- */
  /* 缩略图：主页面直接按住拖动 = 360° 转视角看各个面（先生 2026-09-29）
     ⚠️ cursor 从 zoom-in 改成 grab —— 整块可点弹窗已取消，现在只有右上角 ⤢ 才弹窗，
        缩略图本体改成"按住拖动转视角"。 */
  #thumbBox{cursor:grab;min-height:190px}
  #thumbBox:hover{border-color:#3A5677}
  #thumbBox.dragging{cursor:grabbing}
  /* ⚠️ touch-action 必须是 none：平板上手指拖动时，若沿用 manipulation，
     浏览器会把它当滚动手势吞掉 ⇒ pointermove 收不到，拖动"完全没反应"。 */
  #tcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #thumbHint{position:absolute;left:0;right:0;bottom:0;height:31px;pointer-events:none;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:#9FB4CE;background:linear-gradient(0deg,rgba(11,17,27,.92),rgba(11,17,27,0))}
  #thumbHint b{color:#FFC978}
  #thumbTag{position:absolute;left:11px;top:9px;font-size:11.5px;color:#7C8DA4;
    letter-spacing:.5px;pointer-events:none}
  /* 右上角放大图标：唯一触发弹窗的入口（原来 pointer-events:none 点不动，2026-09-29 激活） */
  #thumbZoom{position:absolute;right:9px;top:8px;width:26px;height:26px;border-radius:9px;cursor:pointer;
    background:rgba(255,179,71,.14);border:1px solid rgba(255,179,71,.42);color:#FFC978;
    display:flex;align-items:center;justify-content:center;font-size:14px;
    transition:background .12s,border-color .12s,transform .1s}
  #thumbZoom:hover{background:rgba(255,179,71,.3);border-color:rgba(255,179,71,.8)}
  #thumbZoom:active{transform:scale(.94)}

  /* 缩略图下方的复位按钮：把缩略图视角搬回默认（先生 2026-09-29）
     ⚠️ 必须静态写在 HTML 里，不用 JS 重建 ⇒ 位置在整个生命周期内不变（规则R）。 */
  #btnThumbReset{height:34px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    border:1px solid #3A5677;color:#9FC6F0;background:#16202E;
    display:flex;align-items:center;justify-content:center;gap:7px}
  #btnThumbReset:hover{background:#16283C;border-color:#4E739B}
  #btnThumbReset:active{transform:translateY(1px)}

  /* ---------- 左侧下方：选项 ---------- */
  #opts{padding:12px 13px 13px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:9px}
  .lbl{font-size:12.5px;color:#8FA3BC;white-space:nowrap;flex:0 0 auto}
  .seg{display:flex;gap:6px;flex:1 1 auto}
  .seg button{flex:1 1 0;height:32px;border-radius:9px;cursor:pointer;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;font-size:13px;font-weight:600}
  .seg button:hover{background:#1D2A3C;border-color:#3B5372}
  .seg button.on{background:#3A2A12;border-color:#B8792A;color:#FFC978;
    box-shadow:0 0 0 1px rgba(255,179,71,.25) inset}
  /* ⚠️ min-width:0 是必须的：<input type="range"> 的固有最小宽度约 129px，flex item 默认
     min-width:auto 会按这个固有宽度撑住 ⇒ 窄屏平板（竖屏 iPad 768 / 安卓 600~800）上
     「小方块数」这一行会比面板宽出 ~98px，把右边的「+」挤出面板被 overflow:hidden 裁掉。
     加 min-width:0 才能让它跟着 flex 一起收缩。
     flex-basis 用 0（不是 auto）：用 auto 时滑块会先占住固有 129px 再谈伸缩，
     窄屏上后面的「＋」仍会被挤到下一行；用 0 则严格按剩余空间分配。 */
  #rng{flex:1 1 0;min-width:0;height:24px;accent-color:#FFB347;cursor:pointer}
  .step{width:30px;height:30px;flex:0 0 auto;border-radius:9px;cursor:pointer;font-size:15px;font-weight:700;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;display:flex;
    align-items:center;justify-content:center;line-height:1}
  .step:hover{background:#1D2A3C;border-color:#3B5372}
  .step:active{transform:translateY(1px)}
  #knum{min-width:34px;text-align:center;font-size:15px;font-weight:800;color:#FFC978}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tools button{height:35px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6}
  .tools button:hover{background:#1D2A3C;border-color:#3B5372}
  .tools button:active{transform:translateY(1px)}
  .tools #btnHint{border-color:#4A6B3F;color:#A6E08A}
  .tools #btnHint:hover{background:#1B2A18;border-color:#5F8A4E}
  .tools #btnUndo{border-color:#5A4630;color:#F0C08A}
  .tools #btnUndo:hover{background:#231A10;border-color:#7A5C3A}
  .tools #btnNew{border-color:#3A5677;color:#9FC6F0}
  .tools #btnNew:hover{background:#16283C}
  .tools #btnMode{border-color:#5A4E86;color:#C9B8FF;font-size:12.5px}
  .tools #btnMode:hover{background:#1E1830;border-color:#7A69B0}
  /* 打印（先生 2026-10-06）：跟"换一道题"同族但换个色，别和模式切换混成一片 */
  .tools #btnPrint{border-color:#4A6076;color:#BFD8EE}
  .tools #btnPrint:hover{background:#16222F;border-color:#66839C}
  .tools #btnBall{border-color:#4A6B3F;color:#A6E08A;font-size:12.5px}
  .tools #btnBall:hover{background:#1B2A18;border-color:#5F8A4E}
  /* 立体模式下圆形没有对应物 ⇒ 直接禁用（点下去什么都不发生比"点了没反应"更让人困惑） */
  .tools #btnBall[disabled]{border-color:#2C3A4A;color:#5C6B7C;cursor:default;background:transparent}
  .tools #btnBall[disabled]:hover{background:transparent;border-color:#2C3A4A}
  .tools #btnBall[disabled]:active{transform:none}

  /* ---------- 右侧上：3 个颜色方块 ---------- */
  #palette{padding:11px 13px;display:flex;gap:11px;align-items:stretch}
  .pal{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px;
    border-radius:12px;background:#0F1A27;border:1px solid #1F3045}
  .sw{width:44px;height:44px;border-radius:11px;flex:0 0 auto;
    border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 -8px 16px rgba(0,0,0,.22)}
  .pcol{display:flex;flex-direction:column;gap:5px;min-width:0}
  .pcol .pn{font-size:12px;color:#9FB4CE;white-space:nowrap}
  .pcol .pn em{font-style:normal;color:#EAF1FA;font-weight:700}
  .pcol button{height:26px;border-radius:8px;cursor:pointer;font-size:11.5px;padding:0 9px;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;white-space:nowrap}
  .pcol button:hover{background:#1D2A3C;border-color:#3B5372}
  /* ★ 先生 2026-10-06：「圆球可以换颜色 因为是球体 只有一种颜色」
     ⇒ 第 4 个色块只在圆形模式下出现，且独占一整行（4 个挤一行会把字压到换行）。
     方形模式下一律 display:none（不是"灰掉"）—— 那时它没有对应物，露出来只会让人问"这是干嘛的"。 */
  .pal[data-k="ball"]{display:none;flex:1 1 100%}
  body.ball-on #palette{flex-wrap:wrap}
  body.ball-on .pal[data-k="ball"]{display:flex}
  /* ★ 先生 2026-10-06 追加：「圆形模式下 游戏区上面的选择颜色就不需要出现方形模式下的那三个了
     因为模式不一样了 你应该是替换那三个选项只出现圆球的颜色选择才对」
     ⇒ 是【替换】而不是并列。理由也站得住：三面网格色在圆形模式里没有任何用武之地
        （格子层不填色、缩略图画的是球不是方块），四行一起摆只会让人问"这三个跟我的球什么关系"。
        切回方形模式自动恢复（颜色值一直留着，不丢）。 */
  body.ball-on .pal[data-k="u"],
  body.ball-on .pal[data-k="v"],
  body.ball-on .pal[data-k="w"]{display:none}
  /* 「彩色」开关与我挑的色并列一行 */
  .pbtns{display:flex;gap:6px;flex-wrap:wrap}
  .pcol button.on{border-color:#7A69B0;background:#241C3A;color:#DDD2FF}
  body.skin-light .pcol button.on{border-color:#7A5CC0;background:#F1EBFF;color:#4A2E8C}

  /* ---------- 右侧下：三面网格 ---------- */
  #board{min-height:0}
  #bsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;
    touch-action:manipulation}
  /* ⚠️ 三面墙的归一化坐标跨度只有 ~7 个单位，直接当 viewBox 用会让 stroke-width:1
     在屏幕上变成 150px 粗的白条、标签字变成 88px。两道保险：
       ① viewBox 整体 ×100（见 buildBoard 的 USCALE），让 1 用户单位 ≈ 1 屏幕像素；
       ② 所有描边一律 non-scaling-stroke ⇒ stroke-width 按屏幕像素解释，与 viewBox 无关。 */
  /* ★ 先生 2026-09-29：「游戏区格子不要带颜色」⇒ 空网格一律透明，直接透出面板底色，只留格线；
     已涂对 / 涂错仍然上色（那是玩家自己涂的，由 refreshBoard() 写 inline fill 盖过这里）。
     注：SVG 里 transparent 仍算 painted（跟 none 不同）⇒ elementFromPoint 照常命中，点击不受影响。 */
  #board .cellbg{fill:transparent;stroke:rgba(255,255,255,.33);stroke-width:1.15;
    stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .1s,stroke .22s}
  /* ⚠️ 触摸设备（iPad / Android 平板）上 :hover 会「粘」在最后碰过的格子上 ——
     表现为涂完的格子一直亮着金边，像是被选中了。所以这条悬停规则挪进了
     文件末尾的 @media (hover:hover)，只有真正带指针的设备才生效。 */
  #board g.wallgrid{cursor:pointer}
  #board .cellbg.bad{stroke:#FF6B6B;stroke-width:2.4}
  /* ★ 圆形模式：格子里的"涂色"不是填满整格，而是【球投到这面墙上的像】= 一个椭圆。
     椭圆整层画在 wallgrid 【之前】⇒ 透明的 cellbg 与它上面的 hover 金边都压在椭圆之上，
     点哪儿都照常命中（cellbg 仍是命中层，椭圆 pointer-events:none 完全不参与点击）。
     transition 是给"涂错 2 秒后自动消除"用的：让那一格淡出去，而不是啪地消失（先生 2026-10-06）。 */
  #board .ballp{pointer-events:none;transition:fill-opacity .22s ease, fill .22s ease}
  #board .wallname{font-size:13px;font-weight:700;pointer-events:none}
  #board .vlab{font-size:14px;font-weight:800;pointer-events:none}
  #board .hintpulse{fill:none;stroke:#FFD447;stroke-width:3.4;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;pointer-events:none;
    animation:hp .72s ease-in-out 3}
  @keyframes hp{0%,100%{opacity:.2}50%{opacity:1}}
  #board .edge{stroke:rgba(255,255,255,.92);stroke-width:2.3;stroke-linecap:round;fill:none;
    vector-effect:non-scaling-stroke;pointer-events:none}

  /* ---------- 游戏区右下角：提示 / 撤销（先生 2026-09-29：移到这儿、做成 2 个小按钮；
     后又要求「改为上下排列 然后大一点点」⇒ 竖排 + 加高加字）----------
     浮在 SVG 之上（z-index 高于 svg），所以点按钮不会穿到下面的格子；SVG 的点击委托绑在 #bsvg 上，
     按钮不在 svg 内 ⇒ 两者天然互不干扰。 */
  #cornerTools{position:absolute;right:14px;bottom:14px;z-index:6;
    display:flex;flex-direction:column;gap:9px;align-items:stretch}
  #cornerTools button{height:40px;min-width:84px;padding:0 18px;border-radius:12px;cursor:pointer;
    font-size:14.5px;font-weight:700;letter-spacing:.4px;
    border:1px solid #2B3E55;background:rgba(22,32,46,.94);color:#C9D6E6;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.34);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #cornerTools button:hover{background:#1D2A3C;border-color:#3B5372}
  #cornerTools button:active{transform:translateY(1px)}
  #cornerTools #btnHint{border-color:#4A6B3F;color:#A6E08A}
  #cornerTools #btnHint:hover{background:#1B2A18;border-color:#5F8A4E}
  #cornerTools #btnUndo{border-color:#5A4630;color:#F0C08A}
  #cornerTools #btnUndo:hover{background:#231A10;border-color:#7A5C3A}

  /* ---------- 自选颜色浮层（先生 2026-09-29：「换个颜色是可以选择颜色的」）---------- */
  #colorPop{position:fixed;z-index:70;display:none;width:236px;padding:11px 12px 12px;
    border-radius:14px;border:1px solid #2B3E55;background:#131E2C;
    box-shadow:0 18px 46px rgba(0,0,0,.55)}
  #colorPop.on{display:block}
  #colorPop .ph{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  #colorPop .ph b{font-size:12.5px;color:#EAF1FA;font-weight:700}
  #colorPop .ph .tip{font-size:11.5px;color:#8FA3BC}
  #colorPop .ph .sp{flex:1 1 auto}
  #colorPop .ph button{width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:12px;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;
    display:flex;align-items:center;justify-content:center}
  #colorPop .pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  #colorPop .pcell{position:relative;height:36px;border-radius:10px;cursor:pointer;
    border:2px solid rgba(255,255,255,.16);box-sizing:border-box}
  #colorPop .pcell:hover{border-color:#FFD447;transform:translateY(-1px)}
  #colorPop .pcell.used::after{content:'✓';position:absolute;right:4px;bottom:1px;
    font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
  #colorPop .pcell.cur{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
  #colorPop .pmore{margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:12px;color:#9FB4CE}
  #colorPop .pmore input{width:36px;height:26px;padding:0;border:1px solid #2B3E55;
    border-radius:8px;background:#16202E;cursor:pointer}

  /* ---------- 通关对话框（先生 2026-09-29：「答对了 通关信息不要在最下面 弹出一个对话框显示」）----------
     原来是底部 toast（bottom:28px）报通关，现在改成居中对话框；toast 只继续管"某一步"的即时反馈。 */
  #winMask{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(5,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #winMask.on{display:flex}
  #winBox{width:min(88vw,392px);padding:26px 26px 20px;border-radius:20px;text-align:center;
    border:1px solid #2B3E55;background:linear-gradient(180deg,#16202E,#101A27);
    box-shadow:0 28px 70px rgba(0,0,0,.55);
    animation:winIn .26s cubic-bezier(.2,.9,.3,1.28) both}
  @keyframes winIn{from{opacity:0;transform:translateY(12px) scale(.95)}
                   to{opacity:1;transform:translateY(0) scale(1)}}
  #winBox .chk{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(111,212,99,.16);border:1px solid rgba(111,212,99,.50)}
  #winBox .chk svg{width:32px;height:32px;display:block}
  #winBox .chk path{fill:none;stroke:#6FD463;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:41;stroke-dashoffset:41;animation:chkDraw .42s .13s ease-out forwards}
  @keyframes chkDraw{to{stroke-dashoffset:0}}
  #winBox h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:.5px;color:#EAF1FA}
  #winBox .sub{margin:0 0 15px;font-size:13px;color:#9FB4CE}
  #winBox .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:19px}
  #winBox .meta i{font-style:normal;font-size:12.5px;padding:5px 11px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid #223449;color:#C9D6E6}
  #winBox .meta i b{color:#FFC978;font-weight:800}
  #winBox .acts{display:flex;gap:10px}
  #winBox .acts button{flex:1 1 0;height:40px;border-radius:11px;cursor:pointer;
    font-size:14px;font-weight:700;border:1px solid #2B3E55;background:#16202E;color:#C9D6E6}
  #winBox .acts button:hover{background:#1D2A3C;border-color:#3B5372}
  #winBox .acts button:active{transform:translateY(1px)}
  #winBox .acts #btnWinAgain{border-color:#4A6B3F;background:#1B2A18;color:#A6E08A}
  #winBox .acts #btnWinAgain:hover{background:#22371D;border-color:#5F8A4E}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(5,9,15,.86);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #modal.on{display:block}
  #mcw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(78vw,78vh);height:min(78vw,78vh);
    background:radial-gradient(120% 120% at 50% 0%,#16202E 0%,#0C131E 78%);
    border:1px solid #2B3E55;border-radius:20px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7)}
  /* touch-action:none 是平板能拖动的关键：不禁掉浏览器手势的话，手指一拖就被当成
     滚动/页面缩放，pointermove 会被 pointercancel 打断 ⇒ 旋转卡住或干脆不动。 */

  /* ============================================================
     立体模式 —— 2026-10-02（先生：「缩略图展示的和实际游戏区的填充反过来，增加一个立体模式」）
     左缩略图 = 三面投影（题面）；右游戏区 = 3D 空间，点格位摆方块。
     ============================================================ */
  /* 三面墙的格线在立体模式里只作背景参考，不可点 —— 可点的是 .pick3d 那些六边形 */
  #board .wallbg{fill:transparent;stroke:rgba(255,255,255,.33);stroke-width:1.15;
    stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  body.skin-light #board .wallbg{stroke:rgba(30,45,70,.40)}
  /* ★ 拾取说明（2026-10-02 改）：立体模式【不再有透明拾取面】。
     上一版每个屏幕位置铺一个 .pick3d 六边形靠 elementFromPoint 命中 —— 那是错的：
     等轴投影下相邻位置的六边形本来就重叠（相邻中心距 0.81650 = 外接圆半径 R，
     一个六边形的顶点正好落在相邻六边形的中心上），实测 61 个位置里 29 个的中心被盖住，
     重叠处命中的是 DOM 里靠后的那个、与远近无关 ⇒ 拖 A 落 B。
     现在改成"取离指针最近的中心"（pickIndexAt），每个位置各自拥有一整块可点区域。 */
  body.mode-solid #bsvg{cursor:pointer}
  #board .cubef{stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  #board .ghostf{pointer-events:none}
  /* 圆形模式下游戏区的球（先生 2026-10-06「立体模式支持圆形」）。
     与 .cubef 一样 pointer-events:none：命中走几何拾取（pickIndexAt），不靠 DOM。 */
  #board .ballf{pointer-events:none}
  /* 立体模式下题面必须固定正向（要逐格对照），所以把转动/放大那几颗按钮收掉 */
  body.mode-solid #thumbBox{cursor:default}
  body.mode-solid #btnThumbReset,
  body.mode-solid #thumbZoom,
  body.mode-solid #btnMRot,
  body.mode-solid #btnMReset{display:none}
  /* ---------- 放错时"闪一下再消失"的那一块（先生 2026-10-02）----------
     先生原话：「点击就放上去了 但是放错了要有提示然后错误的消失」。
     所以错误的方块【必须先真的出现】，再消失 —— 只给一行文字提示，孩子看不出
     自己那一块究竟落在哪个位置、为什么不行。出现 → 抖动 → 淡出，共 520ms。
     用 CSS 动画而不是 JS 逐帧：pointerup 之后不需要再有任何计时器参与布局。 */
  .wrongf{animation:wrongShake 520ms cubic-bezier(.36,.07,.19,.97) both}
  @keyframes wrongShake{
    0%{opacity:0;transform:translate(0,0)}
    14%{opacity:.95;transform:translate(-3px,0)}
    30%{opacity:.95;transform:translate(3px,0)}
    46%{opacity:.95;transform:translate(-2.5px,0)}
    62%{opacity:.95;transform:translate(2.5px,0)}
    78%{opacity:.8;transform:translate(-1.5px,0)}
    100%{opacity:0;transform:translate(0,-9px)}
  }

  /* ============================================================
     平板（iPad / Android）兼容修正 —— 2026-09-29
     ============================================================ */
  /* 触摸设备上 :hover 会「粘」在最后碰过的元素上：iPad 上点完一个格子，它会一直保持
     悬停样式（金边），看着像被选中了。格子的悬停只对真正有指针的设备生效即可。 */
  @media (hover:hover){
    #board .cellbg:hover{stroke:#FFD447;stroke-width:1.8}
    body.skin-light #board .cellbg:hover{stroke:#C97A1A;stroke-width:2}
    /* 立体模式：悬停的落点预览靠 ghost 方块（见 renderCubes），不再用 CSS :hover 亮格 ——
       因为拾取已经是几何计算，CSS 的 :hover 命中的是 DOM，两者会不一致。 */
  }
  /* 窄屏（竖屏 iPad 768 / Android 平板 600~800 宽）：两列布局按比例收窄左栏，
     并把页头那行说明压短、把选项区控件收紧，避免「小方块数」那行把 + 按钮挤出面板。 */
  @media (max-width:860px){
    #wrap{grid-template-columns:clamp(236px,31vw,300px) minmax(0,1fr);gap:10px;padding:10px 11px}
    #hd{padding:0 12px;gap:10px}
    #hd h1{font-size:15px}
    #hd .rule{font-size:11.5px;gap:7px}
    #opts{padding:10px 11px;gap:8px}
    .row{gap:6px}
    .lbl{font-size:11.5px}
    .step{width:28px;height:28px;font-size:13.5px}
    .seg button{font-size:12.5px}
    #knum{min-width:26px;font-size:14px}
    /* 「小方块数」这一行在窄屏让标签独占一行：不然滑块只剩 60~80px（手指根本没法拖）。
       换成两行后滑块能拿回 120px 以上。 */
    #rowK{flex-wrap:wrap;row-gap:5px}
    #rowK .lbl{flex:1 1 100%}
  }
  /* 矮屏（横屏 iPad 768 高 / 安卓平板 600~800 高）：选项区太占高度会挤扁缩略图 ⇒ 收紧留白 */
  @media (max-height:820px){
    #opts{padding:10px 11px;gap:8px}
    #hd{height:48px}
    #wrap{top:48px;gap:10px}
    .seg button{height:30px}
    #thumbBox{min-height:150px}
    #btnThumbReset{height:31px}
  }
  @media (max-height:640px){
    #opts{padding:8px 10px;gap:6px}
    .seg button{height:28px;font-size:12.5px}
    #thumbBox{min-height:118px}
    #btnThumbReset{height:28px;font-size:12.5px}
    .tools button{height:32px}
  }

  /* ============================================================
     打印（先生 2026-10-06：「这个游戏做一个打印按钮 支持打印
     要注意打印时候只显示缩略图和游戏区 合理排版」）
     ------------------------------------------------------------
     两道开关，分工写清楚，别混：
       ① body/html 上的 .paper 类 —— 由 beforeprint（或点按钮）加上。
          它是一套【屏幕上就生效】的版式，尺寸全部用 mm。
          为什么必须有它：canvas 的位图是按 clientWidth/clientHeight 画的，
          而 beforeprint 触发时 @media print 还没生效、量不到纸上尺寸。
          先在屏幕媒体下把盒子摆成纸上的尺寸 → 量到的就是纸上尺寸 → 位图不会糊。
          mm 在屏幕媒体下同样有效（1mm = 96/25.4 px），所以两边尺寸严格相等。
       ② @media print —— 页面尺寸 + 隐藏 + 兜底。
          兜底那份几何与 .paper 那组【必须保持一致】（万一 beforeprint 没派发）。
     ============================================================ */
  /* ---------- 打印页头：只在纸上出现（屏幕上两栏已经能看清，不需要重复一行标题）---------- */
  #printHead{display:none}
  #printHead .pt{font-size:17px;font-weight:800;letter-spacing:.5px;color:#14202E}
  #printHead .ps{font-size:11.5px;color:#41506A;margin-top:3px;line-height:1.5}
  #printHead .ps b{color:#8A5310;font-weight:800}
  #printHead .pm{margin-top:5px;display:flex;gap:7mm;flex-wrap:wrap;
    font-size:11px;color:#41506A;border-top:1px solid #D8E0EA;padding-top:4px}
  #printHead .pm i{font-style:normal}
  #printHead .pm i b{color:#14202E;font-weight:800}

  /* ---------- 纸面版式（屏幕 + 打印共用这一份）---------- */
  /* html 这一层也要刷白：html 的背景是"画布背景"，页面没铺满时露出来的那一条
     就是它（屏幕上 #0B111B、纸上会整条印成深色带）。只改 body 不够。 */
  html.paper{height:auto!important;overflow:visible!important;background:#FFFFFF!important}
  body.paper{height:auto!important;overflow:visible!important;background:#FFFFFF!important;color:#14202E}
  body.paper #printHead{display:block;margin-bottom:5mm}
  /* 只留「缩略图 + 游戏区」：页头、选项区（难度/边长/小方块数/换一题/模式）、
     颜色面板、角上两颗按钮、以及所有浮层，一律不上纸 */
  body.paper #hd,
  body.paper #opts,
  body.paper #btnThumbReset,
  body.paper #palette,
  body.paper #cornerTools,
  body.paper #thumbHint,
  body.paper #thumbZoom,
  body.paper #toast,
  body.paper #colorPop,
  body.paper #winMask,
  body.paper #modal{display:none}
  /* 两栏横排：左缩略图（100mm）· 右游戏区（余下 170mm）。
     纸面 A4 横向留 11mm 边距 ⇒ 内容 275×188mm；这一行占 160mm，其余给页头。 */
  body.paper #wrap{position:static;display:flex;gap:5mm;padding:0;height:160mm}
  body.paper #left{display:flex;flex-direction:column;flex:0 0 100mm;min-width:0}
  body.paper #right{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
  body.paper #thumbBox{flex:1 1 auto;min-height:0;height:auto;cursor:default}
  body.paper #board{flex:1 1 auto;min-height:0}
  /* 纸上不铺深色底、不留阴影（深色皮肤那块面板整块打出来就是一整张黑） */
  body.paper #thumbBox,
  body.paper #board{background:#FFFFFF;border:1px solid #C8D2DE;border-radius:4px;box-shadow:none}
  /* ★ 纸面线色 ★：深色皮肤下格线是 rgba(255,255,255,.33)，打在白纸上等于没有线；
     而且 non-scaling-stroke 的 stroke-width 是 CSS 像素（96dpi）⇒ 1.15 只有 0.30mm，
     纸上一根发丝。这里统一加深加粗到 1.7 / 2.4（≈0.45 / 0.63mm）。 */
  body.paper #board .cellbg,
  body.paper #board .wallbg{stroke:rgba(20,32,50,.62);stroke-width:1.7}
  body.paper #board .edge{stroke:rgba(20,32,50,.92);stroke-width:2.4}
  body.paper #board .hintpulse{display:none}
  /* 玩家自己涂的颜色（格子填充 / 椭圆）是"内容"，一律原样印出来，不覆盖 */
  body.paper #thumbTag{color:#5C6B7F}

  @media print{
    @page{size:A4 landscape;margin:11mm}
    html,body{height:auto!important;overflow:visible!important;background:#FFFFFF!important}
    #hd,#opts,#btnThumbReset,#palette,#cornerTools,#thumbHint,#thumbZoom,
    #toast,#colorPop,#winMask,#modal{display:none!important}
    #printHead{display:block!important;margin-bottom:5mm}

   （flatRel 是线性的）⇒ 屏幕点 = ρ·M·[cosθ,sinθ]ᵀ，M 的两列 = 两根面内轴在屏幕上的像。
   ⇒ 椭圆半轴 = ρ × M 的奇异值；长轴方向 = M × (AᵀA 的最大特征向量)。 */

        ctx.strokeStyle = mixHex(ballColorAt(c.ci), '#000000', 0.50);

      .sort(function (a, b) { return b.d - a.d; })

        ctx.closePath();
        ctx.fillStyle = G.COL[f.k];

/* ★ 立体模式的题面：把三面投影（G.ans）直接涂在三面墙上。

     所以这里也要从格块换成椭圆 —— 与 flat 那边游戏区的椭圆是【同一个 ballEllipse()】，

  /* 先生要「正确和错误的提示音」⇒ 涂上的那一刻就反馈 */
  if (!was) {
    if (G.ans[k][key]) { sndOK(); }
    else {
      sndBad();
      toast('这一格不该涂 —— ' + WALLNAME[k] + (G.ball ? '面上没有球投出的椭圆' : '网格上没有它的投影') +
            '（2 秒后自动消掉）', 'no');
      /* ★ 先生 2026-10-06：提示完 2 秒自动消除（见上面 WRONG_CLEAR_MS 那段口径） */
      armWrongTimer(k, i, j);
    }
  } else {
    cancelWrongTimer(k, key);        /* 玩家自己点掉的 ⇒ 别再让定时器来清一次 */
  }
  refreshBoard(); updateStat();
  if (!G.solved && checkSolved()) {
    G.solved = true;
    sndWin();
    showWin();                 /* ★ 通关走对话框，不再用底部 toast（先生 2026-09-29） */
  }
}
function checkSolved() {
  var ok = true;
  ['w', 'v', 'u'].forEach(function (k) {
    Object.keys(G.ans[k]).forEach(function (key) { if (!G.fill[k][key]) ok = false; });
    Object.keys(G.fill[k]).forEach(function (key) { if (!G.ans[k][key]) ok = false; });
  });
  return ok;
}
function doUndo() {
  if (G.mode === 'solid') {
    var key = G.phist.pop();
    if (!key) { toast('还没有可以撤销的步骤'); return; }
    delete G.place[key];
    G.solved = false;
    hoverCell = null; hoverBad = '';
    renderCubes(); updateStat();
    toast('拿走了 1 块');
    return;
  }
  var h = G.hist.pop();
  if (!h) { toast('还没有可以撤销的步骤'); return; }
  var hp = h.key.split('|');
  if (h.prev) {
    G.fill[h.k][h.key] = 1;
    /* 撤销把一格【错格】又涂回来了 ⇒ 也得排上自动消除，否则它会一直红着 */
    if (!G.ans[h.k][h.key]) armWrongTimer(h.k, +hp[0], +hp[1]);
  } else {
    delete G.fill[h.k][h.key];
    cancelWrongTimer(h.k, h.key);     /* 撤掉的正是那格 ⇒ 待清除的定时器作废 */
  }
  G.solved = false;
  refreshBoard(); updateStat();
  toast('撤销了 1 步');
}
function solidHintCell() {
  /* 该往哪一格补？—— 沿【一条还走得通的路】补，而不是死认原题。
     理由与判错同源：这道题常不止一个解，孩子走的是另一条同样正确的路时，
     照原题提示会把他往回拽。判据用 dropReason === ''（里面就是 solvableWith），
     再加一条"必须能补上至少一个还没点亮的答案格"，否则补了也没用。 */
  var i, k;
  if (G.solCtx) {
    var C = G.solCtx, P = projOfPlace();
    for (i = 0; i < C.cells.length; i++) {
      var c = C.cells[i];
      if (G.place[kk(c)]) continue;
      var pr = [['w', c[0] + '|' + c[1]], ['v', c[0] + '|' + c[2]], ['u', c[1] + '|' + c[2]]];
      var adds = false;
      for (k = 0; k < 3; k++) {
        if (G.ans[pr[k][0]][pr[k][1]] && !P[pr[k][0]][pr[k][1]]) adds = true;
      }
      if (!adds) continue;
      if (dropReason(c) !== '') continue;
      return c.slice();
    }
    return null;
  }
  for (i = 0; i < G.shape.length; i++) {        /* 兜底（理论上走不到）：照原题补 */
    if (!G.place[kk(G.shape[i].lo)]) return G.shape[i].lo.slice();
  }
  return null;
}
function doHint() {
  if (G.mode === 'solid') {
    if (Object.keys(G.place).length >= G.shape.length) {
      toast('方块已经全用上了 —— 看看有没有多放或放错位置的方块（点一下可拿走）', 'no');
      return;
    }
    var lo = solidHintCell();
    if (!lo) {
      toast('场上有一块放错了 —— 点一下把它拿走再试', 'no');
      return;
    }
    /* ⚠️ 还是要查一遍能不能放：解表里的组合彼此不共面，但兜底档（照原题补）
       没有这条保证 —— 孩子摆下的块可能正好挨着原题那一格。
       不查就放 ⇒ 屏幕上当场出现两块贴面的方块，正好是先生要禁的那种。 */
    var why = dropReason(lo);
    if (why) {
      pulseCell3d(lo, 'bad');
      toast('该补的那一格被挡住了 —— ' + (DROP_MSG[why] || '先拿掉挡住它的那一块'), 'no');
      return;
    }
    G.place[kk(lo)] = 1;
    G.phist.push(kk(lo));
    sndTap();
    hoverCell = null; hoverBad = '';
    renderCubes(); updateStat();
    pulseCell3d(lo);
    toast('帮你在能走通的那条路上补了一块', 'ok');
    if (!G.solved && solidDone()) { G.solved = true; sndWin(); showWin(); }
    return;
  }
  var found = null;
  ['w', 'v', 'u'].forEach(function (k) {
    if (found) return;
    Object.keys(G.ans[k]).sort().forEach(function (key) {
      if (!found && !G.fill[k][key]) {
        var ij = key.split('|');
        found = { k: k, i: +ij[0], j: +ij[1] };
      }
    });
  });
  if (!found) { toast('没有漏涂的格子了 —— 检查一下有没有涂错（红色格）', 'ok'); return; }
  showHintPulse(found.k, found.i, found.j);
  toast('看 ' + WALLNAME[found.k] + ' 网格上闪动的黄框', 'ok');
}
/* ---------- 颜色：三面网格各一个色块，点「换个颜色」自己挑（先生 2026-09-29）----------
   旧版是"点一下自动跳到下一个预设色"，先生要求"**是可以选择颜色的**" ⇒ 改成弹一个小调色板：
   10 个预设色块 + 一个系统取色器（<input type="color">）随手调任意色。
   口径变化：不再强制三色互不相同（既然让人自己挑，硬拦会很难用）——
   但已在别面用掉的色块上会打 ✓，选到重复色时给一句提醒，不阻止。 */
var PALETTE = ['#6FD463', '#FF8354', '#5AA9FF', '#FFD447', '#B98CFF',
               '#4ED9D0', '#FF7BAF', '#FF6B6B', '#9CE86B', '#7FB2FF'];
var popK = null;                 /* 当前正在给哪面墙 / 圆球挑色 */
/* ★ 圆形模式那一个色块也走同一套浮层 ⇒ 用这两个取值器统一口径，别在每处写 if (k==='ball') */
function palColor(k) {
  if (k !== 'ball') return G.COL[k];
  return G.rainbow ? '' : G.ballColor;   /* 彩色时没有"当前色"⇒ 浮层里一个都不标选中 */
}
function palLabel(k) { return (k === 'ball') ? '圆球' : WALLNAME[k] + '网格'; }
function setColor(k, hex) {
  if (!k || !hex) return;
  hex = String(hex).toUpperCase();
  /* ★ 自己挑了一个具体颜色 ⇒ 自动退出「彩色」（否则点了色块画面不变，会以为是坏的） */
  if (k === 'ball') { G.ballColor = hex; G.rainbow = false; }
  else G.COL[k] = hex;
  refreshPalette();
  if (popK) syncColorPop();
}
function buildColorPop() {
  document.getElementById('popGrid').innerHTML = PALETTE.map(function (c) {
    return '<span class="pcell" data-c="' + c + '" style="background:' + c +
           '" title="' + c + '"></span>';
  }).join('');
}
function syncColorPop() {
  if (!popK) return;
  document.getElementById('popName').textContent = palLabel(popK);
  var cur = palColor(popK).toUpperCase();
  var used = {};
  if (popK !== 'ball') {
    Object.keys(G.COL).forEach(function (x) { if (x !== popK) used[G.COL[x].toUpperCase()] = 1; });
  } else {
    /* 球与三面网格同色是常态（默认就是同一个绿）⇒ 球这一行不标"已用"，否则一打开满屏 ✓ */
    used = {};
  }
  Array.prototype.forEach.call(document.querySelectorAll('#popGrid .pcell'), function (el) {
    var c = el.getAttribute('data-c');
    el.classList.toggle('used', !!used[c]);
    el.classList.toggle('cur', c === cur);
  });
  var nat = document.getElementById('popNative');
  if (/^#[0-9A-F]{6}$/.test(cur)) nat.value = cur;
}
function openColorPop(k, anchor) {
  popK = k;
  var pop = document.getElementById('colorPop');
  pop.classList.add('on');
  syncColorPop();
  /* 摆到按钮边上：默认贴按钮右下，碰到视口底边就翻到按钮上方；右边越界就往左挪 */
  var r = anchor.getBoundingClientRect();

  pop.style.left = Math.min(Math.max(8, r.right - pw), Math.max(8, window.innerWidth - pw - 8)) + 'px';
  var top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.top = top + 'px';
}
function closeColorPop() {
  document.getElementById('colorPop').classList.remove('on');
  popK = null;
}
function refreshPalette() {
  ['u', 'v', 'w'].forEach(function (k) {
    document.getElementById('sw' + k).style.background = G.COL[k];
  });
  /* ★ 彩色模式下色块显示成一圈彩虹 —— 它此刻不是"某一个颜色"，画成单色块会误导 */
  document.getElementById('swball').style.background = G.rainbow
    ? 'conic-gradient(#FF6B6B,#FFD447,#9CE86B,#4ED9D0,#5AA9FF,#B98CFF,#FF7BAF,#FF6B6B)'
    : G.ballColor;

  rb.classList.toggle('on', !!G.rainbow);
  rb.textContent = G.rainbow ? '🎨 彩色 ✓' : '🎨 彩色';
  refreshBoard();
  renderAll();
}
/* ---------- 「彩色」（先生 2026-10-06）----------
   和 setBall 同理：只换外观，不重新出题（题目、已涂的格子、撤销栈全都不动）。 */
function setRainbow(v) {
  var on = !!v;
  if (on === !!G.rainbow) return;
  G.rainbow = on;
  refreshPalette();      /* 内含 refreshBoard() + renderAll() + 色块与按钮同步 */
  /* ★ 立体模式下不能说"墙上的椭圆也跟着各自的球" ★
     立体模式的题面就是那三面墙上的投影，它是【题目】，颜色按面固定（G.COL），
     不会跟着孩子摆的球变 ⇒ 照抄投影模式那句话会让孩子以为"颜色对不上就是错了"。 */
  var solid = (G.mode === 'solid'), what = G.ball ? '球' : '方块';
  toast(on ? (solid
        ? '彩色：每一' + (G.ball ? '颗球' : '块') + '都是不一样的颜色' +
          '（题面三视图的颜色是每面一种，不跟着摆的' + what + '变）'
        : '彩色：每一颗球都是不一样的颜色，墙上的椭圆也跟着各自的球')
      : '单色：所有' + (solid ? what : '球') + '都用同一个颜色', 'ok');
}

/* ============================================================
   打印（先生 2026-10-06）
   先生原话：「这个游戏做一个打印按钮 支持打印 要注意打印时候只显示缩略图和游戏区 合理排版」
   ------------------------------------------------------------
   为什么要 enterPaper 这一步，而不是只写 @media print：
     · 缩略图是 canvas（位图），位图尺寸 = clientWidth/clientHeight × dpr。
       而 beforeprint 触发时，@media print 还没生效 ⇒ 那个时刻量到的还是屏幕尺寸，
       纸上框子尺寸不同 ⇒ 位图被 CSS 拉伸 ⇒ 糊。
     · 所以先在【屏幕媒体】下把版式切到纸面尺寸（用 .paper 类，单位全用 mm），
       量到的就正好是纸上尺寸，然后才让浏览器去分页。
       mm 在屏幕媒体下同样有效（1mm = 96/25.4 px）⇒ 两边尺寸严格相等，不糊。
   ------------------------------------------------------------
   纸面配色不是"顺手美化"，是必须的：深色皮肤下格线是 rgba(255,255,255,.33)，
   打在白纸上等于没有线；深色面板本身也会整块印成黑。
   ============================================================ */
var _paperTimer = null;
function enterPaper() {
  if (PAPER) return false;                 /* 幂等：按钮与 beforeprint 可能都触发，第二次起什么都不做 */
  PAPER = true;
  document.documentElement.classList.add('paper');
  document.body.classList.add('paper');
  _PALKEY = null;                          /* 强制 skinPal 重算成纸面那一套 */
  syncPrintMeta();
  /* ⚠️ 必须重建整个游戏区，不能只 refreshBoard()：
     A/B/C 标签的引线·圆点·标签框颜色是【烤进 SVG 字符串】的（见 buildBoard），
     换配色只重画填充色是刷不掉的。G.fill / G.place 都在状态里，重建不会丢作答。 */
  buildBoard();
  renderAll();                             /* 缩略图按纸面尺寸与 dpr=4 重画 */
  return true;
}
function exitPaper() {
  if (!PAPER) return false;                /* 同样幂等 */
  PAPER = false;
  document.documentElement.classList.remove('paper');
  document.body.classList.remove('paper');
  _PALKEY = null;
  buildBoard();
  renderAll();
  return true;
}
/* 纸头要素：网格边长 / 小方块数 / 难度 / 模式。
   一张只有两个图形的纸，孩子拿到手里不知道这是哪道题、要干什么 —— 这几项就是题号。 */
function syncPrintMeta() {
  var el = document.getElementById('printMeta');
  if (!el) return;
  var mode = (G.mode === 'solid')
      ? (G.ball ? '立体模式 · 点格位摆球' : '立体模式 · 点格位摆方块')
      : (G.ball ? '圆形模式（涂球投出的椭圆）' : '方形模式（涂满整格）');
  var items = [
    ['网格边长', G.N + '×' + G.N],
    ['小方块数', G.K],
    ['难度', G.diff === 'hard' ? '困难' : '简单'],
    ['玩法', mode]
  ];
  el.innerHTML = items.map(function (it) {
    return '<i>' + it[0] + ' <b>' + it[1] + '</b></i>';
  }).join('');
}
function doPrint() {
  /* 按钮这条路自己先切（不指望 beforeprint），afterprint 负责恢复；
     再兜一个定时器：个别浏览器不派 afterprint，纸面版式不能一直挂着。 */
  enterPaper();
  var done = false;
  function onAfter() { done = true; window.removeEventListener('afterprint', onAfter); exitPaper(); }
  window.addEventListener('afterprint', onAfter);
  try {
    window.print();
  } catch (e) {
    window.removeEventListener('afterprint', onAfter);
    exitPaper();
    toast('这个环境不支持打印（可以直接按 Ctrl+P）', 'no');
    return;
  }
  clearTimeout(_paperTimer);
  _paperTimer = setTimeout(function () {
    window.removeEventListener('afterprint', onAfter);
    if (!done) exitPaper();                /* 兜底恢复，避免停在纸面版式 */
  }, 1500);
}
window.addEventListener('beforeprint', function () { enterPaper(); });
window.addEventListener('afterprint', function () { exitPaper(); });
/* ---------- 底板皮肤：白 / 黑（先生 2026-09-29：「左侧下面设置个按钮 左边是白 右边是黑」）----------
   两段分工，别混：
     · 页面壳子（背景/面板/按钮/文字）→ 只切 CSS 的 body.skin-light，一行 JS 都不用改样式；
     · canvas 线色 + SVG 里 inline 的底色 → 走 skinPal()，所以必须【整幅重画】才生效。 */
function applySkin(s) {
  G.skin = (s === 'light') ? 'light' : 'dark';
  document.body.classList.toggle('skin-light', G.skin === 'light');
  refreshPalette();          /* 里面含 refreshBoard() + renderAll() */
  syncSkinUI();
}
function syncSkinUI() {
  Array.prototype.forEach.call(document.querySelectorAll('#segSkin button'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-skin') === G.skin);
  });
}
/* ---------- 难度（先生 2026-09-29）----------
   简单 = 现在这套（网格 + 内角 3 条棱 + 外框都在）；困难 = 题目立体图只留最外侧那个六边形。

function setDiff(d) {
  G.diff = (d === 'hard') ? 'hard' : 'easy';

  renderAll();            /* 只重画，不重建题目 —— 切换难度不该把玩家的作答清掉 */
}
function syncDiffUI() {
  Array.prototype.forEach.call(document.querySelectorAll('#segDiff button'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-diff') === G.diff);
  });
}
/* ---------- 模式切换（先生 2026-10-02）----------
   flat ↔ solid 只是把"题面"和"作答"对调，题目本身不动 —— 同一道题两边都能玩。
   ⚠️ 立体模式下题面必须固定正向，否则没法逐格跟游戏区对照 ⇒ 顺手转回默认视角：
      缩略图的拖动/缩放与弹窗的旋转都在函数里就地对 G.mode 做了拦截（见 thumbRot / modalRot）。 */
function setMode(m) {

  /* ★ 切模式【必须重新出题】：两边的出题规则相反（原版要面贴面相连、立体模式要互不共面），
     沿用上一道题会直接违规 —— 比如把原版那种连成一片的形状搬进立体模式，
     一摆就是一坨，与"分散"正好相反。newPuzzle 里已经带 buildBoard / syncModeText /
     updateStat / renderAll，所以这里不用再调一遍。 */
  newPuzzle();
  toast(G.mode === 'solid'
    ? '立体模式：方块跟着鼠标走，点一下就放下 —— 每块之间都要空开一格'
    : '投影模式：在三个面上涂出它的投影');
}
/* ---------- 圆形模式（先生 2026-10-06）----------
   方形 ↔ 圆形 只换"方块长什么样 + 涂出来的东西长什么样"，题目本身【不动】。
   与 setMode 的区别就在这里：setMode 必须重新出题（两个模式的出题规则相反）；
   这里绝不能重出 —— 玩家只是想让方块变好看一点，不该被换掉涂到一半的题。
   格子形状变了 ⇒ buildBoard() 必须重跑（椭圆层只在圆形模式下生成）；
   G.fill / G.ans 都以 'i|j' 存，重建 DOM 不影响任何作答。 */
function setBall(v) {
  var on = !!v;
  if (on === !!G.ball) return;
  G.ball = on;
  buildBoard();
  syncModeText();          /* 顺带切 body.ball-on（球色那一行只在圆形模式下露出来） */
  renderAll();
  /* 两种模式的"涂/摆出来的东西"不一样，提示语得分开说，否则立体模式下那句是错的 */
  var solid = (G.mode === 'solid');
  toast(on ? (solid ? '圆形模式：点格位摆的是球（左边三视图上对应一个椭圆）'
                    : '圆形模式：涂一格 = 球在这一面墙上投出的椭圆')
           : (solid ? '方形模式：点格位摆的是方块（三面可见面按墙分色）'
                    : '方形模式：涂一格 = 涂满整格'), 'ok');
}
/* ============================================================
   弹窗：360° 旋转看立体图
   ============================================================ */
var modalOn = false, autoRot = false, autoRaf = 0;
function openModal() {
  modalOn = true;
  document.getElementById('modal').classList.add('on');
  Vmodal.M = defaultM(); Vmodal.zoom = 1;
  setAuto(false);
  renderModal();
  updateZoomLbl();
  sndTap();
}
function closeModal() {
  modalOn = false;
  document.getElementById('modal').classList.remove('on');
  setAuto(false);
  renderThumb();
}
function updateZoomLbl() {
  document.getElementById('mzoom').textContent = Math.round(Vmodal.zoom * 100) + '%';
}
function setAuto(v) {
  autoRot = !!v;
  document.getElementById('btnMRot').textContent = autoRot ? '停止旋转' : '自动旋转';
  document.getElementById('btnMRot').style.color = autoRot ? '#FFC978' : '';

    cornerTools: (function () {
      var box = document.getElementById('board').getBoundingClientRect(), out = {};
      [['hint', 'btnHint'], ['undo', 'btnUndo']].forEach(function (p) {
        var r = document.getElementById(p[1]).getBoundingClientRect();
        out[p[0]] = { left: Math.round(r.left), top: Math.round(r.top),
                      w: Math.round(r.width), h: Math.round(r.height),
                      fromRight: Math.round(window.innerWidth - r.right),
                      fromBottom: Math.round(window.innerHeight - r.bottom),
                      inBoard: r.left >= box.left - 1 && r.right <= box.right + 1 &&
                               r.top >= box.top - 1 && r.bottom <= box.bottom + 1 };
      });
      out.board = { left: Math.round(box.left), top: Math.round(box.top),
                    right: Math.round(box.right), bottom: Math.round(box.bottom) };
      out.panel = document.getElementById('board').querySelectorAll('#cornerTools').length;
      out.stillInLeftPanel = document.getElementById('opts').contains(document.getElementById('btnHint'));
      return out;
    })(),
    /* ③ 颜色浮层状态 */
    colorPop: (function () {
      var pop = document.getElementById('colorPop');
      var on = pop.classList.contains('on');
      var r = pop.getBoundingClientRect();
      return { on: on, k: popK, presets: document.querySelectorAll('#popGrid .pcell').length,
               cur: popK ? G.COL[popK] : null,
               usedMarked: document.querySelectorAll('#popGrid .pcell.used').length,
               curMarked: document.querySelectorAll('#popGrid .pcell.cur').length,
               hasNative: !!document.getElementById('popNative'),
               box: on ? { left: Math.round(r.left), top: Math.round(r.top),
                           w: Math.round(r.width), h: Math.round(r.height) } : null };
    })(),
    /* 通关对话框状态（本轮） */
    win: (function () {
      var mask = document.getElementById('winMask');
      var on = mask.classList.contains('on');
      var bx = document.getElementById('winBox').getBoundingClientRect();
      return { on: on,
               title: (document.querySelector('#winBox h2') || {}).textContent || '',
               sub: (document.querySelector('#winBox .sub') || {}).textContent || '',
               meta: (document.getElementById('winMeta') || {}).textContent || '',
               hasAgain: !!document.getElementById('btnWinAgain'),
               hasLook: !!document.getElementById('btnWinLook'),
               box: { left: Math.round(bx.left), top: Math.round(bx.top),
                      w: Math.round(bx.width), h: Math.round(bx.height),
                      cx: Math.round(bx.left + bx.width / 2),
                      cy: Math.round(bx.top + bx.height / 2) } };
    })(),
    modal: { on: modalOn, zoom: Vmodal ? +Vmodal.zoom.toFixed(3) : null, auto: autoRot,
             M: Vmodal ? Vmodal.M.map(function (x) { return +x.toFixed(4); }) : null },
    /* ===== 立体模式（2026-10-02）=====
       rays 必须等于 N³−(N−1)³（直接可见格位数），rayCover 必须等于 N³（一个格位都不能漏）。
       这两条就是"点屏幕位置到底能点到几个格位"的硬判据。 */
    mode: G.mode,
    solid: {
      rays: rays.length,
      cells: N * N * N,
      visibleCells: N * N * N - (N - 1) * (N - 1) * (N - 1),
      rayCover: (function () {
        var seen = {};
        rays.forEach(function (r) { r.cells.forEach(function (c) { seen[kk(c.c)] = 1; }); });
        return Object.keys(seen).length;
      })(),
      rayHist: (function () {
        var h = {}; rays.forEach(function (r) { h[r.cells.length] = (h[r.cells.length] || 0) + 1; }); return h;
      })(),
      maxRay: rays.reduce(function (m, r) { return Math.max(m, r.cells.length); }, 0),
      /* 独立判据：屏幕位置必须恰好由 (i−j) 与 (2k−i−j) 决定（见 rayKeyOf 的推导）。
         常数取 A0/B0 本身。125 个格位 × 2 个分量全部要落在 1e-6 内，bad 必须为 0。 */
      keyOK: withUnit(function () {
        var bad = 0;
        for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) for (var k = 0; k < N; k++) {
          var p = PT(cv3(i + .5, j + .5, k + .5));
          if (Math.abs(p.x / (-A0.x) - (i - j)) > 1e-6) bad++;
          if (Math.abs(p.y / (-B0.x) - (2 * k - i - j)) > 1e-6) bad++;
        }
        return { bad: bad, total: N * N * N * 2 };
      }),
      picks: document.querySelectorAll('#board .pick3d').length,   /* 必须为 0：拾取已改成几何最近中心 */
      pickMode: 'geo',
      wallbg: document.querySelectorAll('#board .wallbg').length,
      cubes: document.querySelectorAll('#board .cubef').length,
      ghost: document.querySelectorAll('#board .ghostf').length,
      place: Object.keys(G.place).sort(),
      placeCount: Object.keys(G.place).length,
      needBlocks: G.shape.length,
      diff: projDiff(projOfPlace()),
      done: solidDone(),
      /* ===== 2026-10-02 新增：拖拽 + "每块都空开"的核验 =====
         sharePairs（顶层那个）在立体模式下必须为 0 —— 它就是先生要的"不出现共用一面"；
         frontAllShell / frontUnique 是"每条视线最靠前那一格"的两条硬不变量；
         placeSharePairs 是【孩子摆出来之后】也要为空，否则孩子能摆出贴面的解。 */
      shellN: shellCells(N).length,
      frontAllShell: rays.every(function (r) {
        var c = r.cells[0].c;
        return c[0] === 0 || c[1] === 0 || c[2] === 0;
      }),
      frontUnique: (function () {
        var seen = {}, n = 0;
        rays.forEach(function (r) { var k2 = kk(r.cells[0].c); if (!seen[k2]) { seen[k2] = 1; n++; } });
        return { unique: n, expect: N * N * N - (N - 1) * (N - 1) * (N - 1) };
      })(),
      placeSharePairs: (function () {
        var ks = Object.keys(G.place).map(function (x) { return x.split('|').map(Number); });
        var n = 0, i, j;
        for (i = 0; i < ks.length; i++) for (j = i + 1; j < ks.length; j++) {
          var d = Math.abs(ks[i][0] - ks[j][0]) + Math.abs(ks[i][1] - ks[j][1]) + Math.abs(ks[i][2] - ks[j][2]);
          if (d === 1) n++;
        }
        return n;
      })(),
      shapeOnShell: G.shape.every(function (c) {
        return c.lo[0] === 0 || c.lo[1] === 0 || c.lo[2] === 0;
      }),
      /* 共棱 / 共角的对数 —— 不违规（先生只要求不共面），但等轴投影下会【视觉上挨着】，
         所以在容量够的时候应该为 0（容量不够时才会出现，见 growScatter 的两档说明）。 */
      shapeTouchPairs: (function () {
        var t = G.shape, n = 0, i, j;
        for (i = 0; i < t.length; i++) for (j = i + 1; j < t.length; j++) {
          var a = t[i].lo, b = t[j].lo;
          var di = Math.abs(a[0] - b[0]), dj = Math.abs(a[1] - b[1]), dk = Math.abs(a[2] - b[2]);
          if (di + dj + dk >= 2 && Math.max(di, dj, dk) === 1) n++;
        }
        return n;
      })(),
      placeTouchPairs: (function () {
        var ks = Object.keys(G.place).map(function (x) { return x.split('|').map(Number); });
        var n = 0, i, j;
        for (i = 0; i < ks.length; i++) for (j = i + 1; j < ks.length; j++) {
          var di = Math.abs(ks[i][0] - ks[j][0]), dj = Math.abs(ks[i][1] - ks[j][1]), dk = Math.abs(ks[i][2] - ks[j][2]);
          if (di + dj + dk >= 2 && Math.max(di, dj, dk) === 1) n++;
        }
        return n;
      })(),
      placeOnShell: Object.keys(G.place).every(function (key) {
        var p = key.split('|').map(Number);
        return p[0] === 0 || p[1] === 0 || p[2] === 0;
      }),
      left: placeLeft(),
      kMax: solidKMax(N),
      /* —— 2026-10-02 二改：托盘已取消，换成"鼠标跟随 + 点击放置 + 放错消失"。 —— */
      noTray: !document.getElementById('tray') && !document.getElementById('dragIco'),
      /* —— 2026-10-02 三改：判错改成"可满足性"（见 solvableWith），不再枚举全部解 —— */
      /* ★★ 这条是本模式最要紧的健全性判据：
         "照着原题一格一格摆下去，中途会不会被自己判成错？"
         全部 step 都被接受 + 最终 done ⇒ 原题那条路是通的，判错没有误杀。 */
      targetReplay: (function () {
        if (G.mode !== 'solid' || !G.solCtx) return null;
        var keep = G.place, kh = G.phist, ks = G.solved;
        G.place = {}; G.phist = []; G.solved = false;
        _solMemo = {}; _solMemoSig = null;
        var bad = null, i = 0, c, why;
        for (i = 0; i < G.shape.length; i++) {
          c = G.shape[i].lo;
          why = dropReason(c);
          if (why) { bad = { cell: c.slice(), reason: why, at: i }; break; }
          G.place[kk(c)] = 1; G.phist.push(kk(c));
        }
        var done = solidDone();
        G.place = keep; G.phist = kh; G.solved = ks;
        _solMemo = {}; _solMemoSig = null;
        renderCubes(); updateStat();
        return { rejected: bad, done: done, steps: bad ? bad.at : G.shape.length };
      })(),
      /* 空场时"存在解"（true 才合理；null = 搜索算不尽） */
      anySol: (G.mode === 'solid' && G.solCtx) ? (function () {
        var keep = G.place;
        G.place = {};
        _solMemo = {}; _solMemoSig = null;
        var r = solvableWithCell(null);
        G.place = keep;
        _solMemo = {}; _solMemoSig = null;
        return r;
      })() : null,
      wrongCount: wrongList.length,               /* 当前正在"闪一下"的错误方块数 */
      lastPlace: _placeTrace,                     /* 最近一次点击的结局（哪个分支、落点、拒绝原因） */
      placeN: _placeN, rejectN: _rejectN, takeN: _takeN,
      hoverIdx: hoverRay, hoverBad: hoverBad,
      wrongG: (function () {
        var g = document.getElementById('wrongG');
        return { on: !!g, faces: g ? g.querySelectorAll('.wrongf').length : 0 };
      })()
    },
    ruleText: (document.getElementById('ruleBar') || {}).textContent || '',
    /* ★ 判"缩略图到底画的是三视图还是小方块"的硬判据 —— 像素级逐格采样：
       三面墙上【每个格子的中心】的像素，必须等于该墙的轴色（当且仅当该格在答案里）。
       立体模式下应该 100% 命中、且非答案格 0 泄漏；原版是画小方块，中心点对不上墙面格子。
       ⚠️ 调用前会 useView(Vthumb)（可能因尺寸变化清空 canvas），所以外部必须先派发一次
          resize 事件强制重画，再来取像素 —— 否则会拍到被清空的画布。 */
    thumbCenterMatch: (function () {
      var cv = Vthumb && Vthumb.cv;
      if (!cv || !cv.clientWidth) return null;
      var sM = M, sF = F, sCUR = CUR;
      useView(Vthumb);
      var dsf = cv.width / VW, ctx2 = cv.getContext('2d');
      var hit = 0, tot = 0, leak = 0, totEmpty = 0;
      ['w', 'v', 'u'].forEach(function (k) {
        var f = FACES[WALLFACE[k]];
        var c = G.COL[k];
        var R = parseInt(c.substr(1, 2), 16), Gg = parseInt(c.substr(3, 2), 16), Bb = parseInt(c.substr(5, 2), 16);
        for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
          var q = faceCellQuad(f, i, j);
          var px = Math.round((q[0].x + q[1].x + q[2].x + q[3].x) / 4 * dsf);
          var py = Math.round((q[0].y + q[1].y + q[2].y + q[3].y) / 4 * dsf);
          if (px < 0 || py < 0 || px >= cv.width || py >= cv.height) continue;
          var d = ctx2.getImageData(px, py, 1, 1).data;
          var near = Math.abs(d[0] - R) < 26 && Math.abs(d[1] - Gg) < 26 && Math.abs(d[2] - Bb) < 26;
          if (G.ans[k][i + '|' + j]) { tot++; if (near) hit++; }
          else { totEmpty++; if (near) leak++; }
        }
      });
      M = sM; F = sF; CUR = sCUR;
      return { ansCells: tot, filledRight: hit, nonAnsCells: totEmpty, leak: leak, dsf: +dsf.toFixed(2) };
    })(),
    statText: (document.getElementById('statBar') || {}).textContent || '',
    btnModeText: (document.getElementById('btnMode') || {}).textContent || '',
    thumb: Vthumb ? { W: Vthumb.VW, H: Vthumb.VH, s: +Vthumb.F.s.toFixed(3),
                      zoom: Vthumb.zoom } : null,
    /* —— 本轮：难度 + "困难模式下里面的网格是否真没了"的采样点 ——
       缩略图是 canvas，没法用 DOM 查元素，只能按"线该在的位置"去点像素：
         · outline = 最外侧六边形的 6 条边各自的中点（困难模式必须还有墨）
         · grid    = 三面墙每条 N×N 分格线的中点（困难模式必须变成全透明）
       坐标是 canvas 内部像素坐标，附 px/空间尺寸 供外部按比例换算。 */
    diff: G.diff,
    diffSamples: diffSamplesOf(Vthumb),
    modalSamples: modalOn ? diffSamplesOf(Vmodal) : null,
    shapeList: G.shape.map(function (c) { return c.lo.slice(); }),
    defM: defaultM().map(function (x) { return +x.toFixed(5); })
  };
};
/* 探针（立体模式）：给外部脚本做数值核验 —— 摆方块 / 看投影差 / 直接点某条视线，
   全部走与 UI 完全相同的函数，所以探针过了就等于真机那条路径过了。 */
window.__solid = function () {
  return {
    mode: G.mode,
    setMode: function (m) { setMode(m); return G.mode; },
    rays: function () {
      return rays.map(function (r) {
        return { cells: r.cells.map(function (cc) { return cc.c; }), hex: r.hex };
      });
    },
    set: function (arr) {              /* 直接摆一组格位（校验用） */
      G.place = {}; G.phist = []; G.solved = false; hoverCell = null; hoverBad = '';
      wrongList = [];
      renderWrong();
      arr.forEach(function (c) { G.place[kk(c)] = 1; G.phist.push(kk(c)); });
      renderCubes(); updateStat();
      return solidDone();
    },
    clear: function () { return window.__solid().set([]); },
    target: function () { return G.shape.map(function (c) { return c.lo.slice(); }); },
    /* —— 2026-10-02 二改：恢复"点击放置"（先生原话"点击就放上去了"），去掉托盘。
       下面这些是给自检用的【程序化入口】；真机那条路是 pointerdown/up，自检另用真鼠标点。 —— */
    drop: function (idx) {             /* 在第 idx 个屏幕位置上放一块（= 点一下） */
      var ray = rays[idx];
      if (!ray) return { ok: false, reason: 'noray' };
      var cell = cellOfRay(ray), reason = dropReason(cell);
      if (reason) return { ok: false, reason: reason, cell: cell };
      G.place[kk(cell)] = 1; G.phist.push(kk(cell));
      renderCubes(); updateStat();
      var win = false;
      if (!G.solved && solidDone()) { G.solved = true; win = true; sndWin(); showWin(); }
      return { ok: true, cell: cell, done: G.solved, win: win };
    },
    remove: function (idx) {           /* 拿走第 idx 个位置上的方块 */
      var ray = rays[idx];
      if (!ray) return false;
      var r = removeBlockAt(cellOfRay(ray));
      renderCubes(); updateStat();
      return r;
    },
    reason: function (idx) {
      var ray = rays[idx];
      return (ray && G.mode === 'solid') ? (dropReason(cellOfRay(ray)) || 'ok') : 'noray';
    },
    cellOf: function (idx) { return rays[idx] ? cellOfRay(rays[idx]) : null; },
    /* 某个屏幕位置中心在【视口坐标】下的像素位置 —— 自检要按它来拖，才与孩子眼睛看到的一致 */
    centerOf: function (idx) {
      var ray = rays[idx], svg = document.getElementById('bsvg');
      if (!ray || !svg) return null;
      var ctm = svg.getScreenCTM();
      if (!ctm) return null;
      var pt = svg.createSVGPoint();
      pt.x = ray.cx * USCALE; pt.y = ray.cy * USCALE;
      var loc = pt.matrixTransform(ctm);
      return [loc.x, loc.y];
    },
    /* 拾取函数本身 —— 自检可以直接问"指针在这个像素位置会落到哪一格" */
    pickAt: function (x, y) { return pickIndexAt(x, y); },
    left: placeLeft,
    hover: function (idx) {
      hoverRay = idx;
      var cell = (idx >= 0 && rays[idx]) ? cellOfRay(rays[idx]) : null;
      hoverCell = cell;
      hoverBad = cell ? dropReason(cell) : '';
      renderCubes();
      return hoverCell;
    },
    proj: projOfPlace, diff: function () { return projDiff(projOfPlace()); },
    done: solidDone
  };
};
function init() {
  rebuildGeometry(G.N);
  Vthumb = makeView(document.getElementById('tcv'));
  Vmodal = makeView(document.getElementById('mcv'));
  window.__audio = function () { return AC ? { state: AC.state, alwaysOn: true } : null; };
  buildColorPop();
  bindUI();
  applySkin(G.skin);
  syncDiffUI();
  newPuzzle();
  refreshPalette();
  setKUI2();
}
function setKUI2() {
  document.getElementById('rng').value = G.K;
  document.getElementById('knum').textContent = G.K;
  Array.prototype.forEach.call(document.querySelectorAll('#segN button'), function (b) {
    b.classList.toggle('on', +b.getAttribute('data-n') === G.N);
  });
  ['u', 'v', 'w'].forEach(function (k) {
    document.getElementById('sw' + k).style.background = G.COL[k];
  });
}
init();
</script>
