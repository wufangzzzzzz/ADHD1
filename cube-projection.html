<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>立体投影涂色 · 三面方格</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0B111B;color:#EAF1FA;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    /* 平板（iPad / Android）兼容：manipulation = 允许滑动与双指缩放，但【禁掉双击缩放】。
       好处是去掉 iOS/Android 双击缩放带来的约 300ms 点击延迟，也不会出现"点格子变成放大页面"。
       弹窗 canvas 要单独设成 none（见 #mcv），否则拖拽旋转会被浏览器当成滚动手势中断。 */
    touch-action:manipulation;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%}
  button{font-family:inherit}

  /* ---------- 页头 ---------- */
  #hd{position:fixed;left:0;right:0;top:0;height:54px;z-index:20;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(180deg,#16202E,#0F1826);border-bottom:1px solid #1E2C3E}
  #hd h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap;
    background:linear-gradient(92deg,#FFD08A,#FFB347 55%,#FF8E5E);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #hd .rule{font-size:12.5px;color:#8FA3BC;line-height:1.5;
    display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow:hidden}
  #hd .rule b{color:#FFC978;font-weight:700}
  #hd .sp{flex:1 1 auto}
  #hd .stat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8FA3BC;white-space:nowrap}
  #hd .stat i{font-style:normal;color:#EAF1FA;font-weight:700;font-size:14px}

  /* ---------- 主体：横版两列 ---------- */
  #wrap{position:fixed;left:0;right:0;top:54px;bottom:0;z-index:10;
    display:grid;grid-template-columns:340px minmax(0,1fr);gap:13px;padding:13px 16px}
  #left{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:11px;min-height:0}
  #right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:11px;min-height:0}

  .panel{background:linear-gradient(180deg,#141E2C,#101A27);border:1px solid #223449;
    border-radius:15px;position:relative;overflow:hidden}

  /* ---------- 缩略图 ---------- */
  #thumbBox{cursor:zoom-in;min-height:190px}
  #thumbBox:hover{border-color:#3A5677}
  #tcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
  #thumbHint{position:absolute;left:0;right:0;bottom:0;height:31px;pointer-events:none;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:#9FB4CE;background:linear-gradient(0deg,rgba(11,17,27,.92),rgba(11,17,27,0))}
  #thumbHint b{color:#FFC978}
  #thumbTag{position:absolute;left:11px;top:9px;font-size:11.5px;color:#7C8DA4;
    letter-spacing:.5px;pointer-events:none}
  #thumbZoom{position:absolute;right:9px;top:8px;width:26px;height:26px;border-radius:9px;
    background:rgba(255,179,71,.14);border:1px solid rgba(255,179,71,.42);color:#FFC978;
    display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none}

  /* ---------- 左侧下方：选项 ---------- */
  #opts{padding:12px 13px 13px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:9px}
  .lbl{font-size:12.5px;color:#8FA3BC;white-space:nowrap;flex:0 0 auto}
  .seg{display:flex;gap:6px;flex:1 1 auto}
  .seg button{flex:1 1 0;height:32px;border-radius:9px;cursor:pointer;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;font-size:13px;font-weight:600}
  .seg button:hover{background:#1D2A3C;border-color:#3B5372}
  .seg button.on{background:#3A2A12;border-color:#B8792A;color:#FFC978;
    box-shadow:0 0 0 1px rgba(255,179,71,.25) inset}
  /* ⚠️ min-width:0 是必须的：<input type="range"> 的固有最小宽度约 129px，flex item 默认
     min-width:auto 会按这个固有宽度撑住 ⇒ 窄屏平板（竖屏 iPad 768 / 安卓 600~800）上
     「小方块数」这一行会比面板宽出 ~98px，把右边的「+」挤出面板被 overflow:hidden 裁掉。
     加 min-width:0 才能让它跟着 flex 一起收缩。
     flex-basis 用 0（不是 auto）：用 auto 时滑块会先占住固有 129px 再谈伸缩，
     窄屏上后面的「＋」仍会被挤到下一行；用 0 则严格按剩余空间分配。 */
  #rng{flex:1 1 0;min-width:0;height:24px;accent-color:#FFB347;cursor:pointer}
  .step{width:30px;height:30px;flex:0 0 auto;border-radius:9px;cursor:pointer;font-size:15px;font-weight:700;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;display:flex;
    align-items:center;justify-content:center;line-height:1}
  .step:hover{background:#1D2A3C;border-color:#3B5372}
  .step:active{transform:translateY(1px)}
  #knum{min-width:34px;text-align:center;font-size:15px;font-weight:800;color:#FFC978}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tools button{height:35px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6}
  .tools button:hover{background:#1D2A3C;border-color:#3B5372}
  .tools button:active{transform:translateY(1px)}
  .tools #btnHint{border-color:#4A6B3F;color:#A6E08A}
  .tools #btnHint:hover{background:#1B2A18;border-color:#5F8A4E}
  .tools #btnUndo{border-color:#5A4630;color:#F0C08A}
  .tools #btnUndo:hover{background:#231A10;border-color:#7A5C3A}
  .tools #btnNew{border-color:#3A5677;color:#9FC6F0}
  .tools #btnNew:hover{background:#16283C}
  .tools #btnSnd{border-color:#3F5F45;color:#9CE8B4;font-size:12.5px}
  .tools #btnSnd:hover{background:#132118;border-color:#548055}

  /* ---------- 右侧上：3 个颜色方块 ---------- */
  #palette{padding:11px 13px;display:flex;gap:11px;align-items:stretch}
  .pal{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px;
    border-radius:12px;background:#0F1A27;border:1px solid #1F3045}
  .sw{width:44px;height:44px;border-radius:11px;flex:0 0 auto;
    border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 -8px 16px rgba(0,0,0,.22)}
  .pcol{display:flex;flex-direction:column;gap:5px;min-width:0}
  .pcol .pn{font-size:12px;color:#9FB4CE;white-space:nowrap}
  .pcol .pn em{font-style:normal;color:#EAF1FA;font-weight:700}
  .pcol button{height:26px;border-radius:8px;cursor:pointer;font-size:11.5px;padding:0 9px;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;white-space:nowrap}
  .pcol button:hover{background:#1D2A3C;border-color:#3B5372}

  /* ---------- 右侧下：三面网格 ---------- */
  #board{min-height:0}
  #bsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;
    touch-action:manipulation}
  /* ⚠️ 三面墙的归一化坐标跨度只有 ~7 个单位，直接当 viewBox 用会让 stroke-width:1
     在屏幕上变成 150px 粗的白条、标签字变成 88px。两道保险：
       ① viewBox 整体 ×100（见 buildBoard 的 USCALE），让 1 用户单位 ≈ 1 屏幕像素；
       ② 所有描边一律 non-scaling-stroke ⇒ stroke-width 按屏幕像素解释，与 viewBox 无关。 */
  /* ★ 先生 2026-09-29：「游戏区格子不要带颜色」⇒ 空网格一律透明，直接透出面板底色，只留格线；
     已涂对 / 涂错仍然上色（那是玩家自己涂的，由 refreshBoard() 写 inline fill 盖过这里）。
     注：SVG 里 transparent 仍算 painted（跟 none 不同）⇒ elementFromPoint 照常命中，点击不受影响。 */
  #board .cellbg{fill:transparent;stroke:rgba(255,255,255,.33);stroke-width:1.15;
    stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .1s}
  /* ⚠️ 触摸设备（iPad / Android 平板）上 :hover 会「粘」在最后碰过的格子上 ——
     表现为涂完的格子一直亮着金边，像是被选中了。所以这条悬停规则挪进了
     文件末尾的 @media (hover:hover)，只有真正带指针的设备才生效。 */
  #board g.wallgrid{cursor:pointer}
  #board .cellbg.bad{stroke:#FF6B6B;stroke-width:2.4}
  #board .wallname{font-size:13px;font-weight:700;pointer-events:none}
  #board .vlab{font-size:14px;font-weight:800;pointer-events:none}
  #board .hintpulse{fill:none;stroke:#FFD447;stroke-width:3.4;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;pointer-events:none;
    animation:hp .72s ease-in-out 3}
  @keyframes hp{0%,100%{opacity:.2}50%{opacity:1}}
  #board .edge{stroke:rgba(255,255,255,.92);stroke-width:2.3;stroke-linecap:round;fill:none;
    vector-effect:non-scaling-stroke;pointer-events:none}

  /* ---------- 游戏区右下角：提示 / 撤销（先生 2026-09-29：移到这儿、做成 2 个小按钮；
     后又要求「改为上下排列 然后大一点点」⇒ 竖排 + 加高加字）----------
     浮在 SVG 之上（z-index 高于 svg），所以点按钮不会穿到下面的格子；SVG 的点击委托绑在 #bsvg 上，
     按钮不在 svg 内 ⇒ 两者天然互不干扰。 */
  #cornerTools{position:absolute;right:14px;bottom:14px;z-index:6;
    display:flex;flex-direction:column;gap:9px;align-items:stretch}
  #cornerTools button{height:40px;min-width:84px;padding:0 18px;border-radius:12px;cursor:pointer;
    font-size:14.5px;font-weight:700;letter-spacing:.4px;
    border:1px solid #2B3E55;background:rgba(22,32,46,.94);color:#C9D6E6;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.34);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #cornerTools button:hover{background:#1D2A3C;border-color:#3B5372}
  #cornerTools button:active{transform:translateY(1px)}
  #cornerTools #btnHint{border-color:#4A6B3F;color:#A6E08A}
  #cornerTools #btnHint:hover{background:#1B2A18;border-color:#5F8A4E}
  #cornerTools #btnUndo{border-color:#5A4630;color:#F0C08A}
  #cornerTools #btnUndo:hover{background:#231A10;border-color:#7A5C3A}

  /* ---------- 自选颜色浮层（先生 2026-09-29：「换个颜色是可以选择颜色的」）---------- */
  #colorPop{position:fixed;z-index:70;display:none;width:236px;padding:11px 12px 12px;
    border-radius:14px;border:1px solid #2B3E55;background:#131E2C;
    box-shadow:0 18px 46px rgba(0,0,0,.55)}
  #colorPop.on{display:block}
  #colorPop .ph{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  #colorPop .ph b{font-size:12.5px;color:#EAF1FA;font-weight:700}
  #colorPop .ph .tip{font-size:11.5px;color:#8FA3BC}
  #colorPop .ph .sp{flex:1 1 auto}
  #colorPop .ph button{width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:12px;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;
    display:flex;align-items:center;justify-content:center}
  #colorPop .pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  #colorPop .pcell{position:relative;height:36px;border-radius:10px;cursor:pointer;
    border:2px solid rgba(255,255,255,.16);box-sizing:border-box}
  #colorPop .pcell:hover{border-color:#FFD447;transform:translateY(-1px)}
  #colorPop .pcell.used::after{content:'✓';position:absolute;right:4px;bottom:1px;
    font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
  #colorPop .pcell.cur{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
  #colorPop .pmore{margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:12px;color:#9FB4CE}
  #colorPop .pmore input{width:36px;height:26px;padding:0;border:1px solid #2B3E55;
    border-radius:8px;background:#16202E;cursor:pointer}

  /* ---------- 通关对话框（先生 2026-09-29：「答对了 通关信息不要在最下面 弹出一个对话框显示」）----------
     原来是底部 toast（bottom:28px）报通关，现在改成居中对话框；toast 只继续管"某一步"的即时反馈。 */
  #winMask{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(5,9,15,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #winMask.on{display:flex}
  #winBox{width:min(88vw,392px);padding:26px 26px 20px;border-radius:20px;text-align:center;
    border:1px solid #2B3E55;background:linear-gradient(180deg,#16202E,#101A27);
    box-shadow:0 28px 70px rgba(0,0,0,.55);
    animation:winIn .26s cubic-bezier(.2,.9,.3,1.28) both}
  @keyframes winIn{from{opacity:0;transform:translateY(12px) scale(.95)}
                   to{opacity:1;transform:translateY(0) scale(1)}}
  #winBox .chk{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(111,212,99,.16);border:1px solid rgba(111,212,99,.50)}
  #winBox .chk svg{width:32px;height:32px;display:block}
  #winBox .chk path{fill:none;stroke:#6FD463;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:41;stroke-dashoffset:41;animation:chkDraw .42s .13s ease-out forwards}
  @keyframes chkDraw{to{stroke-dashoffset:0}}
  #winBox h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:.5px;color:#EAF1FA}
  #winBox .sub{margin:0 0 15px;font-size:13px;color:#9FB4CE}
  #winBox .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:19px}
  #winBox .meta i{font-style:normal;font-size:12.5px;padding:5px 11px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid #223449;color:#C9D6E6}
  #winBox .meta i b{color:#FFC978;font-weight:800}
  #winBox .acts{display:flex;gap:10px}
  #winBox .acts button{flex:1 1 0;height:40px;border-radius:11px;cursor:pointer;
    font-size:14px;font-weight:700;border:1px solid #2B3E55;background:#16202E;color:#C9D6E6}
  #winBox .acts button:hover{background:#1D2A3C;border-color:#3B5372}
  #winBox .acts button:active{transform:translateY(1px)}
  #winBox .acts #btnWinAgain{border-color:#4A6B3F;background:#1B2A18;color:#A6E08A}
  #winBox .acts #btnWinAgain:hover{background:#22371D;border-color:#5F8A4E}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(5,9,15,.86);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #modal.on{display:block}
  #mcw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(78vw,78vh);height:min(78vw,78vh);
    background:radial-gradient(120% 120% at 50% 0%,#16202E 0%,#0C131E 78%);
    border:1px solid #2B3E55;border-radius:20px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7)}
  /* touch-action:none 是平板能拖动的关键：不禁掉浏览器手势的话，手指一拖就被当成
     滚动/页面缩放，pointermove 会被 pointercancel 打断 ⇒ 旋转卡住或干脆不动。 */
  #mcv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;
    touch-action:none;-webkit-user-drag:none}
  #mcv.on{cursor:grabbing}
  #mhead{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;
    padding:0 14px 0 18px;gap:10px;pointer-events:none;
    background:linear-gradient(180deg,rgba(12,19,30,.92),rgba(12,19,30,0))}
  #mhead .t{font-size:14px;font-weight:700;color:#FFC978}
  #mhead .s{font-size:11.5px;color:#8FA3BC}
  #mhead .sp{flex:1 1 auto}
  #btnMClose{pointer-events:auto;width:32px;height:32px;border-radius:10px;cursor:pointer;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  #btnMClose:hover{background:#22344A;border-color:#3B5372}
  #mfoot{position:absolute;left:0;right:0;bottom:0;height:42px;display:flex;align-items:center;
    justify-content:center;gap:9px;pointer-events:none;
    background:linear-gradient(0deg,rgba(12,19,30,.92),rgba(12,19,30,0))}
  #mfoot button,#mfoot .z{pointer-events:auto}
  #mfoot button{height:30px;border-radius:9px;cursor:pointer;padding:0 13px;font-size:12px;
    border:1px solid #2B3E55;background:#16202E;color:#C9D6E6}
  #mfoot button:hover{background:#22344A;border-color:#3B5372}
  #mfoot .z{font-size:11.5px;color:#8FA3BC}

  /* ---------- 提示条 ---------- */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
    z-index:80;padding:10px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
    background:#16202E;border:1px solid #2B3E55;color:#EAF1FA;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:#3F7A52;color:#9CE8B4}
  #toast.no{border-color:#8A3B3B;color:#FFA3A3}
  #segSkin button{font-size:13px}

  /* ============================================================
     白色底板皮肤（先生 2026-09-29：「再做一套白色底板的 左侧下面设置个按钮
     左边是白 右边是黑 点击可以更换」）
     做法：上面所有规则一条都不动，只在 body.skin-light 下整体覆盖。
     canvas 与 SVG 里那些"写死在 JS 里的线色/底色"由 skinPal() 按皮肤分支给（见 JS）。
     ============================================================ */
  body.skin-light{background:#EEF2F8;color:#1D2733}
  body.skin-light #hd{background:linear-gradient(180deg,#FFFFFF,#F5F8FC);border-bottom-color:#E1E7F0}
  body.skin-light #hd h1{background:linear-gradient(92deg,#E0921C,#C97A1A 55%,#A8570C);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  body.skin-light #hd .rule{color:#5C6B7F}
  body.skin-light #hd .rule b{color:#A8570C}
  body.skin-light #hd .stat{color:#5C6B7F}
  body.skin-light #hd .stat i{color:#1D2733}
  body.skin-light .panel{background:linear-gradient(180deg,#FFFFFF,#FAFCFE);border-color:#E1E7F0}
  body.skin-light #thumbBox:hover{border-color:#A9B8CC}
  body.skin-light #thumbTag{color:#7A8798}
  body.skin-light #thumbHint{color:#4E5D72;
    background:linear-gradient(0deg,rgba(255,255,255,.97),rgba(255,255,255,0))}
  body.skin-light #thumbHint b{color:#A8570C}
  body.skin-light #thumbZoom{background:rgba(201,122,26,.12);border-color:rgba(201,122,26,.42);color:#A8570C}
  body.skin-light .lbl{color:#5C6B7F}
  body.skin-light #rng{accent-color:#C97A1A}
  body.skin-light .seg button,body.skin-light .step,body.skin-light .tools button{
    background:#F6F8FB;border-color:#DCE3EC;color:#33445C}
  body.skin-light .seg button:hover,body.skin-light .step:hover,body.skin-light .tools button:hover{
    background:#EDF3FA;border-color:#B9C6D6}
  body.skin-light .seg button.on{background:#FDF0DC;border-color:#D9A252;color:#8A5310;
    box-shadow:0 0 0 1px rgba(217,162,82,.22) inset}
  body.skin-light #knum{color:#A8570C}
  body.skin-light .tools #btnHint{border-color:#A8CFA0;color:#2F6B36}
  body.skin-light .tools #btnHint:hover{background:#EFF8EC;border-color:#7FB673}
  body.skin-light .tools #btnUndo{border-color:#DFC09A;color:#8A5310}
  body.skin-light .tools #btnUndo:hover{background:#FBF3E8;border-color:#C79A5F}
  body.skin-light .tools #btnNew{border-color:#B8CBE0;color:#2A5C8F}
  body.skin-light .tools #btnNew:hover{background:#EDF4FC}
  body.skin-light .tools #btnSnd{border-color:#A8CFA0;color:#2F6B36}

<script>
/* ============================================================
   立体投影涂色 —— 随机连通立方体块 → 三面网格投影
   ------------------------------------------------------------------
   【几何基座与基准页 cube-5x5x5.html 完全同一套】
     · 原点 A=(0,0,0)；u 沿 A→B、v 沿 A→D、w 沿 A→E，三个方向各长 N。
       B(N,0,0) C(N,N,0) D(0,N,0) E(0,0,N) F(N,0,N) G(N,N,N) H(0,N,N)。
     · 相机基 A0(右) / B0(上) / N0(指向屏幕里)，观察者在 −N0 一侧。
     · 默认视角 M = 绕视线轴 N0 转 180°（= cube-5x5x5.html 那个固定视角）：
       C 到最上面、E 到最下面，A 与 G 仍重合在画面正中。

   【三面墙与轴色的对应（实测，不是推的）】
     把三面墙的形心用过同一套 cam()/A0/B0 投影算出来：
       u=N 墙 BCGF → (+1.7678, −1.0206) = 右上     轴色 COL.u = 绿
       v=N 墙 DCGH → (−1.7678, −1.0206) = 左上     轴色 COL.v = 橙
       w=N 墙 EFGH → ( 0.0000, +2.0412) = 正下     轴色 COL.w = 蓝
     这正好对上先生 2026-09-29 那句「绿色平行于右上的网格面」
     ⇒ 投影口径 = 每面网格涂【平行于它的那个立方体面】的颜色 = 该轴的轴色。

   【投影索引（与基准页 cube-5x5x5.html 逐字同一套）】
     一个格 (a,b,c) 沿某条坐标轴拍平到墙上，索引是它在墙上剩下的两个坐标：
       w 墙格 (i,j) = (u,v)  →  答案键 a|b
       v 墙格 (i,j) = (u,w)  →  答案键 a|c
       u 墙格 (i,j) = (v,w)  →  答案键 b|c
     （三面墙的 q0→q1 / q0→q3 方向实测分别为：w墙 +u/+v、v墙 +u/+w、u墙 +v/+w）

   【为什么画家算法在这里成立（我复算过，这一步不确认就会画错遮挡）】
     1×1×1 块的等轴投影是正六边形，外接圆半径 R=0.81651(×F.s)；
     它的三个可见面（−u / −v / −w）投影各为平行四边形，面积各 0.57735，
     三者之和 1.73205 恰好 = 六边形面积 ⇒ 三个可见面【不重叠地铺满整块六边形】。
     ⇒ 任何被 A 遮住的块 X，其可见点投影 ⊆ A 的投影六边形 ⊆ A 三可见面之并
     ⇒ 「按块中心深度远→近排序 + 每块只画 3 个朝向观察者的面」遮挡必然正确。
     深度相同的两块（Δu+Δv+Δw=0）实测只相切(如 (1,2,3) 与 (2,2,2) 切于 (0,−0.81651))、
     内部不重叠 ⇒ 顺序无关，但仍按 (a,b,c) 字典序钉死以保证渲染可复现。
   ============================================================ */

/* ---------- 全局状态 ---------- */
var G = {
  N: 5,                                   /* 网格档 4 / 5 / 6，默认 5 */
  K: 7,                                   /* 小方块数 3~30 */
  shape: [],                              /* [{lo:[a,b,c]}] 每个 1×1×1 格 */
  ans: { w: {}, v: {}, u: {} },           /* 正确答案：每面墙上该涂的格 */
  fill: { w: {}, v: {}, u: {} },          /* 玩家已涂（键 'i|j'） */
  hist: [],                               /* 撤销栈：{k,key,prev} */
  COL: { u: '#6FD463', v: '#FF8354', w: '#5AA9FF' },
  skin: 'light',                          /* 'dark' | 'light' —— 底板皮肤（先生 2026-09-29：默认白底） */
  diff: 'easy',                           /* 'easy' | 'hard' —— 题目立体图难度（先生 2026-09-29：默认简单） */
  solved: false
};
/* 先生 2026-09-29：「把C点字母C换成A H点字母H换成B F点字母F换成C 记住 只是换字母
   其余点的字母不要显示」⇒ 只改【显示名】，几何坐标一律不动。 */
var LBL = { C: 'A', H: 'B', F: 'C' };
var LBLLIST = ['C', 'H', 'F'];            /* 只给这三个顶点画标签 */
var WALLNAME = { u: '右上', v: '左上', w: '正下' };
var WALLFACE = { w: 1, v: 3, u: 5 };       /* 三面墙在 FACES 里的下标 */
var DROP_FACES = ['A-B-C-D', 'A-B-F-E', 'A-D-H-E'];   /* 含 A 的近侧三面：不画 */

/* ---------- 随 N 重建的几何 ---------- */
var N = 5, VN = 5, CEN, HALF_DIAG, CORNER, FACES, EDGES;
function rebuildGeometry(nn) {
  N = nn; VN = nn;
  CEN = { u: N / 2, v: N / 2, w: N / 2 };
  HALF_DIAG = N * Math.sqrt(3) / 2;
  CORNER = {
    A: { u: 0, v: 0, w: 0 }, B: { u: N, v: 0, w: 0 },
    C: { u: N, v: N, w: 0 }, D: { u: 0, v: N, w: 0 },
    E: { u: 0, v: 0, w: N }, F: { u: N, v: 0, w: N },
    G: { u: N, v: N, w: N }, H: { u: 0, v: N, w: N }
  };
  FACES = [
    { k: 'w', n: { u: 0, v: 0, w: -1 }, q: ['A', 'B', 'C', 'D'] },
    { k: 'w', n: { u: 0, v: 0, w: 1 },  q: ['E', 'F', 'G', 'H'] },
    { k: 'v', n: { u: 0, v: -1, w: 0 }, q: ['A', 'B', 'F', 'E'] },
    { k: 'v', n: { u: 0, v: 1, w: 0 },  q: ['D', 'C', 'G', 'H'] },
    { k: 'u', n: { u: -1, v: 0, w: 0 }, q: ['A', 'D', 'H', 'E'] },
    { k: 'u', n: { u: 1, v: 0, w: 0 },  q: ['B', 'C', 'G', 'F'] }
  ];
  /* 12 条棱自动去重，必须单独画一次（共享棱画两遍会让白色不透明度叠加、亮度翻倍） */
  EDGES = (function () {
    var m = {}, out = [];
    FACES.forEach(function (f) {
      for (var i = 0; i < 4; i++) {
        var a = f.q[i], b = f.q[(i + 1) % 4], key = a < b ? a + b : b + a;
        if (!m[key]) { m[key] = { a: a, b: b, fs: [] }; out.push(m[key]); }
        m[key].fs.push(f);
      }
    });
    return out;
  })();
}
function faceKey(f) { return f.q.join('-'); }
function isDropped(f) { return DROP_FACES.indexOf(faceKey(f)) >= 0; }
function oppo(f) {
  for (var i = 0; i < FACES.length; i++) {
    var g = FACES[i];
    if (g.k === f.k && g.n.u === -f.n.u && g.n.v === -f.n.v && g.n.w === -f.n.w) return g;
  }
  return null;
}
function faceOn(f) { return !isDropped(f); }
function faceFront(f) { return dot3(cam(f.n), N0) < -1e-6; }
function faceLoud(f) { return faceFront(f) || isDropped(oppo(f)); }
function edgeOn(e) {
  return !(e.fs.length && e.fs.every(function (f) { return isDropped(f); }));
}
function edgeFront(e) { return e.fs.some(faceFront); }
function edgeLoud(e) {
  return e.fs.some(function (f) { return faceOn(f) && faceLoud(f); });
}

/* ---------- 3D 基与投影（与两个基准页逐字相同） ---------- */
var A0 = { x: -0.70711, y: 0.70711, z: 0 };
var B0 = { x: -0.40825, y: -0.40825, z: 0.81650 };
var N0 = { x: 0.57735, y: 0.57735, z: 0.57735 };
function dot3(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function mm(A, B) {
  var C = new Array(9), i, j, k, s;
  for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {
    s = 0;
    for (k = 0; k < 3; k++) s += A[i * 3 + k] * B[k * 3 + j];
    C[i * 3 + j] = s;
  }
  return C;
}
function rotAxis(ax, ay, az, th) {
  var n = Math.sqrt(ax * ax + ay * ay + az * az);
  if (n < 1e-9) return [1, 0, 0, 0, 1, 0, 0, 0, 1];
  ax /= n; ay /= n; az /= n;
  var c = Math.cos(th), s = Math.sin(th), t = 1 - c;
  return [t * ax * ax + c, t * ax * ay - s * az, t * ax * az + s * ay,
          t * ax * ay + s * az, t * ay * ay + c, t * ay * az - s * ax,
          t * ax * az - s * ay, t * ay * az + s * ax, t * az * az + c];
}
var ROTK = 0.0082;
function applyRot(dxPix, dyPix) {
  var R = mm(rotAxis(A0.x, A0.y, A0.z, dyPix * ROTK),
             rotAxis(-B0.x, -B0.y, -B0.z, dxPix * ROTK));
  M = mm(R, M);

        var p = PT(CORNER[nm]); xs.push(p.x); ys.push(p.y);

    return { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs),

    }
    parts.push('</g>');
  });

  EDGES.forEach(function (e) {
    if (!edgeOn(e)) return;
    var r = withUnit(function () { return [PT(CORNER[e.a]), PT(CORNER[e.b])]; });
    parts.push('<line class="edge" x1="' + (r[0].x * S).toFixed(2) + '" y1="' + (r[0].y * S).toFixed(2) +
               '" x2="' + (r[1].x * S).toFixed(2) + '" y2="' + (r[1].y * S).toFixed(2) + '"/>');
  });

        而 fs / r / width / font-size 这些【尺寸】本身就是 viewBox 单位，绝不能再 ×S

    parts.push('<circle cx="' + px.toFixed(2) + '" cy="' + py.toFixed(2) +

    parts.push('<rect x="' + (lx - fs * 0.92).toFixed(2) + '" y="' + (ly - fs * 0.74).toFixed(2) +
               '" width="' + (fs * 1.84).toFixed(2) + '" height="' + (fs * 1.48).toFixed(2) +

    parts.push('<text x="' + lx.toFixed(2) + '" y="' + ly.toFixed(2) +
               '" font-size="' + fs.toFixed(2) + '" font-weight="800" fill="#152034" ' +
               'text-anchor="middle" dominant-baseline="central">' + LBL[nm] + '</text>');

  }
  rng.addEventListener('input', function () { applyK(+rng.value); });
  document.getElementById('kMinus').addEventListener('click', function () { applyK(G.K - 1); });
  document.getElementById('kPlus').addEventListener('click', function () { applyK(G.K + 1); });
  /* —— 工具 —— */
  document.getElementById('btnHint').addEventListener('click', function () { ac(); doHint(); });
  document.getElementById('btnUndo').addEventListener('click', function () { ac(); doUndo(); });
  document.getElementById('btnNew').addEventListener('click', function () {
    ac(); rebuildGeometry(G.N); newPuzzle(); toast('换了一道新题');
  });
  var bs = document.getElementById('btnSnd');
  bs.addEventListener('click', function () {
    muted = !muted;
    bs.textContent = muted ? '🔇 静音中' : '🔊 声音开';
    bs.style.color = muted ? '#8FA3BC' : '#9CE8B4';
    if (!muted) { ac(); sndTap(); }
  });
  /* —— 换色：点按钮弹出调色板自己挑（先生 2026-09-29）—— */
  Array.prototype.forEach.call(document.querySelectorAll('.btnSw'), function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      ac(); sndTap();
      var k = b.getAttribute('data-k');
      if (popK === k && document.getElementById('colorPop').classList.contains('on')) closeColorPop();
      else openColorPop(k, b);
    });
  });
  document.getElementById('popGrid').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.pcell') : null;
    if (!el || !popK) return;
    var c = el.getAttribute('data-c');
    var dup = ['u', 'v', 'w'].filter(function (x) {
      return x !== popK && G.COL[x].toUpperCase() === c;
    });
    setColor(popK, c);
    sndTap();
    if (dup.length) {
      toast('这个颜色已经在「' + dup.map(function (x) { return WALLNAME[x]; }).join('、') +
            '」网格上用着了', 'no');
    }
  });
  document.getElementById('popNative').addEventListener('input', function () {
    if (popK) setColor(popK, this.value);
  });
  document.getElementById('popClose').addEventListener('click', function () { closeColorPop(); sndTap(); });
  /* 点浮层外面就收起（注意别把"点 .btnSw 自己"当成外面，否则会开了又立刻关） */
  document.addEventListener('mousedown', function (e) {
    var pop = document.getElementById('colorPop');
    if (!pop.classList.contains('on')) return;
    if (pop.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.btnSw')) return;
    closeColorPop();
  });
  /* —— 游戏区涂色（事件委托）—— */
  document.getElementById('bsvg').addEventListener('click', function (e) {
    var el = e.target;
    if (!el || !el.classList || !el.classList.contains('cellbg')) return;
    ac();
    paint(el.getAttribute('data-k'), +el.getAttribute('data-i'), +el.getAttribute('data-j'));
  });
  /* —— 缩略图点开弹窗 —— */
  document.getElementById('thumbBox').addEventListener('click', openModal);
  document.getElementById('btnMClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target.id === 'modal') closeModal();
  });
  document.getElementById('btnMRot').addEventListener('click', function () { ac(); setAuto(!autoRot); });
  document.getElementById('btnMReset').addEventListener('click', function () {
    Vmodal.M = defaultM(); Vmodal.zoom = 1; renderModal(); updateZoomLbl(); sndTap();
  });
  /* —— 通关对话框（先生 2026-09-29）—— */
  document.getElementById('btnWinAgain').addEventListener('click', function () {
    ac(); sndTap(); hideWin(); rebuildGeometry(G.N); newPuzzle(); toast('换了一道新题');
  });
  document.getElementById('btnWinLook').addEventListener('click', function () {
    hideWin(); sndTap();            /* 只关框，棋盘与成绩都留着让玩家回看 */
  });
  document.getElementById('winMask').addEventListener('click', function (e) {
    if (e.target.id === 'winMask') hideWin();
  });
  /* ESC：由外到里关掉最上层的浮层 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.getElementById('winMask').classList.contains('on')) { hideWin(); return; }
    if (document.getElementById('colorPop').classList.contains('on')) { closeColorPop(); return; }
    if (modalOn) closeModal();
  });
  /* 弹窗拖动旋转 + 双指缩放 */
  var mcv = document.getElementById('mcv'), mp = {}, mlast = null, mpinch = 0;
  mcv.addEventListener('pointerdown', function (e) {
    mcv.setPointerCapture(e.pointerId);
    mp[e.pointerId] = { x: e.clientX, y: e.clientY };
    mlast = { x: e.clientX, y: e.clientY };
    mpinch = 0; setAuto(false); mcv.classList.add('on');
  });
  mcv.addEventListener('pointermove', function (e) {
    if (!mp[e.pointerId]) return;
    mp[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(mp);
    if (ids.length >= 2) {
      var a = mp[ids[0]], b = mp[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (mpinch > 0) {
        Vmodal.zoom = Math.max(0.5, Math.min(3, Vmodal.zoom * (d / mpinch)));
        renderModal(); updateZoomLbl();
      }
      mpinch = d; return;
    }
    var dx = e.clientX - mlast.x, dy = e.clientY - mlast.y;
    mlast = { x: e.clientX, y: e.clientY };
    if (Math.abs(dx) > 26) dx = 26 * Math.sign(dx);
    if (Math.abs(dy) > 26) dy = 26 * Math.sign(dy);
    modalRot(dx, dy);
    renderModal();
  });
  function mup(e) {
    delete mp[e.pointerId]; mpinch = 0;
    if (!Object.keys(mp).length) { mlast = null; mcv.classList.remove('on'); }
    else mlast = mp[Object.keys(mp)[0]];
  }
  mcv.addEventListener('pointerup', mup);
  mcv.addEventListener('pointercancel', mup);
  mcv.addEventListener('wheel', function (e) {
    e.preventDefault();
    Vmodal.zoom = Math.max(0.5, Math.min(3, Vmodal.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    renderModal(); updateZoomLbl();
  }, { passive: false });
  window.addEventListener('resize', renderAll);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOn) closeModal();
    if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doUndo(); }
  });
}
/* ---------- 探针：给外部脚本做数值核验 ---------- */
/* ---------- 难度验收用的采样点（2026-09-29）----------
   困难模式的产物是 canvas，没有 DOM 可查 ⇒ 只能"按线该在的位置去点像素"。三种线的中点：
     · outline = 最外侧六边形的 6 条边（外框棱）中点 —— 困难模式必须还有墨
     · grid    = 三面墙每条 N×N 分格线的中点 —— 困难模式必须变成全透明
     · inner   = 内角 3 条棱（C–G / G–H / F–G）的中点 —— 困难模式必须变成全透明
   ⚠️ 有些采样点会被题目小方块盖住（方块画在格线之上），那种点要由外部按
      "简单模式下它是不是方块色" 先剔除，不能当成格线来判（第一版就吃了这个假 FAIL）。 */
function diffSamplesOf(V) {
  if (!V || !V.VW) return null;
  var sM = M, sF = F, sCUR = CUR;
  useView(V);
  var out = { outline: [], grid: [] };
  EDGES.forEach(function (e) {
    if (!edgeOn(e) || !edgeFront(e)) return;
    var p1 = PT(CORNER[e.a]), p2 = PT(CORNER[e.b]);
    out.outline.push([+((p1.x + p2.x) / 2).toFixed(2), +((p1.y + p2.y) / 2).toFixed(2)]);
  });
  scene().forEach(function (it) {                    /* 逐字复刻 wireFace 的两条格线 */
    if (!faceOn(it.f)) return;
    var ps = it.scr;
    for (var t = 1; t < N; t++) {
      var f = t / N;
      var a1 = { x: ps[0].x + (ps[1].x - ps[0].x) * f, y: ps[0].y + (ps[1].y - ps[0].y) * f };
      var a2 = { x: ps[3].x + (ps[2].x - ps[3].x) * f, y: ps[3].y + (ps[2].y - ps[3].y) * f };
      var b1 = { x: ps[0].x + (ps[3].x - ps[0].x) * f, y: ps[0].y + (ps[3].y - ps[0].y) * f };
      var b2 = { x: ps[1].x + (ps[2].x - ps[1].x) * f, y: ps[1].y + (ps[2].y - ps[1].y) * f };
      out.grid.push([+((a1.x + a2.x) / 2).toFixed(2), +((a1.y + a2.y) / 2).toFixed(2)]);
      out.grid.push([+((b1.x + b2.x) / 2).toFixed(2), +((b1.y + b2.y) / 2).toFixed(2)]);
    }
  });
  out.inner = EDGES.filter(function (e) { return edgeOn(e) && !edgeFront(e); }).map(function (e) {
    var p1 = PT(CORNER[e.a]), p2 = PT(CORNER[e.b]);
    return [+((p1.x + p2.x) / 2).toFixed(2), +((p1.y + p2.y) / 2).toFixed(2)];
  });
  out.space = { VW: VW, VH: VH, cw: V.cv.width, ch: V.cv.height };
  M = sM; F = sF; CUR = sCUR;
  return out;
}
window.__probe = function () {
  function scr(p) { var s = PT(p); return [+s.x.toFixed(2), +s.y.toFixed(2)]; }
  var savedM = M, savedF = F;
  M = defaultM(); F = { s: 1, ox: 0, oy: 0 };
  var unit = {};
  LBLLIST.forEach(function (nm) { unit[nm] = { txt: LBL[nm], pos: scr(CORNER[nm]) }; });
  /* 画面正中心 = A(0,0,0) 与 G(N,N,N) 的公共投影点（二者都在过体心、方向 N0 的直线上）。
     出题第一格固定贴在 G 角上 ⇒ 它正好落在中心点。这里把两点算出来供判据核验。 */
  var centerProj = { A: scr(CORNER.A), G: scr(CORNER.G) };
  var walls = {};
  ['w', 'v', 'u'].forEach(function (k) {
    var f = FACES[WALLFACE[k]];
    walls[k] = { q: f.q.slice(), name: WALLNAME[k], color: G.COL[k],
                 need: Object.keys(G.ans[k]).sort(),
                 filled: Object.keys(G.fill[k]).sort(),
                 wrong: Object.keys(G.fill[k]).filter(function (x) { return !G.ans[k][x]; }).sort(),
                 quad: f.q.map(function (nm) { return scr(CORNER[nm]); }) };
  });
  M = savedM; F = savedF;
  var sharePairs = 0, tot = 0;
  for (var i = 0; i < G.shape.length; i++) for (var j = i + 1; j < G.shape.length; j++) {
    tot++; if (sharesFace(G.shape[i], G.shape[j])) sharePairs++;
  }
  return {
    skin: G.skin,
    N: G.N, K: G.K, blocks: G.shape.length,
    firstCell: G.shape.length ? G.shape[0].lo.slice() : null,
    centerCell: [G.N - 1, G.N - 1, G.N - 1],
    connected: isConnected(G.shape),
    sharePairs: sharePairs, pairsTotal: tot,
    isolated: G.shape.filter(function (c) {
      return !G.shape.some(function (o) { return o !== c && sharesFace(c, o); });
    }).length,
    solved: G.solved,
    walls: walls,
    centerProj: centerProj,
    labels: unit,
    labelList: LBLLIST.map(function (n) { return LBL[n]; }),
    ansTotal: ansCount(G.ans),
    ansPerWall: { w: Object.keys(G.ans.w).length, v: Object.keys(G.ans.v).length,
                  u: Object.keys(G.ans.u).length },
    cells: cellEls.length,
    cellsPerWall: G.N * G.N,
    edgesDrawn: EDGES.filter(edgeOn).length,
    edgesTotal: EDGES.length,
    gridPerFace: (N - 1) * 2,
    colors: G.COL,
    /* ===== 本轮三条改动对应的判据 ===== */
    /* ① 空格子是否真的不带颜色：取第一个空格的 computed fill（应为 rgba(0,0,0,0)） */
    emptyCellFill: (function () {
      for (var i = 0; i < cellEls.length; i++) {
        var el = cellEls[i];
        var kk2 = el.getAttribute('data-k'), a = +el.getAttribute('data-i'), b = +el.getAttribute('data-j');
        if (cellState(kk2, a, b) === 0) return getComputedStyle(el).fill;
      }
      return null;
    })(),
    /* ② 提示/撤销是否真在游戏区右下角、是否真在 #board 范围内 */
    cornerTools: (function () {
      var box = document.getElementById('board').getBoundingClientRect(), out = {};
      [['hint', 'btnHint'], ['undo', 'btnUndo']].forEach(function (p) {
        var r = document.getElementById(p[1]).getBoundingClientRect();
        out[p[0]] = { left: Math.round(r.left), top: Math.round(r.top),
                      w: Math.round(r.width), h: Math.round(r.height),
                      fromRight: Math.round(window.innerWidth - r.right),
                      fromBottom: Math.round(window.innerHeight - r.bottom),
                      inBoard: r.left >= box.left - 1 && r.right <= box.right + 1 &&
                               r.top >= box.top - 1 && r.bottom <= box.bottom + 1 };
      });
      out.board = { left: Math.round(box.left), top: Math.round(box.top),
                    right: Math.round(box.right), bottom: Math.round(box.bottom) };
      out.panel = document.getElementById('board').querySelectorAll('#cornerTools').length;
      out.stillInLeftPanel = document.getElementById('opts').contains(document.getElementById('btnHint'));
      return out;
    })(),
    /* ③ 颜色浮层状态 */
    colorPop: (function () {
      var pop = document.getElementById('colorPop');
      var on = pop.classList.contains('on');
      var r = pop.getBoundingClientRect();
      return { on: on, k: popK, presets: document.querySelectorAll('#popGrid .pcell').length,
               cur: popK ? G.COL[popK] : null,
               usedMarked: document.querySelectorAll('#popGrid .pcell.used').length,
               curMarked: document.querySelectorAll('#popGrid .pcell.cur').length,
               hasNative: !!document.getElementById('popNative'),
               box: on ? { left: Math.round(r.left), top: Math.round(r.top),
                           w: Math.round(r.width), h: Math.round(r.height) } : null };
    })(),
    /* 通关对话框状态（本轮） */
    win: (function () {
      var mask = document.getElementById('winMask');
      var on = mask.classList.contains('on');
      var bx = document.getElementById('winBox').getBoundingClientRect();
      return { on: on,
               title: (document.querySelector('#winBox h2') || {}).textContent || '',
               sub: (document.querySelector('#winBox .sub') || {}).textContent || '',
               meta: (document.getElementById('winMeta') || {}).textContent || '',
               hasAgain: !!document.getElementById('btnWinAgain'),
               hasLook: !!document.getElementById('btnWinLook'),
               box: { left: Math.round(bx.left), top: Math.round(bx.top),
                      w: Math.round(bx.width), h: Math.round(bx.height),
                      cx: Math.round(bx.left + bx.width / 2),
                      cy: Math.round(bx.top + bx.height / 2) } };
    })(),
    modal: { on: modalOn, zoom: Vmodal ? +Vmodal.zoom.toFixed(3) : null, auto: autoRot,
             M: Vmodal ? Vmodal.M.map(function (x) { return +x.toFixed(4); }) : null },
    thumb: Vthumb ? { W: Vthumb.VW, H: Vthumb.VH, s: +Vthumb.F.s.toFixed(3),
                      zoom: Vthumb.zoom } : null,
    /* —— 本轮：难度 + "困难模式下里面的网格是否真没了"的采样点 ——
       缩略图是 canvas，没法用 DOM 查元素，只能按"线该在的位置"去点像素：
         · outline = 最外侧六边形的 6 条边各自的中点（困难模式必须还有墨）
         · grid    = 三面墙每条 N×N 分格线的中点（困难模式必须变成全透明）
       坐标是 canvas 内部像素坐标，附 px/空间尺寸 供外部按比例换算。 */
    diff: G.diff,
    diffSamples: diffSamplesOf(Vthumb),
    modalSamples: modalOn ? diffSamplesOf(Vmodal) : null,
    shapeList: G.shape.map(function (c) { return c.lo.slice(); }),
    defM: defaultM().map(function (x) { return +x.toFixed(5); })
  };
};
function init() {
  rebuildGeometry(G.N);
  Vthumb = makeView(document.getElementById('tcv'));
  Vmodal = makeView(document.getElementById('mcv'));
  window.__audio = function () { return AC ? { state: AC.state, muted: muted } : null; };
  buildColorPop();
  bindUI();
  applySkin(G.skin);
  syncDiffUI();
  newPuzzle();
  refreshPalette();
  setKUI2();
}
function setKUI2() {
  document.getElementById('rng').value = G.K;
  document.getElementById('knum').textContent = G.K;
  Array.prototype.forEach.call(document.querySelectorAll('#segN button'), function (b) {
    b.classList.toggle('on', +b.getAttribute('data-n') === G.N);
  });
  ['u', 'v', 'w'].forEach(function (k) {
    document.getElementById('sw' + k).style.background = G.COL[k];
  });
}
init();
</script>
