<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图案9 · 预览</title>
<style>
  :root { --cell: 96px; --gap: 10px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #004849;              /* 容积色 */
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; gap: 18px;
  }
  .card {
    background: #004849;              /* 与容积一致，格子区就是整片容积色 */
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, var(--cell));
    grid-template-rows: repeat(5, var(--cell));
    gap: var(--gap);
  }
  .cell {
    width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
  }
  .cell svg { width: 100%; height: 100%; display: block; }
  .info {
    color: rgba(255,255,255,.85); text-align: center; font-size: 14px; line-height: 1.7;
  }
  .info .title { font-size: 20px; font-weight: 700; color: #14e1dd; margin-bottom: 4px; }
  .swatches { display: flex; gap: 10px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #fff; }
  .sw i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; border: 1px solid rgba(255,255,255,.3); }
</style>
</head>
<body>
  <div class="info">
    <div class="title">图案9 · 预览版</div>
    <div>4 个圆形叠加 + 中心曲线菱形 + 亮青数字</div>
    <div class="swatches">
      <span class="sw"><i style="background:#ff5100"></i>圆 #ff5100</span>
      <span class="sw"><i style="background:#044d44"></i>菱形 #044d44</span>
      <span class="sw"><i style="background:#14e1dd"></i>数字 #14e1dd</span>
      <span class="sw"><i style="background:#004849"></i>容积 #004849</span>
    </div>
  </div>
  <div class="card">
    <div class="grid" id="grid"></div>
  </div>
  <script>
    function cellSVG(num) {
      var gid = 'og' + num;
      var lgid = 'lg' + num;
      return '' +
      '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<radialGradient id="' + gid + '">' +
            '<stop offset="0%" stop-color="#ff5100"/>' +
            '<stop offset="75%" stop-color="#ff5100"/>' +
            '<stop offset="100%" stop-color="#ff5100" stop-opacity="0"/>' +
          '</radialGradient>' +
          '<radialGradient id="' + lgid + '" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="30">' +
            '<stop offset="0%" stop-color="#044d44"/>' +
            '<stop offset="55%" stop-color="#044d44"/>' +
            '<stop offset="100%" stop-color="#044d44" stop-opacity="0"/>' +
          '</radialGradient>' +
        '</defs>' +
        '<g>' +
          '<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="-360 50 50" dur="14s" repeatCount="indefinite"/>' +
          '<circle cx="50" cy="26" r="24" fill="url(#' + gid + ')"/>' +
          '<circle cx="50" cy="74" r="24" fill="url(#' + gid + ')"/>' +
          '<circle cx="26" cy="50" r="24" fill="url(#' + gid + ')"/>' +
          '<circle cx="74" cy="50" r="24" fill="url(#' + gid + ')"/>' +
        '</g>' +
        '<g fill="url(#' + lgid + ')">' +
          '<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="14s" repeatCount="indefinite"/>' +
          '<path d="M50 50 C40 47 45 28 50 20 C55 28 60 47 50 50 Z"/>' +
          '<path d="M50 50 C40 47 45 28 50 20 C55 28 60 47 50 50 Z" transform="rotate(90 50 50)"/>' +
          '<path d="M50 50 C40 47 45 28 50 20 C55 28 60 47 50 50 Z" transform="rotate(180 50 50)"/>' +
          '<path d="M50 50 C40 47 45 28 50 20 C55 28 60 47 50 50 Z" transform="rotate(270 50 50)"/>' +
        '</g>' +
        '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" ' +
        'fill="#ffffff" font-size="40" font-weight="800" font-family="system-ui,sans-serif">' + num + '</text>' +
      '</svg>';
    }
    var grid = document.getElementById('grid');
    var html = '';
    for (var i = 1; i <= 25; i++) {
      html += '<div class="cell">' + cellSVG(i) + '</div>';
    }
    grid.innerHTML = html;
  </script>
</body>
</html>
