<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图案10·玻璃格 预览</title>
<style>
  :root { --cell: 92px; --gap: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; gap: 16px;
    background: #f0f2f8;
  }
  .info { text-align: center; color: #334; }
  .info .title { font-size: 20px; font-weight: 700; color: #1f6feb; margin-bottom: 4px; }
  .info .sub { font-size: 13px; color: #667; }
  .card {
    /* 容积 = 颜色来源：强烈彩色渐变，玻璃方块透出这些颜色（颜色不在方块上） */
    background: linear-gradient(135deg,
      #5b4cff 0%, #8b5cf6 22%, #d946ef 45%, #ec4899 68%, #fb923c 100%);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, var(--cell));
    grid-template-rows: repeat(5, var(--cell));
    gap: var(--gap);
  }
  .cell {
    width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
  }
  .glass-cell {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 16px;
    /* 玻璃方块：透明 + 背景模糊，颜色全部来自透出的容积 */
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(16px) saturate(140%) brightness(1.05);
    border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 0 12px rgba(255,255,255,0.15),
      0 8px 24px rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* 顶部一条斜向反光（玻璃高光，无色） */
  .glass-cell::before {
    content: '';
    position: absolute;
    top: 7%; left: 9%;
    width: 48%; height: 20%;
    border-radius: 6px;
    background: linear-gradient(115deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  .glass-cell .num {
    position: relative; z-index: 2;
    color: #fff; font-weight: 800; font-size: 30px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
  <div class="info">
    <div class="title">图案10 · 玻璃格（预览版 v5）</div>
    <div class="sub">透明玻璃方块 · 颜色全部来自透出的彩色容积 · 无黑线</div>
  </div>
  <div class="card">
    <div class="grid" id="grid"></div>
  </div>
  <script>
    var grid = document.getElementById('grid');
    var html = '';
    for (var i = 1; i <= 25; i++) {
      html += '<div class="cell"><div class="glass-cell"><span class="num">' + i + '</span></div></div>';
    }
    grid.innerHTML = html;
  </script>
</body>
</html>
