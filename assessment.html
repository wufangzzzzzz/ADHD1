<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注力测评系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f4f8f5; --card:#fff; --ink:#2c3e50; --sub:#6a7178;
  --line:#e8edf0; --teal:#2ba89e; --blue:#6a9bcc; --red:#d97757; --green:#788c5d; --purple:#8b7cb6; --amber:#c4a35a;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}
.btn{display:inline-block;border:none;cursor:pointer;font-size:16px;font-weight:600;border-radius:12px;padding:14px 22px;transition:.18s;font-family:inherit;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:#249a90;}
.btn-ghost{background:#eef4f1;color:var(--teal);}
.btn-ghost:hover{background:#e2efe9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.center{text-align:center;}
.hidden{display:none!important;}

/* 落地页 */
.hero{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:18px;padding:42px 24px;margin-bottom:26px;text-align:center;box-shadow:0 6px 22px rgba(43,168,158,.22);}
.hero h1{font-size:26px;margin-bottom:10px;font-weight:700;letter-spacing:1px;}
.hero p{opacity:.92;font-size:14px;}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
.choose .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.choose .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--teal);}
.choose .card .t{font-size:20px;font-weight:700;margin-bottom:6px;}
.choose .card .d{font-size:13px;color:var(--sub);}
.note{font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:22px;line-height:1.8;}
.note b{color:var(--teal);}

/* 表单 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.topbar .back{cursor:pointer;color:var(--sub);font-size:14px;background:none;border:none;font-family:inherit;}
.topbar .back:hover{color:var(--teal);}
.progress{height:8px;background:#e4ece8;border-radius:6px;overflow:hidden;margin-bottom:6px;}
.progress>i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s;}
.progress-tip{font-size:12px;color:var(--sub);text-align:right;margin-bottom:18px;}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.info-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px;}
.info-row label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;}
.info-row input,.info-row select{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fbfdfc;}
.dim-title{font-size:18px;font-weight:700;margin:22px 0 4px;padding-left:10px;border-left:4px solid var(--teal);}
.dim-sub{font-size:13px;color:var(--sub);margin-bottom:10px;}
.q{background:#fbfdfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.q .qt{font-size:15px;margin-bottom:10px;line-height:1.6;}
.q .opts{display:flex;gap:8px;flex-wrap:wrap;}
.opt{flex:1;min-width:90px;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px;background:#fff;transition:.15s;user-select:none;}
.opt:hover{border-color:var(--teal);}
.opt.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
.warn{border-color:var(--red)!important;background:#fff6f3;}

/* 报告 */
.report-header{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-radius:16px;padding:30px 22px;margin-bottom:20px;text-align:center;box-shadow:0 6px 20px rgba(43,168,158,.2);}
.report-header h1{font-size:23px;margin-bottom:6px;}
.report-header p{opacity:.92;font-size:14px;}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.sec h2{font-size:20px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--line);}
.sec h3{font-size:16px;color:var(--sub);margin:16px 0 8px;}
.tb{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px;}
.tb th,.tb td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
.tb th{background:#f6f9f8;font-weight:600;color:var(--sub);}
.tb tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:2px 11px;border-radius:12px;font-size:12px;font-weight:700;}
.tr{background:#fdeaea;color:var(--red);}
.ty{background:#fdf3e6;color:var(--amber);}
.tg{background:#e9f3ea;color:var(--green);}
canvas{width:100%!important;display:block;margin:14px auto;}
.sb{background:#f7faf9;border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.7;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;}
.pc{background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.pc .wk{font-weight:700;color:var(--teal);font-size:15px;}
.pc .fc{color:var(--red);font-size:13px;margin:3px 0;}
.pc .dc{font-size:13px;color:var(--sub);}
.tip-box{background:#eef6f4;border-left:4px solid var(--teal);padding:13px 16px;border-radius:8px;margin:14px 0;font-size:14px;line-height:1.8;}
.ref-note{font-size:13px;color:var(--sub);background:#fff8f1;border-left:3px solid var(--amber);padding:11px 15px;border-radius:8px;margin:12px 0;line-height:1.8;}
.ref-item{background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:11px 15px;margin:8px 0;font-size:13px;color:#445;line-height:1.7;}
.ref-item .rn{font-weight:700;color:var(--teal);margin-right:4px;}
.ref-item .rj{color:#9aa;font-size:12px;margin-left:6px;}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0;}
.gi{background:#f7faf9;padding:9px 13px;border-radius:8px;font-size:14px;border-left:3px solid var(--blue);}
.gi.a{border-left-color:var(--red);}
.gi.b{border-left-color:var(--green);}
.gi.t{border-left-color:var(--purple);}
.lib-h{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;margin:14px 0;}
.lib-h>div{background:#f7faf9;padding:9px 10px;font-size:13px;border-left:3px solid var(--blue);}
.lib-h .a{border-left-color:var(--red);}
.lib-h .b{border-left-color:var(--green);}
.lib-h .t{border-left-color:var(--purple);}
.actions{display:flex;gap:12px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap;}
.sig{text-align:center;color:#aab;font-size:12px;padding:18px 0 4px;}
a.link{color:var(--teal);text-decoration:underline;}
@media(max-width:560px){.choose,.pg,.gl,.lib-h{grid-template-columns:1fr;}.lib-h{grid-template-columns:1fr 1fr;}.hero{padding:30px 18px;}}
@media print{.wrap{max-width:100%;padding:0 8px;}.sec,.report-header{box-shadow:none;break-inside:avoid;}.actions{display:none;}.no-print{display:none;}}
</style>
</head>
<body>
<div class="wrap">

  <!-- 落地页 -->
  <section id="landing">
    <div class="hero">
      <h1>专注力测评系统</h1>
      <p>基于可观测困难行为的三维度测评 · 听觉 / 视觉 / 行为</p>
    </div>
    <div class="choose">
      <div class="card" onclick="start('adult')">
        <div class="t">成人版</div>
        <div class="d">13岁及以上 · 80题自填<br>约15分钟</div>
      </div>
      <div class="card" onclick="start('kids')">
        <div class="t">儿童版</div>
        <div class="d">4-12岁 · 家长代填<br>80题约15分钟</div>
      </div>
    </div>
    <div class="note">
      <b>测评说明：</b>本测评从听觉、视觉、行为三个维度评估专注力表现。每题按「经常 / 偶尔 / 基本没有」三种频率作答，得分率越低代表困扰越少、状态越好。报告含三维度总览、子维度分析、12周训练方案与游戏推荐，供能力训练参考（非临床诊断）。
    </div>
  </section>

  <!-- 表单页 -->
  <section id="formView" class="hidden">
    <div class="topbar">
      <button class="back" onclick="goLanding()">← 返回</button>
      <span id="formType" style="font-weight:600;"></span>
    </div>
    <div class="progress"><i id="progBar"></i></div>
    <div class="progress-tip"><span id="progTxt">0 / 80</span> 题已作答</div>
    <div id="infoArea"></div>
    <div class="note" id="formHint" style="margin-top:14px;"></div>
    <div id="questions"></div>
    <div class="actions">
      <button class="btn btn-teal" id="submitBtn" onclick="submit()">提交并生成报告</button>
    </div>
  </section>

  <!-- 报告页 -->
  <section id="reportView" class="hidden"></section>

</div>

/* ============ 等级判定（与计划4 tag() 一字不差） ============ */
function tagInfo(rate){
  if(rate>=70) return {label:'重点关注', cls:'tr'};
  if(rate>=50) return {label:'中度关注', cls:'ty'};
  if(rate>=30) return {label:'轻度关注', cls:'tg'};
  if(rate>=1)  return {label:'状态良好', cls:'tg'};
  return {label:'无明显专注力失调迹象', cls:'tg'};
}
const r1 = x => Math.round(x*10)/10;

function pick(idx, val, el){
  const q = QLIST[idx];
  q.val = val;
  const opts = el.parentNode.children;
  for(const o of opts) o.classList.remove('on');
  el.classList.add('on');
  document.getElementById('q_'+idx).classList.remove('warn');
  updateProgress();
}
function updateProgress(){
  const done = QLIST.filter(q=>q.val!==undefined).length;
  document.getElementById('progBar').style.width = (done/QLIST.length*100)+'%';
  document.getElementById('progTxt').textContent = done + ' / ' + QLIST.length;
}

/* ============ 算分 + 生成报告数据 ============ */
function buildData(){
  const cfg = SURVEY[CUR];
  const info = {};
  cfg.info.forEach(f=>{ info[f.id] = (document.getElementById('inf_'+f.id).value||'').trim(); });
  const name = info.name || (CUR==='adult'?'测评者':'孩子');

  // 按维度、子维度聚合
  const dims = ['A','V','B'];
  const agg = {}; // dim -> {sum, count, subs:{sub:{sum,count,name}}}
  dims.forEach(d=> agg[d] = {sum:0, count:0, subs:{}});
  QLIST.forEach(q=>{
    if(q.val===undefined) return;
    const a = agg[q.dim];
    a.sum += q.val; a.count++;
    if(!a.subs[q.sub]) a.subs[q.sub] = {sum:0, count:0, name:q.subName};
    a.subs[q.sub].sum += q.val; a.subs[q.sub].count++;
  });

  function dimRate(d){ const a=agg[d]; return a.count? r1(a.sum/(a.count*2)*100):0; }
  function groups(d){ const a=agg[d]; return Object.keys(a.subs).map(k=>{const s=a.subs[k]; return r1(s.count? s.sum/(s.count*2)*100:0);}); }
  function labels(d){ const a=agg[d]; return Object.keys(a.subs).map(k=>a.subs[k].name); }

  const A=dimRate('A'), V=dimRate('V'), B=dimRate('B');
  const total = r1((agg.A.sum+agg.V.sum+agg.B.sum)/((agg.A.count+agg.V.count+agg.B.count)*2)*100);

  // 训练曲线：以基线为起点，按阶段递减（计划4 样本亦为下降轨迹，代表训练后得分率改善）
  const proj = r => [1,0.92,0.84,0.77,0.70].map(f=> Math.max(0, r1(r*f)));
  const train = [proj(A), proj(V), proj(B)];

  const d = {
    name, type: cfg.typeLabel,
    age: info.age||'', submitter: info.submitter||'',
    A_rate:A, V_rate:V, B_rate:B, total_rate:total,
    A_score: agg.A.sum+'/'+agg.A.count*2, V_score: agg.V.sum+'/'+agg.V.count*2, B_score: agg.B.sum+'/'+agg.B.count*2,
    total_score: (agg.A.sum+agg.V.sum+agg.B.sum)+'/'+(agg.A.count+agg.V.count+agg.B.count)*2,
    A_groups: groups('A'), V_groups: groups('V'), B_groups: groups('B'),
    A_labels: labels('A'), V_labels: labels('V'), B_labels: labels('B'),
    train
  };
  const nar = narrative(d);
  d.conclusion = nar.conclusion; d.strength = nar.strength; d.weakness = nar.weakness; d.path = nar.path;
  return d;
}

function narrative(d){
  const A=d.A_rate, V=d.V_rate, B=d.B_rate, T=d.total_rate;
  const dims=[['听觉',A],['视觉',V],['行为',B]].sort((x,y)=>y[1]-x[1]);
  const w=dims[0], m=dims[1], s=dims[2];
  let profile;
  if(T<30) profile='三维度状态整体良好，专注力困扰较少';
  else if(w[1]>=70) profile=w[0]+'维度为重点关注（'+w[1]+'%），是主要短板';
  else if(w[1]>=50) profile=w[0]+'维度中度关注（'+w[1]+'%），'+m[0]+'维度'+m[1]+'%、'+s[0]+'维度'+s[1]+'%';
  else profile='整体以轻度困扰为主，'+w[0]+'维度略高（'+w[1]+'%）';
  return {
    conclusion: '<b>'+profile+'</b>——'+s[0]+'维度相对最优（'+s[1]+'%），'+w[0]+'维度需重点提升。',
    strength: '你的'+s[0]+'注意力相对最优（'+s[1]+'%·'+tagInfo(s[1]).label+'），信息接收与处理效率较好，是后续训练的稳固基础。',
    weakness: '你的'+w[0]+'注意力最弱（'+w[1]+'%·'+tagInfo(w[1]).label+'），建议在训练方案中作为主攻方向优先安排。',
    path: w[0]+'强化 → '+m[0]+'巩固 → '+s[0]+'整合'
  };
}

/* ============ 提交 ============ */
function submit(){
  const unanswered = QLIST.filter(q=>q.val===undefined);
  if(unanswered.length){
    unanswered.forEach(q=> document.getElementById('q_'+q.idx).classList.add('warn'));
    const first = unanswered[0].idx;
    document.getElementById('q_'+first).scrollIntoView({behavior:'smooth', block:'center'});
    alert('还有 '+unanswered.length+' 题未作答，请全部作答后再提交。');
    return;
  }
  const d = buildData();
  renderReport(d);
}

/* ============ 报告渲染 ============ */
function todayStr(){
  const n=new Date();
  return n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
}
function subAnalysis(dimName, labels, values){
  const mx=Math.max(...values), mn=Math.min(...values);
  const im=values.indexOf(mx), inm=values.indexOf(mn);
  if(im===inm) return '';
  return '<div class="sb"><b>'+dimName+'分析：</b>困扰最大：'+labels[im]+'（'+values[im]+'%）; 相对较好：'+labels[inm]+'（'+values[inm]+'%）。</div>';
}
function renderReport(d){
  const date = todayStr();
  const tg=(r)=>tagInfo(r);
  const dimRow=(cn,dim)=>{ const r=d[dim+'_rate'], lv=tg(r); return '<tr><td>'+cn+'</td><td>'+d[dim+'_score']+'</td><td>'+r+'%</td><td><span class="tag '+lv.cls+'">'+lv.label+'</span></td></tr>'; };
  const tr=tg(d.total_rate);

  // 子标题（空字段优雅处理）
  const subParts = [];
  if(CUR==='adult'){
    subParts.push((d.name||'测评者')+'（成人）');
    if(d.age) subParts.push(d.age+'岁');
  } else {
    subParts.push((d.name||'孩子') + (d.age? '（'+d.age+'岁）':''));
    if(d.submitter) subParts.push('提交人：'+d.submitter);
  }
  subParts.push('测评日期：'+date);
  const sub = subParts.join('｜');

  let html = '';
  html += '<div class="report-header"><h1>专注力测评分析报告</h1><p>'+sub+'</p></div>';

  // 阅读提示
  html += '<div class="ref-note" style="text-align:center;background:#eef6f4;border-left:4px solid var(--teal);">'
        + '<b>阅读提示：</b>百分比越低代表问题越少——分数统计的是困扰出现频率，<b>0分=完全无困扰</b>，满分=所有项目都「经常」出现。请根据自身情况合理看待各项得分。</div>';

  // 一、三维度总览
  html += '<div class="sec"><h2>一、三维度总览</h2>'
        + '<table class="tb"><tr><th>维度</th><th>得分</th><th>得分率</th><th>等级</th></tr>'
        + dimRow('听觉注意力','A') + dimRow('视觉注意力','V') + dimRow('行为表现','B')
        + '<tr style="background:#f6f9f8;font-weight:bold"><td>综合</td><td>'+d.total_score+'</td><td>'+d.total_rate+'%</td><td><span class="tag '+tr.cls+'">'+tr.label+'</span></td></tr>'
        + '</table><canvas id="barChart" height="320"></canvas></div>';

  // 二/三/四 子维度
  const dims=[['A','听觉'],['V','视觉'],['B','行为']];
  const secNo={A:'二',V:'三',B:'四'};
  dims.forEach(([k,cn])=>{
    const r=d[k+'_rate'], lv=tg(r);
    html += '<div class="sec"><h2>'+secNo[k]+'、'+cn+'子维度分析（'+r+'% · '+lv.label+'）</h2>'
          + '<canvas id="'+k+'Chart" height="320"></canvas>'
          + subAnalysis(cn+'子维度', d[k+'_labels'], d[k+'_groups'])
          + '</div>';
  });

  // 五、雷达
  html += '<div class="sec"><h2>五、子维度全景雷达</h2>'
        + '<canvas id="radarChart" height="420"></canvas></div>';

  // 六、综合评分
  const refMean = r1((d.A_rate+d.V_rate+d.B_rate)/3);
  html += '<div class="sec"><h2>六、综合评分</h2>'
        + '<canvas id="scoreChart" height="320"></canvas>'
        + '<div class="sb"><b>综合评分解读：</b>听觉 '+d.A_rate+'%、视觉 '+d.V_rate+'%、行为 '+d.B_rate+'%，加权综合 <b>'+d.total_rate+'%（'+tr.label+'）</b>。综合评分反映三维度协调水平，得分率越低代表困扰越少、状态越好。柱状图中虚线为三维度均值参考线，低于虚线说明优于自身平均水平。最弱维度为<b style="color:var(--red)">'+weakDim(d)+'</b>，第八板块训练方案将以此为重点定制。</div></div>';

  // 七、12周训练方案
  const stages = CUR==='adult'?STAGES_ADULT:STAGES_KIDS;
  html += '<div class="sec"><h2>七、12周训练方案</h2>'
        + '<canvas id="trainChart" height="340"></canvas>'
        + '<div class="pg">'+stages.map(s=>'<div class="pc"><div class="wk">'+s.wk+'</div><div class="fc">'+s.fc+'</div><div class="dc">'+s.dc+'</div></div>').join('')+'</div>'
        + '<div class="ref-note"><b>训练节奏参考：</b>'+TRAIN_NOTE+'</div></div>';

  // 八、游戏推荐
  html += gameGuide(d);

  // 九、科学依据
  html += '<div class="sec"><h2>九、科学依据</h2>'
        + '<p style="font-size:14px;color:var(--sub);margin-bottom:14px;">本测评维度设计与训练建议参考以下经独立核验的学术研究与机构实践：</p>'
        + REFS.map(r=>'<div class="ref-item"><span class="rn">【'+r[0]+'】</span>'+r[1]+'<span class="rj">'+r[2]+'</span></div>').join('')
        + '<div class="ref-note">'+REF_NOTE+'</div></div>';

  // 十、总结
  html += '<div class="sec"><h2>十、总结</h2><div class="sb">'
        + '<p>'+d.conclusion+'</p>'
        + '<p>'+d.strength+'</p>'
        + '<p>'+d.weakness+'</p>'
        + '<p><b>干预路径：</b>'+d.path+'</p>'
        + (d.total_rate===0 ? '<p style="color:var(--blue);">你状态正常，可以玩玩<a class="link" href="index.html">舒尔特方格</a>很有趣。</p>' : '')
        + '</div></div>';

  const signer = CUR==='adult' ? '专注力搭子' : '读写障碍力老师';
  html += '<div class="sig">'+signer+' | '+date+' | 专注力测评分析报告</div>';
  html += '<div class="actions no-print"><button class="btn btn-ghost" onclick="window.print()">打印 / 保存为PDF</button>'
        + '<button class="btn btn-teal" onclick="goLanding()">重新测评</button></div>';

  const rv = document.getElementById('reportView');
  rv.innerHTML = html;
  document.getElementById('formView').classList.add('hidden');
  rv.classList.remove('hidden');
  window.scrollTo(0,0);

  // 绘制图表
  drawBar('barChart', ['听觉注意力','视觉注意力','行为表现'], [d.A_rate,d.V_rate,d.B_rate], ['#d97757','#6a9bcc','#788c5d'], {zones:true});
  drawBar('AChart', d.A_labels, d.A_groups, SUB_COLORS, {zones:true});
  drawBar('VChart', d.V_labels, d.V_groups, SUB_COLORS, {zones:true});
  drawBar('BChart', d.B_labels, d.B_groups, SUB_COLORS, {zones:true});
  drawRadar('radarChart', d.name, d.A_labels.concat(d.V_labels, d.B_labels), d.A_groups.concat(d.V_groups, d.B_groups));
  drawBar('scoreChart', ['听觉','视觉','行为','综合'], [d.A_rate,d.V_rate,d.B_rate,d.total_rate], ['#d97757','#6a9bcc','#788c5d','#8b7cb6'], {zones:true, meanLine:refMean});
  drawLine('trainChart', ['基线','第3周','第6周','第9周','第12周'], [
    {name:'听觉',color:'#d97757',data:d.train[0]},
    {name:'视觉',color:'#6a9bcc',data:d.train[1]},
    {name:'行为',color:'#788c5d',data:d.train[2]}
  ]);
}
function weakDim(d){
  const arr=[['听觉',d.A_rate],['视觉',d.V_rate],['行为',d.B_rate]].sort((x,y)=>y[1]-x[1]);
  return arr[0][0]+'注意力（'+arr[0][1]+'%）';
}
function gameGuide(d){
  const a=d.A_rate, v=d.V_rate, b=d.B_rate;
  const dims=[['听觉',a],['视觉',v],['行为',b]].sort((x,y)=>y[1]-x[1]);
  const w=dims[0], m=dims[1], s=dims[2];
  const OF = CUR==='adult'?OF_ADULT:OF_KIDS;
  const isAdult = CUR==='adult';
  const libCount = VG.length+AG.length+BG.length+(isAdult?0:TG.length)+OF.length;

  // 七天计划（完全沿用计划4 逻辑）
  let plan;
  if(w[0]==='听觉'){
    plan=[
      ['周一','主力', 'G1 听词行动 8-10min → '+VG[0]+' 5min → G2 数字回音壁 5-8min → G3 声波搜索 5min','23-28min'],

  let rows='';

  let h = '<div class="sec"><h2>八、游戏推荐方案</h2>'

    + '</div>'
    + '<h3>七天训练计划（每周循环 × 12周）</h3>'
    + '<table class="tb" style="table-layout:fixed;word-break:break-all;"><tr style="background:#f6f9f8;"><th style="width:7%;">日期</th><th style="width:9%;">类型</th><th style="text-align:left;">训练流程（游戏 → 时长）</th><th style="width:13%;">当日总时长</th></tr>'+rows+'</table>';

  // 游戏库总览

  }

  h += '<h4>线下训练（'+(isAdult?'成人专属':'2款')+'）</h4><div class="gl">'+OF.map(g=>'<div class="gi" style="font-size:14px;">'+g+'</div>').join('')+'</div>';

/* ============ Canvas 图表（替代 ECharts，无外部依赖） ============ */
const FONT = '"PingFang SC","Microsoft YaHei",sans-serif';
const SUB_COLORS = ["#6a9bcc","#8b7cb6","#a0b890","#d97757","#c97b84","#6caaaa","#b8956c","#788c5d","#c4a35a"];
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function roundRect(ctx,x,y,w,h,r){ if(h<0){y+=h;h=-h;} r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function setup(cv,cssH){ const dpr=window.devicePixelRatio||1; const cssW=cv.clientWidth||640; cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr); cv.style.height=cssH+'px'; const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH); return {ctx,w:cssW,h:cssH}; }
function wrapText(ctx,text,x,y,maxW,lh){ const chars=text.split(''); let line='',yy=y; for(const ch of chars){ if(ctx.measureText(line+ch).width>maxW && line){ ctx.fillText(line,x,yy); line=ch; yy+=lh; } else line+=ch; } ctx.fillText(line,x,yy); return yy; }

function drawBar(id,labels,values,colors,opt){
  opt=opt||{}; const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setup(cv, parseInt(cv.getAttribute('height'))||320);
  const padL=44,padR=14,padT=34,padB=48; const plotW=w-padL-padR, plotH=h-padT-padB; const yMax=110;
  if(opt.zones){
    const zones=[[70,110,'#d97757','重点关注'],[50,70,'#c4a35a','中度'],[30,50,'#788c5d','轻度'],[0,30,'#6a9bcc','良好']];
    zones.forEach(z=>{ const y0=padT+plotH*(1-z[1]/yMax), y1=padT+plotH*(1-z[0]/yMax);
      ctx.fillStyle=hexA(z[2],0.06); ctx.fillRect(padL,y0,plotW,y1-y0);
      ctx.fillStyle=hexA(z[2],0.5); ctx.font='10px '+FONT; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(z[3],w-padR-2,(y0+y1)/2); });
  }
  ctx.strokeStyle='#e3e7ec'; ctx.fillStyle='#9aa3ad'; ctx.font='11px '+FONT; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=0;v<=100;v+=20){ const y=padT+plotH*(1-v/yMax); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke(); ctx.fillText(v+'%',padL-6,y); }
  const n=values.length, slot=plotW/n, bw=Math.min(54,slot*0.56);
  for(let i=0;i<n;i++){ const v=values[i]; const x=padL+slot*i+(slot-bw)/2; const bh=plotH*(v/yMax); const y=padT+plotH-bh;
    ctx.fillStyle=colors[i%colors.length]; roundRect(ctx,x,y,bw,bh,5); ctx.fill();
    ctx.fillStyle='#2d2d2d'; ctx.font='bold 14px '+FONT; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(v+'%',x+bw/2,y-4);
    ctx.fillStyle='#555'; ctx.font='12px '+FONT; ctx.textAlign='center'; ctx.textBaseline='top'; wrapText(ctx,labels[i],padL+slot*i+slot/2,padT+plotH+8,slot-4,14);
  }
  if(opt.meanLine!=null){ const y=padT+plotH*(1-opt.meanLine/yMax); ctx.strokeStyle='#999'; ctx.setLineDash([5,4]); ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#888'; ctx.font='11px '+FONT; ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText('参考均值 '+opt.meanLine+'%',w-padR,y-2); }
}

function drawLine(id,weeks,series){
  const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setup(cv, parseInt(cv.getAttribute('height'))||340);
  const padL=44,padR=14,padT=34,padB=42; const plotW=w-padL-padR, plotH=h-padT-padB; const yMin=20,yMax=95;
  const X=i=> padL+plotW*(i/(weeks.length-1));
  const Y=v=> padT+plotH*(1-(v-yMin)/(yMax-yMin));
  ctx.strokeStyle='#e3e7ec'; ctx.fillStyle='#9aa3ad'; ctx.font='11px '+FONT; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=yMin;v<=yMax;v+=15){ const y=Y(v); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke(); ctx.fillText(v+'%',padL-6,y); }
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font='13px '+FONT;
  weeks.forEach((wk,i)=> ctx.fillText(wk,X(i),padT+plotH+8));
  series.forEach(s=>{ ctx.fillStyle=hexA(s.color,0.08); ctx.beginPath(); ctx.moveTo(X(0),Y(s.data[0])); s.data.forEach((v,i)=> ctx.lineTo(X(i),Y(v))); ctx.lineTo(X(s.data.length-1),padT+plotH); ctx.lineTo(X(0),padT+plotH); ctx.closePath(); ctx.fill(); });
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=2.6; ctx.beginPath(); s.data.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    s.data.forEach((v,i)=>{ const x=X(i),y=Y(v); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.fill(); ctx.strokeStyle=s.color; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle=s.color; ctx.font='bold 10px '+FONT; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(v+'%',x,y-7); });
  });
  // 图例
  let lx=padL, ly=12; ctx.font='12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='middle';
  series.forEach(s=>{ ctx.fillStyle=s.color; ctx.fillRect(lx,ly-5,10,10); ctx.fillStyle='#555'; ctx.fillText(s.name,lx+14,ly); lx+=ctx.measureText(s.name).width+36; });
}

function drawRadar(id,name,labels,values){
  const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setup(cv, parseInt(cv.getAttribute('height'))||420);
  const cx=w/2, cy=h/2+6, R=Math.min(w,h)/2-58; const n=labels.length; const yMax=100;
  // 网格环
  ctx.strokeStyle='#e6eaee'; ctx.fillStyle='#bbb'; ctx.font='9px '+FONT;
  [20,40,60,80,100].forEach(g=>{ ctx.beginPath(); for(let i=0;i<=n;i++){ const a=-Math.PI/2+i*2*Math.PI/n; const rr=R*g/100; const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); ctx.stroke(); if(g%40===0){ ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(g+'%',cx+3,cy-R*g/100);} });
  // 数据多边形
  const pts=values.map((v,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const rr=R*v/yMax; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; });
  ctx.fillStyle=hexA('#d97757',0.18); ctx.strokeStyle='#d97757'; ctx.lineWidth=2; ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); ctx.stroke();
  pts.forEach(p=>{ ctx.fillStyle='#d97757'; ctx.beginPath(); ctx.arc(p[0],p[1],3,0,7); ctx.fill(); });
  // 轴 + 标签
  ctx.font='11px '+FONT;
  labels.forEach((lb,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    ctx.strokeStyle='#eef1f4'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a);
    ctx.fillStyle='#555'; const cosA=Math.cos(a); ctx.textAlign = cosA>0.3?'left':(cosA<-0.3?'right':'center'); ctx.textBaseline='middle';
    ctx.fillText(lb, lx, ly);
  });
  ctx.fillStyle='#2c3e50'; ctx.font='bold 15px '+FONT; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(name+' · 子维度全景', cx, 8);
}
