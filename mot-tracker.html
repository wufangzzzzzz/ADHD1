<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多目标追踪 - MOT 视觉追踪训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  background:#FFFBFA;
  height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
.container{
  width:min(98vw,1100px);
  height:min(98vh,760px);
  display:flex;
  gap:16px;
  padding:12px;
}

/* 左面板 */
.left-panel{
  width:300px;min-width:300px;
  background:#FFFFFF;
  border-radius:16px;
  padding:12px;
  display:flex;flex-direction:column;
  gap:10px;
  box-shadow:0 2px 16px rgba(45,43,85,0.06);
  overflow:hidden;
}
.panel-title{
  color:#2D2B55;
  font-size:14px;font-weight:800;
  text-align:center;
  padding-bottom:8px;
  border-bottom:1px solid rgba(45,43,85,0.08);
}
.diff-label{
  color:rgba(45,43,85,0.5);
  font-size:12px;font-weight:600;
  margin-bottom:4px;
}
.diff-btns{display:flex;gap:6px;}
.diff-btn{
  flex:1;
  padding:8px 4px;
  border-radius:12px;
  border:2px solid rgba(45,43,85,0.1);
  background:#FFFFFF;
  color:rgba(45,43,85,0.6);
  font-size:12px;font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  text-align:center;
}
.diff-btn.active{border-color:#FF5E0E;color:#FF5E0E;background:rgba(255,94,14,0.06);}
.diff-btn:hover{background:rgba(45,43,85,0.04);}
.diff-btn:active{transform:scale(0.95);}

.color-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 0;
}
.color-label{
  color:rgba(45,43,85,0.5);
  font-size:12px;font-weight:600;
}
.color-picker{
  width:36px;height:28px;
  border:2px solid rgba(45,43,85,0.15);
  border-radius:8px;
  cursor:pointer;
  padding:2px;
  background:#fff;
}

/* 进度条 */
.progress-wrap{
  width:100%;
  height:6px;
  background:rgba(45,43,85,0.08);
  border-radius:3px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#FF5E0E,#FF9800);
  border-radius:3px;
  transition:width 0.3s ease;
}

/* 倒计时 */
.countdown-overlay{
  position:absolute;
  inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.5);
  z-index:10;
  pointer-events:none;
}
.countdown-num{
  font-size:80px;font-weight:900;
  color:#fff;
  text-shadow:0 4px 20px rgba(0,0,0,0.4);
  animation:countPop 0.6s ease-out;
}
@keyframes countPop{
  0%{transform:scale(1.8);opacity:0;}
  50%{opacity:1;}
  100%{transform:scale(1);opacity:1;}
}

/* 配置说明 */
.config-desc{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
}
.config-desc .row{
  display:flex;justify-content:space-between;
  color:rgba(45,43,85,0.5);
  font-size:11px;
  padding:3px 0;
}
.config-desc .row span:last-child{
  color:#2D2B55;
  font-weight:700;
}

/* 玩法说明 */
.rules-box{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
  flex:1;
  overflow-y:auto;
}
.rules-box .rules-title{
  color:#2D2B55;
  font-size:12px;font-weight:700;
  margin-bottom:6px;
}
.rules-box p{
  color:rgba(45,43,85,0.55);
  font-size:11px;line-height:1.6;
  margin-bottom:5px;
}
.rules-box b{color:#2D2B55;}

/* 开始按钮 */
.start-btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#FF5E0E,#FF9800);
  color:#fff;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:transform 0.1s ease;
  box-shadow:0 3px 12px rgba(255,94,14,0.25);
}
.start-btn:active{transform:scale(0.95);}
.start-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* 右面板 */
.right-panel{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;
  gap:12px;
  padding:8px 0;
  overflow:hidden;
}
.game-title{
  font-size:22px;font-weight:800;
  background:linear-gradient(135deg,#FF5E0E,#FF69B4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-align:center;
}
.info-bar{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.info-item{
  background:#FFFFFF;
  border-radius:10px;
  padding:8px 16px;
  font-size:14px;
  font-weight:700;
  color:#2D2B55;
  box-shadow:0 1px 8px rgba(45,43,85,0.06);
}
.info-item .val{
  font-family:'JetBrains Mono','Courier New',monospace;
  color:#FF5E0E;
}

.canvas-wrap{
  position:relative;
  width:520px;
  height:520px;
  background:rgba(45,43,85,0.03);
  border-radius:20px;
  border:1px solid rgba(45,43,85,0.08);
  overflow:hidden;
}
canvas{display:block;width:100%;height:100%;}

.hint-text{
  font-size:15px;
  font-weight:700;
  color:rgba(45,43,85,0.6);
  text-align:center;
  min-height:22px;
}

.result-card{
  background:rgba(45,43,85,0.03);
  border-radius:10px;
  padding:10px;
  display:none;
  flex-direction:column;
  gap:6px;
  margin-top:4px;
}
.result-card.show{display:flex;}
.result-title{
  font-size:13px;font-weight:800;
  color:#2D2B55;
  text-align:center;
}
.result-row{
  display:flex;justify-content:space-between;
  font-size:12px;
  color:rgba(45,43,85,0.6);
  padding:2px 0;
  border-bottom:1px solid rgba(45,43,85,0.06);
}
.result-row .rv{font-weight:700;color:#FF5E0E;}
.btn-row{display:flex;gap:8px;justify-content:center;}
.btn{
  padding:8px 16px;
  border-radius:10px;
  border:none;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:transform 0.1s ease;
}
.btn:active{transform:scale(0.95);}
.btn-primary{
  background:linear-gradient(135deg,#FF5E0E,#FF9800);
  color:#fff;
  box-shadow:0 3px 12px rgba(255,94,14,0.25);
}
.btn-secondary{
  background:rgba(45,43,85,0.06);
  color:rgba(45,43,85,0.6);
  border:1px solid rgba(45,43,85,0.1);
}

@media (prefers-reduced-motion:reduce){
  .btn:active,.diff-btn:active,.start-btn:active{transform:none;}
}

.back-btn{
  position:absolute;top:10px;left:10px;z-index:100;
  background:rgba(0,0,0,0.06);
  border:1px solid rgba(0,0,0,0.1);
  color:rgba(0,0,0,0.55);
  padding:6px 14px;border-radius:8px;
  font-size:13px;cursor:pointer;
  transition:all 0.2s;
  text-decoration:none;
}
.back-btn:hover{background:rgba(0,0,0,0.1);color:rgba(0,0,0,0.8);}

.speed-row{display:flex;align-items:center;gap:8px;margin:10px 0;padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:8px;}
.speed-label{font-size:13px;color:rgba(0,0,0,0.6);white-space:nowrap;}
.speed-slider{flex:1;accent-color:#FF5E0E;height:4px;}
.speed-val{font-size:13px;font-weight:600;color:#FF5E0E;min-width:36px;text-align:right;}

.countdown-ring{position:absolute;top:10px;right:10px;z-index:50;}
.countdown-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#FF5E0E;}
</style>
</head>
<body>
  <button class="back-btn" onclick="location.href='index.html'">← 返回大厅</button>

<div class="container">
  <!-- 左面板 -->
  <div class="left-panel">
    <div class="panel-title">多目标追踪</div>

    <div class="diff-label">难度选择</div>
    <div class="diff-btns" id="diffPanel">
      <button class="diff-btn active" data-level="easy">初级</button>
      <button class="diff-btn" data-level="medium">中级</button>
      <button class="diff-btn" data-level="hard">高级</button>
    </div>

    <div class="color-row">
      <span class="color-label">目标球颜色</span>
      <input type="color" id="ballColorPicker" value="#FF5E0E" class="color-picker">
    </div>

    <div class="config-desc" id="configDesc">
      <div class="row"><span>总球数</span><span id="cfgN">6</span></div>
      <div class="row"><span>目标球</span><span id="cfgK">2</span></div>
      <div class="row"><span>追踪时长</span><span id="cfgDur">8s</span></div>
      <div class="row"><span>球速</span><span id="cfgSpeed">慢</span></div>
    </div>

    <div class="speed-row">
      <span class="speed-label">速度倍率</span>
      <input type="range" id="speedSlider" min="0.5" max="9.0" step="0.1" value="1.0" class="speed-slider">
      <span class="speed-val" id="speedVal">1.0x</span>
    </div>

    <div class="rules-box">
      <div class="rules-title">玩法说明</div>
      <p><b>训练目标：</b>多目标视觉追踪。N个球中标记K个目标，追踪运动后识别目标球。</p>
      <p><b>操作方式：</b>观察橙色标记→点击开始追踪→球停止后点击识别目标球→全部选中进入下一轮。</p>
      <p><b>计分规则：</b>正确识别数/K。加权分 = 正确率 × (1 + K/N)。共10轮。</p>
      <p><b>难度差异：</b></p>
      <p>初级：6球2目标，慢速8秒<br>中级：8球3目标，中速12秒<br>高级：10球4目标，快速15秒</p>
    </div>

    <button class="start-btn" id="startBtn" onclick="startGame()">开始训练</button>

    <div class="result-card" id="resultCard">
      <div class="result-title">训练结束</div>
      <div class="result-row"><span>总轮次</span><span class="rv" id="rRounds">-</span></div>
      <div class="result-row"><span>正确识别率</span><span class="rv" id="rAcc">-</span></div>
      <div class="result-row"><span>加权得分</span><span class="rv" id="rScore">-</span></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="restartGame()">再玩一次</button>
      </div>
    </div>
  </div>

  <!-- 右面板 -->
  <div class="right-panel">
    <div class="game-title">多目标追踪</div>

    <div class="info-bar">
      <div class="info-item">轮次 <span class="val" id="roundNum">0</span>/10</div>
      <div class="info-item">得分 <span class="val" id="scoreVal">0</span></div>
      <div class="info-item">正确率 <span class="val" id="accVal">-</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
      <span class="progress-label" id="progressText">0 / 0</span>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas"></canvas>
      <canvas id="countdownCanvas" class="countdown-ring" width="60" height="60" style="display:none;"></canvas>
    </div>

    <div class="hint-text" id="hintText">点击左侧「开始训练」</div>
  </div>
</div>

<script>
const DIFFICULTY = {
  easy:{N:6,K:2,speed:0.8,duration:8000,ballSize:18,label:'慢'},
  medium:{N:8,K:3,speed:1.2,duration:12000,ballSize:15,label:'中'},
  hard:{N:10,K:4,speed:1.6,duration:15000,ballSize:12,label:'快'}
};

let state = {
  level:'easy',
  round:0,
  totalScore:0,
  totalCorrect:0,
  totalRounds:0,
  phase:'idle', // idle|marking|tracking|selecting|result
  balls:[],
  targets:[],
  selected:new Set(),
  animId:null,
  startTime:0,
  gameStarted:false,
  ballColor:'#FF5E0E',
  speedMultiplier:1.0,
  selectDeadline:0
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const hintText = document.getElementById('hintText');
const resultCard = document.getElementById('resultCard');
const startBtn = document.getElementById('startBtn');

// 音效
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playClickSound(){
  try{
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, ac.currentTime+0.08);
    gain.gain.setValueAtTime(0.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.12);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+0.12);
  }catch(e){}
}

function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2,2);
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function updateConfigDesc(){
  const cfg = DIFFICULTY[state.level];
  document.getElementById('cfgN').textContent = cfg.N;
  document.getElementById('cfgK').textContent = cfg.K;
  document.getElementById('cfgDur').textContent = (cfg.duration/1000)+'s';
  document.getElementById('cfgSpeed').textContent = cfg.label;
  document.getElementById('speedVal').textContent = state.speedMultiplier.toFixed(1)+'x';
  document.getElementById('speedSlider').value = state.speedMultiplier;
}

function initBalls(){
  const cfg = DIFFICULTY[state.level];
  const W = canvas.width / 2;
  const H = canvas.height / 2;
  const margin = cfg.ballSize * 2;
  state.balls = [];
  state.targets = [];
  state.selected = new Set();

  const positions = [];
  for(let i = 0; i < cfg.N; i++){
    let x,y,overlap;
    let attempts = 0;
    do {
      x = margin + Math.random() * (W - margin * 2);
      y = margin + Math.random() * (H - margin * 2);
      overlap = positions.some(p=>{
        const dx = p.x - x, dy = p.y - y;
        return Math.sqrt(dx*dx+dy*dy) < cfg.ballSize * 3;
      });
      attempts++;
    } while(overlap && attempts < 100);
    positions.push({x,y});

    const angle = Math.random() * Math.PI * 2;
    state.balls.push({
      x,y,
      vx: Math.cos(angle) * cfg.speed * state.speedMultiplier,
      vy: Math.sin(angle) * cfg.speed * state.speedMultiplier,
      isTarget: false,
      selected: false
    });
  }

  const indices = Array.from({length:cfg.N},(_,i)=>i);
  for(let i = indices.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [indices[i],indices[j]] = [indices[j],indices[i]];
  }
  for(let i = 0; i < cfg.K; i++){
    state.balls[indices[i]].isTarget = true;
    state.targets.push(indices[i]);
  }
}

function startGame(){
  if(state.phase === 'tracking' || state.phase === 'marking') return;
  state.round = 0;
  state.totalScore = 0;
  state.totalCorrect = 0;
  state.totalRounds = 0;
  state.gameStarted = true;
  state.ballColor = document.getElementById('ballColorPicker').value;
  if(state.animId) cancelAnimationFrame(state.animId);
  resultCard.classList.remove('show');
  startBtn.disabled = true;
  startBtn.textContent = '训练中...';
  updateUI();
  startRound();
}

function showCountdown(cb){
  const W = canvas.width / 2;
  const H = canvas.height / 2;
  let count = 3;
  function tick(){
    ctx.clearRect(0,0,W,H);
    drawGrid();
    drawBalls(); // 倒计时期间球保持显示
    if(count > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 80px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 20;
      ctx.fillText(count, W/2, H/2);
      ctx.shadowBlur = 0;
      count--;
      setTimeout(tick, 800);
    } else {
      cb();
    }
  }
  tick();
}

function drawGrid(){
  const W = canvas.width / 2;
  const H = canvas.height / 2;
  ctx.strokeStyle = 'rgba(45,43,85,0.04)';
  ctx.lineWidth = 1;
  for(let x = 0; x < W; x += 40){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y = 0; y < H; y += 40){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function startRound(){
  const cfg = DIFFICULTY[state.level];
  state.round++;
  state.phase = 'marking';
  state.selected = new Set();
  initBalls();
  drawBalls();
  hintText.textContent = '记住彩色标记的目标球！';
  hintText.style.color = '#FF073A';
  updateUI();

  // 2秒后倒计时
  setTimeout(()=>{
    showCountdown(()=>{
      state.phase = 'tracking';
      state.startTime = Date.now();
      hintText.textContent = '追踪目标球的运动...';
      hintText.style.color = '';
      animate();
    });
  },2000);
}

function animate(){
  // 选择阶段：倒计时+持续重绘
  if(state.phase === 'selecting'){
    if(state.selectDeadline && Date.now() >= state.selectDeadline){
      // 倒计时到期：进入 reveal 阶段展示答案
      evaluateRound();
      return;
    }
    drawBalls();
    state.animId = requestAnimationFrame(animate);
    return;
  }
  if(state.phase !== 'tracking') return;
  const cfg = DIFFICULTY[state.level];
  const W = canvas.width / 2;
  const H = canvas.height / 2;
  const r = cfg.ballSize;

  state.balls.forEach(b=>{
    b.x += b.vx;
    b.y += b.vy;
    if(b.x - r < 0){b.x = r; b.vx = Math.abs(b.vx);}
    if(b.x + r > W){b.x = W - r; b.vx = -Math.abs(b.vx);}
    if(b.y - r < 0){b.y = r; b.vy = Math.abs(b.vy);}
    if(b.y + r > H){b.y = H - r; b.vy = -Math.abs(b.vy);}
  });

  // 球体积碰撞
  const balls = state.balls;
  const minDist = r * 2;
  for(let i = 0; i < balls.length; i++){
    for(let j = i + 1; j < balls.length; j++){
      const dx = balls[j].x - balls[i].x;
      const dy = balls[j].y - balls[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if(dist < minDist && dist > 0.001){
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        balls[i].x -= nx * overlap / 2;
        balls[i].y -= ny * overlap / 2;
        balls[j].x += nx * overlap / 2;
        balls[j].y += ny * overlap / 2;
        const dvx = balls[j].vx - balls[i].vx;
        const dvy = balls[j].vy - balls[i].vy;
        const dvDotN = dvx * nx + dvy * ny;
        if(dvDotN < 0){
          balls[i].vx += dvDotN * nx;
          balls[i].vy += dvDotN * ny;
          balls[j].vx -= dvDotN * nx;
          balls[j].vy -= dvDotN * ny;
        }
      }
    }
  }

  drawBalls();

  const elapsed = Date.now() - state.startTime;
  if(elapsed >= cfg.duration){
    state.phase = 'selecting';
    state.selectDeadline = Date.now() + 5000;
    hintText.textContent = '点击识别目标球！（需选'+cfg.K+'个）';
    hintText.style.color = '';
    drawBalls();
    state.animId = requestAnimationFrame(animate);
    return;
  }
  state.animId = requestAnimationFrame(animate);
}

function drawBalls(){
  const cfg = DIFFICULTY[state.level];
  const W = canvas.width / 2;
  const H = canvas.height / 2;
  ctx.clearRect(0,0,W,H);

  drawGrid();

  // 选择阶段倒计时
  if(state.phase === 'selecting' && state.selectDeadline){
    const remaining = Math.max(0, Math.ceil((state.selectDeadline - Date.now()) / 1000));
    ctx.fillStyle = remaining <= 1 ? '#FF073A' : '#1a1a2e';
    ctx.font = 'bold 48px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(remaining + 's', canvas.width/4, 60);
  }

  state.balls.forEach((b,i)=>{
    const r = cfg.ballSize;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI*2);

    if(state.phase === 'marking' && b.isTarget){
      ctx.fillStyle = state.ballColor;
      ctx.shadowColor = state.ballColor + '99';
      ctx.shadowBlur = 12;
    } else if(state.phase === 'reveal' && b.isTarget){
      ctx.fillStyle = state.ballColor;
      ctx.shadowColor = state.ballColor + '99';
      ctx.shadowBlur = 12;
    } else if(state.phase === 'selecting' && state.selected.has(i)){
      ctx.fillStyle = '#32CD32';
      ctx.shadowColor = 'rgba(50,205,50,0.4)';
      ctx.shadowBlur = 8;
    } else {
      ctx.fillStyle = 'rgba(45,43,85,0.2)';
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    if(state.phase === 'result'){
      if(b.isTarget && state.selected.has(i)){
        ctx.fillStyle = '#32CD32';
        ctx.font = `bold ${r*1.2}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('✓', b.x, b.y + r*0.4);
      } else if(b.isTarget && !state.selected.has(i)){
        ctx.strokeStyle = '#FF5E0E';
        ctx.lineWidth = 2;
        ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.arc(b.x,b.y,r+4,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
      } else if(!b.isTarget && state.selected.has(i)){
        ctx.fillStyle = '#FF073A';
        ctx.font = `bold ${r*1.2}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('✗', b.x, b.y + r*0.4);
      }
    }

    // reveal 阶段：漏选的目标球画虚线圈
    if(state.phase === 'reveal' && b.isTarget && !state.selected.has(i)){
      ctx.strokeStyle = '#FF5E0E';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.arc(b.x,b.y,r+4,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
    }
  });
}

canvas.addEventListener('click',e=>{
  if(state.phase !== 'selecting') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const cfg = DIFFICULTY[state.level];

  let closest = -1, minDist = Infinity;
  state.balls.forEach((b,i)=>{
    const dx = b.x - mx, dy = b.y - my;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < cfg.ballSize * 1.5 && dist < minDist){
      minDist = dist;
      closest = i;
    }
  });

  if(closest >= 0){
    playClickSound();
    if(state.selected.has(closest)){
      state.selected.delete(closest);
    } else {
      state.selected.add(closest);
    }
    drawBalls();
  }

  if(state.selected.size >= cfg.K){
    evaluateRound();
  }
});

function evaluateRound(){
  // reveal 阶段：展示答案（目标球亮色，非目标灰色）
  state.phase = 'reveal';
  const cfg = DIFFICULTY[state.level];
  let correct = 0;
  state.targets.forEach(t=>{
    if(state.selected.has(t)) correct++;
  });
  state.totalCorrect += correct;
  state.totalRounds++;
  state.totalScore += correct / cfg.K * (1 + cfg.K / cfg.N);
  drawBalls();
  hintText.textContent = '正确识别 ' + correct + '/' + cfg.K + ' 个目标球';
  hintText.style.color = '';
  updateUI();

  if(state.round >= 10){
    setTimeout(()=>endGame(),2000);
  } else {
    setTimeout(()=>startRound(),2000);
  }
}

function endGame(){
  state.phase = 'idle';
  state.gameStarted = false;
  startBtn.disabled = false;
  startBtn.textContent = '开始训练';
  const acc = state.totalRounds > 0 ? Math.round(state.totalCorrect / (state.totalRounds * DIFFICULTY[state.level].K) * 100) : 0;
  document.getElementById('rRounds').textContent = state.totalRounds;
  document.getElementById('rAcc').textContent = acc + '%';
  document.getElementById('rScore').textContent = Math.round(state.totalScore * 100) / 100;
  resultCard.classList.add('show');
  hintText.textContent = '';
  hintText.style.color = '';
  saveResult(acc);
}

function saveResult(acc){
  const data = JSON.parse(localStorage.getItem('mot_tracker')||'[]');
  data.push({acc,score:Math.round(state.totalScore*100)/100,rounds:state.totalRounds,level:state.level,time:Date.now()});
  if(data.length > 20) data.shift();
  localStorage.setItem('mot_tracker',JSON.stringify(data));
}

function resetToIdle(){
  state.phase = 'idle';
  state.gameStarted = false;
  state.selectDeadline = 0;
  startBtn.disabled = false;
  startBtn.textContent = '开始训练';
  resultCard.classList.remove('show');
  document.querySelectorAll('.diff-btn').forEach(b=>b.disabled=false);
  hintText.textContent = '';
  hintText.style.color = '';
}

function restartGame(){
  resetToIdle();
}

function updateUI(){
  document.getElementById('roundNum').textContent = state.round;
  document.getElementById('scoreVal').textContent = Math.round(state.totalScore * 100) / 100;
  const acc = state.totalRounds > 0 ? Math.round(state.totalCorrect/(state.totalRounds*DIFFICULTY[state.level].K)*100)+'%' : '-';
  document.getElementById('accVal').textContent = acc;
  // Progress bar
  const pct = state.round > 0 ? Math.min(100, Math.round(state.round / 10 * 100)) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = state.round + ' / 10';
}

document.getElementById('diffPanel').addEventListener('click',e=>{
  if(!e.target.classList.contains('diff-btn')) return;
  document.querySelectorAll('#diffPanel .diff-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  state.level = e.target.dataset.level;
  if(state.animId) cancelAnimationFrame(state.animId);
  state.phase = 'idle';
  state.gameStarted = false;
  state.round = 0;
  state.totalScore = 0;
  state.totalCorrect = 0;
  state.totalRounds = 0;
  resultCard.classList.remove('show');
  startBtn.disabled = false;
  startBtn.textContent = '开始训练';
  hintText.textContent = '点击左侧「开始训练」';
  updateConfigDesc();
  updateUI();
  drawBalls();
});

	document.getElementById('speedSlider').addEventListener('input',e=>{
	  state.speedMultiplier = parseFloat(e.target.value);
	  document.getElementById('speedVal').textContent = state.speedMultiplier.toFixed(1)+'x';
	  updateConfigDesc();
	});

updateConfigDesc();
updateUI();
</script>
</body>
