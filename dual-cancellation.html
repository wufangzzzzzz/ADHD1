<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>双人划消 · 双人对战</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  #app{height:100vh;display:flex;flex-direction:column;background:#0f1226;color:#eef;}

  /* 顶部条 */
  .topbar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(135deg,#1b1f3b,#2a2f5a);box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:20;}
  .topbar .title{font-size:17px;font-weight:800;letter-spacing:.5px;}
  .badge{font-size:11px;font-weight:700;color:#fff;background:#e53935;padding:2px 8px;border-radius:10px;}
  .topbar .spacer{flex:1;}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;transition:transform .1s,opacity .2s;}
  .btn:active{transform:scale(.96);}
  .btn-menu{background:#4550a0;}
  .btn-flip{background:#5a64c8;}
  .btn-flip.active{background:#ffb300;color:#1b1f3b;}
  .btn-start{background:linear-gradient(135deg,#2e7d32,#43a047);}
  .btn-start:disabled{opacity:.4;cursor:not-allowed;}
  .btn-start.replay{background:linear-gradient(135deg,#1565c0,#1e88e5);}

  /* 对战区 */
  .arena{flex:1 1 auto;display:flex;min-height:0;position:relative;}
  .board-wrap{flex:1 1 0;min-width:0;position:relative;transition:transform .35s ease;}
  .board-wrap.flipped{transform:rotate(180deg);}
  .board-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fafaff;}
  .board-tag{position:absolute;top:8px;left:10px;z-index:5;font-size:12px;font-weight:800;color:#1b1f3b;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:10px;pointer-events:none;}
  .board-wrap.flipped .board-tag{display:none;}
  .divider{flex:0 0 auto;width:2px;background:linear-gradient(#3a3f70,#6c73c0,#3a3f70);position:relative;}
  .divider .vs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#ffb300;color:#1b1f3b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.4);}

  /* 胜利浮层 */
  .winner{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(15,18,38,.55);z-index:15;backdrop-filter:blur(2px);}
  .winner.show{display:flex;}
  .winner .wc{background:#fff;color:#1b1f3b;padding:22px 34px;border-radius:18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:80%;}
  .winner .wc .big{font-size:30px;font-weight:900;margin-bottom:8px;}
  .winner .wc .sub{font-size:15px;color:#555;margin-bottom:6px;}
  .winner .wc .cmp{display:flex;gap:24px;justify-content:center;margin:10px 0;}
  .winner .wc .cmp .ci{text-align:center;}
  .winner .wc .cmp .ci .cl{font-size:12px;color:#888;}
  .winner .wc .cmp .ci .cv{font-size:20px;font-weight:800;}
  .winner .wc .again{margin-top:12px;}

  /* 弹出菜单 */
  .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
  .popup-overlay.show{display:flex;}
  .popup{width:min(420px,92vw);max-height:86vh;overflow:auto;background:#fff;color:#1b1f3b;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .popup h3{margin:0 0 16px;font-size:18px;font-weight:800;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:#555;margin-bottom:7px;}
  .field select{width:100%;height:42px;border-radius:10px;border:1px solid #d5d8ec;padding:0 12px;font-size:15px;background:#f6f7ff;color:#1b1f3b;}
  .field.toggle-row{display:flex;gap:14px;}
  .field.toggle-row .tg{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;}
  .field.toggle-row input{width:20px;height:20px;accent-color:#4550a0;}
  .popup .close-btn{width:100%;margin-top:6px;border:none;border-radius:12px;padding:13px;background:linear-gradient(135deg,#4550a0,#5a64c8);color:#fff;font-size:16px;font-weight:800;cursor:pointer;}
  .hint{font-size:12px;color:#888;margin-bottom:14px;line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="btn btn-menu" id="menuBtn">☰ 菜单</button>
    <span class="title">双人划消</span>
    <span class="badge">双人模式</span>
    <button class="btn btn-flip" id="flipLBtn">⇅ 翻转左</button>
    <button class="btn btn-flip" id="flipRBtn">⇅ 翻转右</button>
    <span class="spacer"></span>
    <button class="btn btn-start" id="startBtn" disabled>开始对战</button>
  </div>
  <div class="arena">
    <div class="board-wrap" id="wrapL">
      <span class="board-tag">左方</span>
      <iframe id="boardL" src="cancellation-embed.html?embed=1&side=L" allow="autoplay"></iframe>
    </div>
    <div class="divider"><span class="vs">VS</span></div>
    <div class="board-wrap" id="wrapR">
      <span class="board-tag">右方</span>
      <iframe id="boardR" src="cancellation-embed.html?embed=1&side=R" allow="autoplay"></iframe>
    </div>
    <div class="winner" id="winner">
      <div class="wc">
        <div class="big" id="winText">🏆 左方胜利！</div>
        <div class="sub" id="winSub"></div>
        <div class="cmp" id="winCmp" style="display:none;"></div>
        <button class="btn btn-start replay again" id="againBtn">再来一局</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="popup-overlay" id="popup">
    <div class="popup">
      <h3>对战设置</h3>
      <div class="field">
        <label>模式</label>
        <select id="modeSel">
          <option value="number" selected>数字模式</option>
          <option value="letter">字母模式</option>
          <option value="word">文字模式</option>
        </select>
      </div>
      <div class="field" id="templateField" style="display:none;">
        <label>文字模板</label>
        <select id="templateSel">
          <option value="宝盖头">宝盖头</option><option value="日字系列">日字系列</option>
          <option value="口字框">口字框</option><option value="土字底">土字底</option>
          <option value="月字旁">月字旁</option><option value="绞丝旁">绞丝旁</option>
          <option value="金字旁">金字旁</option><option value="木字旁">木字旁</option>
          <option value="草字头">草字头</option><option value="三点水">三点水</option>
          <option value="人字旁">人字旁</option><option value="言字旁">言字旁</option>
          <option value="火字旁">火字旁</option>
        </select>
      </div>
      <div class="field">
        <label>找出几个目标</label>
        <select id="targetCountSel">
          <option value="1">1 个</option>
          <option value="2" selected>2 个</option>
          <option value="3">3 个</option>
        </select>
      </div>
      <div class="field">
        <label>方向</label>
        <select id="orientSel">
          <option value="horizontal" selected>横版（12×20）</option>
          <option value="vertical">竖版（20×18）</option>
        </select>
      </div>
      <div class="field">
        <label>游戏区大小</label>
        <select id="volSel">
          <option value="0.6">60%（最小）</option>
          <option value="0.8">80%</option>
          <option value="1" selected>100%（标准）</option>
          <option value="1.2">120%</option>
          <option value="1.4">140%（最大）</option>
        </select>
      </div>
      <div class="field">
        <label>自定义行列（填了则覆盖方向默认值）</label>
        <div style="display:flex;gap:12px;align-items:center;">
          <span style="font-size:13px;font-weight:700;color:#555;">行</span>
          <input type="number" id="customRows" min="3" max="20" placeholder="自动" style="width:70px;height:36px;border-radius:8px;border:1px solid #d5d8ec;padding:0 8px;font-size:15px;background:#f6f7ff;color:#1b1f3b;">
          <span style="font-size:13px;font-weight:700;color:#555;">列</span>
          <input type="number" id="customCols" min="3" max="25" placeholder="自动" style="width:70px;height:36px;border-radius:8px;border:1px solid #d5d8ec;padding:0 8px;font-size:15px;background:#f6f7ff;color:#1b1f3b;">
        </div>
      </div>
      <div class="field toggle-row">
        <label class="tg"><input type="checkbox" id="colorfulChk"> 彩色模式</label>
      </div>
      <div class="hint">左右两方使用相同的目标值但不同的网格排列，每行固定 2 个目标；先找完所有目标的一方获胜。</div>
      <button class="close-btn" id="closePopup">完成</button>
    </div>
  </div>
</div>
<script>
  /* ===== 文字模板（与 embed 页同步） ===== */
  var wordTemplates={
    '宝盖头':['灾','定','官','完','守','牢','宗','宝','宁','宋','宇','宅','宙','宣','审','实','客','容','密','寒'],
    '日字系列':['日','目','白','旧','旦','百','自','且','田','由','申','甲','冒','昌','旭','明','旨','暗','显','晴'],
    '口字框':['囚','团','四','回','囱','囧','圆','圈','囵','固','国','圃','因','园','围','困','图'],
    '土字底':['至','到','致','屋','握','卧','底','店','垂','塞','坐','堪','坑','块','坪','坡','坤','坦','城','域'],
    '月字旁':['肝','胆','肺','肚','肠','胃','腰','腹','腿','脚','膝','臂','朋','胺','肥','胖','脂','胞','腔','脱'],
    '绞丝旁':['红','绿','结','织','终','绚','给','绝','绞','絮','紫','线','纳','纹','纸','纷','统','继','续','缓'],
    '金字旁':['钟','钉','铁','银','铜','锡','铅','钻','锋','链','锁','镜','钢','钱','铭','铲','错','锣','锤'],
    '木字旁':['林','杨','柳','桃','李','梅','桂','桥','板','柜','桌','椅','棵','植','机','村','枝','柱','标','样'],
    '草字头':['花','草','苗','芽','苟','苞','苔','荷','茶','菊','葱','落','苦','若','茂','英','范','蓝','蔬','萍'],
    '三点水':['汉','汗','江','泪','洒','洗','洁','洛','浪','涌','涛','浮','河','湖','海','波','深','浅','流','消'],
    '人字旁':['他','们','你','什','仔','住','体','休','伸','伴','位','低','佛','件','任','借','值','倒'],
    '言字旁':['说','话','语','讲','谈','论','许','识','诗','词','谎','课','读','请','谁','谢','记','设'],
    '火字旁':['灯','炉','炒','烧','烟','烂','炮','焰','焕','煌','炊','炯','炼','烘','烤','烛','煤','燃']
  };
  var letters=['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];

  /* ===== 状态 ===== */
  var state={
    mode:'number',targetCount:2,orientation:'horizontal',colorful:false,
    wordTemplate:'宝盖头',
    customRows:null,customCols:null,
    volScale:1,
    flipL:false,flipR:false,
    started:false,battleOver:false,
    ready:{L:false,R:false},
    results:{L:null,R:null}
  };
  var boardL=document.getElementById('boardL');
  var boardR=document.getElementById('boardR');
  var startBtn=document.getElementById('startBtn');
  var winner=document.getElementById('winner');

  function postTo(side,msg){var w=(side==='L'?boardL:boardR).contentWindow;if(w)w.postMessage(msg,'*');}
  function postBoth(msg){postTo('L',msg);postTo('R',msg);}

  /* ===== 生成目标值（两侧相同） ===== */
  function generateTargets(){
    var pool;
    if(state.mode==='number')pool=[1,2,3,4,5,6,7,8,9];
    else if(state.mode==='letter')pool=letters.slice();
    else pool=wordTemplates[state.wordTemplate].slice();
    var copy=pool.slice(),res=[];
    for(var k=0;k<state.targetCount&&copy.length>0;k++){
      var idx=Math.floor(Math.random()*copy.length);
      res.push(copy.splice(idx,1)[0]);
    }
    return res;
  }

  /* ===== 下发配置 ===== */
  function applyConfig(){
    if(!state.ready.L||!state.ready.R)return;
    var targets=generateTargets();
    var cfg={
      cmd:'config',
      mode:state.mode,
      targetCount:state.targetCount,
      orientation:state.orientation,
      colorful:state.colorful,
      wordTemplate:state.wordTemplate,
      customRows:state.customRows,
      customCols:state.customCols,
      volScale:state.volScale,
      targetValues:targets
    };
    postBoth(cfg);
    state.started=false;
    state.battleOver=false;
    state.results={L:null,R:null};
    winner.classList.remove('show');
    startBtn.disabled=false;
    startBtn.classList.remove('replay');
    startBtn.textContent='开始对战';
  }

  /* ===== 开始对战 ===== */
  function startBattle(){
    if(!state.ready.L||!state.ready.R)return;
    state.started=true;
    state.battleOver=false;
    state.results={L:null,R:null};
    winner.classList.remove('show');
    postBoth({cmd:'start'});
    startBtn.disabled=true;
    startBtn.textContent='对战中…';
  }

  /* ===== 完成处理 ===== */
  function onDone(side,data){
    if(state.results[side]!=null)return;
    state.results[side]=data;
    var other=side==='L'?'R':'L';
    var label=side==='L'?'左方':'右方';

    if(!state.battleOver&&state.results[other]==null){
      // 第一完成者
      state.battleOver=true;
      document.getElementById('winText').textContent='🏆 '+label+'率先完成！';
      document.getElementById('winSub').textContent='用时 '+data.time+' 秒 · 等待对方完成…';
      document.getElementById('winCmp').style.display='none';
      winner.classList.add('show');
      startBtn.disabled=false;
      startBtn.classList.add('replay');
      startBtn.textContent='再来一局';
    }else{
      // 双方都完成，出终局对比
      var l=state.results.L,r=state.results.R;
      var winSide=(parseFloat(l.time)<=parseFloat(r.time))?'左方':'右方';
      document.getElementById('winText').textContent='🏆 '+winSide+'胜利！';
      document.getElementById('winSub').textContent='';
      var cmp=document.getElementById('winCmp');
      cmp.style.display='flex';
      cmp.innerHTML=
        '<div class="ci"><div class="cl">左方用时</div><div class="cv" style="color:'+ (parseFloat(l.time)<=parseFloat(r.time)?'#4CAF50':'#f44336') +'">'+l.time+'s</div></div>'+
        '<div class="ci"><div class="cl">右方用时</div><div class="cv" style="color:'+ (parseFloat(r.time)<parseFloat(l.time)?'#4CAF50':'#f44336') +'">'+r.time+'s</div></div>'+
        '<div class="ci"><div class="cl">左方正确率</div><div class="cv">'+l.accuracy+'%</div></div>'+
        '<div class="ci"><div class="cl">右方正确率</div><div class="cv">'+r.accuracy+'%</div></div>'+
        '<div class="ci"><div class="cl">左方指数</div><div class="cv">'+l.index+'</div></div>'+
        '<div class="ci"><div class="cl">右方指数</div><div class="cv">'+r.index+'</div></div>';
      winner.classList.add('show');
      startBtn.disabled=false;
      startBtn.classList.add('replay');
      startBtn.textContent='再来一局';
    }
  }

  /* ===== 消息监听 ===== */
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.cmd==='ready'){
      state.ready[d.side]=true;
      if(state.ready.L&&state.ready.R){
        startBtn.disabled=false;
        applyConfig();
      }
    }else if(d.cmd==='done'){
      onDone(d.side,d);
    }
  });

  /* ===== UI 交互 ===== */
  document.getElementById('menuBtn').addEventListener('click',function(){
    document.getElementById('popup').classList.add('show');
  });
  document.getElementById('closePopup').addEventListener('click',function(){
    document.getElementById('popup').classList.remove('show');
    applyConfig();
  });
  document.getElementById('popup').addEventListener('click',function(e){
    if(e.target===this)this.classList.remove('show');
  });
  document.getElementById('modeSel').addEventListener('change',function(e){
    state.mode=e.target.value;
    document.getElementById('templateField').style.display=(state.mode==='word')?'block':'none';
    applyConfig();
  });
  document.getElementById('templateSel').addEventListener('change',function(e){
    state.wordTemplate=e.target.value;applyConfig();
  });
  document.getElementById('targetCountSel').addEventListener('change',function(e){
    state.targetCount=parseInt(e.target.value,10);applyConfig();
  });
  document.getElementById('orientSel').addEventListener('change',function(e){
    state.orientation=e.target.value;applyConfig();
  });
  document.getElementById('customRows').addEventListener('input',function(e){
    var v=parseInt(e.target.value,10);
    state.customRows=(v>=3&&v<=20)?v:null;
    if(v>=3&&v<=20)applyConfig();
  });
  document.getElementById('customCols').addEventListener('input',function(e){
    var v=parseInt(e.target.value,10);
    state.customCols=(v>=3&&v<=25)?v:null;
    if(v>=3&&v<=25)applyConfig();
  });
  document.getElementById('volSel').addEventListener('change',function(e){
    state.volScale=parseFloat(e.target.value)||1;
    applyConfig();
  });
  document.getElementById('colorfulChk').addEventListener('change',function(e){
    state.colorful=e.target.checked;applyConfig();
  });

  // 翻转
  document.getElementById('flipLBtn').addEventListener('click',function(){
    state.flipL=!state.flipL;
    document.getElementById('wrapL').classList.toggle('flipped',state.flipL);
    this.classList.toggle('active',state.flipL);
  });
  document.getElementById('flipRBtn').addEventListener('click',function(){
    state.flipR=!state.flipR;
    document.getElementById('wrapR').classList.toggle('flipped',state.flipR);
    this.classList.toggle('active',state.flipR);
  });

  // 开始/再来一局
  function resetToIdle(){
    state.started=false;state.battleOver=false;
    state.results={L:null,R:null};
    winner.classList.remove('show');
    startBtn.disabled=false;
    startBtn.classList.remove('replay');
    startBtn.textContent='开始对战';
    applyConfig();
  }
  startBtn.addEventListener('click',function(){
    if(state.battleOver){resetToIdle();return;}
    if(!state.started)startBattle();
  });
  document.getElementById('againBtn').addEventListener('click',resetToIdle);

  startBtn.disabled=true; // 等两 iframe ready
</script>
</body>
</html>
