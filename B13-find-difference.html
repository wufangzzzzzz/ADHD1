<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>找不同 · 专注力训练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#EC407A;--accent2:#D81B60;
  --err:#EF5350;--ok:#66BB6A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100dvh;overflow:hidden;}
body{font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-weight:500;background:radial-gradient(1200px 800px at 70% -10%,#1a174080,transparent),#0a0e1a;color:#EDE7F6;display:flex;align-items:center;justify-content:center;height:100dvh;user-select:none;-webkit-user-select:none;}
.container{display:flex;gap:16px;width:min(98vw,1100px);height:min(96vh,680px);padding:12px;}
.left-panel{width:270px;min-width:270px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 12px;overflow-y:auto;}
.panel-title{color:var(--accent);font-size:14px;font-weight:800;letter-spacing:0.05em;margin-top:6px;}
.diff-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.diff-btn{flex:1;min-width:42px;padding:6px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(237,231,246,0.55);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
.diff-btn:hover{background:rgba(236,64,122,0.08);}
.diff-btn.active{background:linear-gradient(135deg,#EC407A,#D81B60);border-color:transparent;color:#0a0e1a;font-weight:800;}
.guide-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 13px;margin-top:2px;}
.guide-title{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:6px;}
.guide-text{font-size:11.5px;line-height:1.85;color:rgba(237,231,246,0.62);}
.guide-text b{color:#EDE7F6;}
.guide-text .hint{color:#F48FB1;font-weight:700;}
/* 右面板 */
.right-panel{flex:1;min-width:0;position:relative;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.game-header{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:6;}
.game-title{color:#EDE7F6;font-size:18px;font-weight:800;}
.back-btn{background:rgba(237,231,246,0.06);border:none;color:rgba(237,231,246,0.5);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;}
.back-btn:hover{background:rgba(237,231,246,0.12);}
.game-area{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:46px 14px 14px;min-height:0;width:100%;overflow-y:auto;}
.progress-wrap{width:96%;max-width:480px;height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#EC407A,#D81B60);border-radius:4px;transition:width .3s;}
.target-hint{font-size:15px;font-weight:800;color:var(--accent);height:22px;min-height:22px;text-align:center;}
.grid-wrap{display:grid;gap:8px;width:96%;max-width:480px;margin:0 auto;}
.glyph-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border:2px solid transparent;border-radius:10px;cursor:pointer;transition:all .15s;}
.glyph-cell:hover{background:rgba(255,255,255,0.06);}
.glyph-cell svg{width:72%;height:72%;}
.glyph-cell.picked{border-color:#4CAF50;background:rgba(76,175,80,0.12);cursor:default;}
.glyph-cell.picked svg{opacity:0.5;}
.glyph-cell.wrong{border-color:#EF5350;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.hud{display:flex;gap:18px;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-size:13px;color:rgba(237,231,246,0.6);flex-wrap:wrap;justify-content:center;}
.hud .hud-val{color:var(--accent);font-weight:800;font-size:16px;}
.hud-val.urgent{color:#ef5350;animation:timeflash .5s steps(1,end) infinite;}
@keyframes timeflash{0%,100%{opacity:1;}50%{opacity:.35;}}
.feedback{height:20px;font-size:13px;font-weight:700;color:rgba(237,231,246,0.55);min-height:20px;text-align:center;}
.game-footer{margin-top:6px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:5;}
.start-btn{padding:10px 26px;border-radius:12px;border:none;background:linear-gradient(135deg,#EC407A,#D81B60);color:#0a0e1a;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(216,27,96,0.25);}
.start-btn:hover{transform:translateY(-1px);}
.start-btn:active{transform:scale(.96);}
.start-btn.stop-mode{background:linear-gradient(135deg,#e53935,#ef5350);color:#fff;box-shadow:0 4px 16px rgba(229,57,53,0.3);}
/* 结果卡片 */
.result-card{position:absolute;inset:0;background:rgba(10,14,26,0.97);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:20px 16px;z-index:10;overflow-y:auto;}
.result-title{color:var(--accent);font-size:22px;font-weight:800;margin-top:4px;}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:88%;max-width:440px;}
.result-item{background:rgba(237,231,246,0.05);border-radius:10px;padding:10px;text-align:center;}
.result-item .val{color:var(--accent);font-size:20px;font-weight:800;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;}
.result-item .lbl{color:rgba(237,231,246,0.5);font-size:11px;margin-top:3px;}
.result-section{width:88%;max-width:440px;background:rgba(237,231,246,0.03);border-radius:10px;padding:12px 14px;}
.section-title{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:8px;}
.cond-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(237,231,246,0.04);}
.cond-row:last-child{border-bottom:none;}
.cond-row .cl{color:rgba(237,231,246,0.55);}
.cond-row .cv{color:#EDE7F6;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-weight:700;}
.result-eval{width:88%;max-width:440px;background:rgba(237,231,246,0.04);border-radius:10px;padding:10px 14px;font-size:12px;color:rgba(237,231,246,0.7);line-height:1.8;text-align:left;}
.result-eval .eval-line{margin-bottom:3px;}
.result-btns{display:flex;gap:10px;margin-top:4px;margin-bottom:10px;}
.result-btns button{padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-retry{background:linear-gradient(135deg,#EC407A,#D81B60);color:#0a0e1a;}
.btn-home{background:rgba(237,231,246,0.1);color:#EDE7F6;}
.btn-retry:hover{transform:translateY(-1px);}
.btn-home:hover{background:rgba(237,231,246,0.16);}
@media(max-width:680px){
  html,body{height:auto;min-height:100dvh;overflow:visible;}
  body{align-items:flex-start;overflow-y:auto;}
  .container{flex-direction:column;height:auto;min-height:96vh;gap:10px;padding:10px;}
  .left-panel{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;gap:8px;overflow-x:auto;}
  .panel-title{width:100%;}
  .diff-btns{display:flex;}
  .diff-btns .diff-btn{flex:1;}
  .guide-card{flex:1;min-width:200px;}
  .right-panel{height:64vh;min-height:440px;}
  .result-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="container">
  <!-- 左面板 -->
  <div class="left-panel">
    <div class="panel-title">找不同 · 视觉搜索</div>
    <div class="panel-title" style="margin-top:2px;">难度</div>
    <div class="diff-btns" id="diff-all"></div>
    <div class="guide-card">
      <div class="guide-title">玩法说明</div>
      <div class="guide-text">
        屏幕会铺一组<b>彩色图形</b>，其中藏着若干个<b>目标图形</b>（形状与颜色都要匹配上方提示）。<br>
        • 任务：按提示 <b>点击所有目标图形</b>。<br>
        • 点错会记一次误点；找全所有目标即过关进入下一轮。<br>
        • <span class="hint">难度越高：</span>图形越多、干扰项越接近目标（共享形状或颜色），越考验选择性注意。
      </div>
    </div>
  </div>
  <!-- 右面板 -->
  <div class="right-panel">
    <div class="game-header">
      <div class="game-title">找不同</div>
      <button class="back-btn" onclick="location.href='index.html'">返回</button>
    </div>
    <div class="game-area" id="game-area">
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="target-hint" id="target-hint">选好难度，点开始训练</div>
      <div class="grid-wrap" id="grid-wrap"></div>
      <div class="hud">
        <span>轮次 <span class="hud-val" id="hud-round">0/10</span></span>
        <span>找到 <span class="hud-val" id="hud-found">0/0</span></span>
        <span>误点 <span class="hud-val" id="hud-miss">0</span></span>
        <span>命中 <span class="hud-val" id="hud-hit">-</span></span>
        <span>剩余 <span class="hud-val" id="hud-time">-</span></span>
      </div>
      <div class="feedback" id="feedback">选好难度，点开始训练</div>
      <div class="game-footer">
        <button class="start-btn" id="start-btn" onclick="toggleGame()">开始训练</button>
      </div>
    </div>
    <!-- 结果 -->
    <div class="result-card" id="result-card" style="display:none;"></div>
  </div>
</div>
<script>
// ===== 配置 =====
const COLORS=[
  {hex:'#EF5350',name:'红'},{hex:'#FF7043',name:'橙'},
  {hex:'#FFCA28',name:'黄'},{hex:'#C0CA33',name:'黄绿'},
  {hex:'#66BB6A',name:'绿'},{hex:'#26A69A',name:'青绿'},
  {hex:'#26C6DA',name:'青'},{hex:'#29B6F6',name:'浅蓝'},
  {hex:'#42A5F5',name:'蓝'},{hex:'#7E57C2',name:'蓝紫'},
  {hex:'#AB47BC',name:'紫'},{hex:'#EC407A',name:'粉'},
];
const SHAPES=[
  {key:'circle',name:'圆'},{key:'square',name:'方'},{key:'triangle',name:'三角'},
];
const LEVELS={
  entry :{name:'入门',count:12,targets:1,cols:4,sim:0,  time:9},
  easy  :{name:'初级',count:16,targets:1,cols:4,sim:0.3,time:10},
  medium:{name:'中级',count:24,targets:2,cols:6,sim:0.5,time:13},
  hard  :{name:'高级',count:32,targets:2,cols:7,sim:0.7,time:15},
  expert:{name:'专家',count:40,targets:3,cols:8,sim:0.9,time:19},
};
const DIFF_ORDER=['entry','easy','medium','hard','expert'];
const TOTAL_ROUNDS=10; // 每局固定轮数
// ===== DOM =====
const $=id=>document.getElementById(id);
// ===== 音频 =====
let audioCtx=null;
function initAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function playBeep(freq,dur){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur+0.02);
  }catch(e){}
}
// ===== 工具 =====
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function randOtherColor(hex){const pool=COLORS.filter(c=>c.hex!==hex);return pool[Math.floor(Math.random()*pool.length)].hex;}
function randOtherShape(key){const pool=SHAPES.filter(s=>s.key!==key);return pool[Math.floor(Math.random()*pool.length)].key;}
function glyphSVG(shape,color,size){
  const c=size/2;let inner='';
  if(shape==='circle')inner='<circle cx="'+c+'" cy="'+c+'" r="'+(c*0.82)+'" fill="'+color+'"/>';
  else if(shape==='square'){const r=size*0.16;inner='<rect x="'+r+'" y="'+r+'" width="'+(size-2*r)+'" height="'+(size-2*r)+'" rx="'+(size*0.08)+'" fill="'+color+'"/>';}
  else if(shape==='triangle'){const m=size*0.14;inner='<polygon points="'+c+','+m+' '+(size-m)+','+(size-m)+' '+m+','+(size-m)+'" fill="'+color+'"/>';}
  return '<svg viewBox="0 0 '+size+' '+size+'">'+inner+'</svg>';
}
// 生成干扰项：sim 概率与目标共享一个特征（同形异色 / 异形同色），否则完全随机
function genDistractor(ts,th,sim){
  let shape,color;
  if(Math.random()<sim){
    if(Math.random()<0.5){shape=ts;color=randOtherColor(th);}
    else{shape=randOtherShape(ts);color=th;}
  }else{shape=randOtherShape(ts);color=randOtherColor(th);}
  return {shape,color,isTarget:false};
}
// ===== session 统计（跨轮累计，分难度）=====
const sessionStats={};
DIFF_ORDER.forEach(k=>sessionStats[k]={rounds:0,found:0,targets:0,misses:0,timeouts:0,rtSum:0,rtCount:0});
// ===== 状态 =====
let state={
  level:'entry',running:false,phase:'idle',
  timers:[],timeTimer:null,
  curTargets:0,found:0,misses:0,
  roundsPlayed:0,
  curTargetDesc:'',
  roundStart:0,timeLimit:0,timeLeft:0,
};
function at(delay,fn){const t=setTimeout(fn,delay);state.timers.push(t);return t;}
function clearTimers(){state.timers.forEach(t=>clearTimeout(t));state.timers=[];if(state.timeTimer){clearInterval(state.timeTimer);state.timeTimer=null;}}
// ===== 难度按钮 =====
function buildDiffBtns(){
  const c=$('diff-all');c.innerHTML='';
  DIFF_ORDER.forEach(k=>{
    const b=document.createElement('button');
    b.className='diff-btn'+(state.level===k?' active':'');
    b.textContent=LEVELS[k].name;
    b.onclick=()=>{if(state.running)return;state.level=k;document.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
    c.appendChild(b);
  });
}
// ===== 渲染 =====
function renderGrid(items){
  const cfg=LEVELS[state.level];
  const wrap=$('grid-wrap');
  wrap.style.gridTemplateColumns='repeat('+cfg.cols+',1fr)';
  wrap.innerHTML='';
  items.forEach(it=>{
    const cell=document.createElement('div');
    cell.className='glyph-cell';
    cell.innerHTML=glyphSVG(it.shape,it.color,64);
    cell.dataset.target=it.isTarget?'1':'0';
    cell.onclick=()=>onPick(cell);
    wrap.appendChild(cell);
  });
}
function updateHud(){
  $('hud-round').textContent=state.roundsPlayed+'/'+TOTAL_ROUNDS;
  $('hud-found').textContent=state.found+'/'+state.curTargets;
  $('hud-miss').textContent=state.misses;
  const s=sessionStats[state.level];
  $('hud-hit').textContent=s.targets?Math.round(s.found/s.targets*100)+'%':'-';
  $('progress-bar').style.width=(state.roundsPlayed/TOTAL_ROUNDS*100)+'%';
  updateTimeHud();
}
// ===== 游戏流程 =====
function toggleGame(){
  if(state.running)stopGame();
  else startGame();
}
function startGame(){
  initAudio();
  DIFF_ORDER.forEach(k=>{sessionStats[k]={rounds:0,found:0,targets:0,misses:0,rtSum:0,rtCount:0};});
  state.roundsPlayed=0;
  state.running=true;
  $('result-card').style.display='none';
  $('start-btn').textContent='停止训练';
  $('start-btn').classList.add('stop-mode');
  updateHud();
  nextRound();
}
function nextRound(){
  const cfg=LEVELS[state.level];
  state.curTargets=cfg.targets;
  state.found=0;state.misses=0;
  const tColor=COLORS[randInt(0,COLORS.length-1)];
  const tShape=SHAPES[randInt(0,SHAPES.length-1)];
  state.curTargetDesc=tColor.name+tShape.name;
  const items=[];
  for(let i=0;i<cfg.targets;i++)items.push({shape:tShape.key,color:tColor.hex,isTarget:true});
  for(let i=0;i<cfg.count-cfg.targets;i++)items.push(genDistractor(tShape.key,tColor.hex,cfg.sim));
  shuffle(items);
  renderGrid(items);
  $('target-hint').textContent='找出所有 '+state.curTargetDesc;
  $('feedback').textContent='点击所有目标图形';
  state.roundStart=performance.now();
  state.timeLimit=cfg.time;state.timeLeft=cfg.time;
  state.phase='playing';
  updateHud();
  startTimer();
}
function onPick(cell){
  if(state.phase!=='playing'||cell.dataset.done)return;
  if(cell.dataset.target==='1'){
    cell.dataset.done='1';
    cell.classList.add('picked');
    state.found++;
    playBeep(880,0.08);
    updateHud();
    if(state.found>=state.curTargets)roundDone();
  }else{
    state.misses++;
    cell.classList.add('wrong');
    playBeep(300,0.1);
    setTimeout(()=>cell.classList.remove('wrong'),400);
    updateHud();
  }
}
function roundDone(){
  state.phase='done';
  const rt=performance.now()-state.roundStart;
  const s=sessionStats[state.level];
  s.rounds++;s.found+=state.found;s.targets+=state.curTargets;s.misses+=state.misses;
  if(rt>0){s.rtSum+=rt;s.rtCount++;}
  playBeep(990,0.18);
  state.roundsPlayed++;
  updateHud();
  $('feedback').textContent='本轮完成！';
  at(700,()=>{
    if(!state.running)return;
    if(state.roundsPlayed>=TOTAL_ROUNDS)showResult();
    else nextRound();
  });
}
// ===== 倒计时（时间压力）=====
function startTimer(){
  clearInterval(state.timeTimer);
  updateTimeHud();
  state.timeTimer=setInterval(()=>{
    if(state.phase!=='playing'){clearInterval(state.timeTimer);state.timeTimer=null;return;}
    const el=performance.now()-state.roundStart;
    state.timeLeft=Math.max(0,state.timeLimit-el/1000);
    updateTimeHud();
    if(state.timeLeft<=0){clearInterval(state.timeTimer);state.timeTimer=null;onTimeout();}
  },100);
}
function updateTimeHud(){
  const t=$('hud-time');
  if(state.phase==='playing'||state.phase==='timeout'){
    t.textContent=state.timeLeft.toFixed(1)+'s';
    if(state.timeLeft<=5)t.classList.add('urgent');else t.classList.remove('urgent');
  }else{t.textContent='-';t.classList.remove('urgent');}
}
function onTimeout(){
  if(state.phase!=='playing')return;
  state.phase='timeout';
  const rt=performance.now()-state.roundStart;
  const s=sessionStats[state.level];
  s.rounds++;s.found+=state.found;s.targets+=state.curTargets;s.misses+=state.misses;s.timeouts++;
  if(rt>0){s.rtSum+=rt;s.rtCount++;}
  playBeep(200,0.3);
  document.querySelectorAll('.glyph-cell[data-target="1"]:not([data-done])').forEach(c=>c.classList.add('wrong'));
  state.roundsPlayed++;
  updateHud();
  $('feedback').textContent='时间到！漏找 '+(state.curTargets-state.found)+' 个目标';
  at(1100,()=>{
    if(!state.running)return;
    if(state.roundsPlayed>=TOTAL_ROUNDS)showResult();
    else nextRound();
  });
}
function stopGame(){
  clearTimers();
  if(state.running)showResult();
  else {state.running=false;$('start-btn').textContent='开始训练';$('start-btn').classList.remove('stop-mode');}
}
// ===== 结果 =====
function showResult(){
  state.running=false;
  clearTimers();
  state.phase='idle';updateTimeHud();
  $('start-btn').textContent='开始训练';
  $('start-btn').classList.remove('stop-mode');
  $('grid-wrap').innerHTML='';
  $('target-hint').textContent='选好难度，点开始训练';
  // 累计
  let tf=0,tt=0,tm=0,tto=0,rtSum=0,rtC=0;
  DIFF_ORDER.forEach(k=>{const s=sessionStats[k];tf+=s.found;tt+=s.targets;tm+=s.misses;tto+=s.timeouts;rtSum+=s.rtSum;rtC+=s.rtCount;});
  const hitRate=tt?Math.round(tf/tt*100):0;
  const avgRt=rtC?(rtSum/rtC/1000).toFixed(1):'-';
  // 评级（含时间压力）
  let grade,evalTxt;
  if(hitRate>=90&&tm<=4&&tto<=1){grade='优秀';evalTxt='在限时压力下你的选择性注意依然出色：多数轮次从容找全目标，误点与超时极少，抗时间压迫能力强。';}
  else if(hitRate>=75&&tto<=3){grade='良好';evalTxt='整体良好，但限时下偶有漏找或超时。建议先整体扫视定位、再聚焦点击，减少冲动与犹豫。';}
  else if(hitRate>=60){grade='中等';evalTxt='命中率中等，时间压力上来后容易分心或被逼停。建议从入门难度练起，逐步提升特征辨别与搜索速度。';}
  else{grade='需加强';evalTxt='命中率偏低、误点或超时偏多，说明在限时压力下尚未稳定掌握目标与干扰的细微差异。放慢节奏、逐格确认会有帮助。';}
  const condRows=DIFF_ORDER.map(k=>{
    const s=sessionStats[k];
    const hr=s.targets?Math.round(s.found/s.targets*100)+'%':'-';
    const ar=s.rtCount?(s.rtSum/s.rtCount/1000).toFixed(1)+'s':'-';
    return '<div class="cond-row"><span class="cl">'+LEVELS[k].name+'</span>'+
      '<span class="cv">命中 '+hr+' · 误点 '+s.misses+' · 超时 '+s.timeouts+' · 反应 '+ar+'</span></div>';
  }).join('');
  $('result-card').innerHTML=
    '<div class="result-title">找不同 · 训练结果</div>'+
    '<div class="result-grid">'+
      '<div class="result-item"><div class="val">'+hitRate+'%</div><div class="lbl">总命中率</div></div>'+
      '<div class="result-item"><div class="val">'+(avgRt==='-'?'-':avgRt+'s')+'</div><div class="lbl">平均反应时</div></div>'+
      '<div class="result-item"><div class="val">'+tm+'</div><div class="lbl">误点总数</div></div>'+
      '<div class="result-item"><div class="val">'+tto+'</div><div class="lbl">超时轮数</div></div>'+
    '</div>'+
    '<div class="result-section"><div class="section-title">分难度统计</div>'+condRows+'</div>'+
    '<div class="result-eval">'+
      '<div class="eval-line">综合评级：<b style="color:var(--accent)">'+grade+'</b></div>'+
      '<div class="eval-line">'+evalTxt+'</div>'+
      (rtC?'<div class="eval-line">平均反应时 '+avgRt+' 秒/轮，数值越大说明限时下搜索越慢。</div>':'')+
      (tto>0?'<div class="eval-line">共有 '+tto+' 轮未在限时内完成，超时越多说明时间压迫下稳定性越不足。</div>':'<div class="eval-line">全部轮次均在限时内完成，时间管理良好。</div>')+
    '</div>'+
    '<div class="result-btns">'+
      '<button class="btn-retry" onclick="startGame()">再来一局</button>'+
      '<button class="btn-home" onclick="location.href=\'index.html\'">返回大厅</button>'+
    '</div>';
  $('result-card').style.display='flex';
}
// ===== 初始化 =====
buildDiffBtns();
</script>
</body>
</html>
