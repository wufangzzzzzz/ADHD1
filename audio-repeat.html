<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>复读机训练 - 听知觉训练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 16px;
    overflow: hidden;
  }

  .game-container {
    background: white;
    border-radius: 20px;
    padding: 0;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    margin: 0 auto;
  }

  /* 顶部装饰条 */
  .game-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #f97316, #ec4899, #8b5cf6, #06b6d4);
  }

  /* ===== 横屏分栏布局（默认，听觉游戏全横屏独占） ===== */
  .land-left {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 10px;
    overflow-y: auto;
    border-right: 1px solid rgba(0,0,0,0.06);
  }
  .land-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 14px 14px;
    overflow: hidden;
  }

  .land-left .title-area { padding: 4px 6px; margin-bottom: 4px; }
  .land-left .title-area h1 { font-size: 18px; }
  .land-left .title-area .subtitle { font-size: 12px; }
  .land-left .game-header { padding: 4px 6px; margin-bottom: 4px; text-align: center; }
  .land-left .game-header h1 { font-size: 18px; }
  .land-left .game-header .subtitle { font-size: 12px; }
  .land-left .info-bar { flex-wrap: nowrap; gap: 2px; padding: 4px 6px; margin-bottom: 4px; }
  .land-left .info-label { font-size: 11px; }
  .land-left .info-value { font-size: 16px; }
  .land-left .status-area { padding: 6px 6px; min-height: 48px; }
  .land-left .status-icon { font-size: 20px; }
  .land-left .status-text { font-size: 14px; }
  .land-left .status-sub { font-size: 11px; }
  .land-left .controls { gap: 4px; padding: 4px 6px; }
  .land-left .difficulty-section { padding: 4px 6px; }
  .land-left .difficulty-btn { font-size: 13px; padding: 5px 10px; min-height: 32px; }
  .land-left .diff-btn { font-size: 13px; padding: 5px 10px; min-height: 32px; }
  .land-left .interference-toggle { padding: 4px 6px; font-size: 12px; }
  .land-left .stats-bar { padding: 4px 6px; font-size: 12px; }
  .land-left .game-rules { padding: 10px; margin-bottom: 6px; font-size: 14px; background: rgba(255,255,255,0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 10px; line-height: 1.6; border: 1px solid rgba(180,190,200,0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.3); }
  .land-left .game-rules .rules-title { font-size: 10px; font-weight: 700; margin-bottom: 1px; }

  .land-right .start-btn, .land-right .record-btn, .land-right .play-btn {
    font-size: 16px; padding: 8px 20px; min-height: 44px;
  }
  .land-right .waveform { height: 40px; }
  .land-right .num-pad { gap: 6px; padding: 4px; }
  .land-right .key-btn { font-size: 26px; min-height: 46px; border-radius: 10px; }
  .land-right .progress-bar { padding: 2px 8px; }

  .game-header {
    text-align: center;
    margin-bottom: 20px;
    padding-top: 8px;
  }

  .game-header h1 {
    font-size: 24px;
    color: #1e293b;
    font-weight: 800;
    background: linear-gradient(135deg, #f97316, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .game-header .subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 2px;
  }

  /* 状态显示区 */
  .status-area {
    background: #f8fafc;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: center;
    border: 2px dashed #e2e8f0;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.3s;
  }

  .status-area .status-text {
    font-size: 18px;
    color: #334155;
    font-weight: 600;
  }

  .status-area .status-hint {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 4px;
  }

  .status-area.listening {
    border-color: #f97316;
    background: #fff7ed;
  }

  .status-area.listening .status-text {
    color: #ea580c;
  }

  .status-area.recalling {
    border-color: #8b5cf6;
    background: #f5f3ff;
  }

  .status-area.recalling .status-text {
    color: #7c3aed;
  }

  .status-area.success {
    border-color: #22c55e;
    background: #f0fdf4;
  }

  .status-area.success .status-text {
    color: #16a34a;
  }

  .status-area.error {
    border-color: #ef4444;
    background: #fef2f2;
  }

  .status-area.error .status-text {
    color: #dc2626;
  }

  /* 进度指示 */
  .progress-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 16px;
    padding: 0 4px;
    justify-content: center;
  }

  .progress-star {
    font-size: 22px;
    line-height: 1;
    color: #cbd5e1;
    transition: all 0.3s;
    flex-shrink: 0;
  }

  .progress-star.correct {
    color: #22c55e;
    text-shadow: 0 0 8px rgba(34,197,94,0.5);
  }

  .progress-star.wrong {
    color: #FF073A;
    text-shadow: 0 0 8px rgba(255,7,58,0.5);
  }
    box-shadow: 0 0 6px rgba(34,197,94,0.4);
  }



  @keyframes pulse-dot {
    0%, 100% { transform: scale(1.3); }
    50% { transform: scale(1.6); }
  }

  /* 九宫格数字面板 */
  .num-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }

  .key-btn {
    aspect-ratio: 1.2;
    border: 1px solid rgba(180, 190, 200, 0.35);
    border-radius: 14px;
    font-size: 28px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.3);
    background: linear-gradient(145deg, #667eea, #764ba2);
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key-btn:active {
    transform: scale(0.92);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
  }

  .key-btn:hover:not(:disabled) {
    background: linear-gradient(145deg, #7b74f0, #8b6ac0);
    border-color: rgba(255,255,255,0.4);
  }

  .key-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
  }

  .key-btn.pressed {
    transform: scale(0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    opacity: 0.7;
  }

  /* 为每个数字按钮分配不同的颜色 */
  .key-btn[data-num="1"] { background: linear-gradient(135deg, #f97316, #fb923c); }
  .key-btn[data-num="2"] { background: linear-gradient(135deg, #ec4899, #f472b6); }
  .key-btn[data-num="3"] { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
  .key-btn[data-num="4"] { background: linear-gradient(135deg, #06b6d4, #22d3ee); }
  .key-btn[data-num="5"] { background: linear-gradient(135deg, #22c55e, #4ade80); }
  .key-btn[data-num="6"] { background: linear-gradient(135deg, #eab308, #facc15); }
  .key-btn[data-num="7"] { background: linear-gradient(135deg, #ef4444, #f87171); }
  .key-btn[data-num="8"] { background: linear-gradient(135deg, #14b8a6, #2dd4bf); }
  .key-btn[data-num="9"] { background: linear-gradient(135deg, #6366f1, #818cf8); }

  .key-btn.wrong {
    animation: shake 0.5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px) rotate(-5deg); }
    40% { transform: translateX(10px) rotate(5deg); }
    60% { transform: translateX(-6px) rotate(-3deg); }
    80% { transform: translateX(6px) rotate(3deg); }
  }

  /* 控制区 */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .controls .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-start {
    background: linear-gradient(135deg, #f97316, #ec4899);
    color: white;
    box-shadow: 0 4px 16px rgba(236,72,153,0.3);
  }

  .btn-start:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(236,72,153,0.4);
  }

  .btn-start:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-replay {
    background: #f1f5f9;
    color: #64748b;
  }

  .btn-replay:hover:not(:disabled) {
    background: #e2e8f0;
    transform: translateY(-2px);
  }

  .btn-replay:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
  }

  /* 难度选择 */
  .difficulty-section {
    background: #f8fafc;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .difficulty-label {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .difficulty-options {
    display: flex;
    gap: 8px;
  }

  .diff-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    background: white;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }

  .diff-btn:hover {
    border-color: #94a3b8;
    background: #f8fafc;
  }

  .diff-btn.active {
    border-color: #8b5cf6;
    background: #f5f3ff;
    color: #7c3aed;
    box-shadow: 0 2px 8px rgba(139,92,246,0.2);
  }

  .diff-btn .diff-label {
    display: block;
    font-size: 15px;
  }

  .diff-btn .diff-desc {
    display: block;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
  }

  /* 干扰模式开关 */
  .interference-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #f8fafc;
    border-radius: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
  }

  .interference-toggle.active {
    border-color: #f97316;
    background: #fff7ed;
  }

  .interference-toggle .toggle-label {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .interference-toggle .toggle-label .icon {
    font-size: 18px;
  }

  .interference-toggle .toggle-switch {
    width: 48px;
    height: 28px;
    background: #cbd5e1;
    border-radius: 14px;
    position: relative;
    transition: all 0.3s;
  }

  .interference-toggle.active .toggle-switch {
    background: linear-gradient(135deg, #f97316, #ec4899);
  }

  .interference-toggle .toggle-switch::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: all 0.3s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .interference-toggle.active .toggle-switch::after {
    left: 23px;
  }

  /* 分数统计 */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px;
    background: #f8fafc;
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-item .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: #1e293b;
  }

  .stat-item .stat-label {
    font-size: 12px;
    color: #94a3b8;
  }

  .stat-item .stat-value.green { color: #22c55e; }
  .stat-item .stat-value.orange { color: #f97316; }
  .stat-item .stat-value.purple { color: #8b5cf6; }
  .stat-item .stat-value.gold { color: #eab308; }

  /* 结算面板 */
  .result-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.3s ease;
  }

  .result-panel {
    background: white;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: scaleIn 0.4s ease;
  }

  .result-emoji {
    font-size: 56px;
    margin-bottom: 8px;
    animation: bounceEmoji 0.6s ease;
  }

  .result-title {
    font-size: 22px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 20px;
  }

  .result-stats {
    background: #f8fafc;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 15px;
    color: #64748b;
    border-bottom: 1px solid #e2e8f0;
  }

  .result-row:last-child {
    border-bottom: none;
  }

  .result-val {
    font-weight: 700;
    color: #1e293b;
  }

  .result-val.green { color: #22c55e; }
  .result-val.purple { color: #8b5cf6; }
  .result-val.gold { color: #eab308; font-weight: 800; font-size: 17px; }

  .result-stars {
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: 4px;
  }

  .result-desc {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 20px;
  }

  .btn-result {
    background: linear-gradient(135deg, #f97316, #ec4899);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 16px rgba(236,72,153,0.3);
    width: 100%;
  }

  .btn-result:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(236,72,153,0.4);
  }

  /* 动态结果卡片样式 */
  .result-card {
    background: white;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: scaleIn 0.4s ease;
  }

  .result-icon {
    font-size: 56px;
    margin-bottom: 8px;
    animation: bounceEmoji 0.6s ease;
  }

  .result-grade {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .result-stat {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #e2e8f0;
  }

  .result-stat:last-child {
    border-bottom: none;
  }

  .result-stat .stat-label {
    font-size: 14px;
    color: #64748b;
  }

  .result-stat .stat-value {
    font-size: 16px;
    font-weight: 700;
  }

  .result-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f97316, #ec4899);
    color: white;
  }

  .result-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(236,72,153,0.4);
  }

  .result-btn.secondary {
    background: #f1f5f9;
    color: #475569;
  }

  .result-btn.secondary:hover {
    background: #e2e8f0;
    box-shadow: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scaleIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes bounceEmoji {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* 得分动画 */
  .score-popup {
    position: fixed;
    font-size: 48px;
    font-weight: 900;
    color: #22c55e;
    pointer-events: none;
    animation: scoreUp 1s ease-out forwards;
    z-index: 100;
  }

  @keyframes scoreUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    50% { opacity: 1; transform: translateY(-40px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-80px) scale(1); }
  }

  /* 响应式 */
  @media (max-width: 400px) {
    .game-container { padding: 16px; }
    .key-btn { font-size: 26px; border-radius: 12px; gap: 8px; }
    .game-header h1 { font-size: 20px; }
    .status-area .status-text { font-size: 16px; }
  }

  

  /* 星星奖励动画 */
  .star-burst {
    position: absolute;
    pointer-events: none;
    z-index: 50;
  }

  .star-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: starFly 0.8s ease-out forwards;
  }

  @keyframes starFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }

  


  
/* 规则弹窗 */
.rules-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;}
.rules-dialog{background:#1e1e3a;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:28px 32px;max-width:420px;width:90%;text-align:center;}
.rules-dialog h2{color:#fff;font-size:20px;font-weight:800;margin-bottom:16px;}
.rules-dialog p{color:rgba(255,255,255,0.8);font-size:14px;line-height:1.6;text-align:left;margin-bottom:12px;}
.rules-dialog .rd-note{color:rgba(255,255,255,0.4);font-size:11px;margin-top:8px;margin-bottom:16px;}
.rules-dialog button{padding:12px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,#FF5E0E,#FF9800);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(255,94,14,0.3);}
.rules-dialog button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,94,14,0.4);}
</style>
<script src="/public/audio-helper.js"></script>
<script>
function showRulesPopup(){
    if(!localStorage.getItem('ar_visited')){
        document.getElementById('rulesOverlay').style.display='flex';
    }
}
function closeRules(){
    localStorage.setItem('ar_visited','1');
    document.getElementById('rulesOverlay').style.display='none';
}
document.addEventListener('DOMContentLoaded', () => { showRulesPopup(); });
</script>
</head>
<body>

<div class="game-container">
  <div class="land-left">
    <!-- 游戏头 -->
    <div class="game-header">
      <h1>🎧 复读机训练</h1>
      <div class="subtitle">听数字 · 记顺序 · 点击复现</div>
    </div>

    <!-- 状态区 -->
    <div class="status-area" id="statusArea">
      <div class="status-text" id="statusText">准备好了吗？</div>
      <div class="status-hint" id="statusHint">选择难度，点击开始挑战</div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="btn btn-start" id="btnStart" onclick="startRound()">🎯 开始挑战</button>
      <button class="btn btn-replay" id="btnReplay" onclick="replayAudio()" disabled>🔊 再听一次</button>
    </div>

    <!-- 难度选择 -->
    <div class="difficulty-section">
      <div class="difficulty-label">📊 难度选择</div>
      <div class="difficulty-options">
        <button class="diff-btn active" data-diff="easy" onclick="setDifficulty('easy')">
          <span class="diff-label">🟢 简单</span>
          <span class="diff-desc">2~3个数字</span>
        </button>
        <button class="diff-btn" data-diff="normal" onclick="setDifficulty('normal')">
          <span class="diff-label">🟡 普通</span>
          <span class="diff-desc">4~5个数字</span>
        </button>
        <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">
          <span class="diff-label">🔴 困难</span>
          <span class="diff-desc">6~7个数字</span>
        </button>
      </div>
    </div>

    <!-- 干扰模式开关 -->
    <div class="interference-toggle" id="interferenceToggle" onclick="toggleInterference()">
      <div class="toggle-label">
        <span class="icon">🌀</span>
        干扰模式（混入干扰音节）
      </div>
      <div class="toggle-switch"></div>
    </div>

    <!-- 玩法说明 -->
    <div class="game-rules" id="gameRules">
      <div class="rules-title">📋 玩法说明</div>
      <div>• 听系统朗读的数字或词语<br>• 按原样复述出来<br>• 训练听觉记忆和口语表达能力</div>
    </div>

    <!-- 统计 -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-value purple" id="streakCount">0</div>
        <div class="stat-label">🔥 连续正确</div>
      </div>
      <div class="stat-item">
        <div class="stat-value green" id="scoreCount">0</div>
        <div class="stat-label">⭐ 总分</div>
      </div>
      <div class="stat-item">
        <div class="stat-value orange" id="levelCount">0/0题</div>
        <div class="stat-label">🎯 完成进度</div>
      </div>
    </div>
  </div>

  <div class="land-right">
    <!-- 进度指示 -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- 九宫格数字面板 -->
    <div class="num-pad" id="numPad">
      <button class="key-btn" data-num="1" disabled>1</button>
      <button class="key-btn" data-num="2" disabled>2</button>
      <button class="key-btn" data-num="3" disabled>3</button>
      <button class="key-btn" data-num="4" disabled>4</button>
      <button class="key-btn" data-num="5" disabled>5</button>
      <button class="key-btn" data-num="6" disabled>6</button>
      <button class="key-btn" data-num="7" disabled>7</button>
      <button class="key-btn" data-num="8" disabled>8</button>
      <button class="key-btn" data-num="9" disabled>9</button>
    </div>
  </div>
</div>

<!-- 结算法 -->
<div class="result-overlay" id="resultOverlay" style="display:none;">
  <div class="result-panel">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <h2 class="result-title" id="resultTitle">训练完成！</h2>
    <div class="result-stats">
      <div class="result-row"><span>总题数</span><span class="result-val" id="rTotal">10</span></div>
      <div class="result-row"><span>正确数</span><span class="result-val green" id="rCorrect">0</span></div>
      <div class="result-row"><span>最高连对</span><span class="result-val purple" id="rMaxStreak">0</span></div>
      <div class="result-row"><span>⭐ 总分</span><span class="result-val gold" id="rScore">0</span></div>
      <div class="result-row"><span>准确率</span><span class="result-val" id="rAccuracy">0%</span></div>
    </div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div class="result-desc" id="resultDesc">表现不错，继续加油！</div>
    <button class="btn-result" onclick="restartGame()">🔄 再来一轮</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---------- 游戏状态 ----------
  var difficulty = 'easy';          // easy / normal / hard
  var interferenceOn = false;       // 干扰模式开关
  var currentSequence = [];         // 当前题目数字序列
  var userInput = [];               // 用户输入序列
  var currentNumIndex = 0;          // 当前播放到第几个
  var isPlaying = false;            // 是否正在播放
  var isInputPhase = false;         // 是否在输入阶段
  var score = 0;
  var streak = 0;
  var level = 0;
  var totalRounds = 10;             // 每轮总题数
  var gameOver = false;             // 是否完成全部题目
  var maxStreak = 0;                // 本轮最高连对
  var correctCount = 0;             // 正确题数
  var roundResults = [];            // 每轮结果: 'correct'|'wrong'
  var roundHadError = false;        // 当前轮是否错过
  var speechSynth = window.speechSynthesis;

  // 难度等级配置
  var diffConfig = {
    easy:   { label: '简单',   minLen: 2, maxLen: 3, rate: 0.8, pitches: [1.0, 1.2] },
    normal: { label: '普通',   minLen: 4, maxLen: 5, rate: 1.0, pitches: [0.9, 1.0, 1.1] },
    hard:   { label: '困难',   minLen: 6, maxLen: 7, rate: 1.15, pitches: [0.8, 0.9, 1.0, 1.1, 1.2] }
  };

  // 干扰音效（使用非人声电子音，避免与数字发音混淆）
  var interferenceChars = ['tone1', 'tone2', 'tone3'];

  // ---------- DOM 引用 ----------
  var statusArea = document.getElementById('statusArea');
  var statusText = document.getElementById('statusText');
  var statusHint = document.getElementById('statusHint');
  var progressBar = document.getElementById('progressBar');
  var numBtns = document.querySelectorAll('.key-btn');
  var btnStart = document.getElementById('btnStart');
  var btnReplay = document.getElementById('btnReplay');
  var diffBtns = document.querySelectorAll('.diff-btn');
  var streakEl = document.getElementById('streakCount');
  var scoreEl = document.getElementById('scoreCount');
  var levelEl = document.getElementById('levelCount');

  // ---------- 工具函数 ----------
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // 生成题目序列
  function generateSequence() {
    var cfg = diffConfig[difficulty];
    var len = cfg.minLen + Math.floor(Math.random() * (cfg.maxLen - cfg.minLen + 1));
    var seq = [];
    // 从1-9中随机选数字，尽量不重复
    var pool = [1,2,3,4,5,6,7,8,9];
    shuffle(pool);
    for (var i = 0; i < len; i++) {
      seq.push(pool[i % pool.length]);
    }
    return seq;
  }

  // 构建播放队列：数字 + 可选的干扰音节
  function buildPlaySequence(seq) {
    if (!interferenceOn) return seq.slice(); // 无需干扰
    var result = [];
    for (var i = 0; i < seq.length; i++) {
      result.push(seq[i]);
      // 除最后一个外，随机插入干扰音节
      if (i < seq.length - 1 && Math.random() < 0.6) {
        var inter = interferenceChars[Math.floor(Math.random() * interferenceChars.length)];
        result.push(inter);
      }
    }
    return result;
  }

  // 使用语音合成朗读一段内容（优先使用预生成音频）
  function speakText(text, callback) {
    var cfg = diffConfig[difficulty];
    window.playAudio(text, callback, cfg ? cfg.rate : 0.85);
  }

  // ---------- 音效系统 ----------
  var audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  // 按键提示音 - 短促清脆的"滴"
  function playClickSound() {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
  }

  // 错误提示音 - 低沉短促
  function playErrorSound() {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 220;
      osc.type = 'sawtooth';
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
  }

  // 通关胜利音效 - 上升音阶
  function playVictorySound() {
    try {
      var ctx = getAudioCtx();
      var notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
      notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        var t = ctx.currentTime + i * 0.15;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      });
    } catch(e) {}
  }

  // 每题正确提示音 - 短促上升
  function playCorrectSound() {
    try {
      var ctx = getAudioCtx();
      var notes = [659, 784]; // E5, G5
      notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        var t = ctx.currentTime + i * 0.08;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      });
    } catch(e) {}
  }

  // ---------- 核心游戏流程 ----------

  // 开始新回合
  function startRound() {
    if (isPlaying || isInputPhase) return;

    btnStart.disabled = true;
    btnReplay.disabled = true;
    setButtonsEnabled(false);
    setStatus('listening', '👂 仔细听...', '数字序列正在播放中');
    userInput = [];
    currentNumIndex = 0;

    // 生成序列
    currentSequence = generateSequence();
    var playQueue = buildPlaySequence(currentSequence);

    // 更新进度条
    renderProgress();
    isPlaying = true;

    // 按顺序播放
    playQueueRecursive(playQueue, 0, function() {
      isPlaying = false;
      isInputPhase = true;
      btnReplay.disabled = false;
      setButtonsEnabled(true);
      setStatus('recalling', '🖱️ 到你了！', '按顺序点击数字复现');
    });
  }

  // 递归播放队列中的每个元素（数字或干扰音节）
  function playQueueRecursive(queue, index, callback) {
    if (index >= queue.length) {
      if (callback) callback();
      return;
    }

    var item = queue[index];
    var isInterference = typeof item === 'string';

    // 数字：高亮播放进度
    if (!isInterference) {
      currentNumIndex++;
      renderProgress();
      highlightNumBtn(item, true);
      speakText(item, function() {
        highlightNumBtn(item, false);
        // 播放间隔
        setTimeout(function() {
          playQueueRecursive(queue, index + 1, callback);
        }, isInterference ? 200 : 350);
      });
    } else {
      // 干扰音节：用非人声音效代替语音，避免与数字混淆
      setStatus('listening', '👂 干扰音...', '跳过干扰音，只记数字！');
      // 播放短促的"咔嗒"音效（明显非人声）
      try {
        var actx = new (window.AudioContext || window.webkitAudioContext)();
        var now = actx.currentTime;

        // 短促的打击声
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);

        // 使用特殊频率，明显不是人声（高频电子音 + 噪音感）
        if (item === 'tone1') {
          osc.frequency.value = 1200;
        } else if (item === 'tone2') {
          osc.frequency.value = 800;
        } else if (item === 'tone3') {
          osc.frequency.value = 600;
        } else {
          osc.frequency.value = 1000;
        }
        osc.type = 'square'; // 方波，听起来像电子音

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.start(now);
        osc.stop(now + 0.12);
      } catch(e) { /* fallback silent */ }

      setTimeout(function() {
        playQueueRecursive(queue, index + 1, callback);
      }, 250);
    }
  }

  // 高亮数字按钮（播放时闪烁）
  function highlightNumBtn(num, on) {
    var btns = document.querySelectorAll('.key-btn');
    for (var i = 0; i < btns.length; i++) {
      if (parseInt(btns[i].getAttribute('data-num')) === num) {
        if (on) {
          btns[i].style.transform = 'scale(1.15)';
          btns[i].style.boxShadow = '0 0 20px rgba(255,255,255,0.6)';
          btns[i].style.zIndex = '10';
        } else {
          btns[i].style.transform = '';
          btns[i].style.boxShadow = '';
          btns[i].style.zIndex = '';
        }
        break;
      }
    }
  }

  // 重新播放当前序列
  function replayAudio() {
    if (isPlaying || !currentSequence.length || btnReplay.disabled) return;

    btnStart.disabled = true;
    btnReplay.disabled = true;
    setButtonsEnabled(false);
    setStatus('listening', '👂 再听一次...', '集中注意力！');
    userInput = [];
    currentNumIndex = 0;
    isPlaying = true;

    var playQueue = buildPlaySequence(currentSequence);
    renderProgress();

    playQueueRecursive(playQueue, 0, function() {
      isPlaying = false;
      isInputPhase = true;
      btnReplay.disabled = false;
      setButtonsEnabled(true);
      setStatus('recalling', '🖱️ 到你了！', '按顺序点击数字复现');
    });
  }

  // ---------- 用户输入 ----------
  function onNumClick(num) {
    if (!isInputPhase || isPlaying) return;

    var btn = document.querySelector('.key-btn[data-num="' + num + '"]');
    if (!btn) return;

    // 用户输入的应该是当前序列的当前数字
    var expected = currentSequence[userInput.length];

    if (num === expected) {
      // 正确！
      playClickSound();
      userInput.push(num);
      btn.classList.add('pressed');
      renderProgress();

      // 小反馈：震动
      btn.style.transform = 'scale(0.92)';
      var self = btn;
      setTimeout(function() { self.style.transform = ''; }, 200);

      // 检查是否完成
      if (userInput.length === currentSequence.length) {
        // 全部正确！
        isInputPhase = false;
        btnStart.disabled = false;
        btnReplay.disabled = true;
        setButtonsEnabled(false);
        onSuccess();
      }
    } else {
      // 错误！
      playErrorSound();
      roundHadError = true;
      btn.classList.add('wrong');
      var self = btn;
      setTimeout(function() { self.classList.remove('wrong'); }, 500);

      // 错误反馈
      setStatus('error', '❌ 顺序不对哦', '再试一次！');
      streak = 0;
      updateStats();

      // 振动效果
      navigator.vibrate && navigator.vibrate(100);

      // 重置输入，让用户重新从第一个开始
      resetInput();
    }
  }

  // 重置用户输入
  function resetInput() {
    userInput = [];
    // 清除所有pressed状态
    var btns = document.querySelectorAll('.key-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.remove('pressed');
    }
    renderProgress();
    setStatus('recalling', '🖱️ 重新开始', '从第一个数字开始点击');
  }

  // 正确完成！
  function onSuccess() {
    playCorrectSound();
    score += 1;
    streak += 1;
    correctCount += 1;
    if (streak > maxStreak) maxStreak = streak;
    level += 1;
    updateStats();

    setStatus('success', '🎉 太棒了！全部正确！', '连对' + streak + '次！');

    // 得分弹出动画
    showScorePopup();

    // 星星特效
    createStarBurst();

    // 振动反馈
    navigator.vibrate && navigator.vibrate([50, 50, 50]);

    // 记录本轮结果
    roundResults.push(roundHadError ? 'wrong' : 'correct');
    roundHadError = false;
    renderProgress();

    // 检查是否完成所有轮次
    var roundsDone = Math.min(level, totalRounds);
    if (roundsDone >= totalRounds) {
      // 完成全部题目！
      var delay = streak >= 5 ? 1000 : 1500;
      setTimeout(function() { showGameResult(); }, delay);
      return;
    }

    // 自动进入下一题
    var delay = streak >= 5 ? 1000 : 1500;
    setTimeout(function() {
      startRound();
    }, delay);
  }

  // 得分弹出
  function showScorePopup() {
    var popup = document.createElement('div');
    popup.className = 'score-popup';
    var texts = ['+1⭐', '👍 棒', '🎉 完美', '💪 继续'];
    popup.textContent = texts[Math.floor(Math.random() * texts.length)];
    popup.style.left = (40 + Math.random() * 20) + '%';
    popup.style.top = '30%';
    document.body.appendChild(popup);
    setTimeout(function() { popup.remove(); }, 1000);
  }

  // 星星爆发特效
  function createStarBurst() {
    var container = document.querySelector('.game-container');
    var rect = container.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var colors = ['#f97316','#ec4899','#8b5cf6','#22c55e','#eab308','#06b6d4'];

    for (var i = 0; i < 12; i++) {
      var particle = document.createElement('div');
      particle.className = 'star-particle';
      var angle = (Math.PI * 2 / 12) * i;
      var dist = 60 + Math.random() * 80;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;
      particle.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;background:' + colors[i % colors.length] + ';--tx:' + tx + 'px;--ty:' + ty + 'px;';
      document.body.appendChild(particle);
      setTimeout(function(p) { p.remove(); }, 800, particle);
    }
  }

  // ---------- 界面更新 ----------
  function setStatus(type, text, hint) {
    statusArea.className = 'status-area ' + type;
    statusText.textContent = text;
    statusHint.textContent = hint || '';
  }

  function renderProgress() {
    progressBar.innerHTML = '';
    for (var i = 0; i < totalRounds; i++) {
      var star = document.createElement('span');
      star.className = 'progress-star';
      star.textContent = '★';
      if (i < roundResults.length) {
        star.classList.add(roundResults[i]);
      }
      progressBar.appendChild(star);
    }
  }

  function setButtonsEnabled(enabled) {
    var btns = document.querySelectorAll('.key-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = !enabled;
    }
  }

  function updateStats() {
    streakEl.textContent = streak;
    scoreEl.textContent = score;
    var roundsDone = Math.min(level, totalRounds);
    levelEl.textContent = roundsDone + '/' + totalRounds + '题';
  }

  // ---------- 难度切换 ----------
  function setDifficulty(diff) {
    if (isPlaying || isInputPhase) {
      window.speechSynthesis && window.speechSynthesis.cancel();
      if (window.stopAllAudio) window.stopAllAudio();
      isPlaying = false;
      isInputPhase = false;
    }
    difficulty = diff;
    for (var i = 0; i < diffBtns.length; i++) {
      diffBtns[i].classList.remove('active');
      if (diffBtns[i].getAttribute('data-diff') === diff) {
        diffBtns[i].classList.add('active');
      }
    }
    // 重置状态
    resetGame();
  }

  // 干扰模式切换
  function toggleInterference() {
    if (window.stopAllAudio) window.stopAllAudio();
    var toggle = document.getElementById('interferenceToggle');
    interferenceOn = !interferenceOn;
    toggle.classList.toggle('active', interferenceOn);
    resetGame();
  }

  // 重置游戏
  function resetGame() {
    isPlaying = false;
    isInputPhase = false;
    currentSequence = [];
    userInput = [];
    currentNumIndex = 0;
    btnStart.disabled = false;
    btnReplay.disabled = true;
    setButtonsEnabled(false);
    setStatus('', '准备好了吗？', '选择难度，点击开始挑战');
    renderProgress();
    correctCount = 0;
    roundResults = [];
    roundHadError = false;
    maxStreak = 0;
    gameOver = false;
    updateStats();
    // 清除所有按钮高亮
    var btns = document.querySelectorAll('.key-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.remove('pressed', 'wrong');
      btns[i].style.transform = '';
      btns[i].style.boxShadow = '';
      btns[i].style.zIndex = '';
    }
  }

  // ---------- 暴露到全局 ----------
  window.startRound = startRound;
  window.replayAudio = replayAudio;
  // 显示游戏完成结果
  function showGameResult() {
    playVictorySound();
    gameOver = true;
    isPlaying = false;
    isInputPhase = false;

    // 隐藏游戏按钮区域
    document.querySelector('.num-grid').style.display = 'none';
    document.getElementById('btnReplay').style.display = 'none';

    setStatus('success', '🏆 训练完成！', '看看你的成绩吧！');

    var accuracy = Math.round((correctCount / totalRounds) * 100);
    var grade = accuracy >= 90 ? '🌟 卓越' : (accuracy >= 70 ? '👍 不错' : '💪 继续加油');

    // 显示结果覆盖层
    var overlay = document.getElementById('resultOverlay');
    overlay.innerHTML = ''; // 清空
    overlay.style.display = 'flex';
    overlay.innerHTML =
      '<div class="result-card">' +
        '<div class="result-icon">🏆</div>' +
        '<h2 class="result-title">训练完成！</h2>' +
        '<div class="result-grade">' + grade + '</div>' +
        '<div class="result-stats">' +
          '<div class="result-stat">' +
            '<span class="stat-label">完成题数</span>' +
            '<span class="stat-value">' + totalRounds + '</span>' +
          '</div>' +
          '<div class="result-stat">' +
            '<span class="stat-label">正确</span>' +
            '<span class="stat-value" style="color:#4ade80">' + correctCount + '</span>' +
          '</div>' +
          '<div class="result-stat">' +
            '<span class="stat-label">正确率</span>' +
            '<span class="stat-value" style="color:#fbbf24">' + accuracy + '%</span>' +
          '</div>' +
          '<div class="result-stat">' +
            '<span class="stat-label">最高连对</span>' +
            '<span class="stat-value" style="color:#f472b6">' + maxStreak + '</span>' +
          '</div>' +
          '<div class="result-stat">' +
            '<span class="stat-label">总分</span>' +
            '<span class="stat-value" style="color:#a78bfa">' + score + '</span>' +
          '</div>' +
        '</div>' +
        '<button class="result-btn" onclick="restartGame()">🔄 再来一轮</button>' +
        '<button class="result-btn secondary" onclick="backToMenu()">🏠 返回主页</button>' +
      '</div>';
  }

  // 重新开始
  function restartGame() {
    if (window.stopAllAudio) window.stopAllAudio();
    document.querySelector('.num-grid').style.display = 'grid';
    document.getElementById('btnReplay').style.display = '';

    var overlay = document.getElementById('resultOverlay');
    overlay.style.display = 'none';

    resetGame();

    // 自动开始
    setTimeout(function() { startRound(); }, 500);
  }

  // 返回主页
  function backToMenu() {
    window.location.href = 'index.html';
  }

  window.onNumClick = onNumClick;
  window.setDifficulty = setDifficulty;
  window.toggleInterference = toggleInterference;
  window.restartGame = restartGame;

  // 数字按钮绑定点击事件
  for (var i = 0; i < numBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var num = parseInt(this.getAttribute('data-num'));
        onNumClick(num);
      });
    })(numBtns[i]);
  }

  // 初始化
  resetGame();
})();
</script>

<div class="rules-overlay" id="rulesOverlay">
<div class="rules-dialog">
<h2>🎮 复读机训练</h2>
<p>听一段音频，然后<b>尽可能准确地复述</b>你听到的内容。</p><p>可以逐字复述，也可以复述大意。考验听觉记忆与语言表达能力！</p>
<p class="rd-note">每次进入游戏都会显示，点击下方按钮开始</p>
<button onclick="closeRules()">我知道了，开始游戏！</button>
</div>
</div>
</body>
