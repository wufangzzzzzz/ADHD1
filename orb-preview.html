<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>图案7·模糊球 预览</title>
<style>
:root{--cell:88px;--gap:10px;--breath:1.15;--beat:2.6s}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,rgba(76,110,245,.10) 0%,transparent 60%),linear-gradient(168deg,#f4f8fb,#e8eef5);
  display:flex;flex-direction:column;color:#1a2030}
header{flex-shrink:0;padding:18px 20px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;font-weight:800;letter-spacing:2px;background:linear-gradient(120deg,#0d9488,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{font-size:12px;color:#6b7280;margin-top:2px}
header .badge{font-size:11px;color:#0d9488;border:1px solid #0d9488;padding:3px 10px;border-radius:99px;background:rgba(13,148,136,.08)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);
  padding:18px;background:#fff;border-radius:18px;
  box-shadow:0 6px 28px rgba(13,148,136,.10),0 2px 6px rgba(0,0,0,.04);
}
.cell{
  width:var(--cell);height:var(--cell);
  position:relative;display:flex;align-items:center;justify-content:center;
  animation:breathe var(--beat) ease-in-out infinite;
  transform-origin:center;
}
.cell::before{
  content:'';position:absolute;inset:4%;border-radius:50%;
  background:
    radial-gradient(circle at 48% 46%, var(--c) 0%, var(--c) 34%, var(--c-soft) 55%, transparent 82%);
  filter:blur(5px);
  z-index:1;
}
.cell::after{
  content:'';position:absolute;inset:14%;border-radius:50%;
  box-shadow:inset 0 0 0 0.6px var(--line, rgba(0,0,0,.92));
  pointer-events:none;z-index:3;
}
.num{
  position:relative;z-index:2;
  color:#fff;font:800 26px/1 sans-serif;letter-spacing:.5px;
  text-shadow:
    0 0 8px rgba(255,255,255,.7),
    0 0 3px rgba(255,255,255,.55),
    0 0 1px rgba(255,255,255,.4);
}
@keyframes breathe{
  0%,100% {transform:scale(1);}
  50%    {transform:scale(var(--breath));}
}
footer{flex-shrink:0;padding:6px 20px 14px;text-align:center;color:#6b7280;font-size:12px;line-height:1.6}
footer b{color:#0d9488}
</style>
</head>
<body>
<header>
  <div>
    <h1>图案7 · 模糊球</h1>
    <div class="sub">径向渐变色块 + 黑色细圆线 + 白色模糊数字 + 呼吸放大</div>
  </div>
  <span class="badge">预览版</span>
</header>
<div class="stage">
  <div class="grid" id="grid"></div>
</div>
<footer>
  这是 5×5 预览样例。接入舒尔特后，<b>沿用当前难度</b>（5×5 / 8×8 / 10×10），此样式作为图案模式的新子类型「图案7·模糊球」出现。
</footer>
<script>
(function(){
  function rand(a,b){return a+Math.random()*(b-a);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  const N = 25;
  const nums = shuffle(Array.from({length:N}, (_,i)=>i+1));
  const grid = document.getElementById('grid');
  for(var i=0;i<N;i++){
    var h = Math.floor(rand(0,360));
    var s = Math.floor(rand(72,98));
    var l = Math.floor(rand(48,68));
    var color = 'hsl('+h+', '+s+'%, '+l+'%)';
    var colorSoft = 'hsl('+h+', '+(s-8)+'%, '+(l+14)+'%)';
    var row = Math.floor(i / 5), col = i % 5;
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.setProperty('--c', color);
    cell.style.setProperty('--c-soft', colorSoft);
    cell.style.setProperty('--line', 'rgba(0,0,0,.92)');
    cell.style.animationDelay = (Math.random()*1.6).toFixed(2) + 's';
    var n = document.createElement('div');
    n.className = 'num';
    n.textContent = String(nums[i]);
    cell.appendChild(n);
    grid.appendChild(cell);
  }
})();
</script>
</body>
</html>
