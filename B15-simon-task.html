<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>西蒙任务 · 专注力训练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#26C6DA;--accent2:#00897B;
  --err:#EF5350;--ok:#66BB6A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100dvh;overflow:hidden;}
body{font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-weight:500;background:radial-gradient(1200px 800px at 70% -10%,#1a174080,transparent),#0a0e1a;color:#EDE7F6;display:flex;align-items:center;justify-content:center;height:100dvh;user-select:none;-webkit-user-select:none;}
.container{display:flex;gap:16px;width:min(98vw,1100px);height:min(96vh,680px);padding:12px;}
.left-panel{width:270px;min-width:270px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px 12px;overflow-y:auto;}
.panel-title{color:var(--accent);font-size:14px;font-weight:800;letter-spacing:0.05em;margin-top:6px;}
.diff-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.diff-btn{flex:1;min-width:42px;padding:6px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(237,231,246,0.55);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
.diff-btn:hover{background:rgba(38,198,218,0.08);}
.diff-btn.active{background:linear-gradient(135deg,#26C6DA,#00897B);border-color:transparent;color:#0a0e1a;font-weight:800;}
.guide-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 13px;margin-top:2px;}
.guide-title{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:6px;}
.guide-text{font-size:11.5px;line-height:1.85;color:rgba(237,231,246,0.62);}
.guide-text b{color:#EDE7F6;}
.guide-text .hint{color:#4DD0E1;font-weight:700;}
/* 右面板 */
.right-panel{flex:1;min-width:0;position:relative;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.game-header{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:6;}
.game-title{color:#EDE7F6;font-size:18px;font-weight:800;}
.back-btn{background:rgba(237,231,246,0.06);border:none;color:rgba(237,231,246,0.5);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s;}
.back-btn:hover{background:rgba(237,231,246,0.12);}
.game-area{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:46px 14px 14px;min-height:0;width:100%;overflow-y:auto;}
.progress-wrap{width:96%;max-width:480px;height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#26C6DA,#00897B);border-radius:4px;transition:width .3s;}
.target-hint{font-size:14px;font-weight:700;color:rgba(237,231,246,0.7);height:22px;min-height:22px;text-align:center;padding:0 8px;}
/* 西蒙圆盘 */
.simon-board{position:relative;width:min(78vw,330px);aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;margin:4px auto;border-radius:50%;overflow:hidden;background:#06121a;}
.simon-pad{opacity:0.4;cursor:default;transition:opacity .12s, box-shadow .12s, filter .12s, transform .08s;}
.simon-pad[data-pad="0"]{background:#2ECC71;border-top-left-radius:50%;}
.simon-pad[data-pad="1"]{background:#E74C3C;border-top-right-radius:50%;}
.simon-pad[data-pad="2"]{background:#F1C40F;border-bottom-left-radius:50%;}
.simon-pad[data-pad="3"]{background:#3498DB;border-bottom-right-radius:50%;}
.simon-board.input-on .simon-pad{cursor:pointer;}
.simon-pad.lit{opacity:1;filter:brightness(1.55);box-shadow:0 0 36px 8px rgba(255,255,255,0.35);}
.simon-pad.wrong{opacity:1;filter:brightness(1.1);box-shadow:0 0 30px 6px #ef5350;animation:shake .4s;}
.simon-pad:active{transform:scale(0.97);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.simon-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36%;height:36%;border-radius:50%;background:#0a0e1a;border:3px solid rgba(255,255,255,0.14);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent);pointer-events:none;z-index:3;text-align:center;}
.hub-main{font-size:17px;font-weight:800;line-height:1.1;}
.hub-sub{font-size:11px;opacity:0.7;margin-top:2px;}
.hud{display:flex;gap:16px;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-size:13px;color:rgba(237,231,246,0.6);flex-wrap:wrap;justify-content:center;}
.hud .hud-val{color:var(--accent);font-weight:800;font-size:16px;}
.feedback{height:20px;font-size:13px;font-weight:700;color:rgba(237,231,246,0.55);min-height:20px;text-align:center;}
.game-footer{margin-top:6px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:5;}
.start-btn{padding:10px 26px;border-radius:12px;border:none;background:linear-gradient(135deg,#26C6DA,#00897B);color:#0a0e1a;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(0,137,123,0.25);}
.start-btn:hover{transform:translateY(-1px);}
.start-btn:active{transform:scale(.96);}
.start-btn.stop-mode{background:linear-gradient(135deg,#e53935,#ef5350);color:#fff;box-shadow:0 4px 16px rgba(229,57,53,0.3);}
/* 结果卡片 */
.result-card{position:absolute;inset:0;background:rgba(10,14,26,0.97);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:20px 16px;z-index:10;overflow-y:auto;}
.result-title{color:var(--accent);font-size:22px;font-weight:800;margin-top:4px;}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:88%;max-width:440px;}
.result-item{background:rgba(237,231,246,0.05);border-radius:10px;padding:10px;text-align:center;}
.result-item .val{color:var(--accent);font-size:20px;font-weight:800;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;}
.result-item .lbl{color:rgba(237,231,246,0.5);font-size:11px;margin-top:3px;}
.result-section{width:88%;max-width:440px;background:rgba(237,231,246,0.03);border-radius:10px;padding:12px 14px;}
.section-title{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:8px;}
.cond-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(237,231,246,0.04);}
.cond-row:last-child{border-bottom:none;}
.cond-row .cl{color:rgba(237,231,246,0.55);}
.cond-row .cv{color:#EDE7F6;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;font-weight:700;}
.result-eval{width:88%;max-width:440px;background:rgba(237,231,246,0.04);border-radius:10px;padding:10px 14px;font-size:12px;color:rgba(237,231,246,0.7);line-height:1.8;text-align:left;}
.result-eval .eval-line{margin-bottom:3px;}
.result-btns{display:flex;gap:10px;margin-top:4px;margin-bottom:10px;}
.result-btns button{padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-retry{background:linear-gradient(135deg,#26C6DA,#00897B);color:#0a0e1a;}
.btn-home{background:rgba(237,231,246,0.1);color:#EDE7F6;}
.btn-retry:hover{transform:translateY(-1px);}
.btn-home:hover{background:rgba(237,231,246,0.16);}
@media(max-width:680px){
  html,body{height:auto;min-height:100dvh;overflow:visible;}
  body{align-items:flex-start;overflow-y:auto;}
  .container{flex-direction:column;height:auto;min-height:96vh;gap:10px;padding:10px;}
  .left-panel{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;gap:8px;overflow-x:auto;}
  .panel-title{width:100%;}
  .diff-btns{display:flex;}
  .diff-btns .diff-btn{flex:1;}
  .guide-card{flex:1;min-width:200px;}
  .right-panel{height:64vh;min-height:440px;}
  .result-grid{grid-template-columns:repeat(2,1fr);}
}
/* ===== 儿童色彩模式 (kid-mode) ===== */
body.kid-mode{background:#FFFFFF;color:#2A2A35;}
body.kid-mode .container{padding:12px;}
body.kid-mode .left-panel,
body.kid-mode .right-panel{background:#FFFFFF;border:1px solid #E4E4EC;box-shadow:0 6px 24px rgba(80,80,120,0.10);}
body.kid-mode .panel-title,
body.kid-mode .guide-title,
body.kid-mode .section-title,
body.kid-mode .result-title{color:#7C4DFF;}
body.kid-mode .game-title{color:#2A2A35;}
body.kid-mode .guide-card,
body.kid-mode .result-section,
body.kid-mode .result-eval,
body.kid-mode .result-item{background:#F6F6FB;border-color:#E4E4EC;}
body.kid-mode .guide-text,
body.kid-mode .guide-text b,
body.kid-mode .hud,
body.kid-mode .feedback,
body.kid-mode .cond-row .cl,
body.kid-mode .cond-row .cv,
body.kid-mode .result-eval,
body.kid-mode .result-item .lbl{color:#3A3A45;}
body.kid-mode .back-btn{background:#F0F0F6;color:#5A5A66;border:1px solid #E4E4EC;}
body.kid-mode .back-btn:hover{background:#E8E8F0;}
body.kid-mode .diff-label{color:#7A7A86;}
body.kid-mode .diff-btn{background:#FFFFFF;border:2px solid #FFD54F;color:#5A5A66;}
body.kid-mode .diff-btn:hover{background:#FFF8E1;}
body.kid-mode .diff-btn.active{background:linear-gradient(135deg,#FF5252,#FF9800);border-color:transparent;color:#fff;}
body.kid-mode .start-btn{background:linear-gradient(135deg,#66BB6A,#26C6DA);color:#fff;box-shadow:0 4px 16px rgba(38,198,218,0.30);}
body.kid-mode .start-btn.stop-mode{background:linear-gradient(135deg,#FF5252,#FF9800);color:#fff;box-shadow:0 4px 16px rgba(255,82,82,0.30);}
body.kid-mode .btn-retry{background:linear-gradient(135deg,#66BB6A,#26C6DA);color:#fff;}
body.kid-mode .btn-home{background:#F0F0F6;color:#5A5A66;border:1px solid #E4E4EC;}
body.kid-mode .progress-bar{background:linear-gradient(90deg,#FF5252,#FFC107,#4CAF50,#2196F3);}
body.kid-mode .target-hint{color:#3A3A45;}
/* 西蒙圆盘在白底下保留深色圆盘，彩色块可见；中心 hub 保持深色 */
body.kid-mode .simon-hub{background:#0a0e1a;}
/* 儿童切换按钮（常驻显示） */
.kid-toggle{background:linear-gradient(135deg,#FF5252,#FF9800,#FFC107,#4CAF50,#2196F3,#9C27B0);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(124,77,255,0.25);transition:transform .12s;}
.kid-toggle:active{transform:scale(.95);}
body.kid-mode .kid-toggle{background:linear-gradient(135deg,#9C27B0,#2196F3);}
</style>
</head>
<body>
<div class="container">
  <!-- 左面板 -->
  <div class="left-panel">
    <div class="panel-title">西蒙任务 · 工作记忆</div>
    <div class="panel-title" style="margin-top:2px;">难度</div>
    <div class="diff-btns" id="diff-all"></div>
    <div class="guide-card">
      <div class="guide-title">玩法说明</div>
      <div class="guide-text">
        圆盘有 <b>四块颜色</b>（绿/红/黄/蓝），每块对应一个音调。<br>
        • 每轮先<b>观看</b>一段闪光 + 音调序列（长度逐轮 +1）。<br>
        • 观看结束后，按<b>相同顺序点击</b>四块复述出来。<br>
        • 全部点对我们记一轮通过；点错则本轮失败。<br>
        • <span class="hint">难度越高：</span>起始序列越长（入门2 / 专家6），越考验工作记忆的存储容量与顺序保持。
      </div>
    </div>
  </div>
  <!-- 右面板 -->
  <div class="right-panel">
    <div class="game-header">
      <div class="game-title">西蒙任务</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="kid-toggle" onclick="toggleKidMode()" title="切换儿童色彩">🎨 儿童</button>
        <button class="back-btn" onclick="location.href='index.html'">返回</button>
      </div>
    </div>
    <div class="game-area" id="game-area">
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="target-hint" id="target-hint">选好难度，点开始训练</div>
      <div class="simon-board" id="simon-board">
        <div class="simon-pad" data-pad="0"></div>
        <div class="simon-pad" data-pad="1"></div>
        <div class="simon-pad" data-pad="2"></div>
        <div class="simon-pad" data-pad="3"></div>
        <div class="simon-hub" id="simon-hub"><div class="hub-main">准备</div><div class="hub-sub"></div></div>
      </div>
      <div class="hud">
        <span>轮次 <span class="hud-val" id="hud-round">0/10</span></span>
        <span>长度 <span class="hud-val" id="hud-len">-</span></span>
        <span>最佳 <span class="hud-val" id="hud-best">0</span></span>
        <span>状态 <span class="hud-val" id="hud-status">准备</span></span>
      </div>
      <div class="feedback" id="feedback">选好难度，点开始训练</div>
      <div class="game-footer">
        <button class="start-btn" id="start-btn" onclick="toggleGame()">开始训练</button>
      </div>
    </div>
    <!-- 结果 -->
    <div class="result-card" id="result-card" style="display:none;"></div>
  </div>
</div>
<script>
// ===== 配置 =====
const PAD_TONES=[329.63,440.00,277.18,392.00]; // 绿 红 黄 蓝
const PAD_NAMES=['绿','红','黄','蓝'];
const LEVELS={
  entry :{name:'入门',start:2},
  easy  :{name:'初级',start:3},
  medium:{name:'中级',start:4},
  hard  :{name:'高级',start:5},
  expert:{name:'专家',start:6},
};
const DIFF_ORDER=['entry','easy','medium','hard','expert'];
const TOTAL_ROUNDS=10; // 每局固定轮数
// ===== DOM =====
const $=id=>document.getElementById(id);
// ===== 音频 =====
let audioCtx=null;
function initAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function playBeep(freq,dur){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur+0.02);
  }catch(e){}
}
// ===== 工具 =====
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
// ===== session 统计（跨轮累计，分难度）=====
const sessionStats={};
DIFF_ORDER.forEach(k=>sessionStats[k]={rounds:0,pass:0,errors:0,bestLen:0,rtSum:0,rtCount:0,streak:0,longest:0});
// ===== 状态 =====
let state={
  level:'entry',running:false,phase:'idle',
  timers:[],
  seq:[],inputIdx:0,round:0,
  bestLen:0,passRounds:0,errors:0,rtSum:0,rtCount:0,
  roundStartInput:0,clickTimes:[],
};
function at(delay,fn){const t=setTimeout(fn,delay);state.timers.push(t);return t;}
function clearTimers(){
  state.timers.forEach(t=>clearTimeout(t));state.timers=[];
  document.querySelectorAll('.simon-pad').forEach(p=>p.classList.remove('lit','wrong'));
}
// ===== 难度按钮 =====
function buildDiffBtns(){
  const c=$('diff-all');c.innerHTML='';
  DIFF_ORDER.forEach(k=>{
    const b=document.createElement('button');
    b.className='diff-btn'+(state.level===k?' active':'');
    b.textContent=LEVELS[k].name;
    b.onclick=()=>{if(state.running)return;state.level=k;document.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
    c.appendChild(b);
  });
}
// ===== 圆盘交互 =====
function setHub(main,sub){
  $('simon-hub').innerHTML='<div class="hub-main">'+main+'</div>'+(sub?'<div class="hub-sub">'+sub+'</div>':'');
}
function lightPad(pad,dur){
  const el=document.querySelector('.simon-pad[data-pad="'+pad+'"]');
  if(!el)return;
  el.classList.add('lit');
  setTimeout(()=>el.classList.remove('lit'),dur);
}
function enableInput(on){ $('simon-board').classList.toggle('input-on',on); }
function updateHud(){
  $('hud-round').textContent=state.round+'/'+TOTAL_ROUNDS;
  $('hud-len').textContent=state.seq.length?state.seq.length:LEVELS[state.level].start;
  $('hud-best').textContent=state.bestLen;
  $('hud-status').textContent= state.phase==='watch'?'观看中':(state.phase==='input'?'请复述':(state.phase==='done'?'':'准备'));
  $('progress-bar').style.width=(state.round/TOTAL_ROUNDS*100)+'%';
}
// ===== 序列生成（避免连续三次相同，尽量减少连续重复）=====
function genSeq(len){
  const s=[];let prev=-1,run=0;
  for(let i=0;i<len;i++){
    let v;
    do{v=randInt(0,3);}while(v===prev&&run>=1&&Math.random()<0.7);
    s.push(v);
    if(v===prev)run++;else run=1;
    prev=v;
  }
  return s;
}
// ===== 游戏流程 =====
function toggleGame(){ if(state.running)stopGame(); else startGame(); }
function startGame(){
  initAudio();
  DIFF_ORDER.forEach(k=>{sessionStats[k]={rounds:0,pass:0,errors:0,bestLen:0,rtSum:0,rtCount:0,streak:0,longest:0};});
  state.round=0;state.bestLen=0;state.passRounds=0;state.errors=0;state.rtSum=0;state.rtCount=0;
  state.running=true;
  $('result-card').style.display='none';
  $('start-btn').textContent='停止训练';
  $('start-btn').classList.add('stop-mode');
  setHub('准备','');
  updateHud();
  nextRound();
}
function nextRound(){
  state.round++;
  const cfg=LEVELS[state.level];
  const L=cfg.start+(state.round-1);
  state.seq=genSeq(L);
  state.inputIdx=0;
  updateHud();
  $('feedback').textContent='第 '+state.round+' 轮 · 长度 '+L;
  playSequence(state.seq);
}
// 播放序列：每块亮 600ms + 间隔 250ms
function playSequence(seq){
  state.phase='watch';
  enableInput(false);
  setHub('看','长度 '+seq.length);
  const on=600,gap=250,step=on+gap;let t=0;
  seq.forEach((pad)=>{
    at(t,()=>{ lightPad(pad,on); playBeep(PAD_TONES[pad],on/1000*0.9); });
    t+=step;
  });
  at(t+200,()=>{
    if(!state.running)return;
    state.phase='input';
    enableInput(true);
    setHub('复述',String(seq.length));
    $('hud-status').textContent='请复述';
    state.roundStartInput=performance.now();
    state.clickTimes=[];
  });
}
function onPadClick(pad){
  if(state.phase!=='input')return;
  lightPad(pad,200);
  playBeep(PAD_TONES[pad],0.18);
  const now=performance.now();
  if(state.clickTimes.length){ state.rtSum+=now-state.clickTimes[state.clickTimes.length-1]; state.rtCount++; }
  else { state.rtSum+=now-state.roundStartInput; state.rtCount++; }
  state.clickTimes.push(now);
  if(state.seq[state.inputIdx]===pad){
    state.inputIdx++;
    if(state.inputIdx>=state.seq.length) roundSuccess();
  }else{
    roundFail(pad);
  }
}
function roundSuccess(){
  state.phase='done';
  enableInput(false);
  const L=state.seq.length;
  const s=sessionStats[state.level];
  s.rounds++;s.pass++;if(L>s.bestLen)s.bestLen=L;
  s.streak++;if(s.streak>s.longest)s.longest=s.streak;
  state.passRounds++;if(L>state.bestLen)state.bestLen=L;
  playBeep(990,0.2);
  setHub('✓','');
  $('feedback').textContent='正确！长度 '+L;
  updateHud();
  at(800,()=>{ if(!state.running)return; afterRound(); });
}
function roundFail(pad){
  state.phase='done';
  enableInput(false);
  const L=state.seq.length;
  const s=sessionStats[state.level];
  s.rounds++;s.errors++;s.streak=0;
  state.errors++;
  playBeep(200,0.3);
  const el=document.querySelector('.simon-pad[data-pad="'+pad+'"]');
  if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450);}
  setHub('✗','');
  $('feedback').textContent='错误！应点 '+PAD_NAMES[state.seq[state.inputIdx]];
  updateHud();
  at(1000,()=>{ if(!state.running)return; afterRound(); });
}
function afterRound(){
  if(state.round>=TOTAL_ROUNDS)showResult();
  else nextRound();
}
function stopGame(){
  clearTimers();
  if(state.running)showResult();
  else {state.running=false;$('start-btn').textContent='开始训练';$('start-btn').classList.remove('stop-mode');}
}
// ===== 结果 =====
function showResult(){
  state.running=false;
  clearTimers();
  state.phase='idle';
  $('start-btn').textContent='开始训练';
  $('start-btn').classList.remove('stop-mode');
  setHub('准备','');
  $('feedback').textContent='选好难度，点开始训练';
  // 累计
  let tp=0,te=0,tb=0,trSum=0,trC=0,tLong=0;
  DIFF_ORDER.forEach(k=>{const s=sessionStats[k];tp+=s.pass;te+=s.errors;if(s.bestLen>tb)tb=s.bestLen;trSum+=s.rtSum;trC+=s.rtCount;if(s.longest>tLong)tLong=s.longest;});
  const avgRt=trC?(trSum/trC/1000).toFixed(2):'-';
  // 评级
  let grade,evalTxt;
  if(state.passRounds>=9&&state.errors<=1){grade='优秀';evalTxt='你的序列记忆容量与顺序保持非常稳定：10 轮中几乎全部通过，错误极少，工作记忆的存储与复述能力出色。';}
  else if(state.passRounds>=7){grade='良好';evalTxt='整体表现良好，大多数轮次能完整复述。偶尔出错多发生在序列变长时，说明容量接近上限，可通过刻意延长复述来扩充广度。';}
  else if(state.passRounds>=5){grade='中等';evalTxt='能通过约一半轮次，序列长度增加后容易跟丢顺序。建议从入门难度稳练，关注「分组复述」策略以提升保持。';}
  else{grade='需加强';evalTxt='通过轮次偏少、错误偏多，说明当前序列长度已超出舒适容量。先从短序列（入门/初级）建立稳定的编码—复述环路，再循序渐进加长。';}
  const condRows=DIFF_ORDER.map(k=>{
    const s=sessionStats[k];
    const ar=s.rtCount?(s.rtSum/s.rtCount/1000).toFixed(2)+'s':'-';
    return '<div class="cond-row"><span class="cl">'+LEVELS[k].name+'</span>'+
      '<span class="cv">通过 '+s.pass+'/'+s.rounds+' · 最佳长度 '+s.bestLen+' · 错误 '+s.errors+' · 反应 '+ar+'</span></div>';
  }).join('');
  $('result-card').innerHTML=
    '<div class="result-title">西蒙任务 · 训练结果</div>'+
    '<div class="result-grid">'+
      '<div class="result-item"><div class="val">'+state.bestLen+'</div><div class="lbl">记忆广度(最长)</div></div>'+
      '<div class="result-item"><div class="val">'+state.passRounds+'/'+TOTAL_ROUNDS+'</div><div class="lbl">通过轮数</div></div>'+
      '<div class="result-item"><div class="val">'+state.errors+'</div><div class="lbl">错误次数</div></div>'+
      '<div class="result-item"><div class="val">'+(avgRt==='-'?'-':avgRt+'s')+'</div><div class="lbl">平均点击间隔</div></div>'+
    '</div>'+
    '<div class="result-section"><div class="section-title">分难度统计</div>'+condRows+'</div>'+
    '<div class="result-eval">'+
      '<div class="eval-line">综合评级：<b style="color:var(--accent)">'+grade+'</b></div>'+
      '<div class="eval-line">'+evalTxt+'</div>'+
      (trC?'<div class="eval-line">平均点击间隔 '+avgRt+' 秒/步，间隔越短说明编码—复述越流畅。</div>':'')+
      (tLong>0?'<div class="eval-line">最长连续通过 '+tLong+' 轮，反映稳定保持的上限。</div>':'')+
      '<div class="eval-line">理论：西蒙任务依赖 Baddeley 工作记忆的<b>视空间模板</b>暂存序列位置、<b>中央执行</b>系统维持顺序与抑制干扰；广度越长，对复述策略与注意控制的负荷越高。</div>'+
    '</div>'+
    '<div class="result-btns">'+
      '<button class="btn-retry" onclick="startGame()">再来一局</button>'+
      '<button class="btn-home" onclick="location.href=\'index.html\'">返回大厅</button>'+
    '</div>';
  $('result-card').style.display='flex';
}
// ===== 初始化 =====
buildDiffBtns();
document.querySelectorAll('.simon-pad').forEach(p=>{ p.onclick=()=>onPadClick(+p.dataset.pad); });
document.addEventListener('keydown',e=>{
  if(state.phase!=='input')return;
  const map={'1':0,'2':1,'3':2,'4':3};
  if(e.key in map)onPadClick(map[e.key]);
});
// ===== 儿童色彩切换 =====
function toggleKidMode(){ document.body.classList.toggle('kid-mode'); }
</script>
