<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羊素材挑选画廊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f4f8f5;
    color: #2a3b35;
    padding: 28px 20px 60px;
  }
  h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
  p.tip { text-align: center; color: #6b7c75; font-size: 14px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 1px solid #e2ece7;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 4px 14px rgba(43, 168, 158, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .num {
    align-self: flex-start;
    background: #2ba89e;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
  }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: repeating-conic-gradient(#f0f4f2 0% 25%, #ffffff 0% 50%) 50% / 22px 22px;
    border-radius: 10px;
  }
  .style {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #2a3b35;
  }
</style>
</head>
<body>
  <h1>羊素材挑选画廊</h1>
