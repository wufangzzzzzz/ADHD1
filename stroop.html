<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>斯特鲁普 · 视知觉训练</title>
<style id="pageStyle">@page{size:portrait;margin:8mm;}</style>
<style>
:root{
  --bg:#ffffff; --panel:#f5f6fa; --text:#1a1a2e; --muted:#5a6072;
  --border:#d8dce6; --accent:#6a1b9a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overflow:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column;
}
.app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; padding:10px 14px; gap:8px;}
.topbar{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.back-btn{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;}
.title{flex:1; font-size:18px; font-weight:600; text-align:center;}
.controls{flex-shrink:0; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-start; justify-content:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.ctrl-group{display:flex; flex-direction:column; gap:5px; min-width:0;}
.ctrl-label{font-size:11px; color:var(--muted); font-weight:600;}
.ctrl-row{display:flex; gap:5px; flex-wrap:wrap;}
.opt{background:#fff; color:var(--muted); border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap;}
.opt.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.num-input{width:54px; padding:6px 6px; font-size:13px; border:1px solid var(--border); border-radius:7px; text-align:center;}
.btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; font-weight:600;}
.print-btn{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;}
.rule-note{flex:1 1 100%; font-size:11px; color:var(--muted); line-height:1.6; text-align:center; border-top:1px dashed var(--border); padding-top:8px;}
.preview-wrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
canvas{background:#fff; touch-action:none; max-width:100%; max-height:100%;}
@media (max-width:480px){
  .title{font-size:15px;}
  .app{padding:8px 10px; gap:6px;}
  .opt{padding:5px 8px; font-size:11px;}
  .controls{gap:8px 10px; padding:8px;}
}
@media print{
  .no-print{display:none !important;}
  html,body{height:auto !important; overflow:visible !important; background:#fff !important; margin:0 !important;}
  .app{height:auto !important; display:block !important; padding:0 !important;}
  .preview-wrap{display:flex !important; align-items:center; justify-content:center; min-height:90vh;}
  canvas{width:100% !important; height:auto !important; max-width:100% !important; box-shadow:none !important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar no-print">
    <button class="back-btn" onclick="location.href='index.html'">返回</button>
    <div class="title">斯特鲁普生成器</div>
  </div>

  <div class="controls no-print">
    <div class="ctrl-group">
      <div class="ctrl-label">训练模式</div>
      <div class="ctrl-row" id="modeRow">
        <button class="opt active" data-mode="word">文字色</button>
        <button class="opt" data-mode="size">大小</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">阅读规则</div>
      <div class="ctrl-row" id="ruleRow">
        <button class="opt active" data-rule="0">读文字</button>
        <button class="opt" data-rule="1">读颜色</button>
        <button class="opt" data-rule="2">先文后色</button>
        <button class="opt" data-rule="3">先色后文</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">规格</div>
      <div class="ctrl-row" id="sizeRow">
        <button class="opt" data-r="5" data-c="7">5×7</button>
        <button class="opt active" data-r="6" data-c="8">6×8</button>
        <button class="opt" data-r="10" data-c="10">10×10</button>
        <button class="opt" data-r="9" data-c="13">9×13</button>
        <button class="opt" data-r="-1" data-c="-1">自定义</button>
      </div>
    </div>

    <div class="ctrl-group" id="customGroup" style="display:none;">
      <div class="ctrl-label">自定义行列</div>
      <div class="ctrl-row">
        <label style="font-size:12px;color:var(--muted);">行<input class="num-input" id="rowsInput" type="number" min="1" max="20" value="6"></label>
        <label style="font-size:12px;color:var(--muted);">列<input class="num-input" id="colsInput" type="number" min="1" max="20" value="8"></label>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">颜色数 / 汉字数</div>
      <div class="ctrl-row">
        <input class="num-input" id="colorCount" type="number" min="2" max="8" value="4" title="颜色种类">
        <span id="wordSep" style="font-size:12px;color:var(--muted);align-self:center;">/</span>
        <span id="wordWrap"><input class="num-input" id="wordCount" type="number" min="2" max="8" value="4" title="汉字种类"></span>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">打印方向</div>
      <div class="ctrl-row" id="orientRow">
        <button class="opt active" data-orient="portrait">竖版</button>
        <button class="opt" data-orient="landscape">横版</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">操作</div>
      <div class="ctrl-row">
        <button class="btn" id="genBtn">生成 / 重排</button>
        <button class="print-btn" onclick="doPrint()">打印</button>
      </div>
    </div>

    <div class="rule-note" id="ruleNote"></div>
  </div>

  <div class="preview-wrap">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
const RULES=[
  {name:'读文字', desc:'忽略颜色，只念出字的「含义」（如绿字写"红"→念"红"）。'},
  {name:'读颜色', desc:'忽略字义，只念出字的「墨水颜色」（如绿字写"红"→念"绿"）。'},
  {name:'先读文字，再读颜色', desc:'每个词先念含义、再念墨色（如绿字写"红"→"红、绿"）。'},
  {name:'先读颜色，后读文字', desc:'每个词先念墨色、再念含义（如绿字写"红"→"绿、红"）。'}
];
// 大小模式（数字·大小）的三条阅读规则
const SIZE_RULES=[
  {name:'读大的数字', desc:'每个格子一大一小两个数字，念出较大的那个（大字固定在一侧）。'},
  {name:'大小切换·读大字', desc:'两个数字左右来回互换大小，始终念出当前较大的那个。'},
  {name:'按颜色读数字', desc:'顶部提示一个颜色，每个格子两个数字颜色不同，念出与该颜色相同的数字。'}
];
// 颜色池（白底高对比，名称与汉字池对应）
const COLORS=[
  {name:'红',hex:'#e53935'},
  {name:'绿',hex:'#2e7d32'},
  {name:'蓝',hex:'#1565c0'},
  {name:'紫',hex:'#8e24aa'},
  {name:'橙',hex:'#ef6c00'},
  {name:'青',hex:'#00838f'},
  {name:'粉',hex:'#d81b60'},
  {name:'棕',hex:'#6d4c41'}
];
const WORDS=['红','绿','蓝','紫','橙','青','粉','棕'];

const cv=document.getElementById('cv');
const wrap=document.querySelector('.preview-wrap');
let state={mode:'word', rule:0, rows:6, cols:8, colorCount:4, wordCount:4, orient:'portrait', sizePrompt:null, swapT:0, printStatic:false};
let matrix=[];
let swapRAF=null, swapStart=0, swapDir=1;

function ri(n){return Math.floor(Math.random()*n);}

function genMatrix(){
  const cols=COLORS.slice(0,state.colorCount);
  const words=WORDS.slice(0,state.wordCount);
  matrix=[];
  for(let r=0;r<state.rows;r++){
    const row=[];
    for(let c=0;c<state.cols;c++){
      const w=words[ri(words.length)];
      let ink;
      const matchColor=cols.find(x=>x.name===w);
      if(matchColor && Math.random()<0.8){
        const others=cols.filter(x=>x.name!==w);
        ink=others[ri(others.length)].hex;
      }else{
        ink=cols[ri(cols.length)].hex;
      }
      row.push({w,ink});
    }
    matrix.push(row);
  }
}

// 大小模式：每个格子两个数字（1-9，互不相同），一大一小，两色不同（规则③用）
function genSizeMatrix(){
  const cols=COLORS.slice(0,state.colorCount);
  state.sizePrompt=ri(cols.length);                // 顶部提示颜色（取自当前颜色池）
  const otherColor = c => (c + 1 + ri(cols.length-1)) % cols.length; // 取一个不同的颜色下标
  matrix=[];
  for(let r=0;r<state.rows;r++){
    const row=[];
    for(let c=0;c<state.cols;c++){
      let d1=ri(9)+1, d2=ri(9)+1;
      while(d2===d1) d2=ri(9)+1;                 // 两个数字不同
      const bigLeft=Math.random()<0.5;            // 大字在左/右（规则②打印时左右交替）
      // 规则③要求：每个格子必须含一个与提示色相同的数字（另一个用不同颜色）
      let ci1, ci2;
      if(Math.random()<0.5){ ci1=state.sizePrompt; ci2=otherColor(state.sizePrompt); }
      else { ci2=state.sizePrompt; ci1=otherColor(state.sizePrompt); }
      row.push({d1, d2, bigLeft, colorIdx1:ci1, colorIdx2:ci2});
    }
    matrix.push(row);
  }
}

function draw(){
  const W = state.orient==='landscape' ? 1414 : 1000;
  const H = state.orient==='landscape' ? 1000 : 1414;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  const pad=40;
  const headerH=H*0.085;
  const ruleName = state.mode==='size' ? SIZE_RULES[state.rule].name : RULES[state.rule].name;
  let ruleDesc  = state.mode==='size' ? SIZE_RULES[state.rule].desc : RULES[state.rule].desc;
  if(state.mode==='size' && state.rule===2){
    ruleDesc = '顶部提示颜色「'+COLORS[state.sizePrompt].name+'」，念出与该颜色相同的数字。';
  }
  // 顶部标注（打印件自带说明）
  ctx.fillStyle='#222222';
  ctx.textBaseline='middle';
  const fs=H*0.026;
  ctx.font='bold '+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('规则：'+ruleName, pad, pad+headerH*0.33);
  ctx.textAlign='right';
  ctx.fillText('规格 '+state.rows+'×'+state.cols+'　颜色'+state.colorCount+(state.mode==='size'?'':'　汉字'+state.wordCount), W-pad, pad+headerH*0.33);
  ctx.textAlign='left';
  ctx.font='normal '+(fs*0.8)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  const descY=pad+headerH*0.72;
  if(state.mode==='size' && state.rule===2){
    // 规则③：提示颜色名用对应颜色书写
    const cn=COLORS[state.sizePrompt].name;
    const pre='顶部提示颜色「';
    const suf='」，念出与该颜色相同的数字。';
    ctx.fillStyle='#666666';
    ctx.fillText(pre, pad, descY);
    const w1=ctx.measureText(pre).width;
    ctx.fillStyle=COLORS[state.sizePrompt].hex;
    ctx.fillText(cn, pad+w1, descY);
    const w2=ctx.measureText(cn).width;
    ctx.fillStyle='#666666';
    ctx.fillText(suf, pad+w1+w2, descY);
  } else {
    ctx.fillStyle='#666666';
    ctx.fillText(ruleDesc, pad, descY);
  }

  // 网格
  const gx=pad, gy=pad+headerH;
  const gw=W-2*pad, gh=H-pad-gy;
  const cw=gw/state.cols, ch=gh/state.rows;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  if(state.mode==='size'){
    // 画方格：每个单元格画细边框
    ctx.strokeStyle='#d8dce6';
    ctx.lineWidth=Math.max(1, W*0.0012);
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        ctx.strokeRect(gx+cw*c, gy+ch*r, cw, ch);
      }
    }
    // 大小模式：每格两个数字（一大一小），间距=2个空格
    const FF='"PingFang SC","Microsoft YaHei",sans-serif';
    const baseMin=Math.min(cw,ch);
    const bigFs=baseMin*0.46;
    const smallFs=baseMin*0.24;
    ctx.font='bold '+smallFs+'px '+FF;
    const gap=0.5*ctx.measureText(' ').width;        // 两数字间距更近（约0.5空格）
    ctx.font='bold '+bigFs+'px '+FF; const rbW=ctx.measureText('9').width;
    ctx.font='bold '+smallFs+'px '+FF; const rsW=ctx.measureText('9').width;
    const laneHalf=gap/2 + rbW/4 + rsW/4;             // 左右两路中心到列中心的距离
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        const cell=matrix[r][c];
        const cx=gx+cw*(c+0.5), cy=gy+ch*(r+0.5);
        if(state.rule===1 && !state.printStatic){
          // 规则②动画：左右两路固定，大小互相平滑过渡（缓动）
          const t=state.swapT==null?0:state.swapT;
          const sL=bigFs*(1-t)+smallFs*t;
          const sR=smallFs*(1-t)+bigFs*t;
          ctx.fillStyle='#222222';
          ctx.font='bold '+sL+'px '+FF; ctx.fillText(cell.d1, cx-laneHalf, cy);
          ctx.font='bold '+sR+'px '+FF; ctx.fillText(cell.d2, cx+laneHalf, cy);
        } else {
          // 规则① / 规则②静态打印 / 规则③：大字在左路、小字在右路
          let bigLeft;
          if(state.rule===0) bigLeft=true;
          else bigLeft=cell.bigLeft;
          const bigD=bigLeft?cell.d1:cell.d2;
          const smallD=bigLeft?cell.d2:cell.d1;
          if(state.rule===2){
            const bigCol=bigLeft?COLORS[cell.colorIdx1].hex:COLORS[cell.colorIdx2].hex;
            const smallCol=bigLeft?COLORS[cell.colorIdx2].hex:COLORS[cell.colorIdx1].hex;
            ctx.fillStyle=bigCol; ctx.font='bold '+bigFs+'px '+FF; ctx.fillText(bigD, cx-laneHalf, cy);
            ctx.fillStyle=smallCol; ctx.font='bold '+smallFs+'px '+FF; ctx.fillText(smallD, cx+laneHalf, cy);
          } else {
            ctx.fillStyle='#222222';
            ctx.font='bold '+bigFs+'px '+FF; ctx.fillText(bigD, cx-laneHalf, cy);
            ctx.font='bold '+smallFs+'px '+FF; ctx.fillText(smallD, cx+laneHalf, cy);
          }
        }
      }
    }
  } else {
    // 文字色模式（原有）
    const wordFs=Math.min(cw,ch)*0.52;
    ctx.font='bold '+wordFs+'px "PingFang SC","Microsoft YaHei",sans-serif';
    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        const cell=matrix[r][c];
        const cx=gx+cw*(c+0.5), cy=gy+ch*(r+0.5);
        ctx.fillStyle=cell.ink;
        ctx.fillText(cell.w, cx, cy);
      }
    }
  }
}

function resize(){
  const W=cv.width, H=cv.height;
  if(!W||!H) return;
  const ar=W/H;
  let cw=wrap.clientWidth, ch=wrap.clientHeight;
  if(cw/ch>ar){ cw=ch*ar; } else { ch=cw/ar; }
  cv.style.width=cw+'px';
  cv.style.height=ch+'px';
}

function updateRuleNote(){
  if(state.mode==='size'){
    const r=SIZE_RULES;
    document.getElementById('ruleNote').textContent='大小模式规则 — ①'+r[0].name+'：'+r[0].desc+' ②'+r[1].name+'：'+r[1].desc+' ③'+r[2].name+'：'+r[2].desc;
  } else {
    document.getElementById('ruleNote').textContent='四种规则说明 — ①读文字：'+RULES[0].desc+' ②读颜色：'+RULES[1].desc+' ③先文后色：'+RULES[2].desc+' ④先色后文：'+RULES[3].desc;
  }
}

// 依据当前模式生成对应矩阵并重绘
function regenerate(){
  if(state.mode==='size') genSizeMatrix(); else genMatrix();
  draw(); resize();
}

// 按当前模式重建「阅读规则」按钮
function rebuildRuleRow(){
  const row=document.getElementById('ruleRow');
  row.innerHTML='';
  const arr = state.mode==='size' ? SIZE_RULES : RULES;
  arr.forEach((rl,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(i===state.rule?' active':'');
    b.dataset.rule=i;
    b.textContent=rl.name;
    row.appendChild(b);
  });
}

// 规则②屏幕动画：左右两路大小平滑互换（requestAnimationFrame + 缓动）
const SWAP_DUR=1200, SWAP_HOLD=360;   // 变换速度慢一倍
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function startSwapAnim(){
  stopSwapAnim();
  state.swapT=0; swapDir=1; swapStart=performance.now();
  swapRAF=requestAnimationFrame(swapFrame);
}
function swapFrame(now){
  if(!(state.mode==='size' && state.rule===1 && !state.printStatic)){ swapRAF=null; return; }
  const el=now-swapStart;
  if(el<SWAP_DUR){
    state.swapT = swapDir===1 ? easeInOutCubic(el/SWAP_DUR) : 1-easeInOutCubic(el/SWAP_DUR);
    draw();
    swapRAF=requestAnimationFrame(swapFrame);
  } else if(el<SWAP_DUR+SWAP_HOLD){
    state.swapT = swapDir===1?1:0;
    draw();
    swapRAF=requestAnimationFrame(swapFrame);
  } else {
    swapDir=-swapDir; swapStart=now;
    swapRAF=requestAnimationFrame(swapFrame);
  }
}
function stopSwapAnim(){
  if(swapRAF){ cancelAnimationFrame(swapRAF); swapRAF=null; }
}

// 打印：规则②先渲染静态「左右交替」帧，再调起打印，打印后恢复
function doPrint(){
  if(state.mode==='size' && state.rule===1){
    state.printStatic=true;
    draw();
  }
  window.print();
}
window.addEventListener('afterprint',()=>{
  state.printStatic=false;
  if(state.mode==='size' && state.rule===1){ startSwapAnim(); }
  else { draw(); }
});

// 事件
document.getElementById('ruleRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#ruleRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.rule=+b.dataset.rule;
  stopSwapAnim();
  if(state.mode==='size' && state.rule===1) startSwapAnim();
  updateRuleNote(); draw(); resize();
});
document.getElementById('modeRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#modeRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.mode=b.dataset.mode;
  stopSwapAnim();
  state.rule=0;
  rebuildRuleRow();
  const hideWord = state.mode==='size';
  document.getElementById('wordWrap').style.display = hideWord ? 'none' : '';
  document.getElementById('wordSep').style.display  = hideWord ? 'none' : '';
  updateRuleNote();
  regenerate();
  if(state.mode==='size' && state.rule===1) startSwapAnim();
});
document.getElementById('sizeRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#sizeRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  if(b.dataset.r==='-1'){
    document.getElementById('customGroup').style.display='';
    return;
  }
  document.getElementById('customGroup').style.display='none';
  state.rows=+b.dataset.r; state.cols=+b.dataset.c;
  regenerate();
});
document.getElementById('customGroup').addEventListener('change',()=>{
  const r=Math.max(1,Math.min(20, +document.getElementById('rowsInput').value||6));
  const c=Math.max(1,Math.min(20, +document.getElementById('colsInput').value||8));
  state.rows=r; state.cols=c;
  regenerate();
});
document.getElementById('colorCount').addEventListener('change',e=>{
  state.colorCount=Math.max(2,Math.min(8, +e.target.value||4));
  e.target.value=state.colorCount;
  regenerate();
});
document.getElementById('wordCount').addEventListener('change',e=>{
  state.wordCount=Math.max(2,Math.min(8, +e.target.value||4));
  e.target.value=state.wordCount;
  regenerate();
});
document.getElementById('orientRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#orientRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.orient=b.dataset.orient;
  document.getElementById('pageStyle').textContent='@page{size:'+state.orient+';margin:8mm;}';
  draw(); resize();
});
document.getElementById('genBtn').addEventListener('click',()=>{ regenerate(); });
window.addEventListener('resize',resize);

// 初始化
updateRuleNote();
rebuildRuleRow();
genMatrix();
draw();
resize();
</script>
</body>
</html>
