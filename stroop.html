<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>斯特鲁普 · 视知觉训练</title>
<style id="pageStyle">@page{size:portrait;margin:8mm;}</style>
<style>
:root{
  --bg:#ffffff; --panel:#f5f6fa; --text:#1a1a2e; --muted:#5a6072;
  --border:#d8dce6; --accent:#6a1b9a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overflow:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column;
}
.app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; padding:10px 14px; gap:8px;}
.topbar{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.back-btn{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;}
.title{flex:1; font-size:18px; font-weight:600; text-align:center;}
.controls{flex-shrink:0; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-start; justify-content:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.ctrl-group{display:flex; flex-direction:column; gap:5px; min-width:0;}
.ctrl-label{font-size:11px; color:var(--muted); font-weight:600;}
.ctrl-row{display:flex; gap:5px; flex-wrap:wrap;}
.opt{background:#fff; color:var(--muted); border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap;}
.opt.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.num-input{width:54px; padding:6px 6px; font-size:13px; border:1px solid var(--border); border-radius:7px; text-align:center;}
.btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; font-weight:600;}
.print-btn{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;}
.rule-note{flex:1 1 100%; font-size:11px; color:var(--muted); line-height:1.6; text-align:center; border-top:1px dashed var(--border); padding-top:8px;}
.preview-wrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
canvas{background:#fff; touch-action:none; max-width:100%; max-height:100%;}
@media (max-width:480px){
  .title{font-size:15px;}
  .app{padding:8px 10px; gap:6px;}
  .opt{padding:5px 8px; font-size:11px;}
  .controls{gap:8px 10px; padding:8px;}
}
@media print{
  .no-print{display:none !important;}
  html,body{height:auto !important; overflow:visible !important; background:#fff !important; margin:0 !important;}
  .app{height:auto !important; display:block !important; padding:0 !important;}
  .preview-wrap{display:flex !important; align-items:center; justify-content:center; min-height:90vh;}
  canvas{width:100% !important; height:auto !important; max-width:100% !important; box-shadow:none !important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar no-print">
    <button class="back-btn" onclick="location.href='index.html'">返回</button>
    <div class="title">斯特鲁普 · 刺激材料生成器</div>
  </div>

  <div class="controls no-print">
    <div class="ctrl-group">
      <div class="ctrl-label">阅读规则</div>
      <div class="ctrl-row" id="ruleRow">
        <button class="opt active" data-rule="0">读文字</button>
        <button class="opt" data-rule="1">读颜色</button>
        <button class="opt" data-rule="2">先文后色</button>
        <button class="opt" data-rule="3">先色后文</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">规格</div>
      <div class="ctrl-row" id="sizeRow">
        <button class="opt" data-r="5" data-c="7">5×7</button>
        <button class="opt active" data-r="6" data-c="8">6×8</button>
        <button class="opt" data-r="10" data-c="10">10×10</button>
        <button class="opt" data-r="9" data-c="13">9×13</button>
        <button class="opt" data-r="-1" data-c="-1">自定义</button>
      </div>
    </div>

    <div class="ctrl-group" id="customGroup" style="display:none;">
      <div class="ctrl-label">自定义行列</div>
      <div class="ctrl-row">
        <label style="font-size:12px;color:var(--muted);">行<input class="num-input" id="rowsInput" type="number" min="1" max="20" value="6"></label>
        <label style="font-size:12px;color:var(--muted);">列<input class="num-input" id="colsInput" type="number" min="1" max="20" value="8"></label>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">颜色数 / 汉字数</div>
      <div class="ctrl-row">
        <input class="num-input" id="colorCount" type="number" min="2" max="8" value="4" title="颜色种类">
        <span style="font-size:12px;color:var(--muted);align-self:center;">/</span>
        <input class="num-input" id="wordCount" type="number" min="2" max="8" value="4" title="汉字种类">
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">打印方向</div>
      <div class="ctrl-row" id="orientRow">
        <button class="opt active" data-orient="portrait">竖版</button>
        <button class="opt" data-orient="landscape">横版</button>
      </div>
    </div>

    <div class="ctrl-group">
      <div class="ctrl-label">操作</div>
      <div class="ctrl-row">
        <button class="btn" id="genBtn">生成 / 重排</button>
        <button class="print-btn" onclick="window.print()">打印</button>
      </div>
    </div>

    <div class="rule-note" id="ruleNote"></div>
  </div>

  <div class="preview-wrap">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
const RULES=[
  {name:'读文字', desc:'忽略颜色，只念出字的「含义」（如绿字写"红"→念"红"）。'},
  {name:'读颜色', desc:'忽略字义，只念出字的「墨水颜色」（如绿字写"红"→念"绿"）。'},
  {name:'先读文字，再读颜色', desc:'每个词先念含义、再念墨色（如绿字写"红"→"红、绿"）。'},
  {name:'先读颜色，后读文字', desc:'每个词先念墨色、再念含义（如绿字写"红"→"绿、红"）。'}
];
// 颜色池（白底高对比，名称与汉字池对应）
const COLORS=[
  {name:'红',hex:'#e53935'},
  {name:'绿',hex:'#2e7d32'},
  {name:'蓝',hex:'#1565c0'},
  {name:'紫',hex:'#8e24aa'},
  {name:'橙',hex:'#ef6c00'},
  {name:'青',hex:'#00838f'},
  {name:'粉',hex:'#d81b60'},
  {name:'棕',hex:'#6d4c41'}
];
const WORDS=['红','绿','蓝','紫','橙','青','粉','棕'];

const cv=document.getElementById('cv');
const wrap=document.querySelector('.preview-wrap');
let state={rule:0, rows:6, cols:8, colorCount:4, wordCount:4, orient:'portrait'};
let matrix=[];

function ri(n){return Math.floor(Math.random()*n);}

function genMatrix(){
  const cols=COLORS.slice(0,state.colorCount);
  const words=WORDS.slice(0,state.wordCount);
  matrix=[];
  for(let r=0;r<state.rows;r++){
    const row=[];
    for(let c=0;c<state.cols;c++){
      const w=words[ri(words.length)];
      let ink;
      const matchColor=cols.find(x=>x.name===w);
      if(matchColor && Math.random()<0.8){
        const others=cols.filter(x=>x.name!==w);
        ink=others[ri(others.length)].hex;
      }else{
        ink=cols[ri(cols.length)].hex;
      }
      row.push({w,ink});
    }
    matrix.push(row);
  }
}

function draw(){
  const W = state.orient==='landscape' ? 1414 : 1000;
  const H = state.orient==='landscape' ? 1000 : 1414;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  const pad=40;
  const headerH=H*0.085;
  // 顶部标注（打印件自带说明）
  ctx.fillStyle='#222222';
  ctx.textBaseline='middle';
  const fs=H*0.026;
  ctx.font='bold '+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('规则：'+RULES[state.rule].name, pad, pad+headerH*0.33);
  ctx.textAlign='center';
  ctx.fillText('规格 '+state.rows+'×'+state.cols, W/2, pad+headerH*0.33);
  ctx.textAlign='right';
  ctx.fillText('颜色'+state.colorCount+'　汉字'+state.wordCount, W-pad, pad+headerH*0.33);
  ctx.textAlign='left';
  ctx.font='normal '+(fs*0.8)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='#666666';
  ctx.fillText(RULES[state.rule].desc, pad, pad+headerH*0.72);

  // 网格
  const gx=pad, gy=pad+headerH;
  const gw=W-2*pad, gh=H-pad-gy;
  const cw=gw/state.cols, ch=gh/state.rows;
  const wordFs=Math.min(cw,ch)*0.52;
  ctx.font='bold '+wordFs+'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for(let r=0;r<state.rows;r++){
    for(let c=0;c<state.cols;c++){
      const cell=matrix[r][c];
      const cx=gx+cw*(c+0.5), cy=gy+ch*(r+0.5);
      ctx.fillStyle=cell.ink;
      ctx.fillText(cell.w, cx, cy);
    }
  }
}

function resize(){
  const W=cv.width, H=cv.height;
  if(!W||!H) return;
  const ar=W/H;
  let cw=wrap.clientWidth, ch=wrap.clientHeight;
  if(cw/ch>ar){ cw=ch*ar; } else { ch=cw/ar; }
  cv.style.width=cw+'px';
  cv.style.height=ch+'px';
}

function updateRuleNote(){
  document.getElementById('ruleNote').textContent='四种规则说明 — ①读文字：'+RULES[0].desc+' ②读颜色：'+RULES[1].desc+' ③先文后色：'+RULES[2].desc+' ④先色后文：'+RULES[3].desc;
}

// 事件
document.getElementById('ruleRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#ruleRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.rule=+b.dataset.rule;
  updateRuleNote(); draw();
});
document.getElementById('sizeRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#sizeRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  if(b.dataset.r==='-1'){
    document.getElementById('customGroup').style.display='';
    return;
  }
  document.getElementById('customGroup').style.display='none';
  state.rows=+b.dataset.r; state.cols=+b.dataset.c;
  genMatrix(); draw(); resize();
});
document.getElementById('customGroup').addEventListener('change',()=>{
  const r=Math.max(1,Math.min(20, +document.getElementById('rowsInput').value||6));
  const c=Math.max(1,Math.min(20, +document.getElementById('colsInput').value||8));
  state.rows=r; state.cols=c;
  genMatrix(); draw(); resize();
});
document.getElementById('colorCount').addEventListener('change',e=>{
  state.colorCount=Math.max(2,Math.min(8, +e.target.value||4));
  e.target.value=state.colorCount;
  genMatrix(); draw(); resize();
});
document.getElementById('wordCount').addEventListener('change',e=>{
  state.wordCount=Math.max(2,Math.min(8, +e.target.value||4));
  e.target.value=state.wordCount;
  genMatrix(); draw(); resize();
});
document.getElementById('orientRow').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(!b) return;
  document.querySelectorAll('#orientRow .opt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.orient=b.dataset.orient;
  document.getElementById('pageStyle').textContent='@page{size:'+state.orient+';margin:8mm;}';
  draw(); resize();
});
document.getElementById('genBtn').addEventListener('click',()=>{ genMatrix(); draw(); resize(); });
window.addEventListener('resize',resize);

// 初始化
updateRuleNote();
genMatrix();
draw();
resize();
</script>
</body>
</html>
