<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>划消训练</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;min-height:100dvh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);display:flex;flex-direction:column;align-items:center;padding:10px;color:#fff;}
  .header{text-align:center;margin-bottom:10px;}
  h1{font-size:24px;font-weight:800;margin-bottom:5px;background:linear-gradient(135deg,#fff 0%,#4FC3F7 50%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .subtitle{color:#4FC3F7;font-size:10px;padding:4px 12px;background:rgba(0,0,0,.2);border-radius:12px;display:inline-block;}
  .mode-bar{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
  .mode-btn,.orient-btn,.colorful-btn{padding:8px 16px;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,.3);border-radius:20px;cursor:pointer;transition:all .3s;background:transparent;color:rgba(255,255,255,.7);}
  .mode-btn.active{border-color:#4FC3F7;background:rgba(79,195,247,.3);color:#fff;}
  .orient-btn.active{border-color:#FF9800;background:rgba(255,152,0,.3);color:#fff;}
  .colorful-btn.active{border-color:#E91E63;background:linear-gradient(135deg,rgba(233,30,99,.3),rgba(156,39,176,.3));color:#fff;}
  .template-select{padding:8px 12px;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,.3);border-radius:20px;cursor:pointer;background:rgba(0,0,0,.3);color:rgba(255,255,255,.9);outline:none;}
  .template-select option{background:#1a1a2e;color:#fff;}
  .tc-select{padding:7px 14px;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,.3);border-radius:20px;cursor:pointer;background:rgba(79,195,247,.15);color:#fff;outline:none;}
  .tc-select option{background:#2a2a40;color:#fff;}
  .tc-sep{color:rgba(255,255,255,.6);font-size:12px;align-self:center;margin:0 2px;}
  .info-bar{display:flex;justify-content:space-around;width:100%;max-width:720px;margin-bottom:10px;padding:8px 15px;background:rgba(255,255,255,.1);border-radius:12px;}
  .info-item{text-align:center;}
  .info-label{font-size:10px;color:rgba(255,255,255,.7);}
  .info-value{font-size:18px;font-weight:700;color:#FFD700;}
  .target-item{min-width:60px;}
  .target-number-inline{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;align-items:center;font-size:20px!important;color:#f44336!important;}
  .target-number-inline .tgt{color:#f44336;font-weight:700;}
  .game-area{background:#fff;border-radius:15px;padding:15px 8px;max-width:720px;width:100%;overflow:hidden;}
  .grid{display:grid;gap:4px;margin:0 auto;max-width:100%;width:fit-content;}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#333;cursor:pointer;transition:all .15s;background:transparent;padding:0 2px;min-width:28px;max-width:32px;}
  .cell:active{transform:scale(.9);}
  .cell.found{color:transparent;position:relative;}
  .cell.found::after{content:'';position:absolute;width:80%;height:3px;background:#333;transform:rotate(-45deg);}
  .cell.found::before{content:'';position:absolute;width:80%;height:3px;background:#333;transform:rotate(45deg);}
  .cell.wrong{animation:wrongShake .3s ease-out;}
  .cell .letter{font-size:22px;color:#333;}
  .cell.found .letter{color:transparent;}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:15px;}
  .btn{padding:10px 25px;font-size:14px;font-weight:700;border:none;border-radius:25px;cursor:pointer;transition:all .3s;}
  .btn-start{background:linear-gradient(135deg,#4CAF50,#66BB6A);color:#fff;}
  .btn-reset{background:linear-gradient(135deg,#9C27B0,#BA68C8);color:#fff;}
  .status{text-align:center;margin-top:10px;font-size:14px;color:#4FC3F7;}
  .win-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;z-index:2000;align-items:center;justify-content:center;}
  .win-overlay.show{display:flex;animation:fadeIn .3s;}
  .win-content{text-align:center;animation:winBounce .8s ease-out;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:30px 40px;max-width:360px;width:90%;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes winBounce{0%{transform:scale(0);opacity:0}50%{transform:scale(1.1)}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
  .win-emoji{font-size:56px;margin-bottom:10px;}
  .win-grade{font-size:28px;font-weight:900;margin-bottom:15px;}
  .win-time{font-size:32px;font-weight:700;color:#FFD700;margin-bottom:10px;}
  .win-stats{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap;}
  .win-stat-item{text-align:center;}
  .win-stat-label{font-size:11px;color:rgba(255,255,255,.6);}
  .win-stat-value{font-size:18px;font-weight:700;}
  .win-index{font-size:14px;color:#4FC3F7;margin-bottom:15px;}
  .win-text{font-size:16px;color:#4CAF50;margin-bottom:20px;}
  .win-btn{padding:10px 30px;font-size:14px;font-weight:700;border:none;border-radius:25px;cursor:pointer;background:linear-gradient(135deg,#4CAF50,#66BB6A);color:#fff;transition:all .3s;}
  .back-btn{position:absolute;top:10px;left:10px;z-index:100;background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.1);color:rgba(0,0,0,.55);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;}
  .print-btn{background:#27ae60;color:#fff;border:none;padding:8px 14px;font-size:clamp(12px,1.8vw,15px);border-radius:8px;cursor:pointer;white-space:nowrap;}
  @media print{.no-print,.back-btn,.win-overlay{display:none!important;}*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}html,body{background:#fff!important;overflow:visible!important;height:auto!important;}body{display:block!important;}}

  /* ===== 嵌入模式 ===== */
  html.embed-mode,body.embed-mode{height:100%;overflow:hidden;}
  body.embed-mode{padding:0;background:#0f1226;color:#333;display:flex;flex-direction:column;}
  .embed-mode .back-btn,.embed-mode .header,.embed-mode .mode-bar,
  .embed-mode .controls,.embed-mode .status,.embed-mode .win-overlay,
  .embed-mode .print-btn{display:none!important;}
  .embed-mode .info-bar{
    flex:0 0 auto;max-width:none;border-radius:0;padding:4px 8px;
    background:linear-gradient(135deg,#1b1f3b,#2a2f5a);color:#fff;
  }
  .embed-mode .info-label{color:rgba(255,255,255,.6);}
  .embed-mode .info-value{color:#FFD700;}
  .embed-mode .target-number-inline{color:#f44336!important;}
  .embed-mode .game-area{
    --vol:1;
    flex:1 1 auto;min-height:0;width:calc(100% - max(16px, 8%));max-width:none;
    margin:calc(12px / var(--vol)) max(8px, 4%) calc(16px / var(--vol)) max(8px, 4%);
    border-radius:14px;
    padding:calc(12px / var(--vol));display:flex;flex-direction:column;overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .embed-mode .grid{
    flex:1 1 auto;min-height:0;width:100%;max-width:none;gap:2px;overflow:hidden;
    grid-template-rows:repeat(var(--rows,12),1fr);
  }
  .embed-mode .cell{
    min-width:0;max-width:none;aspect-ratio:auto;overflow:hidden;
    font-size:var(--cell-fs,14px);padding:0;
  }
  .embed-mode .cell .letter{font-size:var(--cell-fs,14px);}
</style>
</head>
<body>
<button class="back-btn" onclick="location.href='index.html'">← 返回大厅</button>
<div class="header">
  <h1>划消训练</h1>
  <p class="subtitle">获取更多内容请关注公众号：读写障碍-ADHD之家</p>
</div>
<div class="mode-bar">
  <button class="mode-btn active" id="modeNumber" onclick="setMode('number')">数字模式</button>
  <button class="mode-btn" id="modeLetter" onclick="setMode('letter')">字母模式</button>
  <button class="mode-btn" id="modeWord" onclick="setMode('word')">文字模式</button>
  <select id="wordTemplateSelect" class="template-select" onchange="selectWordTemplate(this.value)" style="display:none;">
    <option value="宝盖头">宝盖头</option><option value="日字系列">日字系列</option>
    <option value="口字框">口字框</option><option value="土字底">土字底</option>
    <option value="月字旁">月字旁</option><option value="绞丝旁">绞丝旁</option>
    <option value="金字旁">金字旁</option><option value="木字旁">木字旁</option>
    <option value="草字头">草字头</option><option value="三点水">三点水</option>
    <option value="人字旁">人字旁</option><option value="言字旁">言字旁</option>
    <option value="火字旁">火字旁</option>
  </select>
  <button class="orient-btn active" id="orientH" onclick="setOrientation('horizontal')">横版</button>
  <button class="orient-btn" id="orientV" onclick="setOrientation('vertical')">竖版</button>
  <button class="colorful-btn" id="colorfulBtn" onclick="toggleColorful()">彩色</button>
  <span class="tc-sep">找</span>
  <select class="tc-select" id="targetCountSelect" onchange="setTargetCount(parseInt(this.value,10))">
    <option value="1">1个</option><option value="2">2个</option><option value="3">3个</option>
  </select>
</div>
<div class="info-bar">
  <div class="info-item target-item">
    <div class="info-label">找出</div>
    <div class="info-value target-number-inline" id="targetNumber">-</div>
  </div>
  <div class="info-item"><div class="info-label">用时</div><div class="info-value" id="timer">0.0s</div></div>
  <div class="info-item"><div class="info-label">找到</div><div class="info-value" id="found">0/0</div></div>
  <div class="info-item"><div class="info-label">正确率</div><div class="info-value" id="accuracy">100%</div></div>
</div>
<div class="game-area">
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button class="btn btn-start" onclick="startGame()">开始</button>
    <button class="btn btn-reset" onclick="resetGame()">重置</button>
    <button class="print-btn no-print" onclick="window.print()">打印</button>
  </div>
</div>
<div class="status" id="status">点击开始按钮开始训练</div>
<div class="win-overlay" id="winOverlay">
  <div class="win-content">
    <div class="win-emoji" id="winEmoji">🎉</div>
    <div class="win-grade" id="winGrade">优秀</div>
    <div class="win-time" id="winTime">0.0秒</div>
    <div class="win-stats">
      <div class="win-stat-item"><div class="win-stat-label">正确率</div><div class="win-stat-value" id="winAccuracy" style="color:#4CAF50;">100%</div></div>
      <div class="win-stat-item"><div class="win-stat-label">找到</div><div class="win-stat-value" id="winFound" style="color:#FFD700;">0/0</div></div>
      <div class="win-stat-item"><div class="win-stat-label">误点</div><div class="win-stat-value" id="winWrong" style="color:#f44336;">0</div></div>
    </div>
    <div class="win-index" id="winIndex">注意力指数：0.0</div>
    <div class="win-text" id="winText">全部找到！</div>
    <button class="win-btn" onclick="closeWin()">再来一次</button>
  </div>
</div>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

/* ===== 游戏数据 ===== */
var ROWS=12,COLS=20;
var orientation='horizontal',mode='number',colorfulMode=false,multiCount=1;
var grid=[],targetValues=[],targetCells=[],foundCount=0,wrongCount=0;
var gameStarted=false,gameEnded=false,startTime=0,timerInterval=null;
var isEmbed=false,embedSide='L';
var embedTargets=null; // 协调器下发的目标值（embed 模式）

var letters=['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];
var wordTemplates={
  '宝盖头':['灾','定','官','完','守','牢','宗','宝','宁','宋','宇','宅','宙','宣','审','实','客','容','密','寒'],
  '日字系列':['日','目','白','旧','旦','百','自','且','田','由','申','甲','冒','昌','旭','明','旨','暗','显','晴'],
  '口字框':['囚','团','四','回','囱','囧','圆','圈','囵','固','国','圃','因','园','围','困','图'],
  '土字底':['至','到','致','屋','握','卧','底','店','垂','塞','坐','堪','坑','块','坪','坡','坤','坦','城','域'],
  '月字旁':['肝','胆','肺','肚','肠','胃','腰','腹','腿','脚','膝','臂','朋','胺','肥','胖','脂','胞','腔','脱'],
  '绞丝旁':['红','绿','结','织','终','绚','给','绝','绞','絮','紫','线','纳','纹','纸','纷','统','继','续','缓'],
  '金字旁':['钟','钉','铁','银','铜','锡','铅','钻','锋','链','锁','镜','钢','钱','铭','铲','错','锣','锤'],
  '木字旁':['林','杨','柳','桃','李','梅','桂','桥','板','柜','桌','椅','棵','植','机','村','枝','柱','标','样'],
  '草字头':['花','草','苗','芽','苟','苞','苔','荷','茶','菊','葱','落','苦','若','茂','英','范','蓝','蔬','萍'],
  '三点水':['汉','汗','江','泪','洒','洗','洁','洛','浪','涌','涛','浮','河','湖','海','波','深','浅','流','消'],
  '人字旁':['他','们','你','什','仔','住','体','休','伸','伴','位','低','佛','件','任','借','值','倒'],
  '言字旁':['说','话','语','讲','谈','论','许','识','诗','词','谎','课','读','请','谁','谢','记','设'],
  '火字旁':['灯','炉','炒','烧','烟','烂','炮','焰','焕','煌','炊','炯','炼','烘','烤','烛','煤','燃']
};
var currentWordTemplate='宝盖头';
var words=wordTemplates[currentWordTemplate];
var COLOR_PALETTE=['#e53935','#1976D2','#2E7D32','#F57C00','#7B1FA2','#5D4037','#00838F','#C2185B'];

/* ===== 音频 ===== */
var audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(type){
  try{
    initAudio();
    if(type==='found'){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      o.frequency.value=800;o.type='sine';
      g.gain.setValueAtTime(.3,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);
      o.start();o.stop(audioCtx.currentTime+.1);
    }else if(type==='wrong'){
      var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      o.frequency.value=200;o.type='square';
      g.gain.setValueAtTime(.2,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.2);
      o.start();o.stop(audioCtx.currentTime+.2);
    }else if(type==='win'){
      [523.25,659.25,783.99,1046.50].forEach(function(f,i){
        setTimeout(function(){
          var o=audioCtx.createOscillator(),g=audioCtx.createGain();
          o.connect(g);g.connect(audioCtx.destination);
          o.frequency.value=f;o.type='sine';
          g.gain.setValueAtTime(.3,audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.3);
          o.start();o.stop(audioCtx.currentTime+.3);
        },i*150);
      });
    }
  }catch(e){}
}

/* ===== 彩色 ===== */
function generateColorPool(total){
  var p=COLOR_PALETTE,bc=Math.floor(total/p.length),ex=total%p.length,pool=[];
  for(var i=0;i<p.length;i++){var c=bc+(i<ex?1:0);for(var k=0;k<c;k++)pool.push(p[i]);}
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  return pool;
}

/* ===== 目标值 ===== */
function getTargetValues(pool){
  var n=isEmbed&&embedTargets?embedTargets.length:multiCount;
  if(isEmbed&&embedTargets)return embedTargets;
  var copy=pool.slice(),res=[];
  for(var k=0;k<n&&copy.length>0;k++){var idx=Math.floor(Math.random()*copy.length);res.push(copy.splice(idx,1)[0]);}
  return res;
}

/* ===== 构建网格 ===== */
function buildGrid(){
  grid=[];targetCells=[];
  var container=document.getElementById('grid');
  container.innerHTML='';
  container.style.gridTemplateColumns='repeat('+COLS+',1fr)';
  container.style.setProperty('--rows',ROWS);
  container.style.setProperty('--cols',COLS);

  var colorPool=colorfulMode?generateColorPool(ROWS*COLS):null;
  var possibleValues;
  if(mode==='number')possibleValues=[1,2,3,4,5,6,7,8,9];
  else if(mode==='letter')possibleValues=letters.slice();
  else possibleValues=words.slice();

  targetValues=getTargetValues(possibleValues);
  var nonTargets=possibleValues.filter(function(v){return targetValues.indexOf(v)===-1;});

  // 每行目标数：embed 固定 2，单人对战前预览固定 1，单人对战开始后 1-3 随机
  var tpr = isEmbed ? 2 : (gameStarted ? Math.floor(Math.random()*3)+1 : 1);

  for(var row=0;row<ROWS;row++){
    // 选本行目标列
    var tCols=[];
    while(tCols.length<tpr&&tCols.length<COLS){
      var c=Math.floor(Math.random()*COLS);
      if(tCols.indexOf(c)===-1)tCols.push(c);
    }
    for(var col=0;col<COLS;col++){
      var i=row*COLS+col,value;
      if(tCols.indexOf(col)!==-1){
        var tp=targetCells.length;
        // 前 N 个目标位各绑一个目标值（保证每个目标至少出现一次）
        value = tp<targetValues.length ? targetValues[tp] : targetValues[Math.floor(Math.random()*targetValues.length)];
        targetCells.push(i);
      }else{
        value=nonTargets[Math.floor(Math.random()*nonTargets.length)];
      }
      grid.push(value);
      var cell=document.createElement('div');
      cell.className='cell';cell.dataset.index=i;cell.dataset.value=value;
      if(mode==='letter')cell.innerHTML='<span class="letter">'+value+'</span>';
      else cell.textContent=value;
      if(colorfulMode){
        if(mode==='letter'){var sp=cell.querySelector('.letter');if(sp)sp.style.color=colorPool[i];}
        else cell.style.color=colorPool[i];
      }
      cell.onclick=function(){cellClick(this);};
      container.appendChild(cell);
    }
  }
  // 显示目标
  document.getElementById('targetNumber').innerHTML=targetValues.map(function(v){return '<span class="tgt">'+v+'</span>';}).join('');
  document.getElementById('found').textContent='0/'+targetCells.length;
  adjustFontSize();
}

/* ===== 点击 ===== */
function cellClick(cell){
  if(!gameStarted||gameEnded)return;
  if(cell.classList.contains('found'))return;
  var value=cell.dataset.value;
  var targetVal=(mode==='number')?parseInt(value,10):value;
  if(targetValues.indexOf(targetVal)!==-1){
    cell.classList.add('found');foundCount++;playSound('found');
  }else{
    cell.classList.add('wrong');wrongCount++;playSound('wrong');
    setTimeout(function(){cell.classList.remove('wrong');},300);
  }
  updateStats();
  if(foundCount===targetCells.length)endGame();
}

function updateStats(){
  var total=foundCount+wrongCount;
  var acc=total===0?100:Math.round((foundCount/total)*100);
  document.getElementById('accuracy').textContent=acc+'%';
  document.getElementById('found').textContent=foundCount+'/'+targetCells.length;
}

/* ===== 游戏流程 ===== */
function startGame(){
  clearInterval(timerInterval);
  gameStarted=true;gameEnded=false;foundCount=0;wrongCount=0;
  buildGrid();
  startTime=Date.now();
  timerInterval=setInterval(updateTimer,100);
  var tgt=targetValues.join('、');
  document.getElementById('status').textContent='快速找出所有 '+tgt+'！';
}
function updateTimer(){document.getElementById('timer').textContent=((Date.now()-startTime)/1000).toFixed(1)+'s';}
function endGame(){
  gameEnded=true;clearInterval(timerInterval);
  var elapsed=(Date.now()-startTime)/1000;
  var total=foundCount+wrongCount;
  var acc=total===0?100:Math.round((foundCount/total)*100);
  var totalCells=ROWS*COLS;
  var net=foundCount-wrongCount;if(net<0)net=0;
  var index=(totalCells/elapsed)*(net/targetCells.length);

  if(isEmbed){
    // 上报协调器
    try{window.parent.postMessage({cmd:'done',side:embedSide,time:elapsed.toFixed(1),found:foundCount,wrong:wrongCount,accuracy:acc,index:index.toFixed(1),total:targetCells.length},'*');}catch(e){}
    return;
  }

  // 单人模式：显示胜利浮层
  var grade,emoji,color;
  if(index>=6){grade='卓越';emoji='🏆';color='#FFD700';}
  else if(index>=4){grade='优秀';emoji='⭐';color='#FF9800';}
  else if(index>=2.5){grade='良好';emoji='👍';color='#4CAF50';}
  else if(index>=1.5){grade='合格';emoji='✅';color='#4FC3F7';}
  else{grade='需提升';emoji='💪';color='#9C27B0';}
  document.getElementById('winEmoji').textContent=emoji;
  var ge=document.getElementById('winGrade');ge.textContent=grade;ge.style.color=color;
  document.getElementById('winTime').textContent=elapsed.toFixed(1)+'秒';
  document.getElementById('winAccuracy').textContent=acc+'%';
  document.getElementById('winFound').textContent=foundCount+'/'+targetCells.length;
  document.getElementById('winWrong').textContent=wrongCount;
  document.getElementById('winIndex').textContent='注意力指数：'+index.toFixed(1);
  document.getElementById('winOverlay').classList.add('show');
  playSound('win');
}
function closeWin(){document.getElementById('winOverlay').classList.remove('show');startGame();}
function resetGame(){
  gameStarted=false;gameEnded=false;foundCount=0;wrongCount=0;
  grid=[];targetCells=[];targetValues=[];
  if(!isEmbed)embedTargets=null;
  clearInterval(timerInterval);
  document.getElementById('timer').textContent='0.0s';
  document.getElementById('found').textContent='0/0';
  document.getElementById('accuracy').textContent='100%';
  document.getElementById('targetNumber').textContent='-';
  document.getElementById('status').textContent='点击开始按钮开始训练';
  document.getElementById('winOverlay').classList.remove('show');
  document.querySelectorAll('.cell').forEach(function(c){c.classList.remove('found','wrong');});
}

/* ===== 单人模式控件 ===== */
function setOrientation(o){
  orientation=o;
  ROWS=o==='horizontal'?12:20;COLS=o==='horizontal'?20:18;
  document.getElementById('orientH').classList.toggle('active',o==='horizontal');
  document.getElementById('orientV').classList.toggle('active',o==='vertical');
  resetGame();buildGrid();
}
function setMode(m){
  mode=m;
  document.getElementById('modeNumber').classList.toggle('active',m==='number');
  document.getElementById('modeLetter').classList.toggle('active',m==='letter');
  document.getElementById('modeWord').classList.toggle('active',m==='word');
  document.getElementById('wordTemplateSelect').style.display=m==='word'?'inline-block':'none';
  resetGame();buildGrid();
}
function selectWordTemplate(t){currentWordTemplate=t;words=wordTemplates[t];resetGame();buildGrid();}
function toggleColorful(){colorfulMode=!colorfulMode;document.getElementById('colorfulBtn').classList.toggle('active',colorfulMode);resetGame();buildGrid();}
function setTargetCount(n){multiCount=n;resetGame();buildGrid();}

/* ===== 字号自适应（embed 模式） ===== */
function adjustFontSize(){
  if(!isEmbed)return;
  var g=document.getElementById('grid');
  if(!g||!g.children.length)return;
  var cw=g.clientWidth/COLS-2;
  var ch=g.clientHeight/ROWS-2;
  var minDim=Math.min(cw,ch);
  var vol=parseFloat(getComputedStyle(document.querySelector('.game-area')).getPropertyValue('--vol'))||1;
  var isVert=ROWS>COLS;
  var isWord=(mode==='word');
  var ratio=isVert?(isWord?0.58:0.72):(isWord?0.82:0.92);
  var minFs=vol<0.7?(isVert?18:24):(vol<0.9?(isVert?16:20):14);
  var maxFs=isVert?(isWord?28:36):48;
  var fs=Math.max(minFs,Math.min(maxFs,Math.floor(minDim*ratio)));
  g.style.setProperty('--cell-fs',fs+'px');
}

/* ===== 嵌入模式钩子 ===== */
(function setupEmbed(){
  var params=new URLSearchParams(location.search);
  if(!params.has('embed'))return;
  isEmbed=true;
  embedSide=params.get('side')||'L';
  document.body.classList.add('embed-mode');

  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.cmd==='config'){
      // 应用配置
      mode=d.mode||'number';
      multiCount=d.targetCount||1;
      orientation=d.orientation||'horizontal';
      colorfulMode=!!d.colorful;
      if(d.wordTemplate){currentWordTemplate=d.wordTemplate;words=wordTemplates[currentWordTemplate];}
      if(d.customRows&&d.customRows>=3&&d.customRows<=20){ROWS=d.customRows;}
      else{ROWS=orientation==='horizontal'?12:20;}
      if(d.customCols&&d.customCols>=3&&d.customCols<=25){COLS=d.customCols;}
      else{COLS=orientation==='horizontal'?20:18;}
      embedTargets=d.targetValues||null;
      // 重置并构建网格（预览状态）
      gameStarted=false;gameEnded=false;foundCount=0;wrongCount=0;
      clearInterval(timerInterval);
      document.getElementById('timer').textContent='0.0s';
      document.querySelector('.game-area').style.setProperty('--vol',d.volScale||1);
      buildGrid();
      setTimeout(adjustFontSize,50);
    }else if(d.cmd==='start'){
      // 开始游戏
      initAudio();
      gameStarted=true;gameEnded=false;foundCount=0;wrongCount=0;
      // 重新构建网格（确保新排列）
      buildGrid();
      startTime=Date.now();
      timerInterval=setInterval(updateTimer,100);
      setTimeout(adjustFontSize,50);
    }else if(d.cmd==='reset'){
      resetGame();
      if(embedTargets)buildGrid();
    }
  });

  window.addEventListener('resize',function(){adjustFontSize();});

  // 通知协调器已就绪
  try{window.parent.postMessage({cmd:'ready',side:embedSide},'*');}catch(e){}
})();

/* ===== 初始化 ===== */
window.addEventListener('load',function(){
  if(!isEmbed){
    document.getElementById('grid').style.gridTemplateColumns='repeat('+COLS+',1fr)';
    buildGrid();
  }
});
</script>
